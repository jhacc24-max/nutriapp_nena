<html lang="es">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<title>NutriApp Panel Clínico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: pantalla de ingreso F3 (orbes y vidrio) → panel con menú lateral que se contrae (Heroicons sólidos 28 px)
   · barra superior con búsqueda que se estira · contenido por patrones A (Inicio), E (Citas) y tablero tonal (Pacientes).
   La ficha entra desde la derecha (push-slide). Colores: roles de 08-PALETAS (21 colores × 7 tonos × 3 combinaciones).
   Movimiento: tokens y nombres de 07-MOTION en nivel expresivo. */
:root {
  --tone-50:#EBFBF9; --tone-100:#D6F4F1; --tone-200:#B3E7E1; --tone-300:#82D2CA; --tone-400:#43B6AD; --tone-500:#009991; --tone-600:#007D76; --tone-700:#00635D; --tone-800:#004A46; --tone-900:#003330; --tone-950:#001F1D;
  --bg:#EDF9F7; --surface:#FFFFFF; --tint:#D6F4F1; --selected:#B3E7E1; --hero:#003330; --hero-2:#004A46; --on-hero:#FFFFFF; --on-hero-soft:#82D2CA;
  --accent:#007D76; --on-accent:#FFFFFF; --text:#0C1917; --text-2:#546866; --border:#D6E1DF; --nav:#FFFFFF; --nav-active:#003330; --on-nav-active:#FFFFFF;
  --sec:#D64295; --sec-tint:#FFE4F0; --sec-fg:#951263; --ter:#D15D00; --ter-tint:#FFE7DC; --ter-fg:#893B00;
  --cat-verde-stripe:#219F35; --cat-verde-bg:#DAF6DA; --cat-verde-fg:#006818; --cat-violeta-stripe:#975EEF; --cat-violeta-bg:#EFE9FF; --cat-violeta-fg:#6530AC;
  --cat-azul-stripe:#0782F8; --cat-azul-bg:#E1EEFF; --cat-azul-fg:#0053A5; --cat-ambar-stripe:#D3940A; --cat-ambar-bg:#FEEACC; --cat-ambar-fg:#714D00;
  --st-bajo:#E07A12; --st-meta:#16A34A; --st-exceso:#E5484D;
  --c-kcal:#D96C3F; --c-prot:#C79A3D; --c-carb:#6C8F63; --c-grasa:#4E7089; --c-fibra:#8E6BB0;
  --g-a1: var(--tone-400); --g-a2: var(--tone-700); --g-n1: var(--tone-200); --g-n2: var(--tone-400);
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 8px 24px -16px rgb(0 40 36 / .35);
  --shadow-2: 0 2px 6px rgb(0 0 0 / .06), 0 18px 40px -20px rgb(0 40 36 / .45);
  --scrim: rgb(3 18 16 / .42);
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'Fraunces', Georgia, 'Times New Roman', serif;
  --f-logo: 'Baloo 2', 'Inter', system-ui, sans-serif;
  --dur-instant: 80ms; --dur-fast: 150ms; --dur-base: 240ms; --dur-slow: 360ms; --dur-slower: 500ms;
  --ease-standard: cubic-bezier(.2,0,0,1); --ease-enter: cubic-bezier(0,0,0,1); --ease-exit: cubic-bezier(.3,0,1,1);
  --ease-emph: cubic-bezier(.2,0,0,1.2); --ease-over: cubic-bezier(.34,1.56,.64,1); --ease-io: cubic-bezier(.65,0,.25,1);
  --shift-sm: 8px; --shift-md: 24px; --lift: 1.36;
  --side-w: 264px; --side-w-min: 84px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#021210; --surface:#071E1C; --tint:#032F2C; --selected:#004A46; --hero:#00635D; --hero-2:#007D76; --on-hero-soft:#B3E7E1;
  --accent:#43B6AD; --on-accent:#111318; --text:#E9F5F3; --text-2:#94AAA7; --border:#1C3330; --nav:#102624; --nav-active:#009991; --on-nav-active:#111318;
  --st-bajo:#FFA94D; --st-meta:#3DD68C; --st-exceso:#FF6B6F; --c-kcal:#E08A57; --c-prot:#D9B563; --c-carb:#83B276; --c-grasa:#77A0C7; --c-fibra:#B093D4;
  --g-a1: var(--tone-200); --g-a2: var(--tone-400); --g-n1: #FFFFFF; --g-n2: var(--tone-200);
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 26px -18px rgb(0 0 0 / .9); --shadow-2: 0 2px 8px rgb(0 0 0 / .45), 0 20px 44px -20px rgb(0 0 0 / .95); --scrim: rgb(0 0 0 / .55);
  color-scheme: dark; } }
:root[data-theme="dark"], :root[data-tema="oscuro"] {
  --bg:#021210; --surface:#071E1C; --tint:#032F2C; --selected:#004A46; --hero:#00635D; --hero-2:#007D76; --on-hero-soft:#B3E7E1;
  --accent:#43B6AD; --on-accent:#111318; --text:#E9F5F3; --text-2:#94AAA7; --border:#1C3330; --nav:#102624; --nav-active:#009991; --on-nav-active:#111318;
  --st-bajo:#FFA94D; --st-meta:#3DD68C; --st-exceso:#FF6B6F; --c-kcal:#E08A57; --c-prot:#D9B563; --c-carb:#83B276; --c-grasa:#77A0C7; --c-fibra:#B093D4;
  --g-a1: var(--tone-200); --g-a2: var(--tone-400); --g-n1: #FFFFFF; --g-n2: var(--tone-200);
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 26px -18px rgb(0 0 0 / .9); --shadow-2: 0 2px 8px rgb(0 0 0 / .45), 0 20px 44px -20px rgb(0 0 0 / .95); --scrim: rgb(0 0 0 / .55);
  color-scheme: dark;
}
:root[data-tema="claro"] {
  --st-bajo:#E07A12; --st-meta:#16A34A; --st-exceso:#E5484D; --c-kcal:#D96C3F; --c-prot:#C79A3D; --c-carb:#6C8F63; --c-grasa:#4E7089; --c-fibra:#8E6BB0;
  --g-a1: var(--tone-400); --g-a2: var(--tone-700); --g-n1: var(--tone-200); --g-n2: var(--tone-400);
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 8px 24px -16px rgb(0 40 36 / .35); --shadow-2: 0 2px 6px rgb(0 0 0 / .06), 0 18px 40px -20px rgb(0 40 36 / .45); --scrim: rgb(3 18 16 / .42);
  color-scheme: light;
}
:root[data-motion="estandar"] { --shift-sm: 5px; --shift-md: 14px; --lift: 1.32; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.45; color: var(--text); background: var(--bg); -webkit-tap-highlight-color: transparent; overflow: hidden; transition: background var(--dur-slow) var(--ease-standard), color var(--dur-slow); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tab-nums { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }
svg.hi { display: block; transform-box: fill-box; transform-origin: center; }

/* ===== Íconos: animación "Automática" (09-ICONOS §6) ===== */
.an-press { animation: icoPress 460ms var(--ease-standard); }
@keyframes icoPress { 0% { transform: scale(1); } 30% { transform: scale(.78); } 65% { transform: scale(1.08); } 100% { transform: scale(1); } }
.an-pop { animation: icoPop 520ms var(--ease-over); }
@keyframes icoPop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
.an-bounce { animation: icoBounce 700ms var(--ease-standard); }
@keyframes icoBounce { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-6px); } 50% { transform: translateY(0); } 70% { transform: translateY(-3px); } }
.an-lift { animation: icoLift 750ms var(--ease-over); }
@keyframes icoLift { 0% { transform: translateY(0); filter: none; } 45% { transform: translateY(-9px); filter: drop-shadow(0 6px 4px rgb(0 0 0 / .25)); } 100% { transform: none; filter: none; } }
.an-swing { animation: icoSwing 900ms var(--ease-standard); transform-origin: 50% 8%; }
@keyframes icoSwing { 0% { transform: rotate(0); } 20% { transform: rotate(18deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(9deg); } 80% { transform: rotate(-5deg); } 100% { transform: rotate(0); } }
.an-wiggle { animation: icoWiggle 500ms var(--ease-standard); }
@keyframes icoWiggle { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-3px) rotate(-8deg); } 40% { transform: translateX(3px) rotate(8deg); } 60% { transform: translateX(-2px) rotate(-5deg); } 80% { transform: translateX(2px) rotate(4deg); } }
.an-spin { animation: icoSpin 700ms var(--ease-standard); }
@keyframes icoSpin { to { transform: rotate(360deg); } }
.an-beat { animation: icoBeat 800ms var(--ease-standard); }
@keyframes icoBeat { 0% { transform: scale(1); } 18% { transform: scale(1.25); } 34% { transform: scale(1); } 52% { transform: scale(1.15); } 70%,100% { transform: scale(1); } }
.an-fly { animation: icoFly 900ms var(--ease-standard); }
@keyframes icoFly { 0% { transform: none; opacity: 1; } 35% { transform: translate(14px,-14px) scale(.6); opacity: 0; } 36% { transform: translate(-14px,14px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.an-flip { animation: icoFlip 700ms var(--ease-standard); }
@keyframes icoFlip { from { transform: perspective(60px) rotateY(0); } to { transform: perspective(60px) rotateY(360deg); } }
/* tap-dot: punto de toque discreto */
.tapdot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; animation: tapdot 420ms var(--ease-enter) forwards; z-index: 5; }
@keyframes tapdot { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }

/* ===== Odómetro (Mov A · odometer-roll) ===== */
.odo { display: inline-flex; line-height: 1; height: 1em; overflow: hidden; vertical-align: baseline; }
.od { display: inline-block; height: 1em; overflow: hidden; }
.od-s { display: flex; flex-direction: column; transition: transform 520ms var(--ease-over), filter 520ms; }
.od-s.mv { filter: blur(.6px); }
.od-s span { height: 1em; line-height: 1; display: block; text-align: center; }
.od-c { display: inline-block; }

/* ===== Ingreso · F3 Orbes y vidrio ===== */
[hidden] { display: none !important; }
.login { position: fixed; inset: 0; z-index: 200; background: var(--tone-950); color: #fff; overflow: auto; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.login .orb { position: fixed; border-radius: 50%; filter: blur(46px); opacity: .85; pointer-events: none; }
.login .o1 { width: 42vmax; height: 42vmax; background: var(--tone-500); left: -12vmax; top: -6vmax; animation: orbA 13s ease-in-out infinite alternate; }
.login .o2 { width: 28vmax; height: 28vmax; background: var(--tone-300); right: -6vmax; top: 22vh; animation: orbB 11s ease-in-out infinite alternate; }
.login .o3 { width: 48vmax; height: 48vmax; background: var(--tone-700); left: 18vw; bottom: -26vmax; animation: orbA 16s ease-in-out infinite alternate-reverse; }
.login .o4 { width: 18vmax; height: 18vmax; background: var(--sec); right: 22vw; bottom: 8vh; opacity: .45; animation: orbB 14s ease-in-out infinite alternate-reverse; }
@keyframes orbA { from { transform: translate(0,0) scale(1); } to { transform: translate(6vmax,4vmax) scale(1.12); } }
@keyframes orbB { from { transform: translate(0,0) scale(1); } to { transform: translate(-5vmax,-3vmax) scale(.9); } }
.lg-grid { position: relative; z-index: 2; width: min(1080px, 100%); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 420px); gap: 48px; align-items: center; }
.lg-side { display: flex; flex-direction: column; gap: 18px; }
.lg-logo { width: 78px; height: 78px; border-radius: 22.5%; overflow: hidden; box-shadow: 0 18px 34px -16px rgb(0 0 0 / .7); animation: logoIn 900ms var(--ease-over) both; }
.lg-logo img, .brand-mark img { width: 100%; height: 100%; display: block; }
@keyframes logoIn { 0% { transform: scale(.3) rotate(-24deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.lg-side h1 { margin: 0; font-family: var(--f-num); font-weight: 500; font-size: clamp(30px, 4vw, 46px); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; }
.lg-side p { margin: 0; color: rgb(255 255 255 / .66); max-width: 46ch; font-size: 15.5px; }
.wr { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(6px); color: rgb(255 255 255 / .55); animation: wordIn 700ms var(--ease-standard) forwards; animation-delay: calc(300ms + var(--w) * 70ms); }
@keyframes wordIn { to { opacity: 1; filter: blur(0); transform: none; color: #fff; } }
.lg-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.lg-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); font-size: 13px; backdrop-filter: blur(8px);
  animation: clusterPop 560ms var(--ease-over) both; animation-delay: calc(900ms + var(--i) * 80ms); }
@keyframes clusterPop { from { transform: scale(.3); opacity: 0; } }
.lg-card { position: relative; border-radius: 28px; background: rgb(255 255 255 / .08); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgb(255 255 255 / .16);
  padding: 28px 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px -40px rgb(0 0 0 / .8); animation: zoomBirth 900ms var(--ease-emph) both .1s; }
@keyframes zoomBirth { from { transform: scale(.85); opacity: 0; filter: blur(6px); } }
.lg-card > * { transition: opacity 260ms var(--ease-exit); }
.lg-card.expand > * { opacity: 0; }
.lg-card h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.lg-card .sub { margin: -8px 0 4px; color: rgb(255 255 255 / .62); font-size: 13.5px; }
.lg-brand-m { display: none; align-items: center; gap: 10px; margin-bottom: 4px; }
.lg-brand-m .lg-logo { width: 44px; height: 44px; }
.fld { position: relative; }
.fld input { width: 100%; height: 54px; border-radius: 14px; border: 1px solid rgb(255 255 255 / .16); background: rgb(255 255 255 / .08); padding: 22px 44px 6px 14px; color: #fff; outline: none;
  transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast); }
.fld input:focus { border-color: var(--tone-300); background: rgb(255 255 255 / .12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone-300) 22%, transparent); }
.fld label { position: absolute; left: 15px; top: 17px; font-size: 14.5px; color: rgb(255 255 255 / .6); pointer-events: none; transform-origin: left top; transition: transform var(--dur-fast) var(--ease-standard), color var(--dur-fast); }
.fld input:focus + label, .fld input:not(:placeholder-shown) + label { transform: translateY(-10px) scale(.78); color: var(--tone-200); }
.fld .eye { position: absolute; right: 8px; top: 9px; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: rgb(255 255 255 / .75); }
.fld .err { display: block; height: 0; overflow: hidden; color: #FFB4B0; font-size: 12.5px; transition: height var(--dur-base) var(--ease-standard); }
.fld.bad input { border-color: #FF8A84; }
.fld.bad .err { height: 20px; padding-top: 4px; }
.fld.shake { animation: shake 300ms var(--ease-standard); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.lg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: rgb(255 255 255 / .75); }
.lg-row .lnk { color: var(--tone-200); font-weight: 600; }
.lg-btn { position: relative; height: 52px; border-radius: 15px; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden;
  background: linear-gradient(135deg, var(--tone-400), var(--tone-600)); box-shadow: 0 14px 30px -14px var(--tone-500); transition: transform var(--dur-instant), filter 450ms, opacity 450ms; }
.lg-btn:active { transform: scale(.97); }
.lg-btn[disabled] { filter: grayscale(.9); opacity: .55; }
.lg-btn .lk { width: 20px; height: 20px; }
.lg-btn .lk .sh { transform-box: view-box; transform-origin: 16px 11px; }
.lg-btn.loading .lk { animation: lockshake 1.1s ease-in-out infinite; }
.lg-btn.loading .lk .sh { animation: shk .55s ease-in-out infinite; }
.lg-btn.ok .lk .sh { animation: unlock 460ms var(--ease-over) 120ms both; }
@keyframes shk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes lockshake { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(8deg); } 94% { transform: rotate(-4deg); } }
@keyframes unlock { to { transform: translateY(-4px) rotate(-30deg); } }
.lg-foot { text-align: center; font-size: 12px; color: rgb(255 255 255 / .5); }
.lg-foot.warn { color: #ffd3c4; font-weight: 600; }
.lg-alt { display: block; margin: 10px auto 0; color: var(--tone-200); font-weight: 600; font-size: 13px; }
.sw-tgl { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.login .toggle { width: 38px; height: 22px; }
.login .toggle::after { width: 16px; height: 16px; }
.login .toggle[aria-checked="true"] { background: var(--tone-400); }
.login .toggle[aria-checked="true"]::after { transform: translateX(16px); }
.login.out { animation: loginOut 480ms var(--ease-exit) forwards; }
@keyframes loginOut { to { opacity: 0; } }

/* ===== Estructura ===== */
.app { display: flex; height: 100%; }
.app.boot .main { animation: zoomBirthApp 700ms var(--ease-emph) both; }
@keyframes zoomBirthApp { from { transform: scale(.94); filter: blur(10px); opacity: 0; } }
.side { position: relative; z-index: 30; width: var(--side-w); flex: none; height: 100%; display: flex; flex-direction: column; gap: 4px;
  background: linear-gradient(180deg, var(--hero) 0%, var(--hero-2) 100%); color: var(--on-hero);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  transition: width var(--dur-slow) var(--ease-emph), transform var(--dur-slow) var(--ease-standard); overflow: hidden; }
.side::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 50% at 0% 0%, color-mix(in srgb, var(--tone-400) 34%, transparent), transparent 62%),
              radial-gradient(90% 40% at 100% 100%, color-mix(in srgb, var(--tone-500) 30%, transparent), transparent 70%); }
.side > * { position: relative; }
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 4px 14px; min-height: 60px; }
.brand-mark { width: 52px; height: 52px; border-radius: 22.5%; overflow: hidden; flex: none; box-shadow: 0 8px 18px -8px rgb(0 0 0 / .6); transition: transform var(--dur-slow) var(--ease-over); }
.brand:hover .brand-mark { transform: rotate(-6deg) scale(1.05); }
.brand-txt { white-space: nowrap; transition: opacity var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard); }
.brand-txt span.sub { display: block; font-size: 11px; color: var(--on-hero-soft); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.marca-n { font-family: var(--f-logo); font-weight: 800; line-height: 1; letter-spacing: -.5px; white-space: nowrap; display: inline-flex; align-items: flex-end; color: #fff; font-size: 25px; }
.marca-n .l { display: inline-block; position: relative; }
.marca-n .app { color: #B6E86A; }
.marca-n .i-sin { position: relative; }
.marca-n .punto { position: absolute; left: 50%; top: .02em; width: .3em; height: .3em; margin-left: -.15em; }
.marca-n.salta .l { opacity: 0; animation: marcaSalta .6s var(--ease-over) calc(var(--t, 0s) + var(--k) * 75ms) forwards; }
@keyframes marcaSalta { 0% { opacity: 0; transform: translateY(.8em) scale(.3) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
.marca-n.salta .punto { transform: scale(0); animation: marcaPunto .5s var(--ease-over) calc(var(--t, 0s) + .85s) forwards, marcaLate 1s ease-in-out calc(var(--t, 0s) + 1.5s) 2; }
@keyframes marcaPunto { to { transform: scale(1); } }
@keyframes marcaLate { 0%, 56%, 100% { transform: scale(1); } 14% { transform: scale(1.35); } 42% { transform: scale(1.18); } }
.nav { display: flex; flex-direction: column; gap: 4px; position: relative; }

/* ===== Piezas comunes ===== */

/* ===== Inicio · Patrón A ===== */

/* ===== Gráficos (chart-scrub) ===== */
.cw { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }

.chart .meta { stroke: var(--text); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .55; }
.chart .b { transform-box: fill-box; transform-origin: bottom; animation: barGrow .7s var(--ease-emph) both; animation-delay: calc(var(--i, 0) * 30ms); transition: opacity 200ms, filter 200ms; }

.chart .xh { transition: transform 260ms var(--ease-over), opacity 200ms; opacity: 0; }

.chart .xh line { stroke: var(--text); stroke-width: 1; stroke-dasharray: 3 3; opacity: .45; }
.chart .band { animation: areaIn 700ms var(--ease-enter) both .2s; }

.chart .lolc { animation: badgePop .45s var(--ease-over) both; animation-delay: calc(.4s + var(--i, 0) * 25ms); transform-box: fill-box; transform-origin: center; transition: r 200ms var(--ease-over); }
.chart.scrubbing .lolg { opacity: .45; transition: opacity 200ms; }
.chart.scrubbing .lolg.on { opacity: 1; }
.chart .hm { transition: transform 260ms var(--ease-over), opacity 200ms; transform-box: fill-box; transform-origin: center; animation: badgePop .5s var(--ease-over) both; animation-delay: calc(var(--i) * 60ms); }

.chart .seg-d { transition: transform 300ms var(--ease-over); transform-origin: 100px 100px; cursor: pointer; }
.chart .seg-d:hover, .chart .seg-d.on { transform: scale(1.06); }
.chart .arc { stroke-dasharray: var(--l) 999; stroke-dashoffset: var(--l); animation: arcDraw 900ms var(--ease-standard) forwards; animation-delay: calc(var(--i) * 140ms); }
@keyframes arcDraw { to { stroke-dashoffset: 0; } }
.chart .db-row { transition: opacity 200ms; }
.chart.scrubbing .db-row { opacity: .4; }
.chart.scrubbing .db-row.on { opacity: 1; }
.ctip { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; min-width: 120px; padding: 8px 11px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.35; box-shadow: var(--shadow-2);
  transform: translate(-50%, -6px); transition: left 260ms var(--ease-over), top 260ms var(--ease-over), opacity 200ms; opacity: 0; white-space: nowrap; }
.ctip.on { opacity: 1; }

.ctip .tsw { animation: tipSwap 260ms var(--ease-standard); display: block; }
@keyframes tipSwap { from { opacity: .2; transform: translateY(4px); } }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.scrub-hint { font-size: 11.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }

/* ===== Pacientes: tablero con jerarquía tonal ===== */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.col { scroll-snap-align: start; border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; align-self: start;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 13%, var(--tint)) 0%, color-mix(in srgb, var(--c) 6%, var(--bg)) 100%); border: 1px solid color-mix(in srgb, var(--c) 22%, var(--border)); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px; }
.col-h .n { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--c); }
.col-h .hint { margin-left: auto; font-size: 11.5px; color: var(--text-2); text-align: right; }
.pcard { position: relative; overflow: hidden; background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 18%, var(--border)); border-radius: 16px; padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%;
  box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 6px 16px -12px color-mix(in srgb, var(--c) 60%, transparent); transition: transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast); }
.pcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); transform-origin: top; animation: stripe .5s var(--ease-enter) both; animation-delay: calc(var(--i, 0) * 40ms + 200ms); }
.pcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.pcard:active { transform: scale(.98); }
@keyframes stripe { from { transform: scaleY(0); } }
.pcard-top { display: flex; align-items: center; gap: 10px; }
.pcard-top > div { min-width: 0; flex: 1; }
.pcard-top b { display: block; font-size: 14.5px; font-weight: 600; }
.pcard-top span { font-size: 12px; color: var(--text-2); }
.pcard-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mini { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--m) 12%, var(--surface)); color: var(--text); }
.mini i { width: 8px; height: 8px; border-radius: 2px; background: var(--m); }
.pcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-2); padding-top: 8px; border-top: 1px dashed var(--border); }
.pcard-foot .lt { display: inline-flex; align-items: center; gap: 5px; }
.spark { width: 84px; height: 24px; }
.spark path { fill: none; stroke: var(--sc, var(--accent)); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.row { cursor: pointer; transition: background var(--dur-fast); }
tr.row:hover { background: var(--tint); }
.who-cell { display: flex; align-items: center; gap: 10px; }
.who-cell .av { width: 32px; height: 32px; font-size: 12px; }
.cell-bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.cell-bar .bar { flex: 1; height: 6px; }
.inact { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

/* ===== Alertas ===== */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px 16px; position: relative; overflow: hidden; }
.alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.alert p { margin: 4px 0 0; font-size: 13.5px; }
.alert .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.alert .meta b { color: var(--text); font-weight: 600; }

/* ===== Citas · Patrón E ===== */
.agenda-panel { border-radius: 22px; padding: 14px; background: linear-gradient(180deg, var(--tint), color-mix(in srgb, var(--tint) 35%, var(--bg))); border: 1px solid var(--border); }
.ecards { display: flex; flex-direction: column; gap: 10px; }
.ecard { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 12px 12px 16px; border-radius: 16px;
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--cs) 25%, var(--border)); box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 10px 20px -14px color-mix(in srgb, var(--cs) 70%, transparent);
  transition: transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast), opacity 1.1s var(--ease-standard); animation: tlIn var(--dur-slow) var(--ease-enter) both; animation-delay: calc(var(--i, 0) * 50ms); cursor: pointer; }
.ecard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cs); transform-origin: top; animation: stripe .5s var(--ease-enter) both; animation-delay: calc(var(--i, 0) * 50ms + 220ms); }
.ecard:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.ecard:active { transform: scale(.98); }
.ecard.hl { animation: tlIn var(--dur-slow) var(--ease-enter) both, insertHl 1.2s var(--ease-standard) .2s; }
@keyframes insertHl { 0% { background: color-mix(in srgb, var(--cs) 30%, var(--surface)); } 100% { background: var(--surface); } }
@keyframes tlIn { from { opacity: 0; transform: translateX(12px); } }
.ecard.done { opacity: .55; }
.e-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--cb); color: var(--cf); flex: none; }
.e-txt b { display: block; font-size: 14.5px; font-weight: 600; }
.e-txt .t2 { font-size: 12.5px; color: var(--text-2); }
.e-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--text-2); }
.e-meta .hr { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--text); }
.rem { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 8px; background: var(--cb); color: var(--cf); font-weight: 600; font-size: 11.5px; }
.e-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chk { width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--cs) 60%, var(--border)); display: grid; place-items: center; position: relative; overflow: hidden; background: var(--surface); }
.chk::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--hero); transform: scale(0); transition: transform 420ms var(--ease-over); }
.chk svg { position: relative; color: #fff; }
.chk path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 300ms var(--ease-standard) 150ms; }
.chk.on::before { transform: scale(1); }
.chk.on path { stroke-dashoffset: 0; }
.ecard.pulse { animation: taskPulse 380ms var(--ease-over); }
@keyframes taskPulse { 50% { transform: scale(1.025); } }
.week-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.week-h h2 { margin: 0; font-size: 17px; font-weight: 700; text-transform: capitalize; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 6px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); position: relative; margin-bottom: 14px; }
.week .pill { position: absolute; top: 6px; bottom: 6px; left: 0; border-radius: 15px; background: var(--hero); box-shadow: 0 10px 20px -10px var(--hero); transition: transform 450ms var(--ease-over), width 450ms var(--ease-over); }
.day { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; border-radius: 15px; transition: color var(--dur-fast); }
.day small { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.day b { font-family: var(--f-num); font-size: 20px; font-weight: 500; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--cs); }
.day.on small { color: color-mix(in srgb, var(--on-hero) 80%, transparent); }
.day.on b { background: var(--on-hero); color: var(--hero); animation: badgePop .4s var(--ease-over); }
.day.hoy:not(.on) small { color: var(--accent); }
.tl { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; }
.tl-h { font-size: 11px; color: var(--text-2); text-align: right; padding-top: 16px; font-variant-numeric: tabular-nums; position: relative; padding-right: 8px; }
.tl-h::after { content: ""; position: absolute; right: -8px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--cs); box-shadow: 0 0 0 3px var(--surface); }
.tl-col { position: relative; }
.tl-wrap { position: relative; }
.tl-wrap::before { content: ""; position: absolute; left: 58px; top: 8px; bottom: 8px; border-left: 2px dotted var(--border); transform-origin: top; animation: stripe .7s var(--ease-enter) both; }

/* ===== Reportes y opciones ===== */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.opts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; }
.opt-row + .opt-row { border-top: 1px solid var(--border); }
.opt-row b { display: block; font-size: 14px; font-weight: 600; }
.opt-row span.d { font-size: 12.5px; color: var(--text-2); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; font-weight: 600; transition: transform var(--dur-fast) var(--ease-over), border-color var(--dur-fast), box-shadow var(--dur-fast); }
.sw:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.sw .dot2 { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%); box-shadow: inset 0 0 0 2px rgb(255 255 255 / .25); position: relative; }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.sw[aria-pressed="true"] .dot2::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); animation: chipFill .4s var(--ease-over); }
@keyframes chipFill { from { transform: scale(.4); opacity: 0; } }
.tonos { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tono { height: 44px; border-radius: 12px; border: 2px solid transparent; position: relative; display: grid; place-items: end center; padding-bottom: 4px; font-size: 10.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / .4); transition: transform var(--dur-fast) var(--ease-over); }
.tono:hover { transform: translateY(-2px); }
.tono[aria-pressed="true"] { border-color: var(--text); transform: scale(1.06); }
.combos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.combo { border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.combo[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.combo .strip { display: flex; height: 18px; border-radius: 6px; overflow: hidden; }
.combo .strip i { flex: 1; transform-origin: bottom; }
.combo.morph .strip i { animation: paletteMorph 420ms var(--ease-over) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes paletteMorph { 0% { transform: scaleY(.9) scaleX(1.1); filter: brightness(1.3); } 100% { transform: none; } }
.combo b { font-size: 12.5px; }
.toggle { width: 46px; height: 28px; border-radius: 99px; background: var(--border); position: relative; transition: background var(--dur-fast); flex: none; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .25); transition: transform var(--dur-base) var(--ease-over); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(18px); }
.store-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.store-row + .store-row { border-top: 1px solid var(--border); }
.store-row .si { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--tint); }
.store-row b { display: block; font-size: 14px; }
.store-row span { font-size: 12.5px; color: var(--text-2); }

/* ===== Ficha (push-slide) ===== */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--dur-slow) var(--ease-standard); backdrop-filter: blur(1.5px); }
.scrim.on { opacity: 1; pointer-events: auto; }
.ficha { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(1120px, 95vw); background: var(--bg); box-shadow: -24px 0 60px -30px rgb(0 0 0 / .5);
  display: flex; flex-direction: column; transform: translateX(104%); visibility: hidden; border-radius: 24px 0 0 24px; overflow: hidden;
  transition: transform var(--dur-slower) var(--ease-emph), visibility 0s linear var(--dur-slower), filter var(--dur-slow), scale var(--dur-slow) var(--ease-standard); }
.ficha.on { transform: none; visibility: visible; transition: transform var(--dur-slower) var(--ease-emph), visibility 0s, filter var(--dur-slow), scale var(--dur-slow) var(--ease-standard); }
.ficha.closing { transition-duration: var(--dur-slow); transition-timing-function: var(--ease-exit); }
.ficha.depth { scale: .965; filter: blur(3px) brightness(.55); }
.app.pushed .main { transform: translateX(-3%); filter: brightness(.94); }
.f-top { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
.f-top .pos { font-size: 13px; color: var(--text-2); margin-left: 4px; }
.f-top .sp { flex: 1; }
.f-scroll { flex: 1; overflow: auto; overscroll-behavior: contain; }
.f-head { background: var(--surface); padding: 18px 22px 0; border-bottom: 1px solid var(--border); }
.f-id { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.f-id .av { width: 66px; height: 66px; font-size: 22px; }
.f-name { min-width: 0; flex: 1; }
.f-name h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.f-facts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 8px; }
.f-facts div { font-size: 12px; color: var(--text-2); }
.f-facts b { display: block; font-size: 13.5px; color: var(--text); font-weight: 600; }
.f-actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.estado-wrap { position: relative; }
.grid-cit { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.est-btn { min-width: 150px; justify-content: space-between; }
.est-btn .dotc { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
.est-btn .chev2 { transition: transform var(--dur-base) var(--ease-over); }
.est-btn[aria-expanded="true"] .chev2 { transform: rotate(180deg); }
/* glass-picker */
.picker { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; width: 320px; max-width: calc(100vw - 32px); border-radius: 18px; padding: 6px;
  background: color-mix(in srgb, var(--surface) 78%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--border); box-shadow: var(--shadow-2);
  transform-origin: top right; animation: pickerIn 420ms var(--ease-over) both; }
@keyframes pickerIn { from { opacity: 0; transform: translateY(-8px) scale(.94); } }
.p-opt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px; border-radius: 13px; position: relative; border: 2px solid transparent; transition: background var(--dur-fast), border-color var(--dur-base) var(--ease-over); }
.p-opt:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
.p-opt.sel { border-color: var(--c); }
.p-opt .pi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.p-opt b { display: block; font-size: 14px; }
.p-opt span { font-size: 12px; color: var(--text-2); }
.p-more { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; animation: rise 300ms var(--ease-enter) both; }
.p-more label { font-size: 12px; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
/* hold-fill (Mov D) */
.hold { position: relative; overflow: hidden; height: 46px; border-radius: 13px; background: color-mix(in srgb, var(--st-exceso) 14%, var(--surface)); color: var(--st-exceso); font-weight: 700; font-size: 13.5px; border: 1px solid color-mix(in srgb, var(--st-exceso) 40%, transparent); touch-action: none; }
.hold .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--st-exceso); transition: height 400ms var(--ease-exit); }
.hold.holding .fill { height: 108%; transition: height 1200ms linear; }
.hold .fill::before { content: ""; position: absolute; left: -10%; right: -10%; top: -6px; height: 12px; background: radial-gradient(circle at 10px -2px, transparent 8px, var(--st-exceso) 9px) 0 0 / 20px 12px repeat-x; animation: wave 1s linear infinite; }
@keyframes wave { to { background-position: 20px 0; } }
.hold span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%; height: 100%; transition: color 300ms; }
.hold.holding span { color: #fff; }
.hold.done { animation: icoBeat .8s; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; margin-top: 12px; font-size: 13px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); animation: rise 360ms var(--ease-enter) both; }
.banner b { color: var(--c); }
.tabs { display: flex; gap: 4px; margin-top: 14px; position: relative; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border-radius: 10px 10px 0 0; transition: color var(--dur-fast); }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); }
.tab-ind { position: absolute; bottom: 0; left: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transition: transform var(--dur-slow) var(--ease-over), width var(--dur-slow) var(--ease-over); }
.f-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 18px 22px 40px; padding-right: max(22px, env(safe-area-inset-right, 0px)); align-items: start; }
.f-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.f-pane.in-r { animation: tabInR var(--dur-base) var(--ease-enter) both; }
.f-pane.in-l { animation: tabInL var(--dur-base) var(--ease-enter) both; }
@keyframes tabInR { from { opacity: 0; transform: translateX(var(--shift-md)); } }
@keyframes tabInL { from { opacity: 0; transform: translateX(calc(-1 * var(--shift-md))); } }
.f-side { display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 12px; font-size: 13px; }
.kv dt { color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 4px 9px; border-radius: 8px; background: var(--tint); color: var(--text); font-weight: 500; }
.notes textarea { width: 100%; min-height: 70px; resize: vertical; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); padding: 10px 12px; outline: none; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.notes textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
.note { padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 13px; }
.note small { display: block; color: var(--text-2); font-size: 11.5px; margin-bottom: 2px; }
.note.new { animation: flash 1.2s var(--ease-standard); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 30%, var(--bg)); transform: translateY(-6px); } 100% { background: var(--bg); transform: none; } }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.tile { padding: 16px; text-align: center; }
.tile .l { font-size: 12px; color: var(--text-2); }
.tile .v { font-size: 32px; font-weight: 500; line-height: 1.15; font-family: var(--f-num); display: flex; justify-content: center; align-items: baseline; gap: 4px; }
.tile .s { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.fine { font-size: 12.5px; color: var(--text-2); margin: 0; }
.finds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.finds li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.frow { display: grid; grid-template-columns: 110px 1fr 120px; align-items: center; gap: 12px; padding: 7px 0; font-size: 13px; }
.frow .r { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
.frow .r b { color: var(--text); font-weight: 600; }
.days { display: flex; flex-direction: column; gap: 8px; }
.dayrow { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: box-shadow var(--dur-fast); }
.dayrow:hover { box-shadow: var(--shadow); }
.dayrow > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left; }
.dayrow .dn { flex: 1; min-width: 0; }
.dayrow .dn b { display: block; font-size: 13.5px; font-weight: 600; }
.dayrow .dn span { font-size: 12px; color: var(--text-2); }
.dayrow .car { color: var(--text-2); transition: transform var(--dur-base) var(--ease-over); }
.dayrow.open .car { transform: rotate(90deg); }
.dayrow .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-standard); }
.dayrow.open .det { grid-template-rows: 1fr; }
.dayrow .det > div { overflow: hidden; }
.dayrow .det-in { padding: 4px 14px 14px; border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 18px; }
.nutr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nut { padding: 10px; border-radius: 13px; background: color-mix(in srgb, var(--c) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 26%, transparent); }
.nut .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.nut .t b { color: var(--c); }
.nut .v { font-family: var(--f-num); font-size: 19px; margin: 2px 0 6px; }
.stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; background: var(--c); transform-origin: left; animation: barFill .8s var(--ease-emph) both; }
.stack-row { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 130px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.hbar .bar { height: 10px; }
.hbar span:last-child { color: var(--text-2); font-variant-numeric: tabular-nums; }
.top-food { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; }
.top-food span:last-child { color: var(--text-2); font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; gap: 2px; color: #E7A93A; }
.stars .off { color: color-mix(in srgb, var(--text-2) 35%, transparent); }
.score { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.score .big { font-family: var(--f-num); font-size: 44px; line-height: 1; }
.crit { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; }
.crit + .crit { border-top: 1px solid var(--border); }
.crit-h { display: flex; align-items: center; gap: 10px; }
.crit-h b { font-size: 14px; font-weight: 600; }
.crit p { margin: 0; font-size: 12.5px; color: var(--text-2); }
.crit .quote { font-size: 13px; color: var(--text); }
.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec-i { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.rec-i .hr { font-family: var(--f-num); font-size: 18px; }

/* ===== Hojas: evaluación, más métricas ===== */
.modal { position: fixed; z-index: 70; right: 0; top: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); box-shadow: -20px 0 50px -24px rgb(0 0 0 / .55);
  display: flex; flex-direction: column; transform: translateX(104%); visibility: hidden; transition: transform var(--dur-slow) var(--ease-emph), visibility 0s linear var(--dur-slow); }
.modal.on { transform: none; visibility: visible; transition: transform var(--dur-slow) var(--ease-emph), visibility 0s; }
.scrim2 { z-index: 60; }
.m-head { padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.m-head h3 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
.m-body { flex: 1; overflow: auto; padding: 8px 18px 18px; }
.m-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.ev { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 10px; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.ev.open { border-color: var(--text); box-shadow: var(--shadow); }
.ev-h { display: flex; align-items: center; gap: 10px; }
.ev-h b { font-size: 14px; font-weight: 600; }
.ev-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
.ev-h > div { flex: 1; min-width: 0; }
.ev .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-standard); }
.ev.open .det { grid-template-rows: 1fr; }
.ev .det > div { overflow: hidden; }
.ev-in { padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.pick { display: flex; gap: 4px; }
.pick button { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: color-mix(in srgb, var(--text-2) 40%, transparent); transition: transform var(--dur-fast) var(--ease-over), color var(--dur-fast); }
.pick button.on { color: #E7A93A; }
.pick button:hover { transform: scale(1.15); }
.ev textarea { width: 100%; min-height: 64px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); padding: 9px 11px; resize: vertical; outline: none; }
.ev textarea:focus { border-color: var(--accent); }
.ev .ck { display: none; width: 22px; height: 22px; border-radius: 50%; background: var(--st-meta); color: #fff; place-items: center; animation: badgePop .4s var(--ease-over); }
.ev-done .ev-h .ck { display: grid; }
.mm { position: fixed; z-index: 75; left: 50%; top: 50%; width: min(860px, calc(100vw - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--surface); border-radius: 24px; box-shadow: 0 40px 100px -40px rgb(0 0 0 / .7);
  transform: translate(-50%, -50%) scale(.9); opacity: 0; visibility: hidden; transition: transform var(--dur-slow) var(--ease-over), opacity var(--dur-base), visibility 0s linear var(--dur-slow); }
.mm.on { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; transition: transform var(--dur-slow) var(--ease-over), opacity var(--dur-base), visibility 0s; }
.mm-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 6px; }
.mm-head h3 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
.mm-body { padding: 8px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.mchips { display: flex; flex-wrap: wrap; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { border-radius: 14px; padding: 12px; background: var(--bg); }
.stat small { display: block; color: var(--text-2); font-size: 11.5px; }
.stat b { font-family: var(--f-num); font-size: 22px; font-weight: 500; display: block; }

/* ===== Nueva cita · fab-fill-reveal ===== */
.reveal { position: fixed; inset: 0; z-index: 85; pointer-events: none; visibility: hidden; }
.reveal.on { pointer-events: auto; visibility: visible; }
.reveal .w1, .reveal .w2 { position: absolute; inset: 0; clip-path: circle(0 at var(--rx) var(--ry)); transition: clip-path 640ms cubic-bezier(.7,0,.2,1); }
.reveal .w1 { background: var(--tone-300); }
.reveal .w2 { background: linear-gradient(160deg, var(--hero), var(--hero-2)); transition-delay: 120ms; }
.reveal.on .w1, .reveal.on .w2 { clip-path: circle(150% at var(--rx) var(--ry)); }
.reveal.closing .w1 { transition-delay: 120ms; }
.reveal.closing .w2 { transition-delay: 0ms; }
.rv-body { position: absolute; inset: 0; overflow: auto; color: #fff; padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.rv-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.rv-in > * { opacity: 0; transform: translateY(16px); }
.reveal.on.ready .rv-in > * { animation: rvIn 420ms var(--ease-emph) forwards; animation-delay: calc(var(--i) * 40ms); }
@keyframes rvIn { to { opacity: 1; transform: none; } }
.rv-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rv-top h2 { margin: 0; font-family: var(--f-num); font-weight: 500; font-size: clamp(26px, 3vw, 34px); }
.rv-x { width: 46px; height: 46px; border-radius: 50%; background: rgb(255 255 255 / .14); display: grid; place-items: center; color: #fff; transition: transform 500ms var(--ease-over); }
.rv-x:hover { transform: rotate(90deg); }
.rv-lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgb(255 255 255 / .7); margin-bottom: 8px; }
.rv-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.rchip { position: relative; overflow: hidden; height: 40px; padding: 0 14px; border-radius: 999px; background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .2); color: #fff; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.rchip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--cc, #fff); transform: scale(0); transition: transform 420ms var(--ease-over); }
.rchip > * { position: relative; }
.rchip .pd { width: 9px; height: 9px; border-radius: 50%; background: var(--cc, #fff); transition: background 300ms; }
.rchip[aria-pressed="true"] { color: var(--cfc, var(--hero)); border-color: transparent; }
.rchip[aria-pressed="true"]::before { transform: scale(1.05); }
.rchip[aria-pressed="true"] .pd { background: #fff; }
.rv-sel { height: 46px; width: 100%; border-radius: 14px; background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .2); color: #fff; padding: 0 12px; font-size: 14px; }
.rv-sel option { color: #111; }
.rv-box { border-radius: 18px; padding: 14px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); display: flex; flex-direction: column; gap: 12px; }
.rv-go { height: 52px; border-radius: 16px; background: #fff; color: var(--hero); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform var(--dur-instant); }
.rv-go:active { transform: scale(.97); }
.rv-go.loading { width: 52px; margin: 0 auto; border-radius: 26px; }
.rv-go.loading > * { display: none; }
.rv-go.loading::after { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--hero) 30%, transparent); border-top-color: var(--hero); animation: spin .7s linear infinite; }
.rv-note { font-size: 12.5px; color: rgb(255 255 255 / .75); }

/* ===== Notificaciones ===== */
.npanel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-2); transform-origin: top right; animation: pickerIn 420ms var(--ease-over) both; overflow: hidden; }
.np-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.np-h b { flex: 1; font-size: 15px; }
.np-l { max-height: 60vh; overflow: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.ni { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px; border-radius: 14px; text-align: left; width: 100%; transition: background var(--dur-fast); }
.ni:hover { background: var(--tint); }
.ni .nic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--cb, var(--tint)); color: var(--cf, var(--accent)); }
.ni b { font-size: 13.5px; font-weight: 600; display: block; }
.ni span { font-size: 12px; color: var(--text-2); }
.ni.unread b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--st-exceso); margin-left: 6px; vertical-align: 2px; }
.top-r { display: flex; align-items: center; gap: 10px; position: relative; }
/* toast-fan (Mov C) */
.fan { position: fixed; z-index: 92; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 32px)); height: 96px; }
.fan .ft { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-2);
  transition: transform 520ms var(--ease-over), opacity 300ms; transform: translateY(calc(var(--k) * -15px)) scale(calc(1 - var(--k) * .05)); z-index: calc(10 - var(--k)); animation: fanIn 600ms var(--ease-over) both; animation-delay: calc(var(--k) * 90ms + 400ms); }
@keyframes fanIn { from { opacity: 0; transform: translateY(60px); } }
.fan:hover .ft, .fan.open .ft { transform: translateY(calc(var(--k) * -78px)); }
.fan .ft b { font-size: 13.5px; display: block; }
.fan .ft span { font-size: 12px; color: var(--text-2); }
.fan .ft .nic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--cb); color: var(--cf); }
.fan.gone { opacity: 0; transform: translateY(30px); transition: opacity 300ms, transform 300ms var(--ease-exit); pointer-events: none; }

/* ===== Aviso ===== */
.toast { position: fixed; z-index: 95; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -160%); display: flex; align-items: center; gap: 10px; visibility: hidden;
  padding: 10px 14px 10px 10px; border-radius: 14px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-2); font-size: 13.5px; max-width: calc(100vw - 32px);
  transition: transform var(--dur-slow) var(--ease-over), visibility 0s linear var(--dur-slow); }
.toast.on { transform: translate(-50%, 0); visibility: visible; transition: transform var(--dur-slow) var(--ease-over), visibility 0s; }
.toast .tk { width: 28px; height: 28px; border-radius: 9px; background: var(--st-meta); color: #fff; display: grid; place-items: center; flex: none; }
.toast .tk path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.toast.on .tk path { animation: check .5s var(--ease-standard) .15s forwards; }
@keyframes check { to { stroke-dashoffset: 0; } }
.toast small { display: block; opacity: .7; font-size: 12px; }
.flyer { position: fixed; z-index: 80; pointer-events: none; margin: 0; }
.sk { border-radius: 16px; background: linear-gradient(90deg, var(--tint) 25%, color-mix(in srgb, var(--surface) 70%, var(--tint)) 50%, var(--tint) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* ===== Tamaños ===== */
@media (max-width: 1180px) {
  .tinted { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .f-body { grid-template-columns: minmax(0, 1fr); }
  .f-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .f-actions { width: 100%; padding-left: 80px; }
  .grid-cit { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 980px) {
  .home, .grid-2, .opts { grid-template-columns: minmax(0, 1fr); }
  .lg-grid { grid-template-columns: minmax(0, 440px); justify-content: center; }
  .lg-side { display: none; }
  .lg-brand-m { display: flex; }
}
@media (max-width: 719px) {
  .side { position: fixed; z-index: 45; left: 0; top: 0; bottom: 0; transform: translateX(-104%); width: min(300px, 86vw); box-shadow: 24px 0 60px -30px rgb(0 0 0 / .6); border-radius: 0 24px 24px 0; }
  .app.collapsed .side { width: min(300px, 86vw); }
  .app.collapsed .brand-txt, .app.collapsed .nav-txt, .app.collapsed .who-txt, .app.collapsed .side-btn span, .app.collapsed .nav-label { opacity: 1; transform: none; pointer-events: auto; }
  .app.collapsed .nav-badge { position: static; min-width: 22px; height: 20px; margin-left: auto; }
  .app.drawer .side { transform: none; }
  #collapseBtn { display: none; }
  .icon-btn.menu-btn { display: grid; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  .top h1 { font-size: 17px; }
  .top .crumb { display: none; }
  .sx.open { position: absolute; right: 0; width: calc(100vw - 32px); z-index: 5; }
  .top .btn-primary span { display: none; }
  .top .btn-primary { width: 42px; padding: 0; }
  .hero-in { grid-template-columns: minmax(0, 1fr); }
  .next { min-width: 0; }
  .cell { padding: 12px; }
  .cell .v { font-size: 25px; }
  .board { grid-auto-columns: minmax(82vw, 1fr); }
  .ficha { width: 100vw; border-radius: 0; }
  .f-head { padding: 14px 16px 0; }
  .f-body { padding: 14px 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .f-side { grid-template-columns: minmax(0, 1fr); }
  .f-actions { width: 100%; padding-left: 0; }
  .picker { left: 0; right: auto; }
  .f-actions .btn-primary { flex: 1; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .two.tiles, .nutr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .frow { grid-template-columns: 88px 1fr auto; gap: 10px; }
  .tile .v { font-size: 26px; }
  .dayrow .det-in { grid-template-columns: minmax(0, 1fr); }
  .modal { top: auto; height: 92%; width: 100vw; border-radius: 22px 22px 0 0; transform: translateY(104%); }
  .modal.on { transform: none; }
  .alert { grid-template-columns: auto 1fr; }
  .alert > .btn { grid-column: 1 / -1; justify-self: start; }
  .day b { font-size: 16px; width: 30px; height: 30px; }
  .day small { font-size: 10px; }
  .app.pushed .main { transform: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl { grid-template-columns: 52px minmax(0, 1fr); }
  .tl-wrap::before { left: 50px; }
  .combos { grid-template-columns: minmax(0, 1fr); }
  .ecard { grid-template-columns: auto minmax(0, 1fr); }

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { return Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r()); }

const ANIM = { bell: "swing", bellAlert: "swing", search: "lift", gear: "spin", hist: "spin", home: "bounce", cal: "bounce", alert: "wiggle", off: "wiggle", star: "pop", heart: "beat", check: "pop", checkC: "pop",

function ico(k, s = 18, g = "a", cls = "") {
  const fill = g === "cur" ? "currentColor" : `url(#hg-${g})`;
  return `<svg class="hi ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill}" data-a="${ANIM[k] || "press"}" aria-hidden="true">${HERO[k] || ""}</svg>`;
}
function animIco(svg) {
  if (OPT.motion === "reducido") return;
  const a = "an-" + svg.dataset.a;
  svg.classList.remove(a); void svg.getBoundingClientRect(); svg.classList.add(a);
  svg.addEventListener("animationend", () => svg.classList.remove(a), { once: true });
}
function tapDot(el, e) {
  if (OPT.motion === "reducido" || /^(TR|TD|TABLE|svg|INPUT|SELECT|TEXTAREA)$/i.test(el.tagName)) return;
  const r = el.getBoundingClientRect(); if (r.width < 30) return;
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  const d = document.createElement("span"); d.className = "tapdot"; d.style.left = (e.clientX - r.left) + "px"; d.style.top = (e.clientY - r.top) + "px";
  el.appendChild(d); setTimeout(() => d.remove(), 460);
}
document.addEventListener("pointerdown", (e) => {
  const host = e.target.closest("button, a, .tap"); if (!host) return;
  tapDot(host, e);
  const svg = host.querySelector("svg.hi"); if (svg && !host.classList.contains("nav-item")) animIco(svg);
});

/* ============ Odómetro (Mov A · odometer-roll) ============ */
function odo(el, txt) {
  txt = String(txt);
  const digits = [...txt].filter((c) => /\d/.test(c));
  el.classList.add("odo");
  el.innerHTML = [...txt].map((ch) => /\d/.test(ch) ? `<span class="od"><span class="od-s">${"0123456789".split("").map((n) => `<span>${n}</span>`).join("")}</span></span>` : `<span class="od-c">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
  const cols = $$(".od-s", el);
  requestAnimationFrame(() => requestAnimationFrame(() => cols.forEach((c, i) => {
    c.style.transitionDelay = (cols.length - 1 - i) * 45 + "ms"; c.classList.add("mv"); c.style.transform = `translateY(${-digits[i]}em)`;
    setTimeout(() => c.classList.remove("mv"), 600);
  })));
}

const HOY = hoyLima();

const DIAS_DATOS = 90;
function crearPaciente(b, idx) {

    if (i === 0 && b.p.gap === 0) registra = r() < .8;
    if (!registra) { dias.push({ fecha: iso(d), d, items: 0 }); continue; }

/* ============ Resumen clínico (criterios de Reportes › Resumen clínico de la app) ============ */
function resumen(p, nDias = 14) {

  const R = p.req;
  const pm = prom ? { kcal: prom.kcal / R.kcal * 100, prot: prom.prot / R.prot * 100, fibra: prom.fibra / R.fibra * 100 } : null;

  const deltaPct = delta !== null ? delta / serieP[0].kg * 100 : null;
  const porMomento = MOMENTOS.map(([k, label, s]) => { const avg = n ? con.reduce((a, d) => a + d.mom[k], 0) / n : 0; const obj = R.kcal * s; return { k, label, avg, obj, pct: obj ? avg / obj * 100 : 0 }; });

    if (n < Math.ceil(total * .5)) add("media", `Solo hay registro de alimentos en ${n} de ${total} días: interpretar los promedios con cautela.`);
    if (pm.kcal < 70) add("alta", `Ingesta energética promedio de ${n0(prom.kcal)} kcal/día (${pct(pm.kcal)} de la meta de ${n0(R.kcal)} kcal): déficit sostenido.`);
    else if (pm.kcal < 90) add("media", `Ingesta energética promedio de ${n0(prom.kcal)} kcal/día (${pct(pm.kcal)} de la meta): por debajo de lo previsto.`);
    else if (pm.kcal > 115) add("media", `Ingesta energética promedio de ${n0(prom.kcal)} kcal/día (${pct(pm.kcal)} de la meta): por encima de lo previsto.`);
    if (c.kcalBajo > 0 && pm.kcal >= 70) add("info", `${c.kcalBajo} de ${n} días con menos del 80 % de la meta calórica.`);
    if (pm.prot < 70) add("alta", `Proteína promedio de ${n1(prom.prot)} g/día (${pct(pm.prot)} de la meta de ${n0(R.prot)} g; ${n1(protKg)} g/kg).`);
    else if (pm.prot < 90) add("media", `Proteína promedio de ${n1(prom.prot)} g/día (${pct(pm.prot)} de la meta; ${n1(protKg)} g/kg).`);
    if (p.esMayor && protKg < 1.0) add("media", `Aporte proteico de ${n1(protKg)} g/kg/día: por debajo de 1.0-1.2 g/kg recomendado en adultos mayores (guías ESPEN).`);
    const limNa = p.cond.includes("hta") || p.cond.includes("erc");
    if (prom.sodio > R.sodio) add(limNa ? "alta" : "media", `Sodio promedio de ${n0(prom.sodio)} mg/día, sobre el límite de ${n0(R.sodio)} mg${limNa ? " (el paciente tiene restricción de sodio)" : ""}.`);
    else if (c.naExc >= Math.ceil(n * .3)) add("info", `Sodio por encima del límite en ${c.naExc} de ${n} días.`);
    if (pm.fibra < 70) add("info", `Fibra promedio de ${n1(prom.fibra)} g/día (${pct(pm.fibra)} de la meta de ${n0(R.fibra)} g).`);
    porMomento.forEach((m) => { if (m.pct < 60) add("info", `${m.label}: cubre en promedio solo el ${pct(m.pct)} de lo previsto (${n0(m.avg)} de ${n0(m.obj)} kcal); es una oportunidad para fortificar.`); });
    if (c.kcalOk >= Math.ceil(n * .7)) add("ok", `Buen cumplimiento calórico: ${c.kcalOk} de ${n} días dentro de ±10 % de la meta.`);
    if (c.protOk >= Math.ceil(n * .7)) add("ok", `Buen cumplimiento proteico: ${c.protOk} de ${n} días con al menos 90 % de la meta.`);
  }
  if (deltaPct !== null) {

    if (deltaPct <= -5) add("alta", `Pérdida de peso de ${n1(Math.abs(deltaPct))} % en el período (${n1(a)} kg a ${n1(b)} kg): clínicamente significativa.`);
    else if (deltaPct <= -2 && p.objetivo !== "bajar") add("media", `Pérdida de peso de ${n1(Math.abs(deltaPct))} % en el período (${n1(a)} kg a ${n1(b)} kg).`);
    else if (deltaPct >= 3 && p.objetivo === "bajar") add("info", `Aumento de peso de ${n1(deltaPct)} % en el período (${n1(a)} kg a ${n1(b)} kg).`);
  }
  if (p.esMayor && imc < 22) add("media", `Riesgo nutricional en adulto mayor (IMC ${n1(imc)}).`);
  const orden = { alta: 0, media: 1, info: 2, ok: 3 };

/* Entra quien tiene nutricionistas/{uid} (workflow de alta o invitación aceptada) o admins/{uid}
   (workflow de alta con rol admin). Una invitada con el correo verificado acepta su invitación aquí. */
async function perfilNutri(user) {
  const [n, a] = await Promise.all([dbFB.collection("nutricionistas").doc(user.uid).get(), dbFB.collection("admins").doc(user.uid).get()]);
  let nutri = n.exists ? n.data() : null;
  if (!nutri && user.email && user.emailVerified) nutri = await aceptarInvitacion(user);
  if (!nutri && !a.exists) return null;
  if (n.exists) dbFB.collection("nutricionistas").doc(user.uid).update({ ultimoIngreso: Date.now() }).catch(() => {});
  return { nombre: (nutri && nutri.nombre) || "Administrador", codigo: nutri && nutri.codigo, nutri: !!nutri, admin: a.exists };
}
async function aceptarInvitacion(user) {
  const correo = user.email.toLowerCase();
  let inv; try { inv = await dbFB.collection("invitaciones").doc(correo).get(); } catch { return null; }
  if (!inv.exists) return null;
  const { nombre, codigo } = inv.data(), datos = { nombre, codigo, correo, creadoEn: Date.now(), ultimoIngreso: Date.now() };
  const b = dbFB.batch();
  b.set(dbFB.collection("nutricionistas").doc(user.uid), datos);
  b.update(dbFB.collection("codigosNutri").doc(codigo), { uid: user.uid });
  b.delete(inv.ref);
  await b.commit();
  return datos;
}

  <section class="hero tilt" style="--i:0">

    <div class="hero-in"><div><div class="eyebrow">${cap(fechaLarga(HOY))}</div>
      <h2>${titulo.split(" ").map((w, i) => `<span class="wr" style="--w:${i};animation-delay:calc(200ms + ${i} * 55ms)">${w}</span>`).join(" ")}</h2>
      <p>Los datos llegan de lo que cada paciente anota en NutriApp. El estado de cada uno sale de sus últimos 14 días, con los mismos criterios del Resumen clínico de la app.</p></div>
      ${prox ? `<button class="next" data-open="${prox.p.idx}"><span class="live"><i></i>Próxima cita</span><span class="r1">${av(prox.p)}<span><b>${esc(prox.p.nombre)}</b><small>${prox.tipo} · ${prox.hora}</small></span></span><span class="cd" id="cd" data-min="${aMin(prox.hora)}">${aMin(prox.hora) > now ? "en " + durTxt(aMin(prox.hora) - now) : "pendiente"}</span></button>` : `<div class="next"><b>Sin citas pendientes hoy</b><small>Agenda una con “Nueva cita”.</small></div>`}
    </div>
  </section>
  <section class="tinted" style="--i:1" aria-label="Métricas del día">
    ${[["users","Pacientes activos",String(act.length),"",`${cuenta("meta")} en meta · ${cuenta("atencion")} en atención`,"var(--accent)","pacientes"],
       ["clip","Registraron ayer",String(regAyer),` / ${act.length}`,`${Math.round(regAyer / act.length * 100)} % anotó al menos una comida`,"var(--c-grasa)","reportes"],
       ["alert","Prioridad alta",String(nAlta()),"",`En ${cuenta("riesgo")} pacientes`,"var(--st-exceso)","alertas"],
       ["cal","Citas de hoy",String(hoyC.length),"",`${hoyC.filter((c) => c.hecha).length} atendidas · ${pend.length} pendientes`,"var(--c-fibra)","citas"]]

/* ============ Administración (solo la cuenta de administrador) ============
   Equipo: nutricionistas e invitaciones · Todos los pacientes: cambiar su nutricionista ·

const RUTA_ADMIN = ["admin", "Administración", "shield", "Equipo, pacientes y sistema"];
function activarAdmin(on) {

/* ============ Búsqueda (search-expand + placeholder-ghost) ============ */
const sx = $("#sx"), q = $("#q");
let ghostT, ghostI = 0, kSel = -1;

function cerrarBusqueda() { if (!sx.classList.contains("open")) return; sx.classList.remove("open"); q.value = ""; $("#sxRes").className = "sx-res"; clearInterval(ghostT); }
function ghostLoop() {
  const nombres = activos().map((p) => p.nombre.split(" ")[0]); const g = $("#ghost");
  const pon = () => { g.classList.add("gsw"); setTimeout(() => { g.textContent = `Busca a ${nombres[ghostI++ % nombres.length]}…`; g.classList.remove("gsw"); }, 260); };

function pintarRes() {

  if (!t) { res.className = "sx-res"; res.innerHTML = ""; return; }
  const m = PACIENTES.filter((p) => (p.nombre + " " + p.codigo).toLowerCase().includes(t)).slice(0, 6); kSel = m.length ? 0 : -1;
  res.className = "sx-res has";
  res.innerHTML = m.map((p, i) => `<button class="sx-r ${i === 0 ? "k" : ""}" style="--i:${i}" data-open="${p.idx}">${av(p)}<span style="min-width:0;flex:1"><b>${esc(p.nombre)}</b><span>${p.codigo} · ${p.estado.e === "activo" ? ESTADOS[p.r.estado][0] : EST_PAC[p.estado.e].n}</span></span>${ico("chevR", 15)}</button>`).join("")
