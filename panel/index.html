/* ============ Eventos globales ============ */
document.addEventListener("click", (e) => {
  if (!e.target.closest(".top-r") && npOpen) togglePanelNotif(false);
  if (!e.target.closest("#sx") && sx.classList.contains("open") && !q.value) cerrarBusqueda();
  if (pickerOpen && !e.target.closest(".estado-wrap")) cerrarPicker();
  const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); togglePanelNotif(false); ir(go.dataset.go); return; }
  const chk = e.target.closest("[data-hecha]"); if (chk) { e.stopPropagation(); marcarCita(chk); return; }
  if (e.target.closest("[data-verq]")) { busqueda = q.value.trim(); filtroEst = "activo"; cerrarBusqueda(); ir("pacientes"); render(false); return; }
  if (e.target.closest("[data-clearq]")) { busqueda = ""; render(false); return; }
  const op = e.target.closest("[data-open]"); if (op && !op.closest(".ficha")) { const nid = op.dataset.nid; if (nid) { leidas.add(nid); store.set("leidas", [...leidas]); pintarBell(); } $("#fan").classList.add("gone"); abrirFicha(+op.dataset.open, op); return; }
  const segB = e.target.closest(".seg button"); if (segB) {
    const seg = segB.closest(".seg"), k = seg.dataset.seg, v = segB.dataset.v;
    $$("button", seg).forEach((b) => b.setAttribute("aria-pressed", String(b === segB))); segPill(seg);
    setTimeout(() => {
      if (k === "vistaPac") { vistaPac = v; store.set("vistaPac", v); render(false); }
      else if (k === "filtroEst") { filtroEst = v; render(false); }
      else if (k === "tabAdm") { tabAdm = v; render(false); }
      else if (k === "sev") { filtroSev = v; render(false); }
      else if (k === "per") { perRep = +v; keepScroll = true; render(false); }
      else if (k === "tema") { OPT.tema = v; guardarOpt(); aplicarTema(); toast("Tema actualizado", { claro: "Claro", oscuro: "Oscuro", auto: "Automático" }[v]); }
      else if (k === "motion") { OPT.motion = v; guardarOpt(); aplicarTema(); }
      else if (k === "menu") { OPT.menu = v; guardarOpt(); if (v !== "auto") setCollapsed(v === "contraido", false); setTimeout(moverPill, 400); }
      else if (k === "nfrec") { OPT.notif.frec = v; guardarOpt(); keepScroll = true; render(false); }
      else if (k === "perFicha") { perFicha = +v; repintarPane(); }
      else if (k === "histVista") { histVista = v; histOff = 0; repintarPane(); }
    }, 160);
    return;
  }
  const sw = e.target.closest("[data-pal]"); if (sw) { OPT.paleta = sw.dataset.pal; guardarOpt(); aplicarTema(); keepScroll = true; render(false); toast("Color aplicado", PALD.p.find((x) => x.id === OPT.paleta).n); return; }
  const tn = e.target.closest("[data-tono]"); if (tn) { OPT.tono = tn.dataset.tono; guardarOpt(); aplicarTema(); $$("[data-tono]").forEach((b) => b.setAttribute("aria-pressed", String(b === tn))); return; }
  const cb = e.target.closest("[data-combo]"); if (cb) { OPT.combo = cb.dataset.combo; guardarOpt(); aplicarTema(); $$("[data-combo]").forEach((b) => { b.setAttribute("aria-pressed", String(b === cb)); b.classList.remove("morph"); }); void cb.offsetWidth; cb.classList.add("morph"); return; }
  const nh = e.target.closest("[data-nhora]"); if (nh) { OPT.notif.hora = nh.dataset.nhora; guardarOpt(); $$("[data-nhora]").forEach((b) => b.setAttribute("aria-pressed", String(b === nh))); return; }
  const na = e.target.closest("[data-nantes]"); if (na) { const h = +na.dataset.nantes, A = OPT.notif.antes; OPT.notif.antes = A.includes(h) ? (A.length > 1 ? A.filter((x) => x !== h) : A) : [...A, h].sort((a, b) => b - a); guardarOpt(); na.setAttribute("aria-pressed", String(OPT.notif.antes.includes(h))); return; }
  const ncn = e.target.closest("[data-ncanal]"); if (ncn) { const k = ncn.dataset.ncanal, C = OPT.notif.canal; OPT.notif.canal = C.includes(k) ? (C.length > 1 ? C.filter((x) => x !== k) : C) : [...C, k]; guardarOpt(); ncn.setAttribute("aria-pressed", String(OPT.notif.canal.includes(k))); return; }
  const nr = e.target.closest("[data-nres]"); if (nr) { OPT.notif.resumen = !OPT.notif.resumen; guardarOpt(); nr.setAttribute("aria-checked", String(OPT.notif.resumen)); return; }
  const dia = e.target.closest("[data-dia]"); if (dia) { diaCita = dia.dataset.dia; moverWeek(dia); setTimeout(() => { keepScroll = true; render(false); }, 260); return; }
  const sm = e.target.closest("[data-sem]"); if (sm) { semOff += +sm.dataset.sem; diaCita = ""; render(false); return; }
  if (e.target.closest("#copiarRep")) { copiar(`NutriApp · Pacientes (${perRep} días)\n` + activos().map((p) => { const r = resumen(p, perRep); return `${p.nombre}: ${r.pm ? `${pct(r.pm.kcal)} kcal, ${pct(r.pm.prot)} proteína` : "sin registros"} · ${ESTADOS[r.estado][0]}`; }).join("\n"), "Resumen copiado"); return; }
});
function moverWeek(btn) { const w = $("#week"), pl = $(".pill", w); if (!w || !pl) return; const b = btn || $(".day.on", w); if (!b) return; pl.style.width = b.offsetWidth + "px"; pl.style.transform = `translateX(${b.offsetLeft}px)`; $$(".day", w).forEach((d) => d.classList.toggle("on", d === b)); }
new MutationObserver(() => { if ($("#week")) moverWeek(); }).observe($("#view"), { childList: true });
function marcarCita(btn) {
  const c = CITAS.find((x) => x.id === btn.dataset.hecha); if (!c) return;
  c.hecha = !c.hecha; const hs = new Set(store.get("citasHechas", [])); c.hecha ? hs.add(c.id) : hs.delete(c.id); store.set("citasHechas", [...hs]);
  btn.classList.toggle("on", c.hecha); btn.setAttribute("aria-pressed", String(c.hecha));
  const card = btn.closest(".ecard"); card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse");
  pintarNav(); pintarBell();
  if (c.hecha) { toast("Cita atendida", `${c.p.nombre} · ${c.hora}`);
    const lista = card.closest(".ecards"), item = card.closest(".tl") || card;
    if (lista && OPT.motion !== "reducido" && item.animate) { const r0 = item.getBoundingClientRect(); setTimeout(() => { card.classList.add("done"); lista.appendChild(item); const r1 = item.getBoundingClientRect();
      item.animate([{ transform: `translateY(${r0.top - r1.top}px)`, zIndex: 0 }, { transform: "none" }], { duration: 1100, easing: "cubic-bezier(.4,0,.2,1)" }); }, 380); }
    else card.classList.add("done");
  } else card.classList.remove("done");
}
$("#bellBtn").addEventListener("click", (e) => { e.stopPropagation(); animIco($("#bellBtn svg.hi")); togglePanelNotif(); });
$("#topR").addEventListener("click", (e) => { if (e.target.closest("#npRead")) { notifs().forEach((n) => leidas.add(n.id)); store.set("leidas", [...leidas]); pintarBell(); togglePanelNotif(true); } });
$("#newCitaBtn").addEventListener("click", () => abrirNuevaCita());
scrim.addEventListener("click", () => { if (app.classList.contains("drawer")) abrirDrawer(false); cerrarFicha(); });
scrim2.addEventListener("click", () => { if (mm.classList.contains("on")) cerrarMM(); else cerrarEval(); });
ficha.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.classList.contains("close")) return cerrarFicha();
  if (t.id === "estBtn") { e.stopPropagation(); return abrirPicker(); }
  if (t.dataset.est) { e.stopPropagation(); return elegirEstado(t.dataset.est); }
  if (t.id === "pGo") { e.stopPropagation(); return aplicarEstado({ e: "pausado", motivo: $("#pMot").value, hasta: $("#pHasta").value || iso(addDays(HOY, 30)) }); }
  if (t.closest(".picker")) { e.stopPropagation(); return; }
  if (t.dataset.nav) { const d = +t.dataset.nav; fichaIdx = (fichaIdx + d + PACIENTES.length) % PACIENTES.length; pintarFicha(d); $(".f-scroll", ficha).scrollTop = 0; return; }
  if (t.dataset.tab) return cambiarTab(t.dataset.tab);
  if (t.dataset.print) return imprimir(t.dataset.print);
  if (t.id === "masMetricas") return abrirMM();
  if (t.id === "nuevaEval" || t.id === "nuevaEval2") return abrirEval();
  if (t.id === "copiarFicha") return copiar(textoResumen(PACIENTES[fichaIdx]), "Resumen copiado");
  if (t.dataset.hist) { histOff += +t.dataset.hist; repintarPane(); return; }
  const dr = t.closest(".dayrow"); if (dr && t === dr.firstElementChild) { const on = !dr.classList.contains("open"); dr.classList.toggle("open", on); t.setAttribute("aria-expanded", String(on)); return; }
  if (t.id === "guardarNota") {
    const ta = $("#notaTxt"), tx = ta.value.trim(); if (!tx) { ta.focus(); ta.animate?.([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-4px)" }, { transform: "translateX(0)" }], { duration: 300 }); return; }
    const p = PACIENTES[fichaIdx], notas = store.get("notas_" + p.codigo, []), nota = { f: new Date().toLocaleString("es-PE", { timeZone: "America/Lima", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }), t: tx };
    notas.unshift(nota); store.set("notas_" + p.codigo, notas); ta.value = "";
    $("#notasList").insertAdjacentHTML("afterbegin", `<div class="note new"><small>${esc(nota.f)}</small>${esc(nota.t)}</div>`); toast("Nota guardada", p.nombre);
  }
});
document.addEventListener("change", (e) => { if (e.target.id === "fObj") { filtroObj = e.target.value; render(false); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches?.(".ecard")) { e.target.click(); return; }
  if (e.key === "Escape") { if (reveal.classList.contains("on")) cerrarNC(); else if (mm.classList.contains("on")) cerrarMM(); else if (modal.classList.contains("on")) cerrarEval(); else if (pickerOpen) cerrarPicker(); else if (ficha.classList.contains("on")) cerrarFicha(); else if (npOpen) togglePanelNotif(false); else if (app.classList.contains("drawer")) abrirDrawer(false); }
  if (ficha.classList.contains("on") && !modal.classList.contains("on") && !mm.classList.contains("on") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const d = e.key === "ArrowRight" ? 1 : -1; fichaIdx = (fichaIdx + d + PACIENTES.length) % PACIENTES.length; pintarFicha(d);
  }
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { moverPill(); $$(".seg").forEach(segPill); moverInd(); moverWeek(); if (!esMovil()) abrirDrawer(false); }, 120); });
$("#side").addEventListener("transitionend", (e) => { if (e.target.id === "side") moverPill(); });
setInterval(() => { const cd = $("#cd"); if (cd) { const m = +cd.dataset.min - minLima(); cd.textContent = m > 0 ? "en " + durTxt(m) : "pendiente"; } }, 30000);

/* ============ Arranque ============ */
pintarNav(); pintarBell();
$("#view").innerHTML = `<div class="sk" style="height:170px"></div><div class="sk" style="height:120px;margin-top:14px"></div><div class="home" style="margin-top:14px"><div class="sk" style="height:320px"></div><div class="sk" style="height:320px"></div></div>`;
if (authFB) {
  // Con sesión abierta y perfil de nutricionista entra directo; si no, muestra el ingreso.
  const off = authFB.onAuthStateChanged(async (user) => {
    off();
    let perfil = null;
    if (user) { try { perfil = await perfilNutri(user); } catch {} }
    if (perfil) { ponerPerfil(perfil); setTimeout(entrarApp, 250); }
    else { if (user) { try { await authFB.signOut(); } catch {} } mostrarLogin(); }
  });
} else {
  let dentro = false; try { dentro = sessionStorage.getItem("nutripanel_in") === "1"; } catch {}
  if (dentro) setTimeout(entrarApp, 250); else mostrarLogin();
}
</script>
