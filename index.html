/* Perú usa siempre UTC-5 (no tiene horario de verano), pero el navegador puede estar en
   cualquier zona horaria. Para que "hoy" y las fechas de los registros siempre correspondan
   al día calendario en Perú (y no se adelanten con el corte UTC a las 19:00 hora local),
   toda fecha se deriva explícitamente con timeZone: "America/Lima". */
function fechaLimaISO(fechaOInstante = new Date()) {
  const instante = fechaOInstante instanceof Date ? fechaOInstante : new Date(fechaOInstante);
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Lima", year: "numeric", month: "2-digit", day: "2-digit" }).format(instante);
}
const hoyISO = () => fechaLimaISO();

/* ---------- Lógica de cálculo clínico ---------- */
function mergeRestricciones(fuentes) {
  const r = {};
  RESTRICCIONES_DISPONIBLES.forEach(({ key }) => { r[key] = false; });
  fuentes.forEach((c) => {
    Object.entries(c.restricciones || {}).forEach(([k, v]) => { if (v) r[k] = true; });
  });
  return r;
}

function detectarInteracciones(medicamentos) {
  const lista = [];
  (medicamentos || []).forEach((m) => {
    const nombreLower = (m.nombre || "").toLowerCase();
    const match = MEDICAMENTOS_DB.find((db) => db.alias.some((a) => nombreLower.includes(a)));
    if (match) lista.push({ medicamentoUsuario: m.nombre, ...match });
  });
  return lista;
}

function calcularGEB(perfil) {
  const { edad, sexo, pesoKg, tallaCm, formulaGEB } = perfil;
  if (formulaGEB === "harris_benedict") {
    return sexo === "masculino"
      ? 88.362 + 13.397 * pesoKg + 4.799 * tallaCm - 5.677 * edad
      : 447.593 + 9.247 * pesoKg + 3.098 * tallaCm - 4.33 * edad;
  }
  const base = 10 * pesoKg + 6.25 * tallaCm - 5 * edad;
  return sexo === "masculino" ? base + 5 : base - 161;
}

function calcularGET(geb, perfil, restricciones) {
  let get = geb * FACTOR_ACTIVIDAD[perfil.actividad];
  if (perfil.objetivo === "perdida") get *= 0.8;
  if (perfil.objetivo === "ganancia_muscular") get *= 1.12;
  if (restricciones.aumentarCalorico) get += 300;
  return Math.round(get);
}

function calcularRequerimiento(perfil, catalogo, medicamentos, prescripcion, suplementos) {
  const condicionesActivas = perfil.condiciones.map((id) => catalogo.find((c) => c.id === id)).filter(Boolean);
  const interacciones = detectarInteracciones(medicamentos);
  const restricciones = mergeRestricciones([...condicionesActivas, ...interacciones]);
  const rx = prescripcion && prescripcion.activa ? prescripcion : null;

  const geb = calcularGEB(perfil);
  let get = calcularGET(geb, perfil, restricciones);
  if (rx && rx.kcalManual) get = Math.round(rx.kcalManual);
  const { objetivo, pesoKg } = perfil;

  let proteinaGkg = 1.0;
  if (objetivo === "ganancia_muscular") proteinaGkg = 1.8;
  if (objetivo === "perdida") proteinaGkg = 1.6;
  if (restricciones.aumentarProteina) proteinaGkg = Math.max(proteinaGkg, 1.3);
  if (restricciones.limitarProteina) proteinaGkg = 0.7;

  let proteinasG = Math.round(proteinaGkg * pesoKg);
  if (rx && rx.proteinaManualG) proteinasG = Math.round(rx.proteinaManualG);
  const proteinasKcal = proteinasG * 4;
  const proteinasPct = get > 0 ? Math.round((proteinasKcal / get) * 100) : 0;

  let grasasPct = restricciones.limitarGrasasSaturadas ? 25 : 30;
  if (rx && rx.grasasPctManual) grasasPct = rx.grasasPctManual;
  const grasasKcal = get * (grasasPct / 100);
  const grasasG = Math.round(grasasKcal / 9);
  const grasasSaturadasG = Math.round((grasasKcal * 0.07) / 9);
  const grasasPoliinsaturadasG = Math.round((grasasKcal * 0.1) / 9);
  const grasasMonoinsaturadasG = Math.max(grasasG - grasasSaturadasG - grasasPoliinsaturadasG, 0);

  const carbohidratosKcal = rx && rx.carbohidratosPctManual ? get * (rx.carbohidratosPctManual / 100) : Math.max(get - proteinasKcal - grasasKcal, 0);
  const carbohidratosG = Math.round(carbohidratosKcal / 4);
  const carbohidratosPct = get > 0 ? Math.round((carbohidratosKcal / get) * 100) : 0;

  const sodioMg = restricciones.limitarSodio ? 1500 : 2300;
  const potasioMg = restricciones.limitarPotasio ? 2000 : 3500;
  const fibraG = restricciones.aumentarFibra ? 35 : 28;
  const azucaresAnadidosG = restricciones.limitarAzucar ? Math.round((get * 0.05) / 4) : Math.round((get * 0.1) / 4);

  const suplementosTotales = (suplementos || []).reduce((acc, s) => {
    const veces = s.vecesDia || 1;
    return { kcal: acc.kcal + (s.kcal || 0) * veces, proteinaG: acc.proteinaG + (s.proteinaG || 0) * veces };
  }, { kcal: 0, proteinaG: 0 });

  return { geb: Math.round(geb), get, proteinasG, proteinasPct, carbohidratosG, carbohidratosPct, grasasG, grasasPct, grasasSaturadasG, grasasMonoinsaturadasG, grasasPoliinsaturadasG, sodioMg, potasioMg, fibraG, azucaresAnadidosG, restricciones, condicionesActivas, interacciones, prescripcionActiva: !!rx, suplementos: suplementos || [], suplementosTotales };
}

function aptoParaRestricciones(alimento, restricciones) {
  if (restricciones.limitarSodio && alimento.sodioMg > 140) return false;
  if (restricciones.limitarPotasio && alimento.potasioMg > 300) return false;
  if (restricciones.limitarAzucar && alimento.azucaresG > 5) return false;
  if (restricciones.limitarGrasasSaturadas && alimento.grasasSaturadasG > 5) return false;
  return true;
}

function seleccionarAlimento(pool, poolCompleto, role, seed) {
  let candidatos = pool.filter((f) => f.categoria === role);
  if (candidatos.length === 0) candidatos = poolCompleto.filter((f) => f.categoria === role);
  if (candidatos.length === 0) return null;
  return candidatos[seed % candidatos.length];
}

function generarComida(roles, objetivo, poolAptos, seedBase) {
  const seleccion = roles.map((role, i) => ({ role, alimento: seleccionarAlimento(poolAptos, FOOD_DB, role, seedBase + i * 7) })).filter((s) => s.alimento);
  let items = seleccion.map(({ role, alimento }) => {
    const proteinPerG = alimento.proteinasG / alimento.porcionBaseG;
    const carbPerG = alimento.carbohidratosG / alimento.porcionBaseG;
    let gramos = 100;
    if (role === "proteina" || role === "lacteo") gramos = proteinPerG > 0 ? (objetivo.proteinasG * 0.8) / proteinPerG : 100;
    else if (role === "carbohidrato") gramos = carbPerG > 0 ? (objetivo.carbohidratosG * 0.75) / carbPerG : 100;
    else if (role === "fruta") gramos = carbPerG > 0 ? (objetivo.carbohidratosG * 0.25) / carbPerG : 100;
    else if (role === "vegetal") gramos = 100;
    else if (role === "menestra") gramos = 80;
    else if (role === "quinua") gramos = 60;
    else if (role === "grasa") gramos = 15;
    return { alimento, gramos: Math.max(gramos, 10) };
  });
  const grasaItem = items.find((it) => it.alimento.categoria === "grasa");
  if (grasaItem) {
    const otros = items.filter((it) => it !== grasaItem);
    const fatSoFar = otros.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.grasasG, 0);
    const fatPerG = grasaItem.alimento.grasasG / grasaItem.alimento.porcionBaseG;
    const fatNeeded = Math.max(objetivo.grasasG - fatSoFar, 5);
    grasaItem.gramos = fatPerG > 0 ? fatNeeded / fatPerG : 10;
  }
  const kcalActual = items.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.kcal, 0);
  const factor = kcalActual > 0 ? objetivo.kcal / kcalActual : 1;
  items = items.map((it) => ({ ...it, gramos: Math.max(10, Math.round((it.gramos * factor) / 5) * 5) }));
  return items;
}

function elegirProteinaAlmuerzo(seed) {
  const idx = ((seed % 3) + 3) % 3;
  if (idx === 0) return FOOD_DB.find((f) => f.id === "f01"); // pollo
  if (idx === 1) return FOOD_DB.find((f) => f.id === "f31"); // pavita
  const pescados = FOOD_DB.filter((f) => f.avePescado && f.id !== "f01" && f.id !== "f31");
  return pescados[Math.abs(seed) % pescados.length];
}

function generarMenu(requerimiento, seed) {
  const poolAptos = FOOD_DB.filter((f) => aptoParaRestricciones(f, requerimiento.restricciones));
  return MEAL_DEFS.map((m) => {
    let poolComida = poolAptos;
    if (m.key === "almuerzo") {
      const proteinaFija = elegirProteinaAlmuerzo(seed);
      poolComida = poolAptos.filter((f) => f.categoria !== "proteina" || (proteinaFija && f.id === proteinaFija.id));
    }
    const objetivo = { kcal: requerimiento.get * m.pct, proteinasG: requerimiento.proteinasG * m.pct, carbohidratosG: requerimiento.carbohidratosG * m.pct, grasasG: requerimiento.grasasG * m.pct };
    let items = generarComida(m.roles, objetivo, poolComida, seed + m.key.length);
    if (m.key === "almuerzo" && Math.abs(seed) % 4 === 0) {
      const idxMenestra = items.findIndex((it) => it.alimento.categoria === "menestra");
      if (idxMenestra !== -1) {
        const arracacha = FOOD_DB.find((f) => f.id === "f36");
        const tarwi = FOOD_DB.find((f) => f.id === "f35");
        if (arracacha && tarwi) items.splice(idxMenestra, 1, { alimento: arracacha, gramos: 100 }, { alimento: tarwi, gramos: 80 });
      }
    }
    let notaExtra = "";
    if (m.key === "almuerzo") {
      const proteinaLograda = items.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.proteinasG, 0);
      if (proteinaLograda < objetivo.proteinasG * 0.85) {
        notaExtra = `Esta combinación aporta ~${Math.round(proteinaLograda)} g de proteína; para llegar a tu meta de almuerzo (~${Math.round(objetivo.proteinasG)} g) agrega también arroz o papa/arracacha, y si necesitas más proteína, una porción extra de tu carne del día o un huevo.`;
      }
    }
    return { ...m, items, notaExtra };
  });
}

function calcularTotalesItem(alimento, gramos) {
  const f = gramos / alimento.porcionBaseG;
  return { kcal: alimento.kcal * f, proteinasG: alimento.proteinasG * f, carbohidratosG: alimento.carbohidratosG * f, fibraG: alimento.fibraG * f, grasasG: alimento.grasasG * f, sodioMg: alimento.sodioMg * f };
}

function obtenerLogFecha(pacienteId, fecha) {
  if (pacienteId) {
    return dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(fecha).collection("items").orderBy("agregadoEn").get()
      .then((snap) => snap.docs.map((doc) => ({ uid: doc.id, ...doc.data() })))
      .catch(() => []);
  }
  try { const s = localStorage.getItem("nutriapp_log_" + fecha); return Promise.resolve(s ? JSON.parse(s) : []); } catch { return Promise.resolve([]); }
}

function fechaISOOffset(diasAtras) {
  return fechaLimaISO(Date.now() - diasAtras * 86400000);
}

function resumenCumplimiento(dias, requerimiento) {
  let diasConDatos = 0, diasCumpleKcal = 0, diasCumpleProteina = 0, sumaKcal = 0, sumaProteina = 0;
  for (let i = 0; i < dias; i++) {
    let log = [];
    try { const s = localStorage.getItem("nutriapp_log_" + fechaISOOffset(i)); log = s ? JSON.parse(s) : []; } catch {}
    if (log.length === 0) continue;
    diasConDatos++;
    const t = calcularTotalesLog(log);
    sumaKcal += t.kcal; sumaProteina += t.proteinasG;
    if (requerimiento.get > 0 && Math.abs(t.kcal - requerimiento.get) / requerimiento.get <= 0.1) diasCumpleKcal++;
    if (requerimiento.proteinasG > 0 && t.proteinasG >= requerimiento.proteinasG * 0.9) diasCumpleProteina++;
  }
  return { diasTotales: dias, diasConDatos, diasCumpleKcal, diasCumpleProteina, promedioKcal: diasConDatos ? sumaKcal / diasConDatos : 0, promedioProteina: diasConDatos ? sumaProteina / diasConDatos : 0 };
}

function calcularTotalesLog(log) {
  return log.reduce((acc, item) => {
    const t = calcularTotalesItem(item.alimento, item.gramos);
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, fibraG: acc.fibraG + t.fibraG, grasasG: acc.grasasG + t.grasasG, sodioMg: acc.sodioMg + t.sodioMg };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, fibraG: 0, grasasG: 0, sodioMg: 0 });
}

/* Elige hasta n alimentos de la base (de categorías distintas cuando es posible, y aptos
   para las restricciones del paciente) y calcula cuántos gramos de cada uno cubrirían el
   déficit del nutriente indicado. */
function sugerirAlimentos(nutrienteKey, cantidadFaltante, restricciones, n = 4) {
  if (!(cantidadFaltante > 0)) return [];
  const candidatos = FOOD_DB
    .filter((f) => f[nutrienteKey] > 0 && aptoParaRestricciones(f, restricciones || {}))
    .sort((a, b) => b[nutrienteKey] - a[nutrienteKey]);
  const elegidos = [];
  const categoriasUsadas = new Set();
  for (const f of candidatos) {
    if (categoriasUsadas.has(f.categoria)) continue;
    categoriasUsadas.add(f.categoria);
    elegidos.push(f);
    if (elegidos.length >= n) break;
  }
  if (elegidos.length < n) {
    for (const f of candidatos) {
      if (elegidos.some((e) => e.id === f.id)) continue;
      elegidos.push(f);
      if (elegidos.length >= n) break;
    }
  }
  return elegidos.map((f) => ({ nombre: f.nombre, gramos: Math.max(Math.round((cantidadFaltante / f[nutrienteKey]) * 100), 5) }));
}

function generarSugerencias(requerimiento, totales, perfil) {
  if (totales.kcal === 0) return [{ mensaje: "Aún no registras alimentos hoy. Comienza a registrar para recibir sugerencias personalizadas.", opciones: [] }];
  const restricciones = requerimiento.restricciones || {};
  const sugerencias = [];

  const kcalFaltante = requerimiento.get - totales.kcal;
  if (perfil.objetivo !== "perdida" && kcalFaltante > requerimiento.get * 0.1) {
    sugerencias.push({
      mensaje: `Te faltan ${Math.round(kcalFaltante)} kcal para tu meta de ${perfil.objetivo === "ganancia_muscular" ? "ganancia muscular" : "mantenimiento"}. Puedes completarlas con cualquiera de estas opciones:`,
      opciones: sugerirAlimentos("kcal", kcalFaltante, restricciones),
    });
  }
  if (perfil.objetivo === "perdida" && totales.kcal > requerimiento.get) {
    sugerencias.push({ mensaje: `Superaste tu objetivo calórico de hoy por ${Math.round(totales.kcal - requerimiento.get)} kcal.`, opciones: [] });
  }

  const proteinaFaltante = requerimiento.proteinasG - totales.proteinasG;
  if (proteinaFaltante > requerimiento.proteinasG * 0.15) {
    sugerencias.push({
      mensaje: `Te faltan ${Math.round(proteinaFaltante)} g de proteína. Algunas opciones para cubrirlos:`,
      opciones: sugerirAlimentos("proteinasG", proteinaFaltante, restricciones),
    });
  }

  const carbFaltante = requerimiento.carbohidratosG - totales.carbohidratosG;
  if (carbFaltante > requerimiento.carbohidratosG * 0.15) {
    sugerencias.push({
      mensaje: `Te faltan ${Math.round(carbFaltante)} g de carbohidratos. Algunas opciones:`,
      opciones: sugerirAlimentos("carbohidratosG", carbFaltante, restricciones),
    });
  }

  const grasaFaltante = requerimiento.grasasG - totales.grasasG;
  if (grasaFaltante > requerimiento.grasasG * 0.15) {
    sugerencias.push({
      mensaje: `Te faltan ${Math.round(grasaFaltante)} g de grasas. Algunas opciones:`,
      opciones: sugerirAlimentos("grasasG", grasaFaltante, restricciones),
    });
  }

  if (totales.sodioMg > requerimiento.sodioMg) {
    sugerencias.push({ mensaje: `Superaste tu límite de sodio (${Math.round(totales.sodioMg)} / ${requerimiento.sodioMg} mg). Modera procesados o enlatados en tu próxima comida.`, opciones: [] });
  }

  if (totales.fibraG < requerimiento.fibraG * 0.6) {
    const fibraFaltante = requerimiento.fibraG - totales.fibraG;
    sugerencias.push({
      mensaje: `Tu fibra está baja (${Math.round(totales.fibraG)} / ${requerimiento.fibraG} g). Algunas opciones:`,
      opciones: sugerirAlimentos("fibraG", fibraFaltante, restricciones),
    });
  }

  if (sugerencias.length === 0) sugerencias.push({ mensaje: "Vas muy bien encaminado respecto a tu meta de hoy.", opciones: [] });
  return sugerencias;
}

/* Llama a la API de Anthropic (sin necesidad de gestionar una API key) enviando
   la foto de la receta y pidiendo solo los nombres de medicamentos en JSON. */
async function extraerMedicamentosDeFoto(base64Data, mediaType) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: "Esta imagen es una receta médica o el envase de un medicamento. Devuelve SOLO un array JSON con los nombres (genéricos si es posible) de los medicamentos que identifiques con claridad, sin texto adicional ni backticks. Ejemplo: [\"Losartán\", \"Metformina\"]. Si no logras identificar ninguno con certeza, devuelve []." },
        ],
      }],
    }),
  });
  const data = await response.json();
  const texto = (data.content || []).map((b) => b.text || "").join("");
  const limpio = texto.replace(/```json|```/g, "").trim();
  try { const arr = JSON.parse(limpio); return Array.isArray(arr) ? arr : []; } catch { return []; }
}

function buscarSugerenciasPeru(inputCrudo) {
  const norm = normalizarTexto(inputCrudo);
  const claves = Object.keys(INGREDIENTES_PERU_DB);
  let clave = claves.find((k) => normalizarTexto(k) === norm);
  if (!clave) clave = claves.find((k) => norm.includes(normalizarTexto(k)) || normalizarTexto(k).includes(norm));
  const nombreLimpio = inputCrudo.trim();
  if (clave) return { encontrado: true, platos: [...INGREDIENTES_PERU_DB[clave], generarToqueSabor(clave)] };
  return { encontrado: false, platos: [...GENERICO_PERU(nombreLimpio), generarToqueSabor(nombreLimpio)] };
}

function Bar({ value, max, colorClass }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;

  return (
    <div className="h-2 w-full rounded-full nutri-track overflow-hidden">
      <div className={`h-full rounded-full ${over ? "" : colorClass}`} style={{ width: `${pct}%`, background: over ? "#B23B3B" : undefined }} />
    </div>
  );
}

/* Un solo tipo de gráfico (gauge radial con inclinación 3D y sombra) reutilizado en Panel,
   Historial y el objetivo calórico — así todo el cumplimiento se lee con el mismo lenguaje visual. */
function GaugeRadial({ label, valor, meta, unidad, color, tamano = "md", modo = "porcentaje", animarDelay = 0 }) {
  const size = tamano === "lg" ? 190 : tamano === "md" ? 128 : 92;
  const grosor = tamano === "lg" ? 16 : tamano === "md" ? 11 : 8;
  const centro = size / 2;
  const r = centro - grosor / 2 - 2;
  const c = 2 * Math.PI * r;
  const [montado, setMontado] = useState(false);
  useEffect(() => {
    setMontado(false);
    const t = setTimeout(() => setMontado(true), 60 + animarDelay);
    return () => clearTimeout(t);
  }, [valor, meta, animarDelay]);
  const pctReal = meta > 0 ? valor / meta : 0;
  const pct = montado ? Math.min(pctReal, 1) : 0;
  const pctMostrado = meta > 0 ? Math.round(pctReal * 100) : 0;
  const idGrad = `grad-${label.replace(/\s+/g, "")}-${tamano}`;
  return (
    <div className="anillos-3d relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="anillos-3d-svg" style={{ filter: `drop-shadow(0 ${tamano === "lg" ? 12 : 7}px ${tamano === "lg" ? 18 : 11}px rgba(20,67,60,0.22))` }}>
        <defs>
          <linearGradient id={idGrad} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={color} stopOpacity="0.7" />
            <stop offset="100%" stopColor={color} stopOpacity="1" />
          </linearGradient>
        </defs>
        <circle cx={centro} cy={centro} r={r} fill="none" stroke="var(--track)" strokeWidth={grosor} />
        <circle
          cx={centro} cy={centro} r={r} fill="none"
          stroke={`url(#${idGrad})`}
          strokeWidth={grosor}
          strokeDasharray={c}
          strokeDashoffset={c - pct * c}
          strokeLinecap="round"
          transform={`rotate(-90 ${centro} ${centro})`}
          style={{ transition: `stroke-dashoffset 1s cubic-bezier(.22,1,.36,1) ${animarDelay}ms` }}
        />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2">
        {modo === "numero" ? (
          <>
            <span className={tamano === "lg" ? "nutri-serif text-3xl nutri-ink" : "nutri-serif text-base nutri-ink"}>{Math.round(valor)}</span>
            <span className="text-[10px] nutri-muted text-center leading-tight">de {Math.round(meta)} {unidad}</span>
          </>
        ) : (
          <>
            <span className={tamano === "lg" ? "nutri-serif text-3xl nutri-ink" : tamano === "md" ? "nutri-serif text-lg nutri-ink" : "text-sm font-medium nutri-ink"}>{pctMostrado}%</span>
            {tamano === "lg" && <span className="text-[11px] nutri-muted text-center leading-tight">{pctMostrado >= 100 ? "¡meta cumplida!" : "de tu meta"}</span>}
          </>
        )}
      </div>
    </div>
  );
}

/* Vista de cumplimiento: por defecto una cuadrícula de gauges independientes, uno por
   nutriente (sin superponerse, para que no se lean como "anillos dentro de anillos"); al
   tocar un nutriente, el resto desaparece y se aísla su gauge en grande con el detalle exacto. */
function PanelMetas({ totales, requerimiento, tamanoGrid = "md" }) {
  const metricas = [
    { key: "kcal", label: "Calorías", valor: totales.kcal, meta: requerimiento.get, unidad: "kcal", color: "var(--accent-energy)" },
    { key: "proteinasG", label: "Proteína", valor: totales.proteinasG, meta: requerimiento.proteinasG, unidad: "g", color: "var(--accent-protein)" },
    { key: "carbohidratosG", label: "Carbohidratos", valor: totales.carbohidratosG, meta: requerimiento.carbohidratosG, unidad: "g", color: "var(--accent-carb)" },
    { key: "grasasG", label: "Grasas", valor: totales.grasasG, meta: requerimiento.grasasG, unidad: "g", color: "var(--accent-fat)" },
  ];
  const [seleccionado, setSeleccionado] = useState(null);

  if (seleccionado !== null) {
    const m = metricas[seleccionado];
    const pct = m.meta > 0 ? Math.round((m.valor / m.meta) * 100) : 0;
    return (
      <div key="detalle" className="nutri-fade-in flex flex-col items-center py-2">
        <GaugeRadial label={m.label} valor={m.valor} meta={m.meta} unidad={m.unidad} color={m.color} tamano="lg" modo="porcentaje" />
        <span className="text-sm font-medium nutri-ink mt-3">{m.label}</span>
        <span className="text-xs nutri-muted">{Math.round(m.valor)} / {Math.round(m.meta)} {m.unidad} · {pct}%{pct >= 100 ? " ✓" : ""}</span>
        <button onClick={() => setSeleccionado(null)} className="text-xs nutri-brand-text mt-4 underline">‹ Ver todas las metas</button>
      </div>
    );
  }

  return (
    <div key="lista" className="nutri-fade-in">
      <div className="grid grid-cols-2 gap-x-2 gap-y-4 justify-items-center py-2">
        {metricas.map((m, i) => {
          const pct = m.meta > 0 ? Math.round((m.valor / m.meta) * 100) : 0;
          return (
            <button key={m.key} onClick={() => setSeleccionado(i)} className="flex flex-col items-center">
              <GaugeRadial label={m.label} valor={m.valor} meta={m.meta} unidad={m.unidad} color={m.color} tamano={tamanoGrid} modo="porcentaje" animarDelay={i * 100} />
              <span className="text-xs nutri-muted mt-1.5">{m.label} · {pct}%{pct >= 100 ? " ✓" : ""}</span>
            </button>
          );
        })}
      </div>
      <p className="text-[11px] nutri-muted text-center mt-1">Toca un nutriente para ver su detalle.</p>
    </div>
  );
}

function PantallaRegistro({ log, addItem, removeItem, updateItem, recipientes, pacienteId, fechaInicial, onFechaInicialConsumida }) {
  const [busqueda, setBusqueda] = useState("");
  const [seleccionado, setSeleccionado] = useState(null);
  const [recipienteId, setRecipienteId] = useState("ninguno");
  const [pesoBruto, setPesoBruto] = useState(100);
  const [momento, setMomento] = useState("desayuno");
  const [restarCarneId, setRestarCarneId] = useState("ninguna");
  const [editandoId, setEditandoId] = useState(null);
  const [edicion, setEdicion] = useState(null);
  const [fechaSeleccionada, setFechaSeleccionada] = useState(hoyISO());
  const [logOtraFecha, setLogOtraFecha] = useState([]);
  const [filtroMomento, setFiltroMomento] = useState("todos");
  const [semanaOffset, setSemanaOffset] = useState(0);

  const hoy = hoyISO();
  const diasSemana = useMemo(() => { const l = getLunes(new Date()); l.setDate(l.getDate() + semanaOffset * 7); return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setDate(d.getDate() + i); return d; }); }, [semanaOffset]);

  // Si venimos de "Historial" con una fecha concreta para editar, saltamos a la semana de esa fecha.
  useEffect(() => {
    if (!fechaInicial) return;
    const lunesActual = getLunes(new Date());
    const lunesDestino = getLunes(new Date(fechaInicial + "T00:00:00"));
    const offset = Math.round((lunesDestino - lunesActual) / (7 * DIAS_EN_MS));
    setSemanaOffset(offset);
    setFechaSeleccionada(fechaInicial);
    setSeleccionado(null);
    if (onFechaInicialConsumida) onFechaInicialConsumida();
  }, [fechaInicial]);

  useEffect(() => {
    if (fechaSeleccionada === hoy) return;
    let activo = true;
    obtenerLogFecha(pacienteId, fechaSeleccionada).then((items) => { if (activo) setLogOtraFecha(items); });
    return () => { activo = false; };
  }, [fechaSeleccionada, pacienteId]);

  const logActivo = fechaSeleccionada === hoy ? log : logOtraFecha;
  const logFiltrado = filtroMomento === "todos" ? logActivo : logActivo.filter((it) => it.momento === filtroMomento);

  const resultados = useMemo(() => {
    if (!busqueda.trim()) return [];
    const q = normalizarTexto(busqueda);
    return FOOD_DB.filter((f) => normalizarTexto(f.nombre).includes(q)).slice(0, 6);
  }, [busqueda]);

  const recipiente = recipientes.find((r) => r.id === recipienteId);
  const tara = recipiente ? Number(recipiente.taraG) || 0 : 0;
  const carnesAlmuerzo = logActivo.filter((it) => it.momento === "almuerzo" && it.alimento.categoria === "proteina");
  const carneRestada = restarCarneId !== "ninguna" ? logActivo.find((it) => it.uid === restarCarneId) : null;
  const pesoCarneRestada = carneRestada ? carneRestada.gramos : 0;
  const pesoNeto = Math.max(Math.round(pesoBruto - tara - pesoCarneRestada), 0);
  const mostrarRestarCarne = momento === "almuerzo" && seleccionado && seleccionado.categoria !== "proteina" && carnesAlmuerzo.length > 0;

  const totalesActivo = calcularTotalesLog(logActivo);

  const iniciarEdicion = (item) => {
    setEditandoId(item.uid);
    setEdicion({ recipienteId: item.tara && item.tara.recipiente ? (recipientes.find((r) => r.nombre === item.tara.recipiente) || {}).id || "ninguno" : "ninguno", pesoBruto: item.tara ? item.tara.pesoBruto : item.gramos, momento: item.momento, restarCarneId: "ninguna" });
  };
  const guardarEdicion = (item) => {
    const rec = recipientes.find((r) => r.id === edicion.recipienteId);
    const t = rec ? Number(rec.taraG) || 0 : 0;
    const carneRest = edicion.restarCarneId !== "ninguna" ? logActivo.find((it) => it.uid === edicion.restarCarneId) : null;
    const nuevoNeto = Math.max(Math.round(edicion.pesoBruto - t - (carneRest ? carneRest.gramos : 0)), 0);
    const nuevaTara = (rec || carneRest) ? { recipiente: rec ? rec.nombre : null, pesoBruto: edicion.pesoBruto, tara: t, carneNombre: carneRest ? carneRest.alimento.nombre : null, carneGramos: carneRest ? carneRest.gramos : null } : null;
    updateItem(item.uid, { gramos: nuevoNeto, momento: edicion.momento, tara: nuevaTara }, fechaSeleccionada);
    if (fechaSeleccionada !== hoy) setLogOtraFecha((prev) => prev.map((it) => (it.uid === item.uid ? { ...it, gramos: nuevoNeto, momento: edicion.momento, tara: nuevaTara } : it)));
    setEditandoId(null); setEdicion(null);
  };
  const eliminarDeLista = (itemId) => {
    removeItem(itemId, fechaSeleccionada);
    if (fechaSeleccionada !== hoy) setLogOtraFecha((prev) => prev.filter((it) => it.uid !== itemId));
  };

  const MOMENTOS = [{ key: "todos", label: "Todos" }, { key: "desayuno", label: "Desayuno" }, { key: "almuerzo", label: "Almuerzo" }, { key: "cena", label: "Cena" }, { key: "colacion", label: "Colación" }];

  return (
    <div className="px-5 pt-6 pb-24">
      <h1 className="nutri-serif text-2xl nutri-ink mb-1">Registro de alimentos</h1>
      <p className="text-sm nutri-muted mb-3">Busca un alimento, indica el recipiente (si pesaste con él) y verás el cálculo al instante.</p>

      <div className="flex items-center justify-between mb-2">
        <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text">‹ Semana anterior</button>
        <span className="text-xs nutri-muted">{RANGO_SEMANA(diasSemana[0], diasSemana[6])}</span>
        <button onClick={() => setSemanaOffset((s) => Math.min(s + 1, 0))} disabled={semanaOffset === 0} className="text-xs nutri-brand-text disabled:opacity-30">Semana siguiente ›</button>
      </div>
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2" style={{ scrollbarWidth: "none" }}>
        {diasSemana.map((d, i) => {
          const iso = fechaLimaISO(d);
          const futuro = iso > hoy;
          return (
            <button key={i} disabled={futuro} onClick={() => { setFechaSeleccionada(iso); setSeleccionado(null); }} className={`shrink-0 rounded-lg px-2.5 py-1.5 text-center nutri-chip ${iso === fechaSeleccionada ? "nutri-chip-active" : "bg-white nutri-ink"} ${futuro ? "opacity-30" : ""}`}>
              <div className="text-[10px] uppercase">{NOMBRE_DIA_CORTO(d)}</div>
              <div className="text-xs font-medium">{d.getDate()}</div>
            </button>
          );
        })}
      </div>
      {semanaOffset !== 0 && <button onClick={() => { setSemanaOffset(0); setFechaSeleccionada(hoy); setSeleccionado(null); }} className="text-xs nutri-brand-text mb-2 underline">Volver a esta semana</button>}
      {fechaSeleccionada !== hoy && <p className="text-xs nutri-brand-text mb-3">Editando el registro del {fechaSeleccionada}. Los cambios de esa fecha se guardan igual que los de hoy.</p>}

      <div className="relative mb-3">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 nutri-muted"><IconSearch size={16} /></span>
        <input className="w-full rounded-lg nutri-chip pl-9 pr-3 py-2.5 text-sm bg-white nutri-ink focus:outline-none" placeholder="Buscar alimento (ej. pollo, avena, palta...)" value={busqueda} onChange={(e) => { setBusqueda(e.target.value); setSeleccionado(null); }} />
      </div>
      {resultados.length > 0 && !seleccionado && (
        <div className="nutri-panel rounded-xl mb-3 overflow-hidden">
          {resultados.map((f) => (
            <button key={f.id} onClick={() => setSeleccionado(f)} className="w-full text-left px-4 py-3 text-sm border-b last:border-b-0 hover:bg-stone-50 flex items-center justify-between" style={{ borderColor: "#EEEAE0" }}>
              <span className="nutri-ink">{f.nombre}</span><span className="nutri-muted text-xs">{f.kcal} kcal /100g</span>
            </button>
          ))}
        </div>
      )}
      {seleccionado && (
        <div className="nutri-panel rounded-xl p-4 mb-5">
          <div className="flex items-center justify-between mb-3"><span className="text-sm font-medium nutri-ink">{seleccionado.nombre}</span><button onClick={() => setSeleccionado(null)} className="text-xs nutri-muted">cambiar</button></div>

          <select value={momento} onChange={(e) => { setMomento(e.target.value); setRestarCarneId("ninguna"); }} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink mb-3"><option value="desayuno">Desayuno</option><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option><option value="colacion">Colación</option></select>

          <label className="block mb-3">
            <span className="text-xs nutri-muted block mb-1">Recipiente usado al pesar</span>
            <select value={recipienteId} onChange={(e) => setRecipienteId(e.target.value)} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink">
              <option value="ninguno">Ninguno (peso directo del alimento)</option>
              {recipientes.map((r) => <option key={r.id} value={r.id}>{r.nombre} (tara {r.taraG} g)</option>)}
            </select>
          </label>

          {mostrarRestarCarne && (
            <label className="block mb-3">
              <span className="text-xs nutri-muted block mb-1">¿Pesaste esto junto con una carne ya registrada en el mismo plato?</span>
              <select value={restarCarneId} onChange={(e) => setRestarCarneId(e.target.value)} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink">
                <option value="ninguna">No, es un peso aparte</option>
                {carnesAlmuerzo.map((it) => <option key={it.uid} value={it.uid}>{it.alimento.nombre} ({it.gramos} g ya registrados)</option>)}
              </select>
            </label>
          )}

          <div className="flex gap-2 mb-1">
            <input type="number" value={pesoBruto} onChange={(e) => setPesoBruto(Number(e.target.value))} className="w-28 rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
            <span className="self-center text-sm nutri-muted">gramos (todo lo que pesaste junto)</span>
          </div>
          {(recipienteId !== "ninguno" || carneRestada) && (
            <p className="text-xs nutri-muted mb-3">Peso neto del alimento: <span className="nutri-ink font-medium">{pesoNeto} g</span> ({pesoBruto} g bruto{recipienteId !== "ninguno" ? ` − ${tara} g de ${recipiente.nombre}` : ""}{carneRestada ? ` − ${pesoCarneRestada} g de ${carneRestada.alimento.nombre} ya pesados` : ""})</p>
          )}

          <DesglosePreview alimento={seleccionado} gramos={pesoNeto} />

          <button
            onClick={() => {
              const taraInfo = (recipienteId !== "ninguno" || carneRestada) ? { recipiente: recipiente ? recipiente.nombre : null, pesoBruto, tara, carneNombre: carneRestada ? carneRestada.alimento.nombre : null, carneGramos: carneRestada ? carneRestada.gramos : null } : null;
              addItem(seleccionado, pesoNeto, momento, taraInfo, fechaSeleccionada);
              if (fechaSeleccionada !== hoy) setLogOtraFecha((prev) => [...prev, { uid: `tmp_${Date.now()}`, alimento: seleccionado, gramos: pesoNeto, momento, tara: taraInfo, fecha: fechaSeleccionada }]);
              setSeleccionado(null); setBusqueda(""); setPesoBruto(100); setRecipienteId("ninguno"); setRestarCarneId("ninguna");
            }}
            disabled={pesoNeto <= 0}
            className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm flex items-center justify-center gap-1.5 disabled:opacity-40"
          >
            <IconPlus size={15} /> Agregar al registro
          </button>
        </div>
      )}
      <div className="nutri-panel rounded-2xl p-4 mb-5">
        <span className="text-sm font-medium nutri-ink block mb-2">Totales {fechaSeleccionada === hoy ? "de hoy" : `del ${fechaSeleccionada}`}</span>
        <div className="grid grid-cols-3 gap-3 text-center">
          <div><div className="nutri-serif text-lg nutri-ink">{Math.round(totalesActivo.kcal)}</div><div className="text-[11px] nutri-muted">kcal</div></div>
          <div><div className="nutri-serif text-lg nutri-ink">{Math.round(totalesActivo.proteinasG)}g</div><div className="text-[11px] nutri-muted">proteína</div></div>
          <div><div className="nutri-serif text-lg nutri-ink">{Math.round(totalesActivo.sodioMg)}mg</div><div className="text-[11px] nutri-muted">sodio</div></div>
        </div>
      </div>

      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-3" style={{ scrollbarWidth: "none" }}>
        {MOMENTOS.map((m) => (
          <button key={m.key} onClick={() => setFiltroMomento(m.key)} className={`shrink-0 rounded-full px-3 py-1.5 text-xs nutri-chip ${filtroMomento === m.key ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{m.label}</button>
        ))}
      </div>

      <span className="text-sm font-medium nutri-ink block mb-2">Alimentos registrados</span>
      {logFiltrado.length === 0 && <p className="text-sm nutri-muted">No hay alimentos registrados {filtroMomento === "todos" ? "en esta fecha" : `en ${filtroMomento}`}.</p>}
      <div className="space-y-2">
        {logFiltrado.map((item) => (
          <div key={item.uid} className="nutri-panel rounded-xl px-4 py-3">
            {editandoId === item.uid ? (
              <div>
                <div className="text-sm font-medium nutri-ink mb-2">{item.alimento.nombre}</div>
                <select value={edicion.momento} onChange={(e) => setEdicion((s) => ({ ...s, momento: e.target.value }))} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink mb-2"><option value="desayuno">Desayuno</option><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option><option value="colacion">Colación</option></select>
                <select value={edicion.recipienteId} onChange={(e) => setEdicion((s) => ({ ...s, recipienteId: e.target.value }))} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink mb-2">
                  <option value="ninguno">Ninguno (peso directo)</option>
                  {recipientes.map((r) => <option key={r.id} value={r.id}>{r.nombre} (tara {r.taraG} g)</option>)}
                </select>
                {edicion.momento === "almuerzo" && item.alimento.categoria !== "proteina" && (
                  <select value={edicion.restarCarneId} onChange={(e) => setEdicion((s) => ({ ...s, restarCarneId: e.target.value }))} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink mb-2">
                    <option value="ninguna">No restar ninguna carne</option>
                    {logActivo.filter((it) => it.momento === "almuerzo" && it.alimento.categoria === "proteina" && it.uid !== item.uid).map((it) => <option key={it.uid} value={it.uid}>Restar {it.alimento.nombre} ({it.gramos} g)</option>)}
                  </select>
                )}
                <div className="flex gap-2 mb-2">
                  <input type="number" value={edicion.pesoBruto} onChange={(e) => setEdicion((s) => ({ ...s, pesoBruto: Number(e.target.value) }))} className="w-28 rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
                  <span className="self-center text-xs nutri-muted">gramos (todo lo pesado junto)</span>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => guardarEdicion(item)} className="flex-1 nutri-brand text-white rounded-lg py-2 text-sm">Guardar</button>
                  <button onClick={() => { setEditandoId(null); setEdicion(null); }} className="flex-1 nutri-chip nutri-ink rounded-lg py-2 text-sm">Cancelar</button>
                </div>
              </div>
            ) : (
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-sm nutri-ink">{item.alimento.nombre}</div>
                  <div className="text-xs nutri-muted capitalize">
                    {item.momento} · {item.gramos} g · {Math.round(calcularTotalesItem(item.alimento, item.gramos).kcal)} kcal
                    {item.tara ? ` · (${item.tara.pesoBruto} g bruto${item.tara.recipiente ? ` − ${item.tara.tara} g ${item.tara.recipiente}` : ""}${item.tara.carneGramos ? ` − ${item.tara.carneGramos} g ${item.tara.carneNombre}` : ""})` : ""}
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => iniciarEdicion(item)} className="nutri-brand-text"><IconEdit size={16} /></button>
                  <button onClick={() => eliminarDeLista(item.uid)} className="nutri-warn"><IconTrash size={16} /></button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function FilaCumplimiento({ n }) {
  const cumplido = n.actual >= n.meta;
  return (
    <div className="py-1.5 flex items-center justify-between text-xs">
      <span className="nutri-ink w-24">{n.label}</span>
      <span className="nutri-muted flex-1 text-center">{Math.round(n.actual)} / {Math.round(n.meta)} {n.unidad}</span>
      {cumplido ? <span style={{ color: "#3E8E5A" }}>✅</span> : <span className="nutri-warn">⚠️</span>}
    </div>
  );
}

function PantallaHistorial({ requerimiento, pacienteId, onCerrar, onEditarDia }) {
  const [vista, setVista] = useState("semana");
  const [anio, setAnio] = useState(new Date().getFullYear());
  const [mes, setMes] = useState(new Date().getMonth());
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [cargando, setCargando] = useState(true);
  const [dias, setDias] = useState([]);
  const [diaExpandido, setDiaExpandido] = useState(null);

  const NOMBRES_MES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  const rangoFechas = useMemo(() => {
    if (vista === "semana") {
      const l = getLunes(new Date());
      l.setDate(l.getDate() + semanaOffset * 7);
      l.setFullYear(anio === new Date().getFullYear() ? l.getFullYear() : l.getFullYear());
      return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setDate(d.getDate() + i); return d; }).filter((d) => d <= new Date());
    }
    const ultimoDia = new Date(anio, mes + 1, 0).getDate();
    return Array.from({ length: ultimoDia }, (_, i) => new Date(anio, mes, i + 1)).filter((d) => d <= new Date());
  }, [vista, anio, mes, semanaOffset]);

  useEffect(() => {
    setCargando(true);
    Promise.all(rangoFechas.map((d) => {
      const iso = fechaLimaISO(d);
      return obtenerLogFecha(pacienteId, iso).then((items) => ({ fecha: iso, dia: d, items }));
    })).then((res) => { setDias(res); setCargando(false); });
  }, [rangoFechas, pacienteId]);

  const conDatos = dias.filter((d) => d.items.length > 0);
  const totalPeriodo = conDatos.reduce((acc, d) => {
    const t = calcularTotalesLog(d.items);
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG, fibraG: acc.fibraG + t.fibraG };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });
  const n = conDatos.length || 1;
  const promedio = { kcal: totalPeriodo.kcal / n, proteinasG: totalPeriodo.proteinasG / n, carbohidratosG: totalPeriodo.carbohidratosG / n, grasasG: totalPeriodo.grasasG / n, fibraG: totalPeriodo.fibraG / n };

  const filasResumen = [
    { label: "Calorías", unidad: "kcal", meta: requerimiento.get, actual: promedio.kcal },
    { label: "Proteína", unidad: "g", meta: requerimiento.proteinasG, actual: promedio.proteinasG },
    { label: "Carbohidratos", unidad: "g", meta: requerimiento.carbohidratosG, actual: promedio.carbohidratosG },
    { label: "Grasas", unidad: "g", meta: requerimiento.grasasG, actual: promedio.grasasG },
    { label: "Fibra", unidad: "g", meta: requerimiento.fibraG, actual: promedio.fibraG },
  ];

  return (
    <div className="min-h-screen max-w-md mx-auto" style={{ background: "var(--bg)" }}>
      <header className="sticky top-0 z-10 nutri-brand px-5 py-4 flex items-center justify-between">
        <span className="nutri-serif text-white text-lg">Historial</span>
        <button onClick={onCerrar} className="text-white text-xl leading-none">✕</button>
      </header>
      <div className="px-5 pt-5 pb-24">
        <div className="flex nutri-chip rounded-full overflow-hidden mb-4 w-fit">
          <button onClick={() => setVista("semana")} className={`text-xs px-4 py-1.5 ${vista === "semana" ? "nutri-chip-active" : "nutri-ink"}`}>Por semana</button>
          <button onClick={() => setVista("mes")} className={`text-xs px-4 py-1.5 ${vista === "mes" ? "nutri-chip-active" : "nutri-ink"}`}>Por mes</button>
        </div>

        <div className="flex items-center gap-2 mb-4">
          <select value={anio} onChange={(e) => setAnio(Number(e.target.value))} className="rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink">
            {[0, 1, 2].map((i) => { const y = new Date().getFullYear() - i; return <option key={y} value={y}>{y}</option>; })}
          </select>
          {vista === "mes" && (
            <select value={mes} onChange={(e) => setMes(Number(e.target.value))} className="rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink flex-1">
              {NOMBRES_MES.map((nm, i) => <option key={i} value={i}>{nm}</option>)}
            </select>
          )}
          {vista === "semana" && (
            <div className="flex items-center gap-2 flex-1 justify-between">
              <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text">‹ Anterior</button>
              <span className="text-xs nutri-muted">{rangoFechas[0] && RANGO_SEMANA(rangoFechas[0], rangoFechas[rangoFechas.length - 1] || rangoFechas[0])}</span>
              <button onClick={() => setSemanaOffset((s) => Math.min(s + 1, 0))} className="text-xs nutri-brand-text">Siguiente ›</button>
            </div>
          )}
        </div>

        {cargando ? (
          <p className="text-sm nutri-muted">Cargando...</p>
        ) : (
          <>
            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <p className="text-sm font-medium nutri-ink mb-2">Promedio diario vs. tu meta ({conDatos.length} día{conDatos.length === 1 ? "" : "s"} con registro)</p>
              {filasResumen.map((f, i) => <FilaCumplimiento key={i} n={f} />)}
            </div>

            <p className="text-sm font-medium nutri-ink mb-2">Día por día</p>
            <div className="space-y-2">
              {dias.map((d, i) => {
                const t = calcularTotalesLog(d.items);
                const cumpleKcal = d.items.length > 0 && t.kcal >= requerimiento.get;
                const expandido = diaExpandido === d.fecha;
                return (
                  <div key={i} className="nutri-panel rounded-xl overflow-hidden">
                    <div
                      role="button"
                      tabIndex={0}
                      onClick={() => d.items.length > 0 && setDiaExpandido(expandido ? null : d.fecha)}
                      onKeyDown={(e) => { if (e.key === "Enter" && d.items.length > 0) setDiaExpandido(expandido ? null : d.fecha); }}
                      className="w-full px-4 py-3 flex items-center justify-between text-left cursor-pointer"
                    >
                      <div>
                        <div className="text-sm nutri-ink capitalize">{NOMBRE_DIA_LARGO(d.dia)}</div>
                        <div className="text-xs nutri-muted">{d.items.length === 0 ? "Sin registro" : `${Math.round(t.kcal)} kcal · ${Math.round(t.proteinasG)} g proteína`}</div>
                      </div>
                      <div className="flex items-center gap-3">
                        {d.items.length > 0 && (cumpleKcal ? <span style={{ color: "#3E8E5A" }}>✅</span> : <span className="nutri-warn">⚠️</span>)}
                        <button onClick={(e) => { e.stopPropagation(); onEditarDia(d.fecha); }} className="nutri-brand-text flex items-center gap-1 text-xs shrink-0">
                          <IconEdit size={14} /> {d.items.length === 0 ? "Agregar" : "Editar"}
                        </button>
                        {d.items.length > 0 && <span className="nutri-muted text-xs">{expandido ? "▾" : "▸"}</span>}
                      </div>
                    </div>
                    {expandido && (
                      <div className="px-4 pb-4 pt-1 border-t" style={{ borderColor: "var(--panel-border)" }}>
                        <PanelMetas totales={t} requerimiento={requerimiento} tamanoGrid="sm" />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function PantallaDashboard({ requerimiento, log, perfil, pesos, registrarPeso }) {
  const totales = calcularTotalesLog(log);
  const sugerencias = useMemo(() => generarSugerencias(requerimiento, totales, perfil), [requerimiento, totales, perfil]);
  const [pesoInput, setPesoInput] = useState("");
  const resumenSemanal = useMemo(() => resumenCumplimiento(7, requerimiento), [requerimiento, log]);
  const resumenMensual = useMemo(() => resumenCumplimiento(30, requerimiento), [requerimiento, log]);
  const pesosOrdenados = [...pesos].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const ultimoPeso = pesosOrdenados[pesosOrdenados.length - 1];
  const pesoAnterior = pesosOrdenados[pesosOrdenados.length - 2];
  const deltaPeso = ultimoPeso && pesoAnterior ? ultimoPeso.pesoKg - pesoAnterior.pesoKg : null;
  const confirmarPeso = () => { const v = Number(pesoInput); if (v > 0) { registrarPeso(v); setPesoInput(""); } };
  const fila = (label, val, max, unidad, colorClass) => (
    <div className="mb-4">
      <div className="flex justify-between text-xs mb-1.5"><span className="nutri-ink font-medium">{label}</span><span className="nutri-muted">{Math.round(val)} / {Math.round(max)} {unidad}</span></div>
      <Bar value={val} max={max} colorClass={colorClass} />
    </div>
  );
  return (
    <div className="px-5 pt-6 pb-24">
      <h1 className="nutri-serif text-2xl nutri-ink mb-1">Panel del día</h1>
      <p className="text-sm nutri-muted mb-6">Ingesta consumida frente a tus requerimientos calculados.</p>
      <div className="nutri-panel rounded-2xl p-6 flex flex-col items-center mb-5">
        <GaugeRadial label="Calorías" valor={totales.kcal} meta={requerimiento.get} unidad="kcal" color="var(--accent-energy)" tamano="lg" modo="numero" />
        <div className="flex gap-4 mt-4 text-xs nutri-muted">
          {requerimiento.prescripcionActiva ? <span>Objetivo por prescripción médica</span> : <><span>GEB {requerimiento.geb} kcal</span><span>·</span><span>GET {requerimiento.get} kcal</span></>}
        </div>
      </div>

      {requerimiento.suplementos.length > 0 && (
        <div className="nutri-panel rounded-2xl p-5 mb-5">
          <div className="flex items-center gap-2 mb-2"><span className="nutri-brand-text"><IconSparkles size={15} /></span><span className="text-sm font-medium nutri-ink">Suplementos de hoy (aparte de la comida)</span></div>
          <ul className="space-y-1 mb-2">
            {requerimiento.suplementos.map((s) => <li key={s.id} className="text-xs nutri-ink">{s.nombre} — {s.momento || "mañana"}, {s.vecesDia}x/día ({s.kcal} kcal y {s.proteinaG} g proteína por toma){s.notas ? ` · ${s.notas}` : ""}</li>)}
          </ul>
          <p className="text-xs nutri-muted">Suman {Math.round(requerimiento.suplementosTotales.kcal)} kcal y {Math.round(requerimiento.suplementosTotales.proteinaG)} g de proteína extra al día → total con la dieta: {Math.round(requerimiento.get + requerimiento.suplementosTotales.kcal)} kcal / {Math.round(requerimiento.proteinasG + requerimiento.suplementosTotales.proteinaG)} g proteína.</p>
        </div>
      )}

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center gap-2 mb-2"><span className="nutri-brand-text"><IconActivity size={15} /></span><span className="text-sm font-medium nutri-ink">Control de peso</span></div>
        <p className="text-xs nutri-muted mb-3">Registra el peso cada vez que lo pesen (semanalmente) para ver la tendencia.</p>
        <div className="flex gap-2 mb-2">
          <input type="number" value={pesoInput} onChange={(e) => setPesoInput(e.target.value)} placeholder={`Peso actual (${perfil.pesoKg} kg)`} className="flex-1 rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
          <button onClick={confirmarPeso} disabled={!pesoInput} className="nutri-brand text-white rounded-lg px-4 text-sm disabled:opacity-40">Registrar</button>
        </div>
        {ultimoPeso && (
          <p className="text-xs nutri-muted">Último registro: {ultimoPeso.pesoKg} kg ({ultimoPeso.fecha}){deltaPeso !== null && <> · {deltaPeso >= 0 ? "+" : ""}{deltaPeso.toFixed(1)} kg desde el registro anterior</>}</p>
        )}
      </div>

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center gap-2 mb-3"><span className="nutri-brand-text"><IconSparkles size={15} /></span><span className="text-sm font-medium nutri-ink">Cumplimiento de la meta</span></div>
        <div className="grid grid-cols-2 gap-4 mb-2">
          <div>
            <p className="text-xs nutri-muted mb-1">Esta semana ({resumenSemanal.diasConDatos}/{resumenSemanal.diasTotales} días registrados)</p>
            <p className="text-sm nutri-ink">{resumenSemanal.diasCumpleKcal}/{resumenSemanal.diasConDatos || 0} días en meta de kcal</p>
            <p className="text-sm nutri-ink">{resumenSemanal.diasCumpleProteina}/{resumenSemanal.diasConDatos || 0} días en meta de proteína</p>
            {resumenSemanal.diasConDatos > 0 && <p className="text-xs nutri-muted mt-1">Promedio: {Math.round(resumenSemanal.promedioKcal)} kcal / {Math.round(resumenSemanal.promedioProteina)} g prot</p>}
          </div>
          <div>
            <p className="text-xs nutri-muted mb-1">Este mes ({resumenMensual.diasConDatos}/{resumenMensual.diasTotales} días registrados)</p>
            <p className="text-sm nutri-ink">{resumenMensual.diasCumpleKcal}/{resumenMensual.diasConDatos || 0} días en meta de kcal</p>
            <p className="text-sm nutri-ink">{resumenMensual.diasCumpleProteina}/{resumenMensual.diasConDatos || 0} días en meta de proteína</p>
            {resumenMensual.diasConDatos > 0 && <p className="text-xs nutri-muted mt-1">Promedio: {Math.round(resumenMensual.promedioKcal)} kcal / {Math.round(resumenMensual.promedioProteina)} g prot</p>}
          </div>
        </div>
        <p className="text-[11px] nutri-muted">"En meta de kcal" = dentro de ±10% del objetivo diario. "En meta de proteína" = al menos 90% del objetivo diario.</p>
      </div>

      {requerimiento.interacciones.length > 0 && (
        <div className="nutri-panel rounded-2xl p-5 mb-5 nutri-warn-bg" style={{ borderColor: "#E3B7AF" }}>
          <div className="flex items-center gap-2 mb-3"><span className="nutri-warn"><IconAlert size={16} /></span><span className="text-sm font-medium nutri-ink">Interacciones fármaco-nutriente a vigilar</span></div>
          <ul className="space-y-2 mb-2">
            {requerimiento.interacciones.map((it, i) => (
              <li key={i} className="text-xs nutri-ink leading-relaxed"><span className="font-medium">{it.medicamentoUsuario}</span> ({it.nombre}): <span className="nutri-muted">{it.nota}</span></li>
            ))}
          </ul>
          <p className="text-[11px] nutri-muted">Información orientativa; confírmala con tu médico o farmacéutico.</p>
        </div>
      )}

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center gap-2 mb-3"><span className="nutri-brand-text"><IconSparkles size={15} /></span><span className="text-sm font-medium nutri-ink">Sugerencias para hoy</span></div>
        <ul className="space-y-3">
          {sugerencias.map((s, i) => (
            <li key={i} className="text-xs pl-3 border-l-2" style={{ borderColor: "#C9C3B2" }}>
              <p className="nutri-muted leading-relaxed">{s.mensaje}</p>
              {s.opciones && s.opciones.length > 0 && (
                <ul className="mt-1.5 space-y-1">
                  {s.opciones.map((o, j) => (
                    <li key={j} className="nutri-ink">· {o.gramos} g de {o.nombre}</li>
                  ))}
                </ul>
              )}
            </li>
          ))}
        </ul>
      </div>
      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <span className="text-sm font-medium nutri-ink block mb-3">Macronutrientes</span>
        {fila("Proteínas", totales.proteinasG, requerimiento.proteinasG, "g", "nutri-accent-protein")}
        {fila("Carbohidratos", totales.carbohidratosG, requerimiento.carbohidratosG, "g", "nutri-accent-carb")}
        {fila("Grasas", totales.grasasG, requerimiento.grasasG, "g", "nutri-accent-fat")}
        {fila("Fibra", totales.fibraG, requerimiento.fibraG, "g", "nutri-accent-carb")}
        {fila("Sodio", totales.sodioMg, requerimiento.sodioMg, "mg", "nutri-accent-energy")}
      </div>
      <div className="nutri-panel rounded-2xl p-5">
        <span className="text-sm font-medium nutri-ink block mb-1">Cumplimiento de metas de hoy</span>
        <p className="text-xs nutri-muted mb-1">Cada anillo es un nutriente frente a tu meta diaria.</p>
        <PanelMetas totales={totales} requerimiento={requerimiento} />
      </div>
    </div>
  );
}

function getLunes(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay(); // 0=domingo,1=lunes,...
  const diff = dia === 0 ? -6 : 1 - dia;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}
const DIAS_EN_MS = 86400000;
const NOMBRE_DIA_CORTO = (d) => d.toLocaleDateString("es-ES", { weekday: "short" }).replace(".", "");
const NOMBRE_DIA_LARGO = (d) => d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });
const RANGO_SEMANA = (inicio, fin) => `${inicio.toLocaleDateString("es-ES", { day: "numeric", month: "short" })} – ${fin.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })}`;

function PantallaMenu({ requerimiento, pacienteId, onErrorSync }) {
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [variacion, setVariacion] = useState(0);
  const [diaSeleccionado, setDiaSeleccionado] = useState(() => {
    const hoy = new Date().getDay();
    return hoy === 0 ? 6 : hoy - 1; // índice 0=lunes...6=domingo
  });
  const [ediciones, setEdiciones] = useState({});
  const [agregando, setAgregando] = useState(null);
  const aplicandoRemotoMenu = useRef(false);
  const diasCargados = useRef({});

  const lunes = useMemo(() => {
    const l = getLunes(new Date());
    l.setDate(l.getDate() + semanaOffset * 7);
    return l;
  }, [semanaOffset]);

  const dias = useMemo(() => Array.from({ length: 7 }, (_, i) => { const d = new Date(lunes); d.setDate(d.getDate() + i); return d; }), [lunes]);

  const menusSemana = useMemo(() => dias.map((d) => {
    const seedDia = Math.floor(d.getTime() / DIAS_EN_MS) + variacion * 1000;
    const menu = generarMenu(requerimiento, seedDia);
    const totalDia = menu.reduce((acc, m) => {
      const t = m.items.reduce((s, it) => { const x = calcularTotalesItem(it.alimento, it.gramos); return { kcal: s.kcal + x.kcal, proteinasG: s.proteinasG + x.proteinasG, carbohidratosG: s.carbohidratosG + x.carbohidratosG, grasasG: s.grasasG + x.grasasG }; }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0 });
      return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG };
    }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0 });
    return { fecha: d, menu, totalDia };
  }), [dias, requerimiento, variacion]);

  const activo = menusSemana[diaSeleccionado];
  const claveDia = fechaLimaISO(activo.fecha);

  useEffect(() => {
    if (!pacienteId) return;
    const unsub = dbFirestore.collection("pacientes").doc(pacienteId).collection("menuEdiciones").doc(claveDia).onSnapshot((snap) => {
      const d = snap.data() || {};
      const resuelto = {};
      Object.keys(d).forEach((mealKey) => {
        resuelto[mealKey] = (d[mealKey] || []).map((it) => ({ alimento: FOOD_DB.find((f) => f.id === it.alimentoId), gramos: it.gramos })).filter((it) => it.alimento);
      });
      aplicandoRemotoMenu.current = true;
      diasCargados.current[claveDia] = true;
      setEdiciones((prev) => ({ ...prev, [claveDia]: resuelto }));
    }, () => onErrorSync && onErrorSync("No se pudo leer tus ajustes del menú desde la nube. Revisa tu conexión."));
    return unsub;
  }, [pacienteId, claveDia]);

  useEffect(() => {
    if (!pacienteId) return;
    if (aplicandoRemotoMenu.current) { aplicandoRemotoMenu.current = false; return; }
    if (!diasCargados.current[claveDia]) return;
    const dia = ediciones[claveDia] || {};
    const serializado = {};
    Object.keys(dia).forEach((mealKey) => { serializado[mealKey] = dia[mealKey].map((it) => ({ alimentoId: it.alimento.id, gramos: it.gramos })); });
    const t = setTimeout(() => { dbFirestore.collection("pacientes").doc(pacienteId).collection("menuEdiciones").doc(claveDia).set(serializado).catch(() => onErrorSync && onErrorSync("No se pudo guardar tu ajuste del menú en la nube. Revisa tu conexión.")); }, 800);
    return () => clearTimeout(t);
  }, [pacienteId, claveDia, ediciones]);

  const edicionesDia = ediciones[claveDia] || {};
  const menuEfectivo = activo.menu.map((m) => (edicionesDia[m.key] ? { ...m, items: edicionesDia[m.key] } : m));
  const totalEfectivo = menuEfectivo.reduce((acc, m) => {
    const t = m.items.reduce((s, it) => { const x = calcularTotalesItem(it.alimento, it.gramos); return { kcal: s.kcal + x.kcal, proteinasG: s.proteinasG + x.proteinasG, carbohidratosG: s.carbohidratosG + x.carbohidratosG, grasasG: s.grasasG + x.grasasG, fibraG: s.fibraG + x.fibraG }; }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG, fibraG: acc.fibraG + t.fibraG };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });

  const actualizarItemsComida = (mealKey, nuevosItems) => setEdiciones((prev) => ({ ...prev, [claveDia]: { ...(prev[claveDia] || {}), [mealKey]: nuevosItems } }));
  const restablecerComida = (mealKey) => setEdiciones((prev) => { const dia = { ...(prev[claveDia] || {}) }; delete dia[mealKey]; return { ...prev, [claveDia]: dia }; });
  const cambiarItem = (mealKey, idx) => {
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    const item = meal.items[idx];
    const candidatos = FOOD_DB.filter((f) => f.categoria === item.alimento.categoria && aptoParaRestricciones(f, requerimiento.restricciones));
    if (candidatos.length < 2) return;
    const curIdx = candidatos.findIndex((f) => f.id === item.alimento.id);
    const siguiente = candidatos[(curIdx + 1) % candidatos.length];
    actualizarItemsComida(mealKey, meal.items.map((it, i) => (i === idx ? { ...it, alimento: siguiente } : it)));
  };
  const quitarItem = (mealKey, idx) => {
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    actualizarItemsComida(mealKey, meal.items.filter((_, i) => i !== idx));
  };
  const agregarItem = (mealKey, alimentoId) => {
    const alimento = FOOD_DB.find((f) => f.id === alimentoId);
    if (!alimento) return;
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    actualizarItemsComida(mealKey, [...meal.items, { alimento, gramos: 100 }]);
    setAgregando(null);
  };

  const desvio = requerimiento.get > 0 ? Math.round(((totalEfectivo.kcal - requerimiento.get) / requerimiento.get) * 100) : 0;
  const esHoy = (d) => d.toDateString() === new Date().toDateString();

  return (
    <div className="px-5 pt-6 pb-24">
      <div className="flex items-center justify-between mb-1">
        <h1 className="nutri-serif text-2xl nutri-ink">Menú semanal</h1>
        <button onClick={() => setVariacion((v) => v + 1)} className="flex items-center gap-1.5 text-xs nutri-brand-text font-medium"><IconRefresh size={13} /> Nueva variación</button>
      </div>
      <p className="text-sm nutri-muted mb-4">Cambia automáticamente semana a semana (y por lo tanto mes a mes y año a año) para variar los alimentos.</p>

      <SugeridorIngrediente requerimiento={requerimiento} />

      <div className="flex items-center justify-between mb-3">
        <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text font-medium px-2 py-1">‹ Semana anterior</button>
        <span className="text-xs nutri-muted font-medium">{RANGO_SEMANA(dias[0], dias[6])}</span>
        <button onClick={() => setSemanaOffset((s) => s + 1)} className="text-xs nutri-brand-text font-medium px-2 py-1">Semana siguiente ›</button>
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1 mb-5" style={{ scrollbarWidth: "none" }}>
        {menusSemana.map((dm, i) => (
          <button
            key={i}
            onClick={() => setDiaSeleccionado(i)}
            className={`shrink-0 rounded-xl px-3 py-2 text-center nutri-chip ${i === diaSeleccionado ? "nutri-chip-active" : "bg-white nutri-ink"}`}
            style={{ minWidth: 64 }}
          >
            <div className="text-[10px] uppercase tracking-wide opacity-80">{NOMBRE_DIA_CORTO(dm.fecha)}{esHoy(dm.fecha) ? " •" : ""}</div>
            <div className="nutri-serif text-base leading-tight">{dm.fecha.getDate()}</div>
            <div className="text-[10px] opacity-80">{Math.round(dm.totalDia.kcal)} kcal</div>
          </button>
        ))}
      </div>

      <p className="text-sm font-medium nutri-ink mb-1 capitalize">{NOMBRE_DIA_LARGO(activo.fecha)}</p>
      <div className="nutri-panel rounded-xl p-4 mb-5">
        {[
          { label: "Calorías", unidad: "kcal", meta: requerimiento.get, actual: totalEfectivo.kcal },
          { label: "Proteína", unidad: "g", meta: requerimiento.proteinasG, actual: totalEfectivo.proteinasG },
          { label: "Carbohidratos", unidad: "g", meta: requerimiento.carbohidratosG, actual: totalEfectivo.carbohidratosG },
          { label: "Grasas", unidad: "g", meta: requerimiento.grasasG, actual: totalEfectivo.grasasG },
          { label: "Fibra", unidad: "g", meta: requerimiento.fibraG, actual: totalEfectivo.fibraG },
        ].map((n, i) => {
          const cumplido = n.actual >= n.meta;
          return (
            <div key={i} className="py-2" style={{ borderTop: i > 0 ? "1px solid var(--panel-border)" : "none" }}>
              <div className="flex items-center justify-between mb-0.5">
                <span className="text-xs font-medium nutri-ink">{n.label}</span>
                {cumplido ? <span className="text-xs" style={{ color: "#3E8E5A" }}>✅ Cumplido</span> : <span className="text-xs nutri-warn">⚠️ Ajustar</span>}
              </div>
              <div className="flex items-center justify-between text-xs nutri-muted">
                <span>Meta: {Math.round(n.meta)} {n.unidad}</span>
                <span>Menú: {Math.round(n.actual)} {n.unidad}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div className="space-y-4">
        {menuEfectivo.map((m) => (
          <div key={m.key} className="nutri-panel rounded-2xl p-5">
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm font-medium nutri-ink">{m.label}</span>
              <div className="flex items-center gap-2">
                <span className="text-xs nutri-muted">{Math.round(requerimiento.get * m.pct)} kcal objetivo</span>
                {edicionesDia[m.key] && <button onClick={() => restablecerComida(m.key)} className="text-xs nutri-brand-text">Restablecer</button>}
              </div>
            </div>
            <div className="space-y-2 mb-2">
              {m.items.map((it, i) => (
                <div key={i} className="flex items-center justify-between text-sm">
                  <span className="nutri-ink">{it.alimento.nombre}</span>
                  <div className="flex items-center gap-2">
                    <span className="nutri-muted">{it.gramos} g</span>
                    <button onClick={() => cambiarItem(m.key, i)} title="Cambiar por otra opción" className="nutri-brand-text"><IconRefresh size={13} /></button>
                    <button onClick={() => quitarItem(m.key, i)} title="Quitar" className="nutri-warn"><IconTrash size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
            {agregando === m.key ? (
              <div className="flex gap-2 mt-2">
                <select className="flex-1 rounded-lg nutri-chip px-2 py-1.5 bg-white nutri-ink" style={{ fontSize: "0.7rem" }} defaultValue="" onChange={(e) => agregarItem(m.key, e.target.value)}>
                  <option value="" disabled>Elige un alimento...</option>
                  {ORDEN_CATEGORIAS.map((cat) => {
                    const items = FOOD_DB.filter((f) => f.categoria === cat && aptoParaRestricciones(f, requerimiento.restricciones));
                    if (items.length === 0) return null;
                    return (
                      <optgroup key={cat} label={CATEGORIA_LABELS[cat] || cat}>
                        {items.map((f) => <option key={f.id} value={f.id}>{f.nombre}</option>)}
                      </optgroup>
                    );
                  })}
                </select>
                <button onClick={() => setAgregando(null)} className="text-xs nutri-muted px-2">Cancelar</button>
              </div>
            ) : (
              <button onClick={() => setAgregando(m.key)} className="text-xs nutri-brand-text flex items-center gap-1"><IconPlus size={12} /> Agregar alimento</button>
            )}
            {m.notaExtra && <p className="text-xs nutri-brand-text mt-3">💡 {m.notaExtra}</p>}
          </div>
        ))}
      </div>

      {(requerimiento.condicionesActivas.length > 0 || requerimiento.interacciones.length > 0) && (
        <div className="mt-5 flex items-start gap-2 text-xs nutri-muted">
          <span className="mt-0.5 shrink-0"><IconSparkles size={14} /></span>
          <span>
            {requerimiento.condicionesActivas.length > 0 && <>Excluye alimentos no recomendados para: {requerimiento.condicionesActivas.map((c) => c.nombre).join(", ")}. </>}
            {requerimiento.interacciones.length > 0 && <>También considera tus medicamentos: {requerimiento.interacciones.map((i) => i.medicamentoUsuario).join(", ")}.</>}
          </span>
        </div>
      )}
    </div>
  );
}

function PantallaOpciones({ recipientes, setRecipientes, medicamentos, setMedicamentos, prescripcion, setPrescripcion, suplementos, setSuplementos, perfil, tema, setTema, pacienteId, salir }) {
  const [nuevoMed, setNuevoMed] = useState({ nombre: "", dosis: "", frecuencia: "" });
  const [subiendoFoto, setSubiendoFoto] = useState(false);
  const [errorFoto, setErrorFoto] = useState("");
  const [sugerenciasFoto, setSugerenciasFoto] = useState([]);
  const [nuevoSup, setNuevoSup] = useState({ nombre: "", kcal: "", proteinaG: "", vecesDia: 1, momento: "mañana", notas: "" });
  const fileInputRef = useRef(null);

  const actualizarRecipiente = (id, campo, valor) => setRecipientes((prev) => prev.map((r) => (r.id === id ? { ...r, [campo]: valor } : r)));
  const eliminarRecipiente = (id) => setRecipientes((prev) => prev.filter((r) => r.id !== id));
  const agregarRecipiente = () => setRecipientes((prev) => [...prev, { id: `rec_${Date.now()}`, nombre: "Nuevo recipiente", taraG: 0 }]);

  const agregarMedicamento = () => {
    if (!nuevoMed.nombre.trim()) return;
    setMedicamentos((prev) => [...prev, { id: `med_${Date.now()}`, ...nuevoMed }]);
    setNuevoMed({ nombre: "", dosis: "", frecuencia: "" });
  };
  const eliminarMedicamento = (id) => setMedicamentos((prev) => prev.filter((m) => m.id !== id));

  const actualizarRx = (campo, valor) => setPrescripcion((prev) => ({ ...prev, [campo]: valor }));

  const agregarSuplemento = () => {
    if (!nuevoSup.nombre.trim() || !nuevoSup.kcal) return;
    setSuplementos((prev) => [...prev, { id: `sup_${Date.now()}`, nombre: nuevoSup.nombre, kcal: Number(nuevoSup.kcal) || 0, proteinaG: Number(nuevoSup.proteinaG) || 0, vecesDia: Number(nuevoSup.vecesDia) || 1, momento: nuevoSup.momento, notas: nuevoSup.notas }]);
    setNuevoSup({ nombre: "", kcal: "", proteinaG: "", vecesDia: 1, momento: "mañana", notas: "" });
  };
  const eliminarSuplemento = (id) => setSuplementos((prev) => prev.filter((s) => s.id !== id));

  const handleFoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErrorFoto(""); setSugerenciasFoto([]); setSubiendoFoto(true);
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("No se pudo leer la imagen"));
        r.readAsDataURL(file);
      });
      const nombres = await extraerMedicamentosDeFoto(base64, file.type || "image/jpeg");
      if (nombres.length === 0) setErrorFoto("No se identificaron medicamentos con claridad en la imagen. Puedes agregarlos manualmente.");
      setSugerenciasFoto(nombres);
    } catch (err) {
      setErrorFoto("Ocurrió un error al procesar la imagen. Intenta con otra foto o agrégalo manualmente.");
    } finally {
      setSubiendoFoto(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const inputCls = "w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink";

  return (
    <div className="px-5 pt-6 pb-24">
      <h1 className="nutri-serif text-2xl nutri-ink mb-1">Opciones</h1>
      <p className="text-sm nutri-muted mb-6">Configura tus recipientes de pesaje, medicamentos, prescripción médica y suplementos.</p>

      {pacienteId && (
        <div className="nutri-panel rounded-2xl p-5 mb-5">
          <div className="flex items-center gap-2 mb-2"><IconActivity size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">Espacio compartido</span></div>
          <p className="text-xs nutri-muted mb-2">Comparte este código con las demás personas que vayan a registrar comidas de este paciente. Cada una debe crear su propia cuenta y unirse con este código.</p>
          <div className="flex items-center gap-2 mb-3">
            <span className="nutri-serif text-xl nutri-ink tracking-widest">{pacienteId}</span>
            <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(pacienteId); }} className="text-xs nutri-brand-text">Copiar</button>
          </div>
          {salir && <button onClick={salir} className="text-xs nutri-warn">Cerrar sesión</button>}
        </div>
      )}

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center justify-between">
          <span className="text-sm font-medium nutri-ink">Apariencia</span>
          <div className="flex nutri-chip rounded-full overflow-hidden">
            <button onClick={() => setTema("claro")} className={`text-xs px-3 py-1.5 ${tema === "claro" ? "nutri-chip-active" : "nutri-ink"}`}>Claro</button>
            <button onClick={() => setTema("oscuro")} className={`text-xs px-3 py-1.5 ${tema === "oscuro" ? "nutri-chip-active" : "nutri-ink"}`}>Oscuro</button>
          </div>
        </div>
      </div>

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center gap-2 mb-3"><IconSparkles size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">Prescripción médica (manual)</span></div>
        <p className="text-xs nutri-muted mb-3">Si tu médico o nutricionista te dio metas específicas (kcal, proteína, % de macros), actívalo aquí para que la app las use en vez del cálculo automático. Deja un campo vacío para que ese valor se siga calculando solo.</p>
        <div className="flex items-center gap-2 mb-3">
          <span className="text-xs nutri-muted w-32">Fase actual</span>
          <select className={inputCls} value={prescripcion.activa ? "subir_peso" : "reevaluar"} onChange={(e) => actualizarRx("activa", e.target.value === "subir_peso")}>
            <option value="subir_peso">Subir de peso (indicación médica activa)</option>
            <option value="reevaluar">Ya subió / en reevaluación (usar cálculo automático)</option>

        </div>
        <p className="text-xs nutri-muted mb-3">Mantén "Subir de peso" mientras dure la indicación. Cuando lo pesen y el médico reevalúe, cambia el selector a la segunda opción para volver al cálculo automático por perfil.</p>
        {prescripcion.activa && (
          <div className="space-y-2">
            <div className="flex items-center gap-2"><span className="text-xs nutri-muted w-32">Kcal objetivo/día</span><input type="number" className={inputCls} placeholder="ej. 1300" value={prescripcion.kcalManual ?? ""} onChange={(e) => actualizarRx("kcalManual", e.target.value === "" ? null : Number(e.target.value))} /></div>

            <div className="flex items-center gap-2"><span className="text-xs nutri-muted w-32">% Carbohidratos</span><input type="number" className={inputCls} placeholder="ej. 50" value={prescripcion.carbohidratosPctManual ?? ""} onChange={(e) => actualizarRx("carbohidratosPctManual", e.target.value === "" ? null : Number(e.target.value))} /></div>
            <div className="flex items-center gap-2"><span className="text-xs nutri-muted w-32">% Grasas</span><input type="number" className={inputCls} placeholder="ej. 32" value={prescripcion.grasasPctManual ?? ""} onChange={(e) => actualizarRx("grasasPctManual", e.target.value === "" ? null : Number(e.target.value))} /></div>
          </div>
        )}
      </div>

      <div className="nutri-panel rounded-2xl p-5 mb-5">
        <div className="flex items-center gap-2 mb-3"><IconSparkles size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">Suplementos / módulos nutricionales</span></div>
        <p className="text-xs nutri-muted mb-3">Fórmulas como Ensure Clinical o Ensure Advance con HMB que sumas aparte de la comida. Se muestran como un aporte extra de kcal y proteína, sin mezclarse con las sugerencias de menú.</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {SUPLEMENTOS_PRESET.map((p) => (
            <button key={p.nombre} onClick={() => setNuevoSup((s) => ({ ...s, nombre: p.nombre, kcal: p.kcal, proteinaG: p.proteinaG }))} className="text-xs px-3 py-1.5 rounded-full nutri-chip nutri-ink">
              {p.nombre} ({p.kcal} kcal / {p.proteinaG} g)
