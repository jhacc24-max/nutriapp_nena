      <button onClick={onVolver} className="text-white flex items-center gap-1 text-xs"><IconX size={16} /> {etiqueta}</button>
    </header>
  );
}


/* Gráfico de barras por día con línea de meta (SVG, sin librerías). Una sola serie por gráfico;
   la meta se rotula directamente y cada barra tiene su valor como tooltip nativo. */
function GraficoBarrasDias({ datos, meta, unidad, color, titulo }) {
  const W = 360, H = 176, ml = 36, mr = 8, mt = 16, mb = 30;
  const iw = W - ml - mr, ih = H - mt - mb;
  const maxDato = Math.max(...datos.map((d) => d.valor || 0), meta || 0, 1);
  const techo = maxDato * 1.1;
  const yy = (v) => mt + ih - (v / techo) * ih;
  const paso = iw / datos.length, bw = Math.min(26, paso * 0.62), cada = Math.ceil(datos.length / 15), mostrarValores = datos.length <= 14;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={`${titulo}: ${datos.map((d) => `${fechaCortaLima(d.fecha)} ${Math.round(d.valor || 0)} ${unidad}`).join(", ")}`}>
      {[0, 0.5, 1].map((f) => (
        <g key={f}>
          <line x1={ml} x2={W - mr} y1={yy(maxDato * f)} y2={yy(maxDato * f)} style={{ stroke: "var(--panel-border)" }} strokeWidth="0.7" />
          <text x={ml - 4} y={yy(maxDato * f) + 3} textAnchor="end" fontSize="9" style={{ fill: "var(--muted)" }}>{Math.round(maxDato * f)}</text>
        </g>
      ))}
      {datos.map((d, i) => {
        const bx = ml + paso * i + (paso - bw) / 2;
        const e = etiquetaEjeLima(d.fecha);
        return (
          <g key={d.fecha}>
            {d.valor > 0 && (
              <rect x={bx} y={yy(d.valor)} width={bw} height={mt + ih - yy(d.valor)} rx="3" fill={color}>
                <title>{`${fechaCortaLima(d.fecha)}: ${Math.round(d.valor)} ${unidad}`}</title>
              </rect>
            )}
            {mostrarValores && d.valor > 0 && <text x={bx + bw / 2} y={yy(d.valor) - 3} textAnchor="middle" fontSize="8.5" style={{ fill: "var(--ink)" }}>{Math.round(d.valor)}</text>}
            {i % cada === 0 && (
              <>
                <text x={bx + bw / 2} y={H - mb + 12} textAnchor="middle" fontSize="9" style={{ fill: "var(--muted)" }}>{e.w}</text>
                <text x={bx + bw / 2} y={H - mb + 23} textAnchor="middle" fontSize="9" style={{ fill: "var(--muted)" }}>{e.n}</text>
              </>
            )}
          </g>
        );
      })}
      {meta > 0 && (
        <g>
          <line x1={ml} x2={W - mr} y1={yy(meta)} y2={yy(meta)} strokeDasharray="4 3" strokeWidth="1.2" style={{ stroke: "var(--ink)" }} />
          <text x={W - mr} y={yy(meta) - 4} textAnchor="end" fontSize="9" fontWeight="600" style={{ fill: "var(--ink)" }}>{`Meta: ${Math.round(meta)} ${unidad}`}</text>
        </g>
      )}
    </svg>
  );
}

function GraficoPeso({ serie }) {
  const W = 360, H = 150, ml = 36, mr = 14, mt = 16, mb = 24;
  const iw = W - ml - mr, ih = H - mt - mb;
  const vals = serie.map((p) => p.pesoKg), mn = Math.min(...vals) - 0.5, mx = Math.max(...vals) + 0.5;
  const t0 = new Date(serie[0].fecha + "T12:00:00Z").getTime(), t1 = new Date(serie[serie.length - 1].fecha + "T12:00:00Z").getTime();
  const px = (f) => ml + (t1 > t0 ? ((new Date(f + "T12:00:00Z").getTime() - t0) / (t1 - t0)) * iw : 0);
  const py = (v) => mt + ih - ((v - mn) / (mx - mn)) * ih;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={`Evolución del peso: ${serie.map((p) => `${fechaCortaLima(p.fecha)} ${p.pesoKg} kg`).join(", ")}`}>
      {[mn, (mn + mx) / 2, mx].map((v, i) => (
        <g key={i}>
          <line x1={ml} x2={W - mr} y1={py(v)} y2={py(v)} style={{ stroke: "var(--panel-border)" }} strokeWidth="0.7" />
          <text x={ml - 4} y={py(v) + 3} textAnchor="end" fontSize="9" style={{ fill: "var(--muted)" }}>{n1(v)}</text>
        </g>
      ))}
      <polyline fill="none" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" style={{ stroke: "var(--accent-fat)" }} points={serie.map((p) => `${px(p.fecha)},${py(p.pesoKg)}`).join(" ")} />
      {serie.map((p, i) => (
        <g key={p.fecha}>
          <circle cx={px(p.fecha)} cy={py(p.pesoKg)} r="3.5" style={{ fill: "var(--accent-fat)", stroke: "var(--panel-bg)" }} strokeWidth="1.5"><title>{`${fechaCortaLima(p.fecha)}: ${p.pesoKg} kg`}</title></circle>
          {(serie.length <= 8 || i === 0 || i === serie.length - 1) && <text x={px(p.fecha)} y={py(p.pesoKg) - 8} textAnchor={i === 0 ? "start" : i === serie.length - 1 ? "end" : "middle"} fontSize="9" style={{ fill: "var(--ink)" }}>{`${n1(p.pesoKg)} kg`}</text>}
        </g>
      ))}
      <text x={ml} y={H - 6} fontSize="9" style={{ fill: "var(--muted)" }}>{fechaCortaLima(serie[0].fecha)}</text>
      <text x={W - mr} y={H - 6} textAnchor="end" fontSize="9" style={{ fill: "var(--muted)" }}>{fechaCortaLima(serie[serie.length - 1].fecha)}</text>
    </svg>
  );
}

/* ---------- Pantalla: totales por día ---------- */
function ReporteTotales({ requerimiento, pacienteId, onVolver }) {
  const [periodo, setPeriodo] = useState({ tipo: "semana", valor: 0 });
  const fechas = useMemo(() => fechasDePeriodo(periodo.tipo, periodo.valor), [periodo]);
  const { datos, cargando } = useRegistrosFechas(pacienteId, fechas);
  const res = useMemo(() => datos.map((d) => ({ fecha: d.fecha, ...filasDelDia(d.items), hay: d.items.length > 0 })), [datos]);
  const con = res.filter((d) => d.hay);
  const prom = (k) => (con.length ? con.reduce((s, d) => s + d.totales[k], 0) / con.length : 0);
  const pK = requerimiento.get > 0 ? (prom("kcal") / requerimiento.get) * 100 : 0, pP = requerimiento.proteinasG > 0 ? (prom("proteinasG") / requerimiento.proteinasG) * 100 : 0;
  return (
    <div className="min-h-screen max-w-md mx-auto relative">

/* ---------- Pantalla: detalle por alimento (un día en pantalla; PDF de un día o de varios) ---------- */
function ReporteDetalle({ requerimiento, pacienteId, onVolver }) {
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [fechaSeleccionada, setFechaSeleccionada] = useState(hoyISO());
  const [items, setItems] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [periodoPDF, setPeriodoPDF] = useState({ tipo: "semana", valor: 0 });
  const [exportando, setExportando] = useState(false);

  const hoy = hoyISO();
  const diasSemana = useMemo(() => { const l = getLunes(new Date()); l.setUTCDate(l.getUTCDate() + semanaOffset * 7); return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setUTCDate(d.getUTCDate() + i); return d; }); }, [semanaOffset]);

  useEffect(() => {
    let activo = true;
    setCargando(true);
    obtenerLogFecha(pacienteId, fechaSeleccionada).then((its) => { if (activo) { setItems(its); setCargando(false); } });
    return () => { activo = false; };
  }, [fechaSeleccionada, pacienteId]);

  const { totales, filas } = useMemo(() => filasDelDia(items), [items]);
  const filasPorKcal = useMemo(() => [...filas].sort((a, b) => b.aporteKcal - a.aporteKcal), [filas]);
  const filasPorProteina = useMemo(() => [...filas].sort((a, b) => b.aporteProteina - a.aporteProteina), [filas]);
  const pctMetaKcal = requerimiento.get > 0 ? Math.round((totales.kcal / requerimiento.get) * 100) : 0;
  const pctMetaProteina = requerimiento.proteinasG > 0 ? Math.round((totales.proteinasG / requerimiento.proteinasG) * 100) : 0;

  const exportarVariosDias = async () => {
    setExportando(true);
    try {
      const datos = await Promise.all(fechasDePeriodo(periodoPDF.tipo, periodoPDF.valor).map(async (fecha) => ({ fecha, items: await obtenerLogFecha(pacienteId, fecha) })));
      const dias = datos.filter((d) => d.items.length > 0).map((d) => ({ fecha: d.fecha, ...filasDelDia(d.items) }));
      if (dias.length === 0) { alert("No hay alimentos registrados en ese período."); return; }
      exportarDetallePDF({ dias, requerimiento });
    } finally { setExportando(false); }
  };

  return (
    <div className="min-h-screen max-w-md mx-auto relative">
      <EncabezadoReporte titulo="Detalle por alimento" onVolver={onVolver} />
      <div className="px-5 pt-6 pb-24">
        <p className="text-sm nutri-muted mb-4">Aporte calórico y proteico de cada alimento del día, con su porcentaje sobre el total.</p>

        <div className="flex items-center justify-between mb-2">
          <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text">‹ Semana anterior</button>
          <span className="text-xs nutri-muted">{RANGO_SEMANA(diasSemana[0], diasSemana[6])}</span>
          <button onClick={() => setSemanaOffset((s) => Math.min(s + 1, 0))} disabled={semanaOffset === 0} className="text-xs nutri-brand-text disabled:opacity-30">Semana siguiente ›</button>
        </div>
        <div className="flex gap-1.5 overflow-x-auto pb-1 mb-5" style={{ scrollbarWidth: "none" }}>
          {diasSemana.map((d, i) => {
            const iso = fechaLimaISO(d);
            const futuro = iso > hoy;
            return (
              <button key={i} disabled={futuro} onClick={() => setFechaSeleccionada(iso)} className={`shrink-0 rounded-lg px-2.5 py-1.5 text-center nutri-chip ${iso === fechaSeleccionada ? "nutri-chip-active" : "bg-white nutri-ink"} ${futuro ? "opacity-30" : ""}`}>
                <div className="text-[10px] uppercase">{NOMBRE_DIA_CORTO(d)}</div>
                <div className="text-xs font-medium">{d.toLocaleDateString("es-ES", { day: "numeric", timeZone: "America/Lima" })}</div>

        ) : items.length === 0 ? (
          <p className="text-sm nutri-muted">No hay alimentos registrados en esta fecha.</p>
        ) : (
          <>
            <button onClick={() => exportarDetallePDF({ dias: [{ fecha: fechaSeleccionada, totales, filas: filasPorKcal }], requerimiento })} className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm mb-4 flex items-center justify-center gap-1.5">

/* ---------- Períodos de reporte: día, semana (lun-dom), mes calendario o últimos N días ---------- */
function fechasSemanaCompleta(offset) {
  const l = getLunes(new Date());
  l.setUTCDate(l.getUTCDate() + offset * 7);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setUTCDate(d.getUTCDate() + i); return fechaLimaISO(d); });
}
function fechasDePeriodo(tipo, valor) {
  const hoy = hoyISO();
  let fechas;
  if (tipo === "dia") fechas = [valor];
  else if (tipo === "semana") fechas = fechasSemanaCompleta(valor);
  else if (tipo === "mes") {
    const [y, m] = hoy.split("-").map(Number);
    const base = new Date(Date.UTC(y, m - 1 + valor, 1, 12));
    const yy = base.getUTCFullYear(), mm = base.getUTCMonth();
    const n = new Date(Date.UTC(yy, mm + 1, 0, 12)).getUTCDate();
    fechas = Array.from({ length: n }, (_, i) => fechaLimaISO(new Date(Date.UTC(yy, mm, i + 1, 12))));
  } else fechas = rangoFechasISO(valor);
  return fechas.filter((f) => f <= hoy);
}
function etiquetaPeriodo(tipo, valor) {
  if (tipo === "dia") return fechaCortaLima(valor);
  if (tipo === "semana") { const f = fechasSemanaCompleta(valor); return `${fechaCortaLima(f[0])} al ${fechaCortaLima(f[6])}${valor === 0 ? " (esta semana)" : ""}`; }
  if (tipo === "mes") { const [y, m] = hoyISO().split("-").map(Number); return new Date(Date.UTC(y, m - 1 + valor, 1, 12)).toLocaleDateString("es-ES", { month: "long", year: "numeric", timeZone: "America/Lima" }); }
  return `Últimos ${valor} días`;
}

function useRegistrosFechas(pacienteId, fechas) {
  const clave = fechas.join(",");
  const [datos, setDatos] = useState([]);
  const [cargando, setCargando] = useState(true);
  useEffect(() => {
    let activo = true;
    setCargando(true);
    Promise.all(fechas.map(async (fecha) => ({ fecha, items: await obtenerLogFecha(pacienteId, fecha) })))
      .then((r) => { if (activo) { setDatos(r); setCargando(false); } });
    return () => { activo = false; };
  }, [pacienteId, clave]);
  return { datos, cargando };
}

/* ---------- Resumen de un período y comparación entre dos períodos ---------- */
function resumenPeriodo({ datos, requerimiento, pesos }) {
  const porDia = datos.filter((d) => d.items.length > 0).map((d) => ({ fecha: d.fecha, items: d.items, t: calcularTotalesLog(d.items) }));
  const n = porDia.length;
  const prom = (k) => (n ? porDia.reduce((s, d) => s + d.t[k], 0) / n : 0);
  const promedios = { kcal: prom("kcal"), proteinasG: prom("proteinasG"), carbohidratosG: prom("carbohidratosG"), grasasG: prom("grasasG"), fibraG: prom("fibraG"), sodioMg: prom("sodioMg") };
  const pct = (v, m) => (m > 0 ? (v / m) * 100 : 0);
  const pctMeta = { kcal: pct(promedios.kcal, requerimiento.get), proteinasG: pct(promedios.proteinasG, requerimiento.proteinasG), carbohidratosG: pct(promedios.carbohidratosG, requerimiento.carbohidratosG), grasasG: pct(promedios.grasasG, requerimiento.grasasG), fibraG: pct(promedios.fibraG, requerimiento.fibraG) };
  const get = requerimiento.get;
  const cumplimiento = {
    diasKcalOk: porDia.filter((d) => get > 0 && Math.abs(d.t.kcal - get) / get <= 0.1).length,
    diasProteinaOk: porDia.filter((d) => requerimiento.proteinasG > 0 && d.t.proteinasG >= requerimiento.proteinasG * 0.9).length,
  };
  const mapa = {};
  porDia.forEach((d) => d.items.forEach((it) => {
    const a = calcularTotalesItem(it.alimento, it.gramos);
    if (!mapa[it.alimento.nombre]) mapa[it.alimento.nombre] = { nombre: it.alimento.nombre, gramos: 0, kcal: 0, prot: 0 };
    const x = mapa[it.alimento.nombre];
    x.gramos += it.gramos; x.kcal += a.kcal; x.prot += a.proteinasG;
  }));
  const alimentos = Object.values(mapa).map((x) => ({ ...x, gramosDia: x.gramos / n, kcalDia: x.kcal / n, protDia: x.prot / n }));
  const inicio = datos[0].fecha, fin = datos[datos.length - 1].fecha;
  const serie = (pesos || []).filter((p) => p.fecha >= inicio && p.fecha <= fin).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const peso = { ultimo: serie.length ? serie[serie.length - 1].pesoKg : null, delta: serie.length >= 2 ? serie[serie.length - 1].pesoKg - serie[0].pesoKg : null };
  return { n, total: datos.length, promedios, pctMeta, cumplimiento, alimentos, peso };
}

function filasIndicadores(ra, rb) {
  return [
    { label: "Calorías por día", unidad: "kcal", a: ra.promedios.kcal, b: rb.promedios.kcal },
    { label: "% de la meta calórica", unidad: "%", pct: true, a: ra.pctMeta.kcal, b: rb.pctMeta.kcal },
    { label: "Proteína por día", unidad: "g", dec: true, a: ra.promedios.proteinasG, b: rb.promedios.proteinasG },
    { label: "% de la meta de proteína", unidad: "%", pct: true, a: ra.pctMeta.proteinasG, b: rb.pctMeta.proteinasG },
    { label: "Carbohidratos por día", unidad: "g", dec: true, a: ra.promedios.carbohidratosG, b: rb.promedios.carbohidratosG },
    { label: "Grasas por día", unidad: "g", dec: true, a: ra.promedios.grasasG, b: rb.promedios.grasasG },
    { label: "Fibra por día", unidad: "g", dec: true, a: ra.promedios.fibraG, b: rb.promedios.fibraG },
    { label: "Sodio por día", unidad: "mg", a: ra.promedios.sodioMg, b: rb.promedios.sodioMg },
    { label: "Días con registro", unidad: "", entero: true, a: ra.n, b: rb.n },
    { label: "Días con calorías en ±10% de la meta", unidad: "", entero: true, a: ra.cumplimiento.diasKcalOk, b: rb.cumplimiento.diasKcalOk },
    { label: "Días con proteína >= 90% de la meta", unidad: "", entero: true, a: ra.cumplimiento.diasProteinaOk, b: rb.cumplimiento.diasProteinaOk },
    { label: "Peso al cierre del período", unidad: "kg", dec: true, a: ra.peso.ultimo, b: rb.peso.ultimo },
    { label: "Cambio de peso dentro del período", unidad: "kg", dec: true, a: ra.peso.delta, b: rb.peso.delta },
  ];
}
function difTxt(d, dec) {
  const r = dec ? Math.round(Math.abs(d) * 10) / 10 : Math.round(Math.abs(d));
  return `${r > 0 ? (d > 0 ? "+" : "-") : ""}${dec ? n1(r) : n0(r)}`;
}
function textoValor(v, f) {
  if (v === null || v === undefined) return "-";
  return `${f.dec ? n1(v) : n0(v)}${f.unidad ? (f.pct ? "" : " ") + f.unidad : ""}`;
}
function textoDiferencia(f) {
  if (f.a === null || f.b === null || f.a === undefined || f.b === undefined) return "-";
  const d = f.a - f.b;
  let txt = `${difTxt(d, f.dec)}${f.unidad && !f.pct ? " " + f.unidad : ""}${f.pct ? " pts" : ""}`;
  if (!f.pct && f.b > 0 && Math.round(Math.abs(d)) > 0) txt += ` (${d > 0 ? "+" : "-"}${n0((Math.abs(d) / f.b) * 100)}%)`;
  return txt;
}

function compararAlimentos(ra, rb) {
  const ma = {}, mb = {};
  ra.alimentos.forEach((x) => { ma[x.nombre] = x; });
  rb.alimentos.forEach((x) => { mb[x.nombre] = x; });
  const nombres = Object.keys({ ...ma, ...mb });
  return nombres.map((nombre) => {
    const a = ma[nombre], b = mb[nombre];
    return {
      nombre,
      aKcal: a ? a.kcalDia : 0, bKcal: b ? b.kcalDia : 0,
      aProt: a ? a.protDia : 0, bProt: b ? b.protDia : 0,
      aGr: a ? a.gramosDia : 0, bGr: b ? b.gramosDia : 0,
      nota: a && !b ? "solo en A" : !a && b ? "solo en B" : "",
    };
  });
}

function lecturaRapida(ra, rb, etqA, etqB, comparados) {
  const out = [];
  const sg = (d) => (d > 0 ? "+" : d < 0 ? "-" : "");
  const linea = (nombre, a, b, u, dec) => {
    if (b > 0) { const d = a - b; out.push(`${nombre}: ${dec ? n1(a) : n0(a)} ${u} en A frente a ${dec ? n1(b) : n0(b)} ${u} en B (${sg(d)}${dec ? n1(Math.abs(d)) : n0(Math.abs(d))} ${u}, ${sg(d)}${n0((Math.abs(d) / b) * 100)}%).`); }
  };
  if (ra.n === 0 || rb.n === 0) { out.push(`${ra.n === 0 ? "A" : "B"} no tiene alimentos registrados: la comparación es limitada.`); return out; }
  linea("Calorías por día", ra.promedios.kcal, rb.promedios.kcal, "kcal", false);
  linea("Proteína por día", ra.promedios.proteinasG, rb.promedios.proteinasG, "g", true);
  if (ra.peso.ultimo !== null && rb.peso.ultimo !== null) { const d = ra.peso.ultimo - rb.peso.ultimo; out.push(`Peso al cierre: ${n1(ra.peso.ultimo)} kg en A frente a ${n1(rb.peso.ultimo)} kg en B (${sg(d)}${n1(Math.abs(d))} kg).`); }
  const mas = [...comparados].sort((x, y) => (y.aKcal - y.bKcal) - (x.aKcal - x.bKcal))[0];
  const menos = [...comparados].sort((x, y) => (x.aKcal - x.bKcal) - (y.aKcal - y.bKcal))[0];
  if (mas && mas.aKcal - mas.bKcal > 5) out.push(`Alimento que más aumentó: ${mas.nombre} (+${n0(mas.aKcal - mas.bKcal)} kcal por día${mas.nota ? ", " + mas.nota : ""}).`);
  if (menos && menos.bKcal - menos.aKcal > 5) out.push(`Alimento que más disminuyó: ${menos.nombre} (-${n0(menos.bKcal - menos.aKcal)} kcal por día${menos.nota ? ", " + menos.nota : ""}).`);
  return out;
}

/* ---------- Gráficos de comparación y de peso para PDF ---------- */
function pdfGraficoComparacion(L, { titulo, filas, etiquetaA, etiquetaB }) {
  const { doc } = L;
  L.asegurar(filas.length * 11 + 30); L.seccion(titulo);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.tinta);
  const tA = `A: ${etiquetaA}`, tB = `B: ${etiquetaB}`;
  doc.setFillColor(...COLOR_PDF.azul); doc.rect(L.M, L.y - 2.6, 3, 3, "F"); doc.text(tA, L.M + 4.5, L.y);
  const xB = L.M + 4.5 + doc.getTextWidth(tA) + 8;
  doc.setFillColor(...COLOR_PDF.naranja); doc.rect(xB, L.y - 2.6, 3, 3, "F"); doc.text(tB, xB + 4.5, L.y);
  L.y += 7;
  const x0 = L.M + 38, w = L.ANCHO - 38 - 14, y0 = L.y;
  const max = Math.max(120, ...filas.flatMap((f) => [f.a, f.b])) * 1.05;
  const X = (v) => x0 + (v / max) * w;
  filas.forEach((f, i) => {
    const yy = y0 + i * 11;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.tinta);
    doc.text(f.label, x0 - 2, yy + 5, { align: "right" });
    [[f.a, COLOR_PDF.azul, 0], [f.b, COLOR_PDF.naranja, 4.4]].forEach(([v, c, dy]) => {
      doc.setFillColor(...c); doc.rect(x0, yy + dy, Math.max(X(v) - x0, 0.3), 3.8, "F");
      doc.setFontSize(7); doc.text(pctTxt(v), X(v) + 1.5, yy + dy + 3, { align: "left" });
    });
  });
  doc.setDrawColor(...COLOR_PDF.tinta); doc.setLineWidth(0.3); doc.setLineDashPattern([1.6, 1.2], 0);
  doc.line(X(100), y0 - 2, X(100), y0 + filas.length * 11 - 1); doc.setLineDashPattern([], 0);
  doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.tinta);
  doc.text("100% = meta", X(100), y0 + filas.length * 11 + 2.5, { align: "center" });
  L.y = y0 + filas.length * 11 + 8;
}

function categoriaIMCGeneral(imc) {
  if (!imc) return "";
  if (imc < 18.5) return "Bajo peso";
  if (imc < 25) return "Peso normal";
  if (imc < 30) return "Sobrepeso";
  return "Obesidad";
}
function categoriaIMCPaciente(perfil, imc) {
  if (!imc) return "";
  return perfil.edad >= EDAD_ADULTO_MAYOR ? clasificarIMCAdultoMayor(imc).categoria : categoriaIMCGeneral(imc);
}

/* ---------- PDF: evolución del peso ---------- */
function exportarPesoPDF({ serie, ordenados, perfil, etiqueta }) {
  const L = crearLienzoPDF("NutriApp · Evolución del peso", etiqueta);
  if (!L) return;
  const { M, ANCHO } = L;
  const ultimo = serie[serie.length - 1], primero = serie[0];
  const imc = calcularIMC(ultimo.pesoKg, perfil.tallaCm);
  const delta = serie.length >= 2 ? ultimo.pesoKg - primero.pesoKg : null;
  const deltaPct = delta !== null && primero.pesoKg > 0 ? (delta / primero.pesoKg) * 100 : null;
  const wc = (ANCHO - 6) / 2;
  pdfTarjeta(L, M, wc, "PESO MÁS RECIENTE", `${n1(ultimo.pesoKg)} kg`, `${fechaCortaLima(ultimo.fecha)}${imc ? ` · IMC ${imc.toFixed(1)} (${categoriaIMCPaciente(perfil, imc)})` : ""}`, null, COLOR_PDF.azul);
  pdfTarjeta(L, M + wc + 6, wc, "VARIACIÓN EN EL PERÍODO", delta === null ? "-" : `${delta > 0 ? "+" : ""}${n1(delta)} kg`, delta === null ? "Se necesitan al menos 2 registros" : `${deltaPct > 0 ? "+" : ""}${n1(deltaPct)}% · de ${n1(primero.pesoKg)} kg a ${n1(ultimo.pesoKg)} kg`, null, delta !== null && delta < 0 ? COLOR_PDF.rojo : COLOR_PDF.carb);
  L.y += 36;
  pdfGraficoPeso(L, serie);
  L.seccion("Registros de peso");
  const indice = {}; ordenados.forEach((p, i) => { indice[p.fecha] = i; });
  pdfTabla(L,
    [{ t: "Fecha", w: 50 }, { t: "Peso", w: 40, a: "r" }, { t: "Cambio vs. registro anterior", w: 60, a: "r" }, { t: "IMC", w: 30, a: "r" }],
    [...serie].reverse().map((p) => {
      const prev = ordenados[indice[p.fecha] - 1];
      const d = prev ? p.pesoKg - prev.pesoKg : null;
      const im = calcularIMC(p.pesoKg, perfil.tallaCm);
      return { celdas: [fechaCortaLima(p.fecha), `${n1(p.pesoKg)} kg`, d === null ? "-" : `${d > 0 ? "+" : ""}${n1(d)} kg`, im ? im.toFixed(1) : "-"] };
    }));
  L.nota("Una pérdida involuntaria de peso de 5% o más en 3 meses (o 10% en 6 meses) se considera clínicamente significativa y conviene comentarla con el médico o nutricionista.");
  L.finalizar(`evolucion_peso_${primero.fecha}_a_${ultimo.fecha}.pdf`);
}

/* ---------- PDF: comparación de períodos ---------- */
function exportarComparacionPDF({ ra, rb, etiquetaA, etiquetaB, tipoTxt, comparados, lectura }) {
  const L = crearLienzoPDF("NutriApp · Comparación de períodos", `${tipoTxt}: A frente a B`);
  if (!L) return;
  const { doc, M } = L;
  L.seccion("Períodos comparados");
  [[`A`, etiquetaA, COLOR_PDF.azul, ra], [`B`, etiquetaB, COLOR_PDF.naranja, rb]].forEach(([k, e, c, r]) => {
    doc.setFillColor(...c); doc.roundedRect(M, L.y - 3.4, 6, 5, 1, 1, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(255, 255, 255); doc.text(k, M + 3, L.y + 0.3, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...COLOR_PDF.tinta);
    doc.text(`${e} - ${r.n} de ${r.total} días con registro`, M + 9, L.y); L.y += 6.5;
  });
  L.y += 1;
  if (lectura.length) { L.seccion("Lectura rápida"); lectura.forEach((t) => { doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...COLOR_PDF.tinta); doc.splitTextToSize(t, L.ANCHO - 4).forEach((ln, i) => { L.asegurar(5); doc.text((i === 0 ? "- " : "  ") + ln, M, L.y); L.y += 4.2; }); L.y += 1; }); L.y += 2; }
  L.seccion("Indicadores");
  pdfTabla(L,
    [{ t: "Indicador", w: 72 }, { t: "A", w: 30, a: "r" }, { t: "B", w: 30, a: "r" }, { t: "Diferencia (A - B)", w: 48, a: "r" }],
    filasIndicadores(ra, rb).map((f) => ({ celdas: [f.label, textoValor(f.a, f), textoValor(f.b, f), textoDiferencia(f)] })));
  pdfGraficoComparacion(L, {
    titulo: "Cumplimiento de metas (promedio diario, % de la meta)",
    filas: [{ label: "Calorías", a: ra.pctMeta.kcal, b: rb.pctMeta.kcal }, { label: "Proteína", a: ra.pctMeta.proteinasG, b: rb.pctMeta.proteinasG }, { label: "Carbohidratos", a: ra.pctMeta.carbohidratosG, b: rb.pctMeta.carbohidratosG }, { label: "Grasas", a: ra.pctMeta.grasasG, b: rb.pctMeta.grasasG }, { label: "Fibra", a: ra.pctMeta.fibraG, b: rb.pctMeta.fibraG }],
    etiquetaA, etiquetaB,
  });
  const tabla = (titulo, ka, kb, unidad, dec) => {
    L.seccion(titulo);
    const filas = [...comparados].filter((c) => c[ka] > 0 || c[kb] > 0).sort((x, y) => Math.abs(y[ka] - y[kb]) - Math.abs(x[ka] - x[kb])).slice(0, 25);
    pdfTabla(L,
      [{ t: "Alimento", w: 66 }, { t: `A (${unidad}/día)`, w: 30, a: "r" }, { t: `B (${unidad}/día)`, w: 30, a: "r" }, { t: "Diferencia", w: 28, a: "r" }, { t: "Nota", w: 26 }],
      filas.map((c) => { const d = c[ka] - c[kb]; return { celdas: [c.nombre, dec ? n1(c[ka]) : n0(c[ka]), dec ? n1(c[kb]) : n0(c[kb]), difTxt(d, dec), c.nota] }; }));
  };
  tabla("Calorías por alimento (promedio por día con registro)", "aKcal", "bKcal", "kcal", false);
  tabla("Proteína por alimento (promedio por día con registro)", "aProt", "bProt", "g", true);
  L.nota("Los promedios por alimento se calculan sobre los días con registro de cada período, para que períodos de distinta duración sean comparables.");
  L.finalizar(`comparacion_${tipoTxt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()}_${hoyISO()}.pdf`);
}

/* ---------- Componentes ---------- */
function NavegadorPeriodo({ tipo, valor, onCambio }) {
  return (
    <div className="flex items-center justify-between nutri-panel rounded-lg px-3 py-2">
      <button onClick={() => onCambio(valor - 1)} className="text-base nutri-brand-text px-2" aria-label="Anterior">‹</button>
      <span className="text-xs nutri-ink text-center capitalize">{etiquetaPeriodo(tipo, valor)}</span>
      <button onClick={() => onCambio(Math.min(valor + 1, 0))} disabled={valor >= 0} className="text-base nutri-brand-text px-2 disabled:opacity-30" aria-label="Siguiente">›</button>
    </div>
  );
}

function SelectorPeriodo({ periodo, onCambio, opcionesUltimos = [7, 14, 30] }) {
  const tipos = [["semana", "Semana"], ["mes", "Mes"], ["ultimos", "Últimos días"]];
  return (
    <div className="mb-4">
      <div className="flex gap-1.5 mb-2">
        {tipos.map(([k, l]) => (
          <button key={k} onClick={() => onCambio({ tipo: k, valor: k === "ultimos" ? opcionesUltimos[0] : 0 })} className={`rounded-full px-3 py-1.5 text-xs nutri-chip ${periodo.tipo === k ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{l}</button>
        ))}
      </div>
      {periodo.tipo === "ultimos" ? (
        <div className="flex gap-1.5 flex-wrap">
          {opcionesUltimos.map((o) => (
            <button key={o} onClick={() => onCambio({ tipo: "ultimos", valor: o })} className={`rounded-full px-3 py-1.5 text-xs nutri-chip ${periodo.valor === o ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{o} días</button>
          ))}
        </div>
      ) : (
        <NavegadorPeriodo tipo={periodo.tipo} valor={periodo.valor} onCambio={(v) => onCambio({ tipo: periodo.tipo, valor: v })} />
      )}
    </div>
  );
}

/* Barras horizontales agrupadas A/B (% de la meta). Dos series: leyenda siempre visible y
   rotulada con los períodos; la línea punteada marca el 100% de la meta. */
function GraficoComparacion({ filas, etiquetaA, etiquetaB }) {
  const W = 360, ml = 86, mr = 44, filaH = 36, mt = 34;
  const H = mt + filas.length * filaH + 8;
  const max = Math.max(120, ...filas.flatMap((f) => [f.a, f.b])) * 1.05;
  const iw = W - ml - mr;
  const X = (v) => ml + (v / max) * iw;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={`Comparación de cumplimiento de metas entre A (${etiquetaA}) y B (${etiquetaB})`}>
      <rect x={ml} y="4" width="9" height="9" rx="2" style={{ fill: "var(--accent-fat)" }} />
      <text x={ml + 13} y="12" fontSize="9.5" style={{ fill: "var(--ink)" }}>{`A: ${etiquetaA}`}</text>
      <rect x={ml} y="18" width="9" height="9" rx="2" style={{ fill: "var(--accent-energy)" }} />
      <text x={ml + 13} y="26" fontSize="9.5" style={{ fill: "var(--ink)" }}>{`B: ${etiquetaB}`}</text>
      {filas.map((f, i) => {
        const y = mt + i * filaH;
        return (
          <g key={f.label}>
            <text x={ml - 6} y={y + 17} textAnchor="end" fontSize="10" style={{ fill: "var(--ink)" }}>{f.label}</text>
            <rect x={ml} y={y + 3} width={Math.max(X(f.a) - ml, 1)} height="12" rx="3" style={{ fill: "var(--accent-fat)" }}><title>{`A: ${Math.round(f.a)}%`}</title></rect>
            <text x={X(f.a) + 4} y={y + 13} fontSize="9.5" style={{ fill: "var(--ink)" }}>{`${Math.round(f.a)}%`}</text>
            <rect x={ml} y={y + 18} width={Math.max(X(f.b) - ml, 1)} height="12" rx="3" style={{ fill: "var(--accent-energy)" }}><title>{`B: ${Math.round(f.b)}%`}</title></rect>
            <text x={X(f.b) + 4} y={y + 28} fontSize="9.5" style={{ fill: "var(--ink)" }}>{`${Math.round(f.b)}%`}</text>
          </g>
        );
      })}
      <line x1={X(100)} x2={X(100)} y1={mt - 4} y2={H - 4} strokeDasharray="4 3" strokeWidth="1.2" style={{ stroke: "var(--ink)" }} />
      <text x={X(100)} y={mt - 7} textAnchor="middle" fontSize="9" fontWeight="600" style={{ fill: "var(--ink)" }}>100% = meta</text>
    </svg>
  );
}

/* Interpreta texto pegado con varios pesos, una línea por registro. Acepta fechas AAAA-MM-DD,
   DD/MM/AAAA, DD-MM-AAAA, DD.MM.AAAA (y año de 2 dígitos), separadores espacio, coma, punto y
   coma o tabulación, decimales con punto o coma y unidades kg/lb por línea (si no se indica, se
   usa la unidad elegida). Devuelve las líneas válidas y las que no se pudieron interpretar. */
function fechaCalendarioValida(y, m, d) {
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}
function parsearPesos(texto, unidadPorDefecto) {
  const validos = [], errores = [];
  texto.split(/\r?\n/).forEach((crudo, i) => {
    let linea = crudo.trim();
    if (!linea) return;
    let y, m, d, resto = linea, hallada = false;
    let mt = linea.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (mt) { y = +mt[1]; m = +mt[2]; d = +mt[3]; hallada = true; resto = linea.replace(mt[0], " "); }
    else {
      mt = linea.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})(?!\d)/);
      if (mt) { d = +mt[1]; m = +mt[2]; y = mt[3].length === 2 ? 2000 + +mt[3] : +mt[3]; hallada = true; resto = linea.replace(mt[0], " "); }
    }
    if (!hallada) { errores.push({ n: i + 1, txt: crudo, motivo: "No se encontró una fecha (usa AAAA-MM-DD o DD/MM/AAAA)" }); return; }
    if (!fechaCalendarioValida(y, m, d)) { errores.push({ n: i + 1, txt: crudo, motivo: "La fecha no existe" }); return; }
    const fecha = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const mp = resto.match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|kilos?|lb|lbs|libras?)?/i);
    if (!mp) { errores.push({ n: i + 1, txt: crudo, motivo: "No se encontró el peso" }); return; }
    const num = parseFloat(mp[1].replace(",", "."));
    const u = mp[2] ? (/^l/i.test(mp[2]) ? "lb" : "kg") : unidadPorDefecto;
    const kg = Math.round((u === "lb" ? num * 0.45359237 : num) * 10) / 10;
    if (!(kg >= 20 && kg <= 300)) { errores.push({ n: i + 1, txt: crudo, motivo: `Peso fuera de rango (${n1(kg)} kg; debe estar entre 20 y 300)` }); return; }
    if (fecha > hoyISO()) { errores.push({ n: i + 1, txt: crudo, motivo: "La fecha es futura" }); return; }
    validos.push({ fecha, pesoKg: kg, n: i + 1 });
  });
  // dos líneas con la misma fecha: gana la última
  const ultimo = {}; validos.forEach((v) => { ultimo[v.fecha] = v; });
  return { validos: Object.values(ultimo).sort((a, b) => a.fecha.localeCompare(b.fecha)), errores, repetidos: validos.length - Object.keys(ultimo).length };
}

/* Formulario para registrar un peso: fecha (hoy por defecto, con atajos Hoy/Ayer/Hace 1 semana y
   selector de fecha), unidad kg o lb (se guarda siempre en kg), aviso si ya hay un peso ese día
   (con opción de reemplazar) y carga de varios pesos de una vez. */
function RegistroPeso({ perfil, agregarPeso, importarPesos }) {
  const [unidad, setUnidad] = useState("kg");
  const [fecha, setFecha] = useState(hoyISO());
  const [valor, setValor] = useState("");
  const [msg, setMsg] = useState(null);
  const [conflicto, setConflicto] = useState(null);
  const [masivo, setMasivo] = useState(false);
  const [texto, setTexto] = useState("");
  const [reemplazar, setReemplazar] = useState(false);
  const hoy = hoyISO();
  const num = Number(String(valor).replace(",", "."));
  const kgPrevisto = num > 0 ? Math.round((unidad === "lb" ? num * 0.45359237 : num) * 10) / 10 : null;
  const analisis = useMemo(() => (masivo && texto.trim() ? parsearPesos(texto, unidad) : null), [masivo, texto, unidad]);
  const atajos = [["Hoy", hoy], ["Ayer", fechaISOOffset(1)], ["Hace 1 semana", fechaISOOffset(7)]];

  const registrar = (forzar) => {
    if (!(kgPrevisto > 0)) { setMsg({ tipo: "error", txt: "Ingresa el peso." }); return; }
    const r = agregarPeso(fecha, kgPrevisto, { reemplazar: forzar === true });
    if (r.error) { setMsg({ tipo: "error", txt: r.error }); setConflicto(null); return; }
    if (r.conflicto) { setConflicto({ existente: r.conflicto, pesoKg: kgPrevisto }); setMsg(null); return; }
    setMsg({ tipo: "ok", txt: `✓ ${r.reemplazado ? "Peso reemplazado" : "Peso registrado"}: ${n1(kgPrevisto)} kg el ${fechaCortaLima(fecha)}.` });
    setConflicto(null); setValor(""); setFecha(hoy);
  };
  const importar = () => {
    const r = importarPesos(analisis.validos, reemplazar);
    setMsg({ tipo: "ok", txt: `✓ Importación lista: ${r.agregados} agregado${r.agregados === 1 ? "" : "s"}${r.reemplazados ? `, ${r.reemplazados} reemplazado${r.reemplazados === 1 ? "" : "s"}` : ""}${r.omitidos ? `, ${r.omitidos} omitido${r.omitidos === 1 ? "" : "s"} (ya existía un peso ese día)` : ""}.` });
    setTexto(""); setMasivo(false);
  };

  return (
    <div className="mb-2">
      <div className="flex items-center gap-1.5 mb-2">
        <span className="text-xs nutri-muted mr-1">Unidad</span>
        {["kg", "lb"].map((u) => (
          <button key={u} onClick={() => setUnidad(u)} className={`rounded-full px-3 py-1 text-xs nutri-chip ${unidad === u ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{u}</button>
        ))}
      </div>
      <div className="flex gap-1.5 flex-wrap mb-2">
        {atajos.map(([l, f]) => (
          <button key={l} onClick={() => { setFecha(f); setConflicto(null); }} className={`rounded-full px-3 py-1 text-xs nutri-chip ${fecha === f ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{l}</button>
        ))}
      </div>
      <div className="flex gap-2 mb-1">
        <input type="date" max={hoy} value={fecha} onChange={(e) => { if (e.target.value) { setFecha(e.target.value); setConflicto(null); } }} aria-label="Fecha del peso" className="flex-1 min-w-0 rounded-lg nutri-chip px-2 py-2 text-sm bg-white nutri-ink" />
        <input type="number" step="0.1" inputMode="decimal" value={valor} onChange={(e) => { setValor(e.target.value); setConflicto(null); }} onFocus={(e) => e.target.select()} placeholder={`Peso (${unidad})`} aria-label={`Peso en ${unidad}`} className="w-28 rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink text-right" />
        <button onClick={() => registrar(false)} disabled={!valor} className="nutri-brand text-white rounded-lg px-4 text-sm disabled:opacity-40">Registrar</button>
      </div>
      <p className="text-[11px] nutri-muted mb-1">{fecha === hoy ? "Se registrará con la fecha de hoy." : `Se registrará con la fecha ${fechaCortaLima(fecha)}.`}{unidad === "lb" && kgPrevisto ? ` Equivale a ${n1(kgPrevisto)} kg.` : ""} Peso actual: {n1(perfil.pesoKg)} kg.</p>
      {conflicto && (
        <div className="nutri-panel rounded-lg p-3 my-2">
          <p className="text-xs nutri-ink mb-2">Ya hay un peso de <b>{n1(conflicto.existente.pesoKg)} kg</b> el {fechaCortaLima(conflicto.existente.fecha)}. ¿Reemplazarlo por <b>{n1(conflicto.pesoKg)} kg</b>?</p>
          <div className="flex gap-2">
            <button onClick={() => registrar(true)} className="flex-1 nutri-brand text-white rounded-lg py-1.5 text-xs">Reemplazar</button>
            <button onClick={() => setConflicto(null)} className="flex-1 nutri-chip nutri-ink rounded-lg py-1.5 text-xs">Cancelar</button>
          </div>
        </div>
      )}
      {msg && <p className={`text-xs my-1 ${msg.tipo === "error" ? "nutri-warn" : ""}`} style={msg.tipo === "ok" ? { color: "var(--st-meta)" } : undefined}>{msg.txt}</p>}

      <button onClick={() => setMasivo((v) => !v)} className="text-xs nutri-brand-text underline mt-1">{masivo ? "Ocultar carga de varios pesos" : "Cargar varios pesos de una vez"}</button>
      {masivo && (
        <div className="nutri-panel rounded-lg p-3 mt-2">
          <p className="text-[11px] nutri-muted mb-2">Una línea por peso, con fecha y peso. Ejemplos: <span className="nutri-ink">2026-09-01 52.4</span> · <span className="nutri-ink">01/09/2026, 52,4 kg</span> · <span className="nutri-ink">1-9-26 115 lb</span>. Se usa la unidad elegida arriba si la línea no la indica.</p>
          <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={5} placeholder={"2026-09-01 52.4\n08/09/2026 52.0\n15-09-2026 51.8 kg"} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
          <label className="flex items-center gap-2 text-xs nutri-ink my-2"><input type="checkbox" checked={reemplazar} onChange={(e) => setReemplazar(e.target.checked)} /> Reemplazar si ya hay un peso en esa fecha</label>
          {analisis && (
            <div className="text-xs mb-2">
              <p className="nutri-ink">{analisis.validos.length} peso{analisis.validos.length === 1 ? "" : "s"} válido{analisis.validos.length === 1 ? "" : "s"}{analisis.repetidos ? ` (${analisis.repetidos} línea${analisis.repetidos === 1 ? "" : "s"} repetida${analisis.repetidos === 1 ? "" : "s"} de un mismo día: se usa la última)` : ""}{analisis.errores.length ? ` · ${analisis.errores.length} con error` : ""}</p>
              {analisis.errores.map((e) => <p key={e.n} className="nutri-warn">Línea {e.n}: {e.motivo}</p>)}
            </div>
          )}
          <button onClick={importar} disabled={!analisis || analisis.validos.length === 0} className="w-full nutri-brand text-white rounded-lg py-2 text-sm disabled:opacity-40">{analisis && analisis.validos.length ? `Importar ${analisis.validos.length} peso${analisis.validos.length === 1 ? "" : "s"}` : "Importar"}</button>
        </div>
      )}
    </div>
  );
}

/* Fila de un peso registrado con acciones para corregirlo (valor y/o fecha) o eliminarlo.
   Se usa en el Panel y en el reporte de evolución del peso. onCorregir devuelve un texto de
   error (por ejemplo, fecha duplicada) o null si se guardó. */
function FilaPesoCorregible({ p, delta, onCorregir, onEliminar, plantilla = "1.4fr 1fr 1.2fr auto" }) {
  const [editando, setEditando] = useState(false);
  const [peso, setPeso] = useState(String(p.pesoKg));
  const [fecha, setFecha] = useState(p.fecha);
  const [error, setError] = useState("");
  const borde = { borderBottom: "1px solid var(--panel-border)" };
  const iniciar = () => { setPeso(String(p.pesoKg)); setFecha(p.fecha); setError(""); setEditando(true); };
  const guardar = () => {
    const v = Number(String(peso).replace(",", "."));
    if (!(v >= 20 && v <= 300)) { setError("Ingresa un peso entre 20 y 300 kg."); return; }
    if (!fecha || fecha > hoyISO()) { setError("La fecha no puede estar vacía ni ser futura."); return; }
    const err = onCorregir(p.fecha, { pesoKg: Math.round(v * 10) / 10, fecha });
    if (err) setError(err); else setEditando(false);
  };
  const eliminar = () => { if (window.confirm(`¿Eliminar el peso de ${n1(p.pesoKg)} kg del ${fechaCortaLima(p.fecha)}? Esta acción no se puede deshacer.`)) onEliminar(p.fecha); };
  if (editando) {
    return (
      <div className="py-2" style={borde}>
        <div className="flex gap-2 mb-2">
          <input type="date" max={hoyISO()} value={fecha} onChange={(e) => setFecha(e.target.value)} className="flex-1 rounded-lg nutri-chip px-2 py-1.5 text-xs bg-white nutri-ink" />
          <input type="number" step="0.1" value={peso} onChange={(e) => setPeso(e.target.value)} onFocus={(e) => e.target.select()} className="w-24 rounded-lg nutri-chip px-2 py-1.5 text-xs bg-white nutri-ink text-right" aria-label="Peso en kg" />
          <span className="self-center text-xs nutri-muted">kg</span>
        </div>
        {error && <p className="text-[11px] nutri-warn mb-2">{error}</p>}
        <div className="flex gap-2">
          <button onClick={guardar} className="flex-1 nutri-brand text-white rounded-lg py-1.5 text-xs">Guardar</button>
          <button onClick={() => setEditando(false)} className="flex-1 nutri-chip nutri-ink rounded-lg py-1.5 text-xs">Cancelar</button>
        </div>
      </div>
    );
  }
  return (
    <div className="grid items-center text-xs py-1.5" style={{ gridTemplateColumns: plantilla, ...borde }}>
      <span className="nutri-ink capitalize">{fechaCortaLima(p.fecha)}</span>
      <span className="text-right nutri-ink font-medium">{n1(p.pesoKg)} kg</span>
      <span className={`text-right ${delta === null ? "nutri-muted" : delta < 0 ? "nutri-warn" : "nutri-ink"}`}>{delta === null ? "-" : `${delta > 0 ? "+" : ""}${n1(delta)} kg`}</span>
      <span className="flex items-center gap-3 pl-3">
        <button onClick={iniciar} title="Corregir" aria-label="Corregir peso" className="nutri-brand-text"><IconEdit size={14} /></button>
        <button onClick={eliminar} title="Eliminar" aria-label="Eliminar peso" className="nutri-warn"><IconTrash size={14} /></button>
      </span>
    </div>
  );
}

/* ---------- Pantalla: evolución del peso ---------- */
function ReportePeso({ perfil, pesos, agregarPeso, importarPesos, corregirPeso, eliminarPeso, onVolver }) {
  const [rango, setRango] = useState("todo");
  const [agregando, setAgregando] = useState(false);
  const opciones = [["1m", "1 mes", 30], ["3m", "3 meses", 90], ["6m", "6 meses", 180], ["todo", "Todo", null]];
  const dias = opciones.find((o) => o[0] === rango)[2];
  const ordenados = useMemo(() => [...pesos].sort((a, b) => a.fecha.localeCompare(b.fecha)), [pesos]);
  const desde = dias ? fechaISOOffset(dias) : null;
  const serie = useMemo(() => (desde ? ordenados.filter((p) => p.fecha >= desde) : ordenados), [ordenados, desde]);
  const etiqueta = rango === "todo" ? "Todo el historial" : `Últimos ${opciones.find((o) => o[0] === rango)[1]}`;

  const ultimo = serie[serie.length - 1], primero = serie[0];
  const delta = serie.length >= 2 ? ultimo.pesoKg - primero.pesoKg : null;
  const deltaPct = delta !== null && primero.pesoKg > 0 ? (delta / primero.pesoKg) * 100 : null;
  const diasEntre = serie.length >= 2 ? Math.max((new Date(ultimo.fecha) - new Date(primero.fecha)) / DIAS_EN_MS, 1) : null;
  const ritmo = delta !== null && diasEntre >= 7 ? delta / (diasEntre / 7) : null;
  const imc = ultimo ? calcularIMC(ultimo.pesoKg, perfil.tallaCm) : null;
  const indice = {}; ordenados.forEach((p, i) => { indice[p.fecha] = i; });

  return (
    <div className="min-h-screen max-w-md mx-auto relative">
      <EncabezadoReporte titulo="Evolución del peso" onVolver={onVolver} />
      <div className="px-5 pt-6 pb-24">
        <p className="text-sm nutri-muted mb-3">Todos los pesos registrados y cómo han cambiado en el tiempo.</p>
        <div className="nutri-panel rounded-2xl p-4 mb-4">
          <button onClick={() => setAgregando((v) => !v)} className="w-full flex items-center justify-between text-sm font-medium nutri-ink"><span>Agregar un peso (hoy o de una fecha pasada)</span><span className="nutri-brand-text">{agregando || pesos.length === 0 ? "−" : "+"}</span></button>
          {(agregando || pesos.length === 0) && <div className="mt-3"><RegistroPeso perfil={perfil} agregarPeso={agregarPeso} importarPesos={importarPesos} /></div>}
        </div>
        <div className="flex gap-1.5 flex-wrap mb-4">
          {opciones.map(([k, l]) => (
            <button key={k} onClick={() => setRango(k)} className={`rounded-full px-3 py-1.5 text-xs nutri-chip ${rango === k ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{l}</button>
          ))}
        </div>
        {serie.length === 0 ? (
          <p className="text-sm nutri-muted">{ordenados.length === 0 ? "Aún no hay pesos registrados. Registra el peso cada semana en el Panel." : "No hay pesos registrados en este período. Prueba con un rango más amplio."}</p>
        ) : (
          <>
            <button onClick={() => exportarPesoPDF({ serie, ordenados, perfil, etiqueta })} className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm mb-4 flex items-center justify-center gap-1.5"><IconReporte size={16} /> Exportar a PDF</button>
            <div className="grid grid-cols-2 gap-3 mb-5">
              <div className="nutri-panel rounded-2xl p-4 text-center">
                <div className="text-[11px] nutri-muted">Peso más reciente</div>
                <div className="nutri-serif text-2xl nutri-ink">{n1(ultimo.pesoKg)} kg</div>
                <div className="text-[11px] nutri-muted">{fechaCortaLima(ultimo.fecha)}{imc ? ` · IMC ${imc.toFixed(1)}` : ""}</div>
                {imc ? <div className="text-[11px] nutri-muted">{categoriaIMCPaciente(perfil, imc)}</div> : null}
              </div>
              <div className="nutri-panel rounded-2xl p-4 text-center">
                <div className="text-[11px] nutri-muted">Variación en el período</div>
                <div className={`nutri-serif text-2xl ${delta !== null && delta < 0 ? "nutri-warn" : "nutri-ink"}`}>{delta === null ? "-" : `${delta > 0 ? "+" : ""}${n1(delta)} kg`}</div>
                <div className="text-[11px] nutri-muted">{delta === null ? "Se necesitan 2 registros" : `${deltaPct > 0 ? "+" : ""}${n1(deltaPct)}%`}{ritmo !== null ? ` · ${ritmo > 0 ? "+" : ""}${n1(ritmo)} kg/sem` : ""}</div>
              </div>
            </div>
            {deltaPct !== null && deltaPct <= -5 && <p className="text-xs nutri-warn mb-4">Pérdida de {n1(Math.abs(deltaPct))}% en el período: clínicamente significativa. Conviene comentarla con el médico o nutricionista.</p>}
            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <span className="text-sm font-medium nutri-ink block mb-2">Evolución</span>
              {serie.length >= 2 ? <GraficoPeso serie={serie} /> : <p className="text-xs nutri-muted">Con un solo registro aún no hay tendencia. Registra el peso otra vez la próxima semana.</p>}
            </div>
            <div className="nutri-panel rounded-2xl p-4">
              <span className="text-sm font-medium nutri-ink block mb-2">Registros ({serie.length})</span>
              <p className="text-[11px] nutri-muted mb-2">Si un peso está mal, corrígelo con el lápiz o elimínalo con la papelera.</p>
              <div className="grid text-[11px] nutri-muted pb-1" style={{ gridTemplateColumns: "1.4fr 1fr 1.2fr auto", borderBottom: "1px solid var(--panel-border)" }}><span>Fecha</span><span className="text-right">Peso</span><span className="text-right">Cambio</span><span className="pl-3" style={{ minWidth: 50 }}></span></div>
              {[...serie].reverse().map((p) => {
                const prev = ordenados[indice[p.fecha] - 1];
                return <FilaPesoCorregible key={p.fecha} p={p} delta={prev ? p.pesoKg - prev.pesoKg : null} onCorregir={corregirPeso} onEliminar={eliminarPeso} />;
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------- Pantalla: comparar períodos ---------- */
function ReporteComparar({ requerimiento, pacienteId, pesos, onVolver }) {
  const [tipo, setTipo] = useState("semana");
  const [valA, setValA] = useState(0);
  const [valB, setValB] = useState(-1);
  const cambiarTipo = (t) => { setTipo(t); if (t === "dia") { setValA(hoyISO()); setValB(fechaISOOffset(1)); } else { setValA(0); setValB(-1); } };
  const fechasA = useMemo(() => fechasDePeriodo(tipo, valA), [tipo, valA]);
  const fechasB = useMemo(() => fechasDePeriodo(tipo, valB), [tipo, valB]);
  const A = useRegistrosFechas(pacienteId, fechasA);
  const B = useRegistrosFechas(pacienteId, fechasB);
  const cargando = A.cargando || B.cargando || A.datos.length === 0 || B.datos.length === 0;
  const ra = useMemo(() => (A.datos.length ? resumenPeriodo({ datos: A.datos, requerimiento, pesos }) : null), [A.datos, requerimiento, pesos]);
  const rb = useMemo(() => (B.datos.length ? resumenPeriodo({ datos: B.datos, requerimiento, pesos }) : null), [B.datos, requerimiento, pesos]);
  const etiquetaA = etiquetaPeriodo(tipo, valA), etiquetaB = etiquetaPeriodo(tipo, valB);
  const tipoTxt = tipo === "dia" ? "Días" : tipo === "semana" ? "Semanas" : "Meses";
  const comparados = useMemo(() => (ra && rb ? compararAlimentos(ra, rb) : []), [ra, rb]);
  const lectura = useMemo(() => (ra && rb ? lecturaRapida(ra, rb, etiquetaA, etiquetaB, comparados) : []), [ra, rb, comparados]);
  const hoy = hoyISO();
  const selector = (letra, color, val, setVal) => (
    <div className="nutri-panel rounded-xl p-3 mb-2">
      <div className="flex items-center gap-2 mb-2"><span className="text-[11px] font-semibold text-white rounded px-1.5 py-0.5" style={{ background: color }}>{letra}</span><span className="text-xs nutri-muted">Período {letra}</span></div>
      {tipo === "dia"
        ? <input type="date" max={hoy} value={val} onChange={(e) => { if (e.target.value) setVal(e.target.value); }} className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
        : <NavegadorPeriodo tipo={tipo} valor={val} onCambio={setVal} />}
    </div>
  );
  const topAlimentos = (ka, kb) => [...comparados].filter((c) => c[ka] > 0 || c[kb] > 0).sort((x, y) => Math.abs(y[ka] - y[kb]) - Math.abs(x[ka] - x[kb])).slice(0, 12);
  const tablaAlimentos = (titulo, ka, kb, unidad, dec) => (
    <div className="nutri-panel rounded-2xl p-4 mb-5">
      <span className="text-sm font-medium nutri-ink block mb-1">{titulo}</span>
      <p className="text-[11px] nutri-muted mb-2">Promedio por día con registro ({unidad}/día). Se muestran los 12 con más diferencia.</p>
      <div className="grid text-[11px] nutri-muted pb-1" style={{ gridTemplateColumns: "1.6fr 0.8fr 0.8fr 0.9fr", borderBottom: "1px solid var(--panel-border)" }}><span>Alimento</span><span className="text-right">A</span><span className="text-right">B</span><span className="text-right">Dif.</span></div>
      {topAlimentos(ka, kb).map((c) => {
        const d = c[ka] - c[kb];
        return (
          <div key={c.nombre} className="grid text-xs py-1.5" style={{ gridTemplateColumns: "1.6fr 0.8fr 0.8fr 0.9fr", borderBottom: "1px solid var(--panel-border)" }}>
            <span className="nutri-ink">{c.nombre}{c.nota ? <span className="block text-[10px] nutri-muted">{c.nota}</span> : null}</span>
            <span className="text-right nutri-ink">{dec ? n1(c[ka]) : n0(c[ka])}</span>
            <span className="text-right nutri-ink">{dec ? n1(c[kb]) : n0(c[kb])}</span>
            <span className="text-right nutri-muted">{difTxt(d, dec)}</span>
          </div>
        );
      })}
    </div>
  );

  return (
    <div className="min-h-screen max-w-md mx-auto relative">
      <EncabezadoReporte titulo="Comparar períodos" onVolver={onVolver} />
      <div className="px-5 pt-6 pb-24">
        <p className="text-sm nutri-muted mb-3">Compara dos días, dos semanas o dos meses: indicadores y detalle de los alimentos.</p>
        <div className="flex gap-1.5 mb-3">
          {[["dia", "Días"], ["semana", "Semanas"], ["mes", "Meses"]].map(([k, l]) => (
            <button key={k} onClick={() => cambiarTipo(k)} className={`rounded-full px-3 py-1.5 text-xs nutri-chip ${tipo === k ? "nutri-chip-active" : "bg-white nutri-ink"}`}>{l}</button>
          ))}
        </div>
        {selector("A", "var(--accent-fat)", valA, setValA)}
        {selector("B", "var(--accent-energy)", valB, setValB)}
        {cargando || !ra || !rb ? <p className="text-sm nutri-muted mt-3">Cargando...</p> : (ra.n === 0 && rb.n === 0) ? <p className="text-sm nutri-muted mt-3">Ninguno de los dos períodos tiene alimentos registrados.</p> : (
          <>
            <button onClick={() => exportarComparacionPDF({ ra, rb, etiquetaA, etiquetaB, tipoTxt, comparados, lectura })} className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm my-4 flex items-center justify-center gap-1.5"><IconReporte size={16} /> Exportar a PDF</button>

            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <span className="text-sm font-medium nutri-ink block mb-2">Lectura rápida</span>
              <ul className="space-y-1.5">{lectura.map((t, i) => <li key={i} className="text-xs nutri-ink">- {t}</li>)}</ul>
            </div>

            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <span className="text-sm font-medium nutri-ink block mb-1">Cumplimiento de metas</span>
              <GraficoComparacion etiquetaA={etiquetaA} etiquetaB={etiquetaB} filas={[
                { label: "Calorías", a: ra.pctMeta.kcal, b: rb.pctMeta.kcal }, { label: "Proteína", a: ra.pctMeta.proteinasG, b: rb.pctMeta.proteinasG },
                { label: "Carbohidratos", a: ra.pctMeta.carbohidratosG, b: rb.pctMeta.carbohidratosG }, { label: "Grasas", a: ra.pctMeta.grasasG, b: rb.pctMeta.grasasG }, { label: "Fibra", a: ra.pctMeta.fibraG, b: rb.pctMeta.fibraG },
              ]} />
            </div>

            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <span className="text-sm font-medium nutri-ink block mb-2">Indicadores</span>
              <div className="grid text-[11px] nutri-muted pb-1" style={{ gridTemplateColumns: "1.5fr 0.8fr 0.8fr 1fr", borderBottom: "1px solid var(--panel-border)" }}><span>Indicador</span><span className="text-right">A</span><span className="text-right">B</span><span className="text-right">Dif.</span></div>
              {filasIndicadores(ra, rb).map((f) => (
                <div key={f.label} className="grid text-xs py-1.5" style={{ gridTemplateColumns: "1.5fr 0.8fr 0.8fr 1fr", borderBottom: "1px solid var(--panel-border)" }}>
                  <span className="nutri-ink">{f.label}</span>
                  <span className="text-right nutri-ink">{textoValor(f.a, f)}</span>
                  <span className="text-right nutri-ink">{textoValor(f.b, f)}</span>
                  <span className="text-right nutri-muted">{textoDiferencia(f)}</span>
                </div>
              ))}
            </div>

            {tablaAlimentos("Calorías por alimento", "aKcal", "bKcal", "kcal", false)}
            {tablaAlimentos("Proteína por alimento", "aProt", "bProt", "g", true)}
          </>
        )}
      </div>
    </div>
  );
}

/* ===================================================================================
   Panel didáctico (2026-10-23): un cuadro por cada valor que se mide, con una barra que
   compara "lo que comiste" con "tu meta" (banderita), una frase en lenguaje simple y las
   sugerencias de ese mismo nutriente dentro del cuadro. Así cada nutriente aparece una sola vez.
   =================================================================================== */
const NUTRI_PANEL = [
  { key: "kcal", clave: "calorias", label: "Calorías", art: "tus calorías", unidad: "kcal", meta: (r) => r.get, tipo: "rango", tol: 0.1, color: "var(--accent-energy)" },
  { key: "proteinasG", clave: "proteina", label: "Proteína", art: "tu proteína", unidad: "g", meta: (r) => r.proteinasG, tipo: "minimo", min: 0.9, color: "var(--accent-protein)", para: "mantener y reparar tus músculos" },
  { key: "carbohidratosG", clave: "carbohidratos", label: "Carbohidratos", art: "tus carbohidratos", unidad: "g", meta: (r) => r.carbohidratosG, tipo: "rango", tol: 0.15, color: "var(--accent-carb)", para: "tener energía durante el día" },
  { key: "grasasG", clave: "grasas", label: "Grasas", art: "tus grasas", unidad: "g", meta: (r) => r.grasasG, tipo: "rango", tol: 0.15, color: "var(--accent-fat)", para: "tus hormonas y absorber vitaminas" },
  { key: "fibraG", clave: "fibra", label: "Fibra", art: "tu fibra", unidad: "g", meta: (r) => r.fibraG, tipo: "minimo", min: 0.85, color: "var(--accent-fiber)", para: "una buena digestión" },
  { key: "sodioMg", clave: "sodio", label: "Sodio", art: "tu sodio", unidad: "mg", meta: (r) => r.sodioMg, tipo: "maximo", color: "var(--accent)", para: "cuidar tu presión (es un límite, no una meta)" },
];
function estadoNutriente(n, valor, meta) {
  if (!(meta > 0)) return "cero";
  if (!(valor > 0)) return n.tipo === "maximo" ? "meta" : "cero";
  const p = valor / meta;
  if (n.tipo === "maximo") return p > 1 ? "exceso" : "meta";
  if (n.tipo === "minimo") return p < n.min ? "bajo" : "meta";
  return p > 1 + n.tol ? "exceso" : p < 1 - n.tol ? "bajo" : "meta";
}
const fmtN = (v) => Math.round(v).toLocaleString("es-PE");
/* Fracción en palabras para que el % se entienda sin pensar */
const fraccionEnPalabras = (p) => p < 0.2 ? "muy poco" : p < 0.4 ? "como un tercio" : p < 0.6 ? "como la mitad" : p < 0.8 ? "como dos tercios" : "casi todo";
function fraseNutriente(n, valor, meta, est, cuando) {
  const u = n.unidad, ayer = cuando === "ayer";
  if (est === "cero") return ayer ? `Ayer no registraste ${n.label.toLowerCase()}.` : `Aún no registras alimentos con ${n.label.toLowerCase()} hoy.`;
  if (n.tipo === "maximo") return est === "exceso"
    ? `${ayer ? "Comiste" : "Llevas"} ${fmtN(valor)} ${u} y tu límite es ${fmtN(meta)} ${u}: ${ayer ? "te pasaste" : "ya pasaste"} ${fmtN(valor - meta)} ${u}.`
    : `${ayer ? "Comiste" : "Llevas"} ${fmtN(valor)} ${u} de un máximo de ${fmtN(meta)} ${u}. ${ayer ? "Bien, no pasaste" : "Aún te quedan " + fmtN(meta - valor) + " " + u + " antes de"} el límite.`;
  if (est === "bajo") return `${ayer ? "Comiste" : "Llevas"} ${fmtN(valor)} ${u} de los ${fmtN(meta)} ${u} que necesitas: ${fraccionEnPalabras(valor / meta)}. ${ayer ? "Te faltaron" : "Te faltan"} ${fmtN(meta - valor)} ${u}.`;
  if (est === "exceso") return `${ayer ? "Comiste" : "Llevas"} ${fmtN(valor)} ${u} y tu meta era ${fmtN(meta)} ${u}: ${ayer ? "te pasaste" : "ya pasaste"} ${fmtN(valor - meta)} ${u} (${Math.round((valor / meta - 1) * 100)} % más).`;
  return `¡Bien! ${ayer ? "Comiste" : "Llevas"} ${fmtN(valor)} ${u}, dentro de tu meta de ${fmtN(meta)} ${u}.`;
}
const CHIP_ESTADO = { cero: "Sin datos", bajo: "Faltó", meta: "✓ En tu meta", exceso: "Te pasaste" };
const CHIP_ESTADO_HOY = { cero: "Aún nada", bajo: "Te falta", meta: "✓ En tu meta", exceso: "Te pasaste" };

/* Barra con banderita: el relleno es lo que comiste, la banderita es tu meta (o tu límite) */
function BarraMeta({ valor, meta, unidad, est, tipo, retraso = 0 }) {
  const [listo, setListo] = useState(false);
  useEffect(() => { const t = setTimeout(() => setListo(true), 80 + retraso); return () => clearTimeout(t); }, [retraso]);
  const tope = Math.max(valor, meta) * 1.12 || 1;
  const pv = Math.min(1, valor / tope), pm = meta / tope;
  const color = est === "cero" ? "var(--border)" : COLOR_ESTADO[est];
  return (
    <div className="pn-barra" role="img" aria-label={`${fmtN(valor)} ${unidad} de ${fmtN(meta)} ${unidad}`}>
      <div className="pista">
        <i className="relleno" style={{ width: listo ? `${pv * 100}%` : 0, background: color }} />
        {valor > meta && <i className="sobra" style={{ left: `${pm * 100}%`, width: listo ? `${(pv - pm) * 100}%` : 0 }} />}
        <span className="bandera" style={{ left: `${pm * 100}%` }}><b /></span>
      </div>
      <div className="marcas">
        <span style={{ color }}><b className="num-u">{fmtN(listo ? valor : 0)}</b> {unidad}{tipo !== "maximo" && meta > 0 && <em className="pct"> · {Math.round(valor / meta * 100)} % de tu meta</em>}</span>
        <span className="meta">⚑ {tipo === "maximo" ? "límite" : "meta"} <b className="num-u">{fmtN(meta)}</b></span>
      </div>
    </div>
  );
}

/* Alimentos sugeridos como fichas con su ícono y gramos */
function FichasAlimentos({ opciones }) {
  if (!opciones || !opciones.length) return null;
  return (
    <div className="pn-fichas">
      {opciones.map((o, i) => (
        <span key={i} className={`pn-ficha ${o.habitual ? "habitual" : ""}`} style={{ animationDelay: `${i * 60}ms` }}>
          <IconoAlimento alimento={o.alimento || { nombre: o.nombre }} size={26} />
          <span><b className="num-u">{o.gramos} g</b>{nombreCortoPanel(o.nombre)}{o.habitual && <em>★ lo sueles comer</em>}</span>
        </span>
      ))}
    </div>
  );
}
const nombreCortoPanel = (n) => n.replace(/\s*\(.*?\)\s*/g, " ").trim();

/* En qué comida se originó: 4 columnitas, se resalta la más baja (o la más alta si te pasaste) */
function AporteComidas({ porMomento, n, resaltar }) {
  const vals = MOMENTOS_KEYS.map((m) => (porMomento[m] || {})[n.key] || 0);
  const max = Math.max(...vals, 1);
  const objetivo = resaltar === "max" ? Math.max(...vals) : Math.min(...vals);
  const idx = vals.indexOf(objetivo);
  return (
    <div className="pn-comidas">
      <span className="tt">{resaltar === "max" ? "¿Dónde se pasó?" : "¿Dónde faltó?"}</span>
      <div className="cols">
        {MOMENTOS_KEYS.map((m, i) => (
          <span key={m} className={`col ${i === idx ? "on" : ""}`}>
            <span className="v num-u">{fmtN(vals[i])}</span>
            <span className="pal"><i style={{ height: `${Math.max(6, (vals[i] / max) * 100)}%` }} /></span>
            <span className="m">{MOMENTO_EMOJI[m]} {MOMENTO_LABEL_CAPITALIZADO[m].slice(0, 4)}.</span>
          </span>
        ))}
      </div>
    </div>
  );
}

/* Un cuadro por nutriente */
function CuadroNutriente({ n, valor, meta, cuando, i = 0, opciones, notas, porMomento, log, abierto, onAbrir }) {
  const est = estadoNutriente(n, valor, meta);
  const chips = cuando === "ayer" ? CHIP_ESTADO : CHIP_ESTADO_HOY;
  return (
    <div className={`pn-cuadro est-${est}`} style={{ "--n": n.color, animationDelay: `${i * 70}ms` }}>
      <div className="cab">
        <span className="ico"><IconoAlimento clave={n.clave} size={30} /></span>
        <span className="tit"><b>{n.label}</b>{n.para && <small>Sirve para {n.para}</small>}</span>
        <span className="chip">{chips[est]}</span>
      </div>
      <BarraMeta valor={valor} meta={meta} unidad={n.unidad} est={est} tipo={n.tipo} retraso={i * 90} />
      <p className="frase">{fraseNutriente(n, valor, meta, est, cuando)}</p>
      {porMomento && (est === "bajo" || est === "exceso") && <AporteComidas porMomento={porMomento} n={n} resaltar={est === "exceso" ? "max" : "min"} />}
      {(notas || []).map((t, k) => <p key={k} className="nota">💡 {t}</p>)}
      {opciones && opciones.length > 0 && <>
        <p className="sub">{cuando === "ayer" ? "Hoy puedes compensarlo con una de estas:" : "Para completarlo hoy, elige una de estas:"}</p>
        <FichasAlimentos opciones={opciones} />
      </>}
      {log && valor > 0 && <button type="button" className="ver" onClick={onAbrir}>{abierto ? "Ocultar de dónde vino ▴" : "Ver de dónde vino ▾"}</button>}
      {abierto && log && <CuadroNutrienteDetalle n={n} log={log} />}
    </div>
  );
}

/* "Así te fue ayer": puntaje + un cuadro por nutriente (los que faltaron o se pasaron, completos;
   los cumplidos, como fichas pequeñas con ✓) */
function AlertaInicioDia({ requerimiento }) {
  const [analisis, setAnalisis] = useState(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const hoy = hoyISO();
    let yaVista = null;
    try { yaVista = localStorage.getItem("nutriapp_alerta_vista"); } catch {}
    if (yaVista === hoy) return;
    const a = analizarDiaAnterior(requerimiento);
    if (a) { setAnalisis(a); setVisible(true); }
  }, []);
  if (!visible || !analisis) return null;
  const cerrar = () => { try { localStorage.setItem("nutriapp_alerta_vista", hoyISO()); } catch {} setVisible(false); };
  const filas = NUTRI_PANEL.map((n) => { const valor = analisis.totales[n.key] || 0, meta = n.meta(requerimiento) || 0; return { n, valor, meta, est: estadoNutriente(n, valor, meta) }; });
  const ok = filas.filter((f) => f.est === "meta"), mal = filas.filter((f) => f.est === "bajo" || f.est === "exceso");
  const puntaje = ok.length / filas.length;
  const fechaTxt = new Date(analisis.fecha + "T12:00:00Z").toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long", timeZone: "America/Lima" });
  return (
    <div className="pn-ayer nutri-fade-in">
      <div className="pn-ayer-cab">
        <AnilloAvance pct={puntaje} size={64} grosor={8} />
        <span className="pn-ayer-n"><span><b className="num-u">{ok.length}</b>/{filas.length}</span></span>
        <div className="tx">
          <span className="eti">Antes de empezar</span>
          <b>{mal.length === 0 ? "¡Ayer cumpliste todo!" : "Así te fue ayer"}</b>
          <small>{fechaTxt} · {ok.length} de {filas.length} metas cumplidas</small>
        </div>
        <button onClick={cerrar} className="pn-x" aria-label="Cerrar"><IconX size={16} /></button>
      </div>
      <p className="pn-leyenda">La barra es lo que comiste; la banderita ⚑ es tu meta. <span style={{ color: "var(--st-meta)" }}>● en meta</span> <span style={{ color: "var(--st-bajo)" }}>● faltó</span> <span style={{ color: "var(--st-exceso)" }}>● te pasaste</span></p>
      {ok.length > 0 && <div className="pn-ok">{ok.map(({ n }) => <span key={n.key}><IconoAlimento clave={n.clave} size={20} />{n.label} ✓</span>)}</div>}
      {mal.map(({ n, valor, meta, est }, i) => (
        <CuadroNutriente key={n.key} n={n} valor={valor} meta={meta} cuando="ayer" i={i} porMomento={analisis.porMomento}
          opciones={est === "bajo" && n.tipo !== "maximo" ? sugerirAlimentos(n.key, meta - valor, requerimiento.restricciones, 3) : null}
          notas={est === "exceso" ? [n.key === "sodioMg" ? "Hoy evita procesados, embutidos, enlatados y caldos en cubito." : "Hoy modera un poco la comida que más aportó."] : null} />
      ))}
      <button onClick={cerrar} className="pn-entendido">Entendido, continuar</button>
    </div>
  );
}

/* Hoy: calorías arriba (anillo grande) y debajo un cuadro por cada otro nutriente.
   Las sugerencias van dentro del cuadro del nutriente al que corresponden. */
function NutrientesDeHoy({ totales, requerimiento, log, sugerencias }) {
  const [abierto, setAbierto] = useState(null);
  const de = (k) => sugerencias.filter((s) => s.clave === k);
  const ops = (k) => de(k).filter((s) => !s.nota || (s.opciones && s.opciones.length)).flatMap((s) => s.opciones || []).slice(0, 4);
  const notas = (k) => de(k).filter((s) => s.nota).map((s) => s.mensaje);
  const kcal = NUTRI_PANEL[0], metaK = requerimiento.get || 0, estK = estadoNutriente(kcal, totales.kcal, metaK);
  const generales = de("general");
  return (
    <>
      <div className={`pn-heroe est-${estK}`}>

function CuadroNutrienteDetalle({ n, log }) {
  const grupos = MOMENTOS_KEYS.map((m) => ({ m, items: log.filter((it) => it.momento === m && it.alimento).map((it) => ({ ...it, ap: calcularTotalesItem(it.alimento, it.gramos)[n.key] })).filter((x) => x.ap > 0.5).sort((a, b) => b.ap - a.ap) })).filter((g) => g.items.length);

/* Cumplimiento de la meta: semana como 7 días con círculos por calorías y proteína, y el mes
   como calendario de cuadritos. Verde = en meta, naranja = faltó, rojo = te pasaste, gris = sin registro. */
function diasDeCumplimiento(dias, requerimiento, logHoy) {
  const out = [];
  for (let i = dias - 1; i >= 0; i--) {
    const fecha = fechaISOOffset(i);
    let log = [];
    if (i === 0 && logHoy) log = logHoy; else { try { log = JSON.parse(localStorage.getItem("nutriapp_log_" + fecha) || "[]"); } catch {} }
    if (!log.length) { out.push({ fecha, hoy: i === 0, sin: true }); continue; }
    const t = calcularTotalesLog(log);
    out.push({ fecha, hoy: i === 0, kcal: t.kcal, prot: t.proteinasG, estK: estadoNutriente(NUTRI_PANEL[0], t.kcal, requerimiento.get), estP: estadoNutriente(NUTRI_PANEL[1], t.proteinasG, requerimiento.proteinasG) });
  }
  return out;
}
const COLOR_DIA = (d, k) => d.sin ? "transparent" : COLOR_ESTADO[d[k]] || "var(--border)";
function CumplimientoMeta({ requerimiento, log }) {
  const [vista, setVista] = useState("semana");
  const semana = useMemo(() => diasDeCumplimiento(7, requerimiento, log), [requerimiento, log]);
  const mes = useMemo(() => diasDeCumplimiento(30, requerimiento, log), [requerimiento, log]);
  const datos = vista === "semana" ? semana : mes;
  const con = datos.filter((d) => !d.sin);
  const enK = con.filter((d) => d.estK === "meta").length, enP = con.filter((d) => d.estP === "meta").length;
  const promK = con.length ? con.reduce((a, d) => a + d.kcal, 0) / con.length : 0, promP = con.length ? con.reduce((a, d) => a + d.prot, 0) / con.length : 0;
  const diaCorto = (f) => new Date(f + "T12:00:00Z").toLocaleDateString("es-PE", { weekday: "short", timeZone: "America/Lima" }).replace(".", "").slice(0, 3);
  const diaNum = (f) => Number(f.slice(8, 10));
  // Racha: días seguidos (terminando ayer u hoy) en meta de calorías
  let racha = 0; for (let i = mes.length - 1; i >= 0; i--) { const d = mes[i]; if (d.hoy && d.sin) continue; if (!d.sin && d.estK === "meta") racha++; else break; }
  return (
    <div className="pn-cumple">
      <div className="pn-cumple-cab">
        <span className="nutri-brand-text"><IconSparkles size={15} /></span><b>Cumplimiento de la meta</b>
        <div className="pn-seg">{[["semana", "Semana"], ["mes", "Mes"]].map(([k, l]) => <button key={k} type="button" className={vista === k ? "on" : ""} onClick={() => setVista(k)}>{l}</button>)}</div>
      </div>
      <div className="pn-resumen-cumple">
        <div><AnilloAvance pct={con.length ? enK / con.length : 0} size={54} grosor={7} /><span><b className="num-u">{enK}<em> de {con.length} días</em></b><small>en tu meta de calorías</small></span></div>
        <div><AnilloAvance pct={con.length ? enP / con.length : 0} size={54} grosor={7} /><span><b className="num-u">{enP}<em> de {con.length} días</em></b><small>en tu meta de proteína</small></span></div>
      </div>
      {vista === "semana" ? (
        <div className="pn-semana" key="s">
          <span className="fila-tit" />{semana.map((d) => <span key={d.fecha} className={`dia ${d.hoy ? "hoy" : ""}`}>{d.hoy ? "hoy" : diaCorto(d.fecha)}</span>)}
          <span className="fila-tit"><IconoAlimento clave="calorias" size={18} /></span>{semana.map((d, i) => <span key={d.fecha} className={`bola ${d.sin ? "sin" : ""}`} style={{ background: COLOR_DIA(d, "estK"), animationDelay: `${i * 50}ms` }} title={d.sin ? "Sin registro" : `${fmtN(d.kcal)} kcal`}>{d.sin ? "–" : d.estK === "meta" ? "✓" : d.estK === "exceso" ? "▲" : "▼"}</span>)}
          <span className="fila-tit"><IconoAlimento clave="proteina" size={18} /></span>{semana.map((d, i) => <span key={d.fecha} className={`bola ${d.sin ? "sin" : ""}`} style={{ background: COLOR_DIA(d, "estP"), animationDelay: `${i * 50 + 120}ms` }} title={d.sin ? "Sin registro" : `${fmtN(d.prot)} g`}>{d.sin ? "–" : d.estP === "meta" ? "✓" : "▼"}</span>)}
        </div>
      ) : (
        <div className="pn-mes" key="m">
          {mes.map((d, i) => <span key={d.fecha} className={`cua ${d.sin ? "sin" : ""} ${d.hoy ? "hoy" : ""}`} style={{ background: COLOR_DIA(d, "estK"), animationDelay: `${i * 18}ms` }} title={d.sin ? "Sin registro" : `${fmtN(d.kcal)} kcal`}>{diaNum(d.fecha)}</span>)}
          <p className="pie">Cada cuadrito es un día y su color muestra tus calorías.</p>
        </div>
      )}
      <p className="pn-leyenda"><span style={{ color: "var(--st-meta)" }}>● en meta</span> <span style={{ color: "var(--st-bajo)" }}>● faltó</span> <span style={{ color: "var(--st-exceso)" }}>● te pasaste</span> <span>○ sin registro</span></p>
      <div className="pn-datos">
        <span>Promedio por día<b><span className="num-u">{fmtN(promK)}</span> kcal · <span className="num-u">{fmtN(promP)}</span> g prot</b></span>
        <span>Racha en meta<b>{racha ? `🔥 ${racha} día${racha === 1 ? "" : "s"} seguido${racha === 1 ? "" : "s"}` : "Empieza hoy"}</b></span>
      </div>

    </div>
  );
}

/* Deriva el lunes de la semana a partir del día calendario en huso horario de Lima (no el del
   dispositivo): antes usaba getDay()/setDate() locales, que en un dispositivo con otra zona
   horaria podían desalinear la semana un día entero respecto a lo que fechaLimaISO()/hoyISO()
   consideran "hoy" — por ejemplo, "A registro" terminaba guardando en el día anterior. Acepta
   un Date o una fecha ISO "YYYY-MM-DD", y devuelve el lunes anclado al MEDIODÍA UTC (no
   medianoche) del día calendario correcto en Lima: así, al convertir de vuelta a cualquier huso
   horario razonable (incluido UTC-5 de Lima) con fechaLimaISO() o toLocaleDateString(), sigue
   cayendo en el mismo día calendario en vez de retroceder un día. Todo el código que suma o
   resta días sobre este valor debe usar los métodos UTC (getUTCDate/setUTCDate) para no
   reintroducir el mismo problema. */
function getLunes(fecha) {
  const iso = typeof fecha === "string" ? fecha : fechaLimaISO(fecha);
  const [y, m, d] = iso.split("-").map(Number);
  const base = new Date(Date.UTC(y, m - 1, d, 12));
  const dia = base.getUTCDay(); // 0=domingo,1=lunes,...
  const diff = dia === 0 ? -6 : 1 - dia;
  base.setUTCDate(base.getUTCDate() + diff);
  return base;
}
const DIAS_EN_MS = 86400000;
const NOMBRE_DIA_CORTO = (d) => d.toLocaleDateString("es-ES", { weekday: "short", timeZone: "America/Lima" }).replace(".", "");
const NOMBRE_DIA_LARGO = (d) => d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short", timeZone: "America/Lima" });
const RANGO_SEMANA = (inicio, fin) => `${inicio.toLocaleDateString("es-ES", { day: "numeric", month: "short", timeZone: "America/Lima" })} – ${fin.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric", timeZone: "America/Lima" })}`;

/* Conversión aproximada de cucharas a gramos para aceites y similares (referencia habitual:
   1 cucharadita ≈ 5 g, 1 cucharada ≈ 15 g), para no obligar a pesar el aceite en una balanza. */
const GRAMOS_CUCHARADITA = 5;
const GRAMOS_CUCHARADA = 15;
const UNIDADES_CUCHARA = [
  { label: "½ cucharadita", gramos: GRAMOS_CUCHARADITA / 2 },
  { label: "1 cucharadita", gramos: GRAMOS_CUCHARADITA },
  { label: "½ cucharada", gramos: GRAMOS_CUCHARADA / 2 },
  { label: "1 cucharada", gramos: GRAMOS_CUCHARADA },
];
function esAceite(alimento) {
  return !!alimento && alimento.categoria === "grasa" && /aceite/i.test(alimento.nombre);
}

/* Conversión aproximada de unidades a gramos para nueces (referencia habitual: 1 nuez entera,
   sin cáscara, con sus dos mitades ≈ 5 g), para no obligar a pesarlas en una balanza. */
const GRAMOS_NUEZ = 5;
const UNIDADES_NUEZ = [
  { label: "1 unidad", gramos: GRAMOS_NUEZ },
  { label: "2 unidades", gramos: GRAMOS_NUEZ * 2 },
  { label: "3 unidades", gramos: GRAMOS_NUEZ * 3 },
];
function esNuez(alimento) {
  return !!alimento && alimento.categoria === "grasa" && /nuez|nueces/i.test(alimento.nombre);
}
