/* Perú usa siempre UTC-5 (no tiene horario de verano), pero el navegador puede estar en
   cualquier zona horaria. Para que "hoy" y las fechas de los registros siempre correspondan
   al día calendario en Perú (y no se adelanten con el corte UTC a las 19:00 hora local),
   toda fecha se deriva explícitamente con timeZone: "America/Lima". */
function fechaLimaISO(fechaOInstante = new Date()) {
  const instante = fechaOInstante instanceof Date ? fechaOInstante : new Date(fechaOInstante);
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Lima", year: "numeric", month: "2-digit", day: "2-digit" }).format(instante);
}
const hoyISO = () => fechaLimaISO();

/* ---------- Lógica de cálculo clínico ---------- */
function mergeRestricciones(fuentes) {
  const r = {};
  RESTRICCIONES_DISPONIBLES.forEach(({ key }) => { r[key] = false; });
  fuentes.forEach((c) => {
    Object.entries(c.restricciones || {}).forEach(([k, v]) => { if (v) r[k] = true; });
  });
  return r;
}

function detectarInteracciones(medicamentos) {
  const lista = [];
  (medicamentos || []).forEach((m) => {
    const nombreLower = (m.nombre || "").toLowerCase();
    const match = MEDICAMENTOS_DB.find((db) => db.alias.some((a) => nombreLower.includes(a)));
    if (match) lista.push({ medicamentoUsuario: m.nombre, ...match });
  });
  return lista;
}

function calcularGEB(perfil) {
  const { edad, sexo, pesoKg, tallaCm, formulaGEB } = perfil;
  if (formulaGEB === "harris_benedict") {
    return sexo === "masculino"
      ? 88.362 + 13.397 * pesoKg + 4.799 * tallaCm - 5.677 * edad
      : 447.593 + 9.247 * pesoKg + 3.098 * tallaCm - 4.33 * edad;
  }
  const base = 10 * pesoKg + 6.25 * tallaCm - 5 * edad;
  return sexo === "masculino" ? base + 5 : base - 161;
}

function calcularGET(geb, perfil, restricciones) {
  let get = geb * FACTOR_ACTIVIDAD[perfil.actividad];
  if (perfil.objetivo === "perdida") get *= 0.8;
  if (perfil.objetivo === "ganancia_muscular") get *= 1.12;
  if (restricciones.aumentarCalorico) get += 300;
  return Math.round(get);
}

/* ---------- Valoración nutricional geriátrica ----------
   Umbrales basados en criterios de uso habitual en valoración geriátrica en Latinoamérica
   (p.ej. estudio SABE/OPS) y en los criterios GLIM (Global Leadership Initiative on
   Malnutrition) para pérdida de peso involuntaria. Es una alerta orientativa para priorizar
   una evaluación profesional, no un diagnóstico. */
const EDAD_ADULTO_MAYOR = 60;

function calcularIMC(pesoKg, tallaCm) {
  const tallaM = tallaCm / 100;
  if (!(tallaM > 0)) return 0;
  return pesoKg / (tallaM * tallaM);
}

/* En personas ≥60 años se usan puntos de corte más altos que en adultos jóvenes (el IMC
   "normal" clásico de 18.5-24.9 subestima el riesgo de desnutrición en el adulto mayor). */
function clasificarIMCAdultoMayor(imc) {
  if (imc < 23) return { categoria: "Bajo peso", riesgo: true };
  if (imc < 28) return { categoria: "Normal", riesgo: false };
  if (imc < 32) return { categoria: "Sobrepeso", riesgo: false };
  return { categoria: "Obesidad", riesgo: false };
}

/* Busca, dentro del historial de pesos, el registro más cercano a "hace N meses" y calcula
   el % de cambio respecto al peso actual (pérdida = positivo). */
function calcularPerdidaPesoPct(pesos, pesoActualKg, meses) {
  if (!pesos || pesos.length === 0) return null;
  const ahora = Date.now();
  const objetivoMs = ahora - meses * 30 * DIAS_EN_MS;
  let candidato = null;
  let mejorDiff = Infinity;
  pesos.forEach((p) => {
    const t = new Date(p.fecha + "T00:00:00").getTime();
    if (t > ahora - 7 * DIAS_EN_MS) return; // ignora registros de la última semana (son "el actual")
    const diff = Math.abs(t - objetivoMs);
    if (diff < mejorDiff && t <= ahora - meses * 20 * DIAS_EN_MS) { mejorDiff = diff; candidato = p; }
  });
  if (!candidato || candidato.pesoKg <= 0) return null;
  return ((candidato.pesoKg - pesoActualKg) / candidato.pesoKg) * 100;
}

/* ---------- MNA-SF (Mini Nutritional Assessment - Short Form) ----------
   Es el instrumento de cribado nutricional geriátrico más validado y usado en la práctica
   clínica mundial (Vellas et al., Rubenstein et al.). 6 ítems, máximo 14 puntos: ≥12 normal,
   8-11 riesgo de desnutrición, ≤7 desnutrición. No sustituye una valoración nutricional
   completa (MNA forma larga) por un profesional, pero es mucho más sensible que mirar solo
   el IMC o el peso, sobre todo para detectar riesgo de forma temprana. */
const MNA_OPCIONES = {
  ingesta: [
    { valor: 0, texto: "Disminución grave del apetito o la ingesta" },
    { valor: 1, texto: "Disminución moderada" },
    { valor: 2, texto: "Sin disminución" },
  ],
  perdidaPeso: [
    { valor: 0, texto: "Pérdida de peso > 3 kg" },
    { valor: 1, texto: "No lo sabe" },
    { valor: 2, texto: "Pérdida de peso entre 1 y 3 kg" },
    { valor: 3, texto: "Sin pérdida de peso" },
  ],
  movilidad: [
    { valor: 0, texto: "De la cama al sillón, no sale del domicilio" },
    { valor: 1, texto: "Camina en casa, no sale a la calle" },
    { valor: 2, texto: "Sale del domicilio" },
  ],
  estres: [
    { valor: 0, texto: "Sí, en los últimos 3 meses" },
    { valor: 2, texto: "No" },
  ],
  neuropsicologico: [
    { valor: 0, texto: "Demencia o depresión grave" },
    { valor: 1, texto: "Demencia leve" },
    { valor: 2, texto: "Sin problemas psicológicos" },
  ],
};
const MNA_PREGUNTAS = [
  { key: "ingesta", label: "¿Ha comido menos en los últimos 3 meses por falta de apetito, problemas digestivos, o dificultad para masticar o tragar?" },
  { key: "perdidaPeso", label: "Pérdida de peso en los últimos 3 meses" },
  { key: "movilidad", label: "Movilidad habitual" },
  { key: "estres", label: "¿Enfermedad aguda o estrés psicológico en los últimos 3 meses?" },
  { key: "neuropsicologico", label: "Problemas neuropsicológicos" },
];

function calcularPuntosIMCMNA(imc) {
  if (imc < 19) return 0;
  if (imc < 21) return 1;
  if (imc < 23) return 2;
  return 3;
}

function calcularPuntajeMNA(mnaSF, imc) {
  if (!mnaSF) return null;
  const claves = ["ingesta", "perdidaPeso", "movilidad", "estres", "neuropsicologico"];
  if (claves.some((k) => mnaSF[k] === undefined || mnaSF[k] === null)) return null;
  const puntosIMC = calcularPuntosIMCMNA(imc);
  const puntaje = claves.reduce((s, k) => s + mnaSF[k], 0) + puntosIMC;
  let categoria = "normal";
  if (puntaje <= 7) categoria = "desnutricion";
  else if (puntaje <= 11) categoria = "riesgo";
  return { puntaje, categoria, puntosIMC };
}

function evaluarRiesgoNutricionalMayor(perfil, pesos) {
  if (!perfil.edad || perfil.edad < EDAD_ADULTO_MAYOR) return null;
  const imc = calcularIMC(perfil.pesoKg, perfil.tallaCm);
  const { categoria: categoriaIMC, riesgo: riesgoPorIMC } = clasificarIMCAdultoMayor(imc);
  const perdida3m = calcularPerdidaPesoPct(pesos, perfil.pesoKg, 3);
  const perdida6m = calcularPerdidaPesoPct(pesos, perfil.pesoKg, 6);
  const mna = calcularPuntajeMNA(perfil.mnaSF, imc);
  const alertas = [];
  let nivel = "bajo";

  if (riesgoPorIMC) { alertas.push(`Tu IMC (${imc.toFixed(1)}) está por debajo de 23, el umbral de bajo peso para personas mayores de ${EDAD_ADULTO_MAYOR} años.`); nivel = "moderado"; }
  if (perdida3m !== null && perdida3m >= 5) { alertas.push(`Perdiste ${perdida3m.toFixed(1)}% de tu peso en ~3 meses (≥5% ya se considera pérdida de peso clínicamente significativa).`); nivel = "alto"; }
  else if (perdida6m !== null && perdida6m >= 10) { alertas.push(`Perdiste ${perdida6m.toFixed(1)}% de tu peso en ~6 meses (≥10% se considera pérdida de peso clínicamente significativa).`); nivel = "alto"; }

  if (mna) {
    if (mna.categoria === "desnutricion") { alertas.push(`Tu cribado MNA-SF dio ${mna.puntaje}/14 puntos: rango de desnutrición (≤7).`); nivel = "alto"; }
    else if (mna.categoria === "riesgo" && nivel !== "alto") { alertas.push(`Tu cribado MNA-SF dio ${mna.puntaje}/14 puntos: rango de riesgo de desnutrición (8-11).`); nivel = "moderado"; }
  }

  if (alertas.length > 0) alertas.push("Esto amerita una evaluación por tu médico o nutricionista; no reemplaces esa consulta con la app.");
  return { imc, categoriaIMC, perdida3m, perdida6m, mna, nivel, alertas };
}

function calcularRequerimiento(perfil, catalogo, medicamentos, prescripcion, suplementos, pesos) {
  const condicionesActivas = perfil.condiciones.map((id) => catalogo.find((c) => c.id === id)).filter(Boolean);
  const interacciones = detectarInteracciones(medicamentos);
  const restricciones = mergeRestricciones([...condicionesActivas, ...interacciones]);
  const rx = prescripcion && prescripcion.activa ? prescripcion : null;
  const esAdultoMayor = perfil.edad >= EDAD_ADULTO_MAYOR;
  const riesgoNutricionalMayor = evaluarRiesgoNutricionalMayor(perfil, pesos || []);

  const geb = calcularGEB(perfil);
  let get = calcularGET(geb, perfil, restricciones);
  if (rx && rx.kcalManual) get = Math.round(rx.kcalManual);
  const { objetivo, pesoKg } = perfil;

  /* Requerimiento proteico: la evidencia geriátrica (consenso PROT-AGE / guías ESPEN) recomienda
     un piso más alto que en el adulto joven —~1.0-1.2 g/kg/día incluso sano, y 1.2-1.5 g/kg/día
     si hay riesgo de desnutrición o sarcopenia— porque el envejecimiento reduce la síntesis
     proteica muscular ante el mismo estímulo ("resistencia anabólica"). La restricción renal
     (limitarProteina) es una condición de seguridad y siempre prevalece sobre este piso. */
  let proteinaGkg = 1.0;
  if (objetivo === "ganancia_muscular") proteinaGkg = 1.8;
  if (objetivo === "perdida") proteinaGkg = 1.6;
  if (esAdultoMayor) proteinaGkg = Math.max(proteinaGkg, 1.2);
  if (riesgoNutricionalMayor && riesgoNutricionalMayor.nivel !== "bajo") proteinaGkg = Math.max(proteinaGkg, 1.3);
  if (restricciones.aumentarProteina) proteinaGkg = Math.max(proteinaGkg, 1.3);
  if (restricciones.limitarProteina) proteinaGkg = 0.7;

  let proteinasG = Math.round(proteinaGkg * pesoKg);
  if (rx && rx.proteinaManualG) proteinasG = Math.round(rx.proteinaManualG);
  const proteinasKcal = proteinasG * 4;
  const proteinasPct = get > 0 ? Math.round((proteinasKcal / get) * 100) : 0;

  let grasasPct = restricciones.limitarGrasasSaturadas ? 25 : 30;
  if (rx && rx.grasasPctManual) grasasPct = rx.grasasPctManual;
  const grasasKcal = get * (grasasPct / 100);
  const grasasG = Math.round(grasasKcal / 9);
  const grasasSaturadasG = Math.round((grasasKcal * 0.07) / 9);
  const grasasPoliinsaturadasG = Math.round((grasasKcal * 0.1) / 9);
  const grasasMonoinsaturadasG = Math.max(grasasG - grasasSaturadasG - grasasPoliinsaturadasG, 0);

  const carbohidratosKcal = rx && rx.carbohidratosPctManual ? get * (rx.carbohidratosPctManual / 100) : Math.max(get - proteinasKcal - grasasKcal, 0);
  const carbohidratosG = Math.round(carbohidratosKcal / 4);
  const carbohidratosPct = get > 0 ? Math.round((carbohidratosKcal / get) * 100) : 0;

  const sodioMg = restricciones.limitarSodio ? 1500 : 2300;
  const potasioMg = restricciones.limitarPotasio ? 2000 : 3500;
  const fibraG = restricciones.aumentarFibra ? 35 : 28;
  const azucaresAnadidosG = restricciones.limitarAzucar ? Math.round((get * 0.05) / 4) : Math.round((get * 0.1) / 4);

  const suplementosTotales = (suplementos || []).reduce((acc, s) => {
    const veces = s.vecesDia || 1;
    return { kcal: acc.kcal + (s.kcal || 0) * veces, proteinaG: acc.proteinaG + (s.proteinaG || 0) * veces };
  }, { kcal: 0, proteinaG: 0 });

  /* Hidratación: ~30 ml/kg/día es la referencia habitual en adultos mayores (más baja que la
     regla de 35 ml/kg del adulto joven, porque el agua corporal total disminuye con la edad),
     con un piso de 1500 ml/día para evitar recomendar volúmenes insuficientes en personas de
     bajo peso. Debe ajustarse a la baja solo por indicación médica en insuficiencia cardiaca o
     renal con restricción de líquidos: la app no aplica ese ajuste automáticamente. */
  const aguaMetaMl = Math.max(Math.round(pesoKg * 30), 1500);

  return { geb: Math.round(geb), get, proteinasG, proteinasPct, carbohidratosG, carbohidratosPct, grasasG, grasasPct, grasasSaturadasG, grasasMonoinsaturadasG, grasasPoliinsaturadasG, sodioMg, potasioMg, fibraG, azucaresAnadidosG, aguaMetaMl, restricciones, condicionesActivas, interacciones, prescripcionActiva: !!rx, suplementos: suplementos || [], suplementosTotales, esAdultoMayor, riesgoNutricionalMayor };
}

function aptoParaRestricciones(alimento, restricciones) {
  if (restricciones.limitarSodio && alimento.sodioMg > 140) return false;
  if (restricciones.limitarPotasio && alimento.potasioMg > 300) return false;
  if (restricciones.limitarAzucar && alimento.azucaresG > 5) return false;
  if (restricciones.limitarGrasasSaturadas && alimento.grasasSaturadasG > 5) return false;
  return true;
}

function seleccionarAlimento(pool, poolCompleto, role, seed) {
  let candidatos = pool.filter((f) => f.categoria === role);
  if (candidatos.length === 0) candidatos = poolCompleto.filter((f) => f.categoria === role);
  if (candidatos.length === 0) return null;
  return candidatos[seed % candidatos.length];
}

function generarComida(roles, objetivo, poolAptos, seedBase) {
  const seleccion = roles.map((role, i) => ({ role, alimento: seleccionarAlimento(poolAptos, FOOD_DB, role, seedBase + i * 7) })).filter((s) => s.alimento);
  let items = seleccion.map(({ role, alimento }) => {
    const proteinPerG = alimento.proteinasG / alimento.porcionBaseG;
    const carbPerG = alimento.carbohidratosG / alimento.porcionBaseG;
    let gramos = 100;
    if (role === "proteina" || role === "lacteo") gramos = proteinPerG > 0 ? (objetivo.proteinasG * 0.8) / proteinPerG : 100;
    else if (role === "carbohidrato") gramos = carbPerG > 0 ? (objetivo.carbohidratosG * 0.75) / carbPerG : 100;
    else if (role === "fruta") gramos = carbPerG > 0 ? (objetivo.carbohidratosG * 0.25) / carbPerG : 100;
    else if (role === "vegetal") gramos = 100;
    else if (role === "menestra") gramos = 80;
    else if (role === "quinua") gramos = 60;
    else if (role === "grasa") gramos = 15;
    return { alimento, gramos: Math.max(gramos, 10) };
  });
  const grasaItem = items.find((it) => it.alimento.categoria === "grasa");
  if (grasaItem) {
    const otros = items.filter((it) => it !== grasaItem);
    const fatSoFar = otros.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.grasasG, 0);
    const fatPerG = grasaItem.alimento.grasasG / grasaItem.alimento.porcionBaseG;
    const fatNeeded = Math.max(objetivo.grasasG - fatSoFar, 5);
    grasaItem.gramos = fatPerG > 0 ? fatNeeded / fatPerG : 10;
  }
  const kcalActual = items.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.kcal, 0);
  const factor = kcalActual > 0 ? objetivo.kcal / kcalActual : 1;
  items = items.map((it) => ({ ...it, gramos: Math.max(10, Math.round((it.gramos * factor) / 5) * 5) }));
  return items;
}

function elegirProteinaAlmuerzo(seed) {
  const idx = ((seed % 3) + 3) % 3;
  if (idx === 0) return FOOD_DB.find((f) => f.id === "f01"); // pollo
  if (idx === 1) return FOOD_DB.find((f) => f.id === "f31"); // pavita
  const pescados = FOOD_DB.filter((f) => f.avePescado && f.id !== "f01" && f.id !== "f31");
  return pescados[Math.abs(seed) % pescados.length];
}

function generarMenu(requerimiento, seed) {
  const poolAptos = FOOD_DB.filter((f) => aptoParaRestricciones(f, requerimiento.restricciones));
  return MEAL_DEFS.map((m) => {
    let poolComida = poolAptos;
    if (m.key === "almuerzo") {
      const proteinaFija = elegirProteinaAlmuerzo(seed);
      poolComida = poolAptos.filter((f) => f.categoria !== "proteina" || (proteinaFija && f.id === proteinaFija.id));
    }
    const objetivo = { kcal: requerimiento.get * m.pct, proteinasG: requerimiento.proteinasG * m.pct, carbohidratosG: requerimiento.carbohidratosG * m.pct, grasasG: requerimiento.grasasG * m.pct };
    let items = generarComida(m.roles, objetivo, poolComida, seed + m.key.length);
    if (m.key === "almuerzo" && Math.abs(seed) % 4 === 0) {
      const idxMenestra = items.findIndex((it) => it.alimento.categoria === "menestra");
      if (idxMenestra !== -1) {
        const arracacha = FOOD_DB.find((f) => f.id === "f36");
        const tarwi = FOOD_DB.find((f) => f.id === "f35");
        if (arracacha && tarwi) items.splice(idxMenestra, 1, { alimento: arracacha, gramos: 100 }, { alimento: tarwi, gramos: 80 });
      }
    }
    let notaExtra = "";
    if (m.key === "almuerzo") {
      const proteinaLograda = items.reduce((s, it) => s + (it.gramos / it.alimento.porcionBaseG) * it.alimento.proteinasG, 0);
      if (proteinaLograda < objetivo.proteinasG * 0.85) {
        notaExtra = `Esta combinación aporta ~${Math.round(proteinaLograda)} g de proteína; para llegar a tu meta de almuerzo (~${Math.round(objetivo.proteinasG)} g) agrega también arroz o papa/arracacha, y si necesitas más proteína, una porción extra de tu carne del día o un huevo.`;
      }
    }
    return { ...m, items, notaExtra };
  });
}

function calcularTotalesItem(alimento, gramos) {
  const f = gramos / alimento.porcionBaseG;
  return { kcal: alimento.kcal * f, proteinasG: alimento.proteinasG * f, carbohidratosG: alimento.carbohidratosG * f, fibraG: alimento.fibraG * f, grasasG: alimento.grasasG * f, sodioMg: alimento.sodioMg * f };
}

function obtenerLogFecha(pacienteId, fecha) {
  if (pacienteId) {
    return dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(fecha).collection("items").orderBy("agregadoEn").get()
      .then((snap) => snap.docs.map((doc) => ({ uid: doc.id, ...doc.data() })))
      .catch(() => []);
  }
  try { const s = localStorage.getItem("nutriapp_log_" + fecha); return Promise.resolve(s ? JSON.parse(s) : []); } catch { return Promise.resolve([]); }
}

function fechaISOOffset(diasAtras) {
  return fechaLimaISO(Date.now() - diasAtras * 86400000);
}

function resumenCumplimiento(dias, requerimiento) {
  let diasConDatos = 0, diasCumpleKcal = 0, diasCumpleProteina = 0, sumaKcal = 0, sumaProteina = 0;
  for (let i = 0; i < dias; i++) {
    let log = [];
    try { const s = localStorage.getItem("nutriapp_log_" + fechaISOOffset(i)); log = s ? JSON.parse(s) : []; } catch {}
    if (log.length === 0) continue;
    diasConDatos++;
    const t = calcularTotalesLog(log);
    sumaKcal += t.kcal; sumaProteina += t.proteinasG;
    if (requerimiento.get > 0 && Math.abs(t.kcal - requerimiento.get) / requerimiento.get <= 0.1) diasCumpleKcal++;
    if (requerimiento.proteinasG > 0 && t.proteinasG >= requerimiento.proteinasG * 0.9) diasCumpleProteina++;
  }
  return { diasTotales: dias, diasConDatos, diasCumpleKcal, diasCumpleProteina, promedioKcal: diasConDatos ? sumaKcal / diasConDatos : 0, promedioProteina: diasConDatos ? sumaProteina / diasConDatos : 0 };
}

function calcularTotalesLog(log) {
  return log.reduce((acc, item) => {
    const t = calcularTotalesItem(item.alimento, item.gramos);
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, fibraG: acc.fibraG + t.fibraG, grasasG: acc.grasasG + t.grasasG, sodioMg: acc.sodioMg + t.sodioMg };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, fibraG: 0, grasasG: 0, sodioMg: 0 });
}

/* ---------- Análisis de cumplimiento diario (para la alerta de inicio de día) ----------
   Evalúa un log de un día concreto (normalmente el de ayer) frente al requerimiento actual,
   nutriente por nutriente y también desglosado por momento de comida, para poder señalar en
   qué comida se originó el déficit o el exceso y sugerir un cambio concreto para hoy. */
const NOMBRE_MOMENTO = { desayuno: "el desayuno", almuerzo: "el almuerzo", cena: "la cena", colacion: "la colación" };
const MOMENTOS_KEYS = ["desayuno", "almuerzo", "cena", "colacion"];
const MOMENTO_LABEL_CAPITALIZADO = { desayuno: "Desayuno", almuerzo: "Almuerzo", cena: "Cena", colacion: "Colación" };

function evaluarDia(log, requerimiento) {
  const totales = calcularTotalesLog(log);
  const porMomento = {};
  MOMENTOS_KEYS.forEach((m) => { porMomento[m] = calcularTotalesLog(log.filter((it) => it.momento === m)); });

  const metricas = [
    { key: "kcal", label: "Calorías", unidad: "kcal", meta: requerimiento.get, actual: totales.kcal, tolerancia: 0.1 },
    { key: "proteinasG", label: "Proteína", unidad: "g", meta: requerimiento.proteinasG, actual: totales.proteinasG, minimoPct: 0.9, soloMinimo: true },
    { key: "carbohidratosG", label: "Carbohidratos", unidad: "g", meta: requerimiento.carbohidratosG, actual: totales.carbohidratosG, tolerancia: 0.15 },
    { key: "grasasG", label: "Grasas", unidad: "g", meta: requerimiento.grasasG, actual: totales.grasasG, tolerancia: 0.15 },
    { key: "fibraG", label: "Fibra", unidad: "g", meta: requerimiento.fibraG, actual: totales.fibraG, minimoPct: 0.85, soloMinimo: true },
  ];

  const resultados = metricas.map((m) => {
    const diferencia = m.actual - m.meta;
    const pctDiferencia = m.meta > 0 ? diferencia / m.meta : 0;
    let estado = "cumplido";
    if (m.soloMinimo) {
      estado = m.meta > 0 && m.actual < m.meta * m.minimoPct ? "bajo" : "cumplido";
    } else {
      if (pctDiferencia > m.tolerancia) estado = "excedido";
      else if (pctDiferencia < -m.tolerancia) estado = "bajo";
    }
    return { ...m, diferencia, pctDiferencia, estado };
  });

  const sodioExcedido = totales.sodioMg > requerimiento.sodioMg;
  const cumplioTodo = resultados.every((r) => r.estado === "cumplido") && !sodioExcedido;
  return { totales, porMomento, resultados, sodioExcedido, cumplioTodo };
}

/* Toma el log de ayer (siempre localStorage: es el registro consolidado del día ya cerrado)
   y devuelve su evaluación, o null si ayer no se registró nada. */
function analizarDiaAnterior(requerimiento) {
  const fechaAyer = fechaISOOffset(1);
  let log = [];
  try { const s = localStorage.getItem("nutriapp_log_" + fechaAyer); log = s ? JSON.parse(s) : []; } catch {}
  if (log.length === 0) return null;
  return { fecha: fechaAyer, ...evaluarDia(log, requerimiento) };
}

/* Convierte la evaluación de ayer en mensajes accionables: para cada nutriente incumplido,
   identifica en qué comida estuvo más bajo (o más alto) el aporte y qué alimentos concretos
   ayudarían hoy a corregirlo. */
function generarRecomendacionesDiaAnterior(analisis, requerimiento) {
  if (!analisis) return [];
  const recos = [];

  analisis.resultados.forEach((r) => {
    if (r.estado === "bajo") {
      const momentos = MOMENTOS_KEYS.map((k) => ({ momento: k, valor: analisis.porMomento[k][r.key] || 0 }));
      momentos.sort((a, b) => a.valor - b.valor);
      const peor = momentos[0];
      const faltante = Math.max(r.meta - r.actual, 0);
      const opciones = sugerirAlimentos(r.key, faltante, requerimiento.restricciones);
      recos.push({
        tipo: "bajo",
        mensaje: `Ayer tu ${r.label.toLowerCase()} quedó en ${Math.round(r.actual)} / ${Math.round(r.meta)} ${r.unidad} (por debajo de tu meta). El aporte más bajo fue en ${NOMBRE_MOMENTO[peor.momento]}; hoy refuerza esa comida para no repetir el déficit.`,
        opciones,
      });
    } else if (r.estado === "excedido") {
      const momentos = MOMENTOS_KEYS.map((k) => ({ momento: k, valor: analisis.porMomento[k][r.key] || 0 }));
      momentos.sort((a, b) => b.valor - a.valor);
      const peor = momentos[0];
      recos.push({
        tipo: "excedido",
        mensaje: `Ayer superaste tu meta de ${r.label.toLowerCase()} en ${Math.round(r.diferencia)} ${r.unidad}, sobre todo por ${NOMBRE_MOMENTO[peor.momento]}. Hoy modera un poco esa comida para compensar.`,
        opciones: [],
      });
    }
  });

  if (analisis.sodioExcedido) {
    recos.push({ tipo: "excedido", mensaje: `Ayer tu sodio superó el límite (${Math.round(analisis.totales.sodioMg)} / ${requerimiento.sodioMg} mg). Hoy evita procesados, embutidos, enlatados o caldos concentrados.`, opciones: [] });
  }

  if (analisis.cumplioTodo) {
    recos.push({ tipo: "logro", mensaje: "¡Ayer cumpliste todas tus metas del día! Repite un patrón de comidas parecido hoy.", opciones: [] });
  }

  return recos;
}

/* Elige hasta n alimentos de la base (de categorías distintas cuando es posible, y aptos
   para las restricciones del paciente) y calcula cuántos gramos de cada uno cubrirían el
   déficit del nutriente indicado. */
/* Semilla numérica basada en la fecha de hoy: hace que la rotación de sugerencias
   cambie de un día a otro pero se mantenga estable durante el mismo día (no en cada render). */
function semillaDelDia() {
  const s = hoyISO();
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

/* Alimentos que la persona come seguido (últimos 21 días), para que las sugerencias salgan de
   su propia mesa antes que de la base general. Se calcula una vez por día. */
let cacheHabituales = null;
function alimentosHabituales() {
  const hoy = hoyISO();
  if (cacheHabituales && cacheHabituales.fecha === hoy) return cacheHabituales.mapa;
  const mapa = {};
  for (let i = 1; i <= 21; i++) {
    try { const l = JSON.parse(localStorage.getItem("nutriapp_log_" + fechaISOOffset(i)) || "[]"); new Set(l.map((it) => it.alimento && it.alimento.id)).forEach((id) => { if (id) mapa[id] = (mapa[id] || 0) + 1; }); } catch {}
  }
  cacheHabituales = { fecha: hoy, mapa };
  return mapa;
}

function sugerirAlimentos(nutrienteKey, cantidadFaltante, restricciones, n = 4) {
  if (!(cantidadFaltante > 0)) return [];
  const candidatos = FOOD_DB
    .filter((f) => f[nutrienteKey] > 0 && aptoParaRestricciones(f, restricciones || {}))
    .sort((a, b) => b[nutrienteKey] - a[nutrienteKey]);
  if (candidatos.length === 0) return [];
  /* Solo se consideran los alimentos realmente relevantes para este nutriente (el tercio
     superior, con un mínimo de 8): así no se sugieren cantidades absurdas de algo que casi
     no lo aporta (p. ej. coliflor para cubrir un déficit de grasas). */
  const topK = Math.min(candidatos.length, Math.max(8, Math.ceil(candidatos.length / 3)));
  const relevantes = candidatos.slice(0, topK);
  const porCategoria = {};
  relevantes.forEach((f) => { (porCategoria[f.categoria] = porCategoria[f.categoria] || []).push(f); });
  const seed = semillaDelDia();
  /* De cada categoría relevante se rota entre sus 3 mejores opciones (no siempre la de mayor
     contenido absoluto), para no repetir siempre aceite de oliva / avena / tarwi. */
  const categorias = Object.keys(porCategoria).sort();
  const candidatosDelDia = categorias.map((cat, i) => {
    const lista = porCategoria[cat];
    const top = lista.slice(0, Math.min(3, lista.length));
    return top[(seed + i * 13) % top.length];
  });
  const orden = candidatosDelDia
    .map((f, i) => ({ f, k: (seed * (i + 7) + i) % 997 }))
    .sort((a, b) => a.k - b.k)
    .map((x) => x.f);
  /* Primero hasta 2 alimentos que la persona ya come seguido y que aportan bien este nutriente */
  const hab = alimentosHabituales();
  const propios = candidatos.slice(0, Math.max(12, Math.ceil(candidatos.length / 2))).filter((f) => hab[f.id] >= 2).sort((a, b) => hab[b.id] - hab[a.id]).slice(0, 2);
  const elegidos = [...propios, ...orden.filter((f) => !propios.includes(f))].slice(0, Math.min(n, candidatos.length));
  return elegidos.map((f) => ({ nombre: f.nombre, alimento: f, habitual: propios.includes(f), gramos: Math.max(Math.round((cantidadFaltante / f[nutrienteKey]) * 100), 5) }));
}

/* Patrón clínico frecuente (saciedad precoz: adultos mayores, post-quirúrgicos, oncológicos):
   la proteína se cubre con carnes/huevo, pero falta volumen para llegar a calorías,
   carbohidratos y grasas a la vez. La estrategia habitual no es "comer más cantidad" sino
   fortificar con combos energéticos concentrados (avena con lácteo, frutos secos, palta,
   camote con aceite...) que aportan a los tres déficits en poco volumen. Si la proteína ya
   está cubierta, se descartan los alimentos proteicamente densos (carnes, pescado, lácteos
   muy proteicos, batido de proteína) para no hacer que el paciente termine excediendo su
   meta de proteína solo por completar energía. */
function sugerirCombosEnergeticos(requerimiento, totales, restricciones, proteinaCubierta, n = 4) {
  const kcalFaltante = requerimiento.get - totales.kcal;
  const carbFaltante = requerimiento.carbohidratosG - totales.carbohidratosG;
  const grasaFaltante = requerimiento.grasasG - totales.grasasG;
  if (!(kcalFaltante > 0) || !(carbFaltante > 0) || !(grasaFaltante > 0)) return [];

  let candidatos = FOOD_DB.filter((f) => f.kcal > 0 && aptoParaRestricciones(f, restricciones || {}));
  if (proteinaCubierta) {
    /* Umbral de g de proteína por kcal: deja fuera carnes, pescado, batido de proteína,
       yogur griego y menestras muy proteicas (tarwi); mantiene lácteos moderados, quinua,
       frutas, grasas y la mayoría de menestras y carbohidratos. */
    candidatos = candidatos.filter((f) => f.proteinasG / f.kcal <= 0.08);
  }
  if (candidatos.length === 0) return [];

  /* Puntaje de combo: cuánto cubre una porción de referencia de 100 g de los tres déficits a
     la vez (con un extra si aporta a más de uno), para priorizar alimentos "todo en uno"
     (avena, palta, frutos secos) en vez de uno que solo sobresalga en un nutriente. */
  const puntuados = candidatos.map((f) => {
    const cobKcal = Math.min(f.kcal / kcalFaltante, 1);
    const cobCarb = Math.min(f.carbohidratosG / carbFaltante, 1);
    const cobGrasa = Math.min(f.grasasG / grasaFaltante, 1);
    const nAportes = [f.kcal > 0, f.carbohidratosG > 0, f.grasasG > 0].filter(Boolean).length;
    return { f, score: (cobKcal + cobCarb + cobGrasa) * (nAportes >= 2 ? 1.3 : 1) };
  }).filter((p) => p.score > 0).sort((a, b) => b.score - a.score);
  if (puntuados.length === 0) return [];

  const topK = Math.min(puntuados.length, Math.max(8, Math.ceil(puntuados.length / 3)));
  const relevantes = puntuados.slice(0, topK).map((p) => p.f);
  const porCategoria = {};
  relevantes.forEach((f) => { (porCategoria[f.categoria] = porCategoria[f.categoria] || []).push(f); });
  const seed = semillaDelDia();
  const categorias = Object.keys(porCategoria).sort();
  const candidatosDelDia = categorias.map((cat, i) => {
    const lista = porCategoria[cat];
    const top = lista.slice(0, Math.min(3, lista.length));
    return top[(seed + i * 13) % top.length];
  });
  const orden = candidatosDelDia
    .map((f, i) => ({ f, k: (seed * (i + 7) + i) % 997 }))
    .sort((a, b) => a.k - b.k)
    .map((x) => x.f);
  const elegidos = orden.slice(0, Math.min(n, orden.length));

  return elegidos.map((f) => {
    /* Gramos: el menor entre lo que se necesitaría para cubrir cada déficit por separado, para
       no sobrepasar de largo el primero que se complete (p. ej. no sugerir 800 g de avena solo
       por llegar a la meta de grasas cuando con 200 g ya se cubrió el carbohidrato). */
    const opciones = [];
    if (f.kcal > 0) opciones.push((kcalFaltante / f.kcal) * 100);
    if (f.carbohidratosG > 0) opciones.push((carbFaltante / f.carbohidratosG) * 100);
    if (f.grasasG > 0) opciones.push((grasaFaltante / f.grasasG) * 100);
    const gramos = Math.max(Math.round(Math.min(...opciones) / 5) * 5, 10);
    return { nombre: f.nombre, alimento: f, gramos };
  });
}

function generarSugerencias(requerimiento, totales, perfil, log) {
  if (totales.kcal === 0) return [{ clave: "general", mensaje: "Aún no registras alimentos hoy. Comienza a registrar para recibir sugerencias personalizadas.", opciones: [] }];
  const restricciones = requerimiento.restricciones || {};
  const sugerencias = [];

  /* En el adulto mayor la síntesis de proteína muscular responde mejor cuando cada comida
     principal aporta un umbral mínimo de proteína (referencia habitual: ~25-30 g), en vez de
     concentrar casi toda la proteína del día en una sola comida (típicamente la cena). Un
     desayuno con poca proteína es el patrón más frecuente y el más fácil de corregir. */
  if (requerimiento.esAdultoMayor && log && log.length > 0) {
    const totalesDesayuno = calcularTotalesLog(log.filter((it) => it.momento === "desayuno"));
    if (totalesDesayuno.proteinasG > 0 && totalesDesayuno.proteinasG < 15) {
      sugerencias.push({
        clave: "proteinasG", nota: true, mensaje: `Tu desayuno de hoy aportó solo ${Math.round(totalesDesayuno.proteinasG)} g de proteína. En personas mayores se recomienda repartir la proteína en todas las comidas principales (no solo en el almuerzo o la cena) para aprovechar mejor la masa muscular. Prueba agregar:`,
        opciones: sugerirAlimentos("proteinasG", 20 - totalesDesayuno.proteinasG, restricciones).slice(0, 3),
      });
    }
  }

  const enRiesgoAlto = requerimiento.riesgoNutricionalMayor && requerimiento.riesgoNutricionalMayor.nivel === "alto";
  const kcalFaltante = requerimiento.get - totales.kcal;
  const carbFaltante = requerimiento.carbohidratosG - totales.carbohidratosG;
  const grasaFaltante = requerimiento.grasasG - totales.grasasG;
  const proteinaFaltante = requerimiento.proteinasG - totales.proteinasG;
  const proteinaCubierta = proteinaFaltante <= requerimiento.proteinasG * 0.15;

  /* Patrón frecuente (saciedad precoz): se cumple proteína pero faltan calorías, carbohidratos
     y grasas a la vez. En ese caso conviene un solo bloque de combos energéticos concentrados
     en vez de tres listas de alimentos sueltos (ver sugerirCombosEnergeticos). */
  const esDeficitTriple = !enRiesgoAlto && perfil.objetivo !== "perdida"
    && kcalFaltante > requerimiento.get * 0.1
    && carbFaltante > requerimiento.carbohidratosG * 0.15
    && grasaFaltante > requerimiento.grasasG * 0.15;

  /* En una persona con desnutrición ya identificada, subir la ingesta de golpe hasta cubrir
     todo el déficit calórico del día (en vez de progresivamente) es justo el escenario que
     puede desencadenar un síndrome de realimentación: caídas súbitas de fósforo, potasio y
     magnesio al reiniciar el metabolismo de carbohidratos, con riesgo de arritmias. Por eso
     aquí se reemplaza la sugerencia habitual de "completa tus kcal" por una más conservadora. */
  if (enRiesgoAlto && kcalFaltante > requerimiento.get * 0.3) {
    sugerencias.push({
      clave: "kcal", nota: true, mensaje: `Detecté riesgo de desnutrición y hoy la ingesta quedó bastante por debajo de tu meta calórica. En este contexto, subir la comida de golpe hasta cubrir todo el déficit no es lo más seguro: existe riesgo de síndrome de realimentación (caída brusca de potasio, fósforo y magnesio). Lo recomendable es aumentar la ingesta de forma gradual en 3-5 días, con control médico y de electrolitos, en vez de intentar cubrir todo hoy mismo.`,
      opciones: [],
    });
  } else if (esDeficitTriple) {
    sugerencias.push({
      clave: "kcal", nota: true, mensaje: `Hoy te faltan calorías (${Math.round(kcalFaltante)} kcal), carbohidratos (${Math.round(carbFaltante)} g) y grasas (${Math.round(grasaFaltante)} g) a la vez${proteinaCubierta ? ", pero tu proteína ya está cubierta" : ""}. En vez de comer más cantidad, conviene fortificar lo que ya comes con combos energéticos concentrados${proteinaCubierta ? " y bajos en proteína, para no pasarte de tu meta" : ""}:`,
      opciones: sugerirCombosEnergeticos(requerimiento, totales, restricciones, proteinaCubierta),
    });
  } else if (perfil.objetivo !== "perdida" && kcalFaltante > requerimiento.get * 0.1) {
    sugerencias.push({
      clave: "kcal", nota: false, mensaje: `Te faltan ${Math.round(kcalFaltante)} kcal para tu meta de ${perfil.objetivo === "ganancia_muscular" ? "ganancia muscular" : "mantenimiento"}. Puedes completarlas con cualquiera de estas opciones:`,
      opciones: sugerirAlimentos("kcal", kcalFaltante, restricciones),
    });
  }
  if (perfil.objetivo === "perdida" && totales.kcal > requerimiento.get) {
    sugerencias.push({ clave: "kcal", nota: true, mensaje: `Superaste tu objetivo calórico de hoy por ${Math.round(totales.kcal - requerimiento.get)} kcal.`, opciones: [] });
  }

  if (proteinaFaltante > requerimiento.proteinasG * 0.15) {
    sugerencias.push({
      clave: "proteinasG", nota: false, mensaje: `Te faltan ${Math.round(proteinaFaltante)} g de proteína. Algunas opciones para cubrirlos:`,
      opciones: sugerirAlimentos("proteinasG", proteinaFaltante, restricciones),
    });
  }

  if (!esDeficitTriple && carbFaltante > requerimiento.carbohidratosG * 0.15) {
    sugerencias.push({
      clave: "carbohidratosG", nota: false, mensaje: `Te faltan ${Math.round(carbFaltante)} g de carbohidratos. Algunas opciones:`,
      opciones: sugerirAlimentos("carbohidratosG", carbFaltante, restricciones),
    });
  }

  if (!esDeficitTriple && grasaFaltante > requerimiento.grasasG * 0.15) {
    sugerencias.push({
      clave: "grasasG", nota: false, mensaje: `Te faltan ${Math.round(grasaFaltante)} g de grasas. Algunas opciones:`,
      opciones: sugerirAlimentos("grasasG", grasaFaltante, restricciones),
    });
  }

  if (totales.sodioMg > requerimiento.sodioMg) {
    sugerencias.push({ clave: "sodioMg", nota: true, mensaje: `Superaste tu límite de sodio (${Math.round(totales.sodioMg)} / ${requerimiento.sodioMg} mg). Modera procesados o enlatados en tu próxima comida.`, opciones: [] });
  }

  if (totales.fibraG < requerimiento.fibraG * 0.6) {
    const fibraFaltante = requerimiento.fibraG - totales.fibraG;
    sugerencias.push({
      clave: "fibraG", nota: false, mensaje: `Tu fibra está baja (${Math.round(totales.fibraG)} / ${requerimiento.fibraG} g). Algunas opciones:`,
      opciones: sugerirAlimentos("fibraG", fibraFaltante, restricciones),
    });
  }

  if (sugerencias.length === 0) sugerencias.push({ clave: "general", nota: false, mensaje: "Vas muy bien encaminado respecto a tu meta de hoy.", opciones: [] });
  return sugerencias;
}

/* Llama a la API de Anthropic (sin necesidad de gestionar una API key) enviando
   la foto de la receta y pidiendo solo los nombres de medicamentos en JSON. */
async function extraerMedicamentosDeFoto(base64Data, mediaType) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: "Esta imagen es una receta médica o el envase de un medicamento. Devuelve SOLO un array JSON con los nombres (genéricos si es posible) de los medicamentos que identifiques con claridad, sin texto adicional ni backticks. Ejemplo: [\"Losartán\", \"Metformina\"]. Si no logras identificar ninguno con certeza, devuelve []." },
        ],
      }],
    }),
  });
  const data = await response.json();
  const texto = (data.content || []).map((b) => b.text || "").join("");
  const limpio = texto.replace(/```json|```/g, "").trim();
  try { const arr = JSON.parse(limpio); return Array.isArray(arr) ? arr : []; } catch { return []; }
}

function buscarSugerenciasPeru(inputCrudo) {
  const norm = normalizarTexto(inputCrudo);
  const claves = Object.keys(INGREDIENTES_PERU_DB);
  let clave = claves.find((k) => normalizarTexto(k) === norm);
  if (!clave) clave = claves.find((k) => norm.includes(normalizarTexto(k)) || normalizarTexto(k).includes(norm));
  const nombreLimpio = inputCrudo.trim();
  if (clave) return { encontrado: true, platos: [...INGREDIENTES_PERU_DB[clave], generarToqueSabor(clave)] };
  return { encontrado: false, platos: [...GENERICO_PERU(nombreLimpio), generarToqueSabor(nombreLimpio)] };
}

function SugeridorIngrediente({ requerimiento }) {
  const [ingrediente, setIngrediente] = useState("");
  const [resultado, setResultado] = useState(null);

  const buscar = () => {
    if (!ingrediente.trim()) return;
    setResultado(buscarSugerenciasPeru(ingrediente));
  };

  const tieneInteraccionVitaminaK = requerimiento.interacciones.some((i) => i.nombre === "Anticoagulantes cumarínicos");

  return (
    <div className="nutri-panel rounded-2xl p-5 mb-5">
      <div className="flex items-center gap-2 mb-2"><IconUtensils size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">¿Qué preparo con...?</span></div>
      <p className="text-xs nutri-muted mb-3">Escribe un ingrediente (ej. queso fresco, palta, pescado) y te sugiero cómo prepararlo o acompañarlo al estilo peruano, ajustado a tus condiciones y medicamentos.</p>
      <div className="flex gap-2 mb-1">
        <input value={ingrediente} onChange={(e) => setIngrediente(e.target.value)} onKeyDown={(e) => e.key === "Enter" && buscar()} placeholder="Ej. queso fresco" className="flex-1 min-w-0 rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink" />
        <button onClick={buscar} disabled={!ingrediente.trim()} className="nutri-brand text-white rounded-lg px-4 text-sm disabled:opacity-40">Sugerir</button>
      </div>
      {resultado && (
        <div className="space-y-3 mt-3">
          {!resultado.encontrado && <p className="text-xs nutri-muted">No tengo una receta específica para ese ingrediente en mi biblioteca todavía, pero aquí van ideas generales al estilo peruano:</p>}
          {resultado.platos.map((p, i) => (
            <div key={i} className="nutri-panel rounded-lg p-3" style={{ borderStyle: "dashed" }}>
              <div className="text-sm font-medium nutri-ink mb-1">{p.tipo === "toque" ? "💫 " : ""}{p.nombre}</div>
              <div className="text-xs nutri-muted mb-1">{p.preparacion}</div>
              {p.acompañamientos && p.acompañamientos !== "-" && <div className="text-xs nutri-ink"><span className="nutri-muted">Acompaña con:</span> {p.acompañamientos}</div>}
              {p.alerta && requerimiento.restricciones[p.alerta] && p.tip && <div className="text-xs nutri-brand-text mt-1">💡 {p.tip}</div>}
              {p.nombre.toLowerCase().includes("espinaca") && tieneInteraccionVitaminaK && <div className="text-xs nutri-warn mt-1">⚠ mantén constante tu consumo habitual de espinaca por tu anticoagulante.</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Componentes visuales ---------- */
function Bar({ value, max, colorClass, marcarExceso = true }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  const over = marcarExceso && max > 0 && value > max;
  const [m, setM] = useState(false);
  useEffect(() => { setM(false); const t = setTimeout(() => setM(true), 80); return () => clearTimeout(t); }, [value, max]);
  return (
    <div className="h-2.5 w-full rounded-full nutri-track overflow-hidden">
      <div className={`h-full rounded-full nutri-bar-fill ${over ? "" : colorClass}`} style={{ width: m ? `${pct}%` : "0%", background: over ? "var(--warn)" : undefined }} />
    </div>
  );
}

/* Barra de avance por nutriente: roja→amarilla→verde mientras se completa la meta,
   y el tramo que excede el 100% se pinta de blanco, separado por una línea en la marca del 100%. */
const ESCALA_BARRA_PCT = 130;
function BarraNutriente({ valor, meta }) {
  const pct = meta > 0 ? (valor / meta) * 100 : 0;
  const pctClamp = Math.max(pct, 0);
  const anchoDentro = Math.min(pctClamp, 100);
  const excedido = pctClamp > 100;
  const anchoExceso = excedido ? Math.min(pctClamp - 100, ESCALA_BARRA_PCT - 100) : 0;
  const color = pctClamp >= 100 ? "var(--st-meta)" : pctClamp >= 50 ? "var(--st-bajo)" : "var(--warn)";
  const posMarca = (100 / ESCALA_BARRA_PCT) * 100;
  return (
    <div className="relative w-full h-1.5 rounded-full nutri-track overflow-hidden mt-1.5">
      <div className="h-full" style={{ width: `${(anchoDentro / ESCALA_BARRA_PCT) * 100}%`, background: color, transition: "width .3s" }} />
      {excedido && (
        <div className="h-full absolute top-0" style={{ left: `${posMarca}%`, width: `${(anchoExceso / ESCALA_BARRA_PCT) * 100}%`, background: "var(--surface)" }} />
      )}
      <div className="absolute top-0 h-full" style={{ left: `${posMarca}%`, width: 1, background: "var(--panel-border)" }} />
    </div>
  );
}

/* Barra horizontal de una sola serie (sin leyenda: el título de la sección ya identifica qué
   mide) para el reporte de aporte por alimento. Un solo color por gráfico, ya que la magnitud
   -no la identidad del alimento- es lo que se compara entre barras. */
function BarraContribucion({ pct, color }) {
  return (
    <div className="h-2 w-full rounded-full nutri-track overflow-hidden">
      <div className="h-full rounded-full" style={{ width: `${Math.min(Math.max(pct, 0), 100)}%`, background: color, transition: "width .3s" }} />
    </div>
  );
}

/* Un solo tipo de gráfico (gauge radial con inclinación 3D y sombra) reutilizado en Panel,
   Historial y el objetivo calórico — así todo el cumplimiento se lee con el mismo lenguaje visual.
   Movimiento: el arco se dibuja con resorte, una perla viaja en su punta, el número cuenta hasta su
   valor, un destello recorre el anillo y, al llegar al 100 %, el anillo pulsa una vez. */
function useContar(valor, dur = 1000, retraso = 0) {
  const [v, setV] = useState(0);
  useEffect(() => {
    const reducir = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reducir) { setV(valor); return; }
    let raf, t0 = null;
    const paso = (t) => {
      if (t0 === null) t0 = t;
      const p = Math.min(Math.max((t - t0 - retraso) / dur, 0), 1);
      setV(valor * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(paso);
    };
    setV(0);
    raf = requestAnimationFrame(paso);
    return () => cancelAnimationFrame(raf);
  }, [valor, dur, retraso]);
  return v;
}
function GaugeRadial({ label, valor, meta, unidad, color, tamano = "md", modo = "porcentaje", animarDelay = 0 }) {
  const size = tamano === "lg" ? 200 : tamano === "md" ? 124 : 92;
  const grosor = tamano === "lg" ? 17 : tamano === "md" ? 11 : 8;
  const centro = size / 2;
  const r = centro - grosor / 2 - 4;
  const c = 2 * Math.PI * r;
  const [montado, setMontado] = useState(false);
  useEffect(() => {
    setMontado(false);
    const t = setTimeout(() => setMontado(true), 60 + animarDelay);
    return () => clearTimeout(t);
  }, [valor, meta, animarDelay]);
  const pctReal = meta > 0 ? valor / meta : 0;
  const pct = montado ? Math.min(pctReal, 1) : 0;
  const cumplida = pctReal >= 1;
  const pctMostrado = meta > 0 ? Math.round(pctReal * 100) : 0;
  const contado = useContar(modo === "numero" ? valor : pctMostrado, 1100, animarDelay);
  const idGrad = `grad-${label.replace(/\s+/g, "")}-${tamano}`;
  const idBrillo = `brillo-${label.replace(/\s+/g, "")}-${tamano}`;
  const transicion = `1.15s cubic-bezier(.22,1.2,.36,1) ${animarDelay}ms`;
  const grande = tamano === "lg";
  return (
    <div className={`anillos-3d relative shrink-0 ${cumplida && montado ? "nutri-gauge-ok" : ""}`} style={{ width: size, height: size, "--gauge-color": color }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="anillos-3d-svg" style={{ filter: `drop-shadow(0 ${grande ? 12 : 7}px ${grande ? 16 : 10}px color-mix(in srgb, ${color} 34%, transparent))`, overflow: "visible" }}>
        <defs>
          <linearGradient id={idGrad} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={color} stopOpacity="0.55" />
            <stop offset="55%" stopColor={color} stopOpacity="0.9" />
            <stop offset="100%" stopColor={color} stopOpacity="1" />
          </linearGradient>
          <radialGradient id={idBrillo} cx="50%" cy="38%" r="60%">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.16" />
            <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
          </radialGradient>
        </defs>
        {/* disco interior con brillo suave */}
        <circle cx={centro} cy={centro} r={r - grosor / 2 - 2} fill={`url(#${idBrillo})`} />
        {/* órbita decorativa que gira despacio */}
        {grande && (
          <g className="nutri-gauge-orbita" style={{ transformOrigin: `${centro}px ${centro}px` }}>
            <circle cx={centro} cy={centro} r={r - grosor - 8} fill="none" stroke="currentColor" strokeOpacity="0.28" strokeWidth="1.5" strokeDasharray="1.5 7" strokeLinecap="round" />
          </g>
        )}
        {/* pista */}
        <circle cx={centro} cy={centro} r={r} fill="none" stroke="var(--track)" strokeWidth={grosor} />
        {/* arco de progreso */}
        <circle
          cx={centro} cy={centro} r={r} fill="none"
          stroke={`url(#${idGrad})`}
          strokeWidth={grosor}
          strokeDasharray={c}
          strokeDashoffset={c - pct * c}
          strokeLinecap="round"
          transform={`rotate(-90 ${centro} ${centro})`}
          style={{ transition: `stroke-dashoffset ${transicion}` }}
        />
        {/* destello que recorre el arco */}
        {pct > 0.02 && (
          <circle
            cx={centro} cy={centro} r={r} fill="none" stroke="#FFFFFF" strokeOpacity="0.55" strokeWidth={Math.max(grosor - 8, 3)}
            strokeLinecap="round" strokeDasharray={`${c * 0.045} ${c}`}
            transform={`rotate(-90 ${centro} ${centro})`} className="nutri-gauge-destello"
            style={{ transformOrigin: `${centro}px ${centro}px`, "--vuelta": `${pct * 360}deg` }}
          />
        )}
        {/* perla en la punta del arco */}
        <g style={{ transformOrigin: `${centro}px ${centro}px`, transform: `rotate(${pct * 360}deg)`, transition: `transform ${transicion}`, opacity: pct > 0 ? 1 : 0 }}>
          <circle cx={centro} cy={centro - r} r={grosor / 2 - 1.5} fill="var(--surface)" stroke={color} strokeWidth="2.5" />
        </g>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-2 tabular-nums">
        {modo === "numero" ? (
          <>
            <span className={grande ? "nutri-serif text-4xl nutri-ink leading-none" : "nutri-serif text-base nutri-ink"}>{Math.round(contado)}</span>
            <span className="text-[11px] nutri-muted text-center leading-tight mt-1">de {Math.round(meta)} {unidad}</span>
            {grande && <span className="nutri-gauge-pct mt-1.5">{pctMostrado >= 100 ? "¡meta cumplida!" : `${pctMostrado}%`}</span>}
          </>
        ) : (
          <>
            <span className={grande ? "nutri-serif text-4xl nutri-ink leading-none" : tamano === "md" ? "nutri-serif text-xl nutri-ink leading-none" : "text-sm font-medium nutri-ink"}>{Math.round(contado)}<span className={grande ? "text-lg" : "text-xs"}>%</span></span>
            {grande && <span className="text-[11px] nutri-muted text-center leading-tight mt-1">{pctMostrado >= 100 ? "¡meta cumplida!" : "de tu meta"}</span>}
          </>
        )}
      </div>
    </div>
  );
}

/* Vista de cumplimiento: por defecto una cuadrícula de gauges independientes, uno por
   nutriente (sin superponerse, para que no se lean como "anillos dentro de anillos"); al
   tocar un nutriente, el resto desaparece y se aísla su gauge en grande con el detalle exacto. */
function PanelMetas({ totales, requerimiento, tamanoGrid = "md", log }) {
  const metricas = [
    { key: "kcal", label: "Calorías", valor: totales.kcal, meta: requerimiento.get, unidad: "kcal", color: "var(--accent-energy)" },
    { key: "proteinasG", label: "Proteína", valor: totales.proteinasG, meta: requerimiento.proteinasG, unidad: "g", color: "var(--accent-protein)" },
    { key: "carbohidratosG", label: "Carbohidratos", valor: totales.carbohidratosG, meta: requerimiento.carbohidratosG, unidad: "g", color: "var(--accent-carb)" },
    { key: "grasasG", label: "Grasas", valor: totales.grasasG, meta: requerimiento.grasasG, unidad: "g", color: "var(--accent-fat)" },
  ];
  const [seleccionado, setSeleccionado] = useState(null);

  if (seleccionado !== null) {
    const m = metricas[seleccionado];
    const pct = m.meta > 0 ? Math.round((m.valor / m.meta) * 100) : 0;
    const porMomento = MOMENTOS_KEYS.map((momento) => {
      const items = (log || [])
        .filter((it) => it.momento === momento)
        .map((it) => ({ ...it, aporte: calcularTotalesItem(it.alimento, it.gramos)[m.key] }))
        .filter((it) => it.aporte > 0)
        .sort((a, b) => b.aporte - a.aporte);
      return { momento, items };
    }).filter((g) => g.items.length > 0);
    return (
      <div key="detalle" className="nutri-fade-in flex flex-col items-center py-2">
        <GaugeRadial label={m.label} valor={m.valor} meta={m.meta} unidad={m.unidad} color={m.color} tamano="lg" modo="porcentaje" />
        <span className="text-sm font-medium nutri-ink mt-3">{m.label}</span>
        <span className="text-xs nutri-muted">{Math.round(m.valor)} / {Math.round(m.meta)} {m.unidad} · {pct}%{pct >= 100 ? " ✓" : ""}</span>
        {log && (
          <div className="w-full mt-4 text-left">
            {porMomento.length === 0 ? (
              <p className="text-xs nutri-muted text-center">Ningún alimento registrado aportó {m.label.toLowerCase()}.</p>
            ) : porMomento.map((g) => (
              <div key={g.momento} className="mb-3">
                <span className="text-xs font-medium nutri-ink capitalize block mb-1">{MOMENTO_LABEL_CAPITALIZADO[g.momento]}</span>
                <ul className="space-y-0.5">
                  {g.items.map((it, i) => (
                    <li key={i} className="text-xs nutri-muted flex items-center justify-between">
                      <span>{it.alimento.nombre} ({it.gramos} g)</span>
                      <span className="nutri-ink">{Math.round(it.aporte)} {m.unidad}</span>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        )}
        <button onClick={() => setSeleccionado(null)} className="text-xs nutri-brand-text mt-1 underline">‹ Ver todas las metas</button>
      </div>
    );
  }

  return (
    <div key="lista" className="nutri-fade-in">
      <div className="grid grid-cols-2 gap-3 py-2">
        {metricas.map((m, i) => {
          const pct = m.meta > 0 ? Math.round((m.valor / m.meta) * 100) : 0;
          const cumplida = pct >= 100;
          return (
            <button key={m.key} onClick={() => setSeleccionado(i)} className="nutri-metrica flex flex-col items-center rounded-2xl px-2 pt-3 pb-3" style={{ "--m": m.color, animationDelay: `${i * 90}ms` }}>
              <GaugeRadial label={m.label} valor={m.valor} meta={m.meta} unidad={m.unidad} color={m.color} tamano={tamanoGrid} modo="porcentaje" animarDelay={i * 110} />
              <span className="text-sm font-medium nutri-ink mt-2">{m.label}</span>
              <span className="text-[11px] nutri-muted tabular-nums">{Math.round(m.valor)} / {Math.round(m.meta)} {m.unidad}</span>
              <span className={`nutri-metrica-chip mt-1.5 ${cumplida ? "ok" : ""}`}>{cumplida ? "✓ Cumplida" : `Falta ${Math.max(100 - pct, 0)} %`}</span>
            </button>
          );
        })}
      </div>
      <p className="text-[11px] nutri-muted text-center mt-1">Toca un nutriente para ver su detalle.</p>
    </div>
  );
}

  const responder = (key, valor) => setPerfil((p) => ({ ...p, mnaSF: { ...(p.mnaSF || {}), [key]: valor } }));
  const resultado = calcularPuntajeMNA(mnaSF, imc);

  return (
    <div className="nutri-panel rounded-2xl p-5 mt-5">

      <p className="text-xs nutri-muted mb-4">Cuestionario corto y validado para detectar riesgo de desnutrición en personas mayores. Complétalo una vez y actualízalo si algo cambia (una enfermedad, un cambio de apetito, etc.).</p>
      {MNA_PREGUNTAS.map((p) => (

          </select>

      ))}
      <p className="text-xs nutri-muted mb-3">IMC (calculado automáticamente de tu peso y talla): {imc.toFixed(1)} → {puntosIMC} punto{puntosIMC === 1 ? "" : "s"} de 3 en esta escala.</p>
      {resultado ? (
        <div className="nutri-panel rounded-lg p-3" style={{ borderStyle: "dashed" }}>

          </p>

        <p className="text-xs nutri-muted">Responde las 5 preguntas para ver tu puntaje.</p>

        <span className="text-sm font-medium nutri-ink block mb-1">Tamizaje de disfagia (dificultad para tragar)</span>

      </div>
    </div>
  );
}

/* ===================================================================================
   Hoja "¿Qué comiste?" (Registro): Buscar (cuadrícula 4 por fila, frecuentes por momento,
   ficha con − / + y recipiente en pantalla aparte) y Escribir (texto resaltado + plato).

function HojaQueComiste({ fecha, logDia, recipientes, historial, requerimiento, addItem, momentoInicial, onCerrar, onRegistrado }) {

  const totPlato = sumaMacros(plato);

  const cerrar = () => { setCerrando(true); setTimeout(onCerrar, 330); };
