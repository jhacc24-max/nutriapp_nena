  }, [texto, modo]);

  /* ---------- Buscar ---------- */
  const frecuentes = useMemo(() => frecuentesPorMomento(historial, momento), [historial, momento]);
  const resultados = useMemo(() => {
    const q = normalizarTexto(busqueda);
    if (!q) return null;
    return FOOD_DB.filter((f) => coincideBusqueda(f, q)).slice(0, 16);
  }, [busqueda]);
  const abrirFicha = (alimento) => { const en = plato.find((x) => x.alimento.id === alimento.id && x.origen === "buscar"); setFicha({ alimento, g: en ? en.gramos : porcionDe(alimento), recId: "ninguno", carneUid: null }); };
  const recFicha = ficha ? recipientes.find((r) => r.id === ficha.recId) : null;
  const taraFicha = recFicha ? Number(recFicha.taraG) || 0 : 0;
  const carnes = logDia.filter((it) => it.momento === "almuerzo" && it.alimento && it.alimento.categoria === "proteina");
  const carneFicha = ficha && ficha.carneUid ? logDia.find((it) => it.uid === ficha.carneUid) : null;
  const netoFicha = ficha ? Math.max(0, Math.round(ficha.g - taraFicha - (carneFicha ? carneFicha.gramos : 0))) : 0;
  const agregarDeFicha = () => {
    const tara = (recFicha || carneFicha) ? { recipiente: recFicha ? recFicha.nombre : null, pesoBruto: ficha.g, tara: taraFicha, carneNombre: carneFicha ? carneFicha.alimento.nombre : null, carneGramos: carneFicha ? carneFicha.gramos : null } : null;
    setPlato((prev) => [...prev.filter((x) => !(x.alimento.id === ficha.alimento.id && x.origen === "buscar")), { alimento: ficha.alimento, gramos: netoFicha, exacto: true, tara, origen: "buscar" }]);
    setFicha(null); setElegirRec(false);
  };

  const registrar = () => {
    if (!plato.length) return;
    setExito(true);
    plato.forEach((it) => addItem(it.alimento, it.gramos, momento, it.tara || null, fecha));
    if (onRegistrado) onRegistrado(plato.map((it) => ({ ...it, momento })));
    setTimeout(cerrar, 750);
  };
  const cambiarGramos = (idx, v, escrito) => setPlato((prev) => prev.map((x, i) => (i === idx ? { ...x, gramos: v, exacto: escrito, tocado: true, tara: null } : x)));
  const quitar = (idx) => setPlato((prev) => prev.filter((_, i) => i !== idx));

  const POS = [[50, 27], [74, 46], [66, 73], [36, 75], [24, 50], [32, 27]];
  const nombreMom = MOMENTO_LABEL_CAPITALIZADO[momento];

  return (
    <div className={`qc-capa ${cerrando ? "cierra" : ""}`} role="dialog" aria-modal="true" aria-label="¿Qué comiste?">
      <div className="qc-fondo" onClick={cerrar} />
      <div className="qc-hoja" onClick={() => picker && setPicker(false)}>
        <div className="qc-asa" />
        <div className="qc-cab">
          <h2>¿Qué comiste?</h2>
          <button type="button" className="qc-vidrio" aria-haspopup="listbox" onClick={(e) => { e.stopPropagation(); setPicker((v) => !v); }}>{MOMENTO_EMOJI[momento]} <span key={momento} className="qc-morph">{nombreMom}</span> ▾</button>
          <button type="button" className="qc-x" aria-label="Cerrar" onClick={cerrar}>✕</button>
          {picker && (
            <div className="qc-picker" role="listbox">
              {MOMENTOS_KEYS.map((m) => <button key={m} type="button" className={m === momento ? "on" : ""} onClick={() => cambiarMomento(m)}>{MOMENTO_EMOJI[m]} {MOMENTO_LABEL_CAPITALIZADO[m]}</button>)}
            </div>
          )}
        </div>
        <div className={`qc-seg ${modo === "escribir" ? "der" : ""}`}>
          <span className="ind" />
          <button type="button" className={modo === "buscar" ? "on" : ""} onClick={() => setModo("buscar")}>🔍 Buscar</button>
          <button type="button" className={modo === "escribir" ? "on" : ""} onClick={() => setModo("escribir")}>✍ Escribir</button>
        </div>

        <div className="qc-zona">
          {modo === "buscar" ? (
            <div key="b" className="qc-vista entra-izq">
              <label className="qc-buscador"><IconSearch size={16} /><input type="search" placeholder="Busca o filtra tus alimentos…" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} aria-label="Buscar alimento" /></label>
              <p className="qc-tsec">{resultados ? (resultados.length === 1 ? "1 resultado" : `${resultados.length} resultados`) : `Lo que sueles comer ${{ desayuno: "en el desayuno", almuerzo: "en el almuerzo", cena: "en la cena", colacion: "en la colación" }[momento]}`}</p>
              <div className="qc-rejilla" key={momento + (resultados ? "r" : "f")}>
                {(resultados ? resultados.map((a) => ({ alimento: a, veces: 0 })) : frecuentes).map(({ alimento, veces }, i) => {
                  const en = plato.find((x) => x.alimento.id === alimento.id);
                  return (
                    <button key={alimento.id} type="button" className={`qc-tile ${en ? "tiene" : ""}`} style={{ animationDelay: `${i * 30}ms` }} onClick={() => abrirFicha(alimento)}>
                      {en && <span className="badge">{en.gramos} g</span>}
                      <IconoAlimento alimento={alimento} size={34} />
                      <span className="tn">{nombreMosaico(alimento)}</span>
                      {veces > 0 && <span className="veces">{veces} {veces === 1 ? "vez" : "veces"}</span>}
                    </button>
                  );
                })}
                {resultados && resultados.length === 0 && <p className="qc-vacio">No encontramos "{busqueda}" en la base de alimentos.</p>}
              </div>
            </div>
          ) : (
            <div key="e" className="qc-vista entra-der">
              <div className="qc-campo">
                <div className="qc-espejo" aria-hidden="true">{resaltarTexto(texto)}</div>
                <textarea rows={3} value={texto} onChange={(e) => setTexto(e.target.value)} placeholder="Escribe como hablas: almorcé una taza de arroz, 120 g de pollo y ensalada…" aria-label="Escribe lo que comiste" autoFocus />
              </div>
              <div className="qc-plato">
                <svg className="aro" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="var(--tint)" strokeWidth="6" /><circle cx="75" cy="75" r="70" fill="none" stroke={colorEstado(totPlato.kcal / (meta || 1))} strokeWidth="6" strokeLinecap="round" transform="rotate(-90 75 75)" strokeDasharray="440" strokeDashoffset={440 * (1 - Math.min(1, totPlato.kcal / (meta || 1)))} style={{ transition: "stroke-dashoffset .7s cubic-bezier(.2,0,0,1), stroke .5s" }} /></svg>
                <div className="base" />
                {plato.slice(0, 6).map((it, j) => <span key={it.alimento.id} className="en-plato" style={{ left: POS[j][0] + "%", top: POS[j][1] + "%" }}><IconoAlimento alimento={it.alimento} size={36} /></span>)}
                <div className="centro"><div><strong className="num-u"><NumeroAnimado valor={totPlato.kcal} /></strong><span>kcal · meta {Math.round(meta)}</span></div></div>
              </div>
              <div className="qc-lista">
                {plato.map((it, i) => { const t = calcularTotalesItem(it.alimento, it.gramos); return (
                  <div key={it.alimento.id + it.origen} className="qc-fila sube">
                    <IconoAlimento alimento={it.alimento} size={30} />
                    <span className="n">{nombreCorto(it.alimento)}<span className={`est ${it.exacto ? "exacto" : ""}`}>{it.tocado ? "ajustado" : it.exacto ? "exacto" : "est."}</span><small><span className="num-u">{Math.round(t.kcal)}</span> kcal · <span className="num-u">{t.proteinasG.toFixed(1)}</span> g prot</small></span>
                    <Pasos valor={it.gramos} onCambio={(v, e) => cambiarGramos(i, v, e)} />
                  </div>); })}
                {desconocidos.map((d) => <div key={d} className="qc-desc sube"><span className="q">?</span><span><b>«{d}»</b> no está en tu base de alimentos. Búscalo en "Buscar" o elige uno parecido.</span></div>)}
              </div>
            </div>
          )}

          {ficha && (
            <div className="qc-ficha">
              <div className="cab-f">
                <IconoAlimento alimento={ficha.alimento} size={52} className="nutri-ico-pop" />
                <div className="tx"><b>{nombreCorto(ficha.alimento)}</b><span><span className="num-u">{ficha.alimento.kcal}</span> kcal por 100 g</span></div>
                <button type="button" className="qc-x" aria-label="Cerrar" onClick={() => { setFicha(null); setElegirRec(false); }}>✕</button>
              </div>
              <div className="qc-chips">
                {porcionesRapidas(ficha.alimento).map(([n, g]) => <button key={n} type="button" className={`qc-chip ${ficha.g - taraFicha === g ? "on" : ""}`} onClick={() => setFicha((f) => ({ ...f, g: g + taraFicha + (carneFicha ? carneFicha.gramos : 0) }))}>{n}</button>)}
              </div>
              <div className="qc-centro"><span className="qc-mini">{(recFicha || carneFicha) ? "Peso total en la balanza" : "Peso del alimento"}</span><Pasos grande valor={ficha.g} onCambio={(v) => setFicha((f) => ({ ...f, g: v }))} /></div>
              {(() => { const t = calcularTotalesItem(ficha.alimento, netoFicha); return (
                <div className="qc-macros">
                  <div><strong className="num-u"><NumeroAnimado valor={t.kcal} duracion={300} /></strong>kcal</div>
                  <div><strong className="num-u"><NumeroAnimado valor={t.proteinasG} decimales={1} duracion={300} /><small>g</small></strong>proteína</div>
                  <div><strong className="num-u"><NumeroAnimado valor={t.carbohidratosG} decimales={1} duracion={300} /><small>g</small></strong>carbohid.</div>
                  <div><strong className="num-u"><NumeroAnimado valor={t.grasasG} decimales={1} duracion={300} /><small>g</small></strong>grasa</div>
                </div>); })()}
              <div className="qc-recip">
                <button type="button" className={`qc-toggle ${(recFicha || carneFicha) ? "on" : ""}`} role="switch" aria-checked={!!(recFicha || carneFicha)} onClick={() => { if (recFicha || carneFicha) setFicha((f) => ({ ...f, g: netoFicha, recId: "ninguno", carneUid: null })); else setElegirRec(true); }}>
                  <span>Lo pesé con un recipiente</span><span className="sw" />
                </button>
                {(recFicha || carneFicha) && (
                  <div className="qc-recfila">
                    <button type="button" className="elegido" onClick={() => setElegirRec(true)}>{recFicha && <IconoRecipiente nombre={recFicha.nombre} />}{[recFicha && `${recFicha.nombre} · ${taraFicha} g`, carneFicha && `− ${nombreCorto(carneFicha.alimento)} ${carneFicha.gramos} g`].filter(Boolean).join(" ")} ›</button>
                    <span className="qc-mini">Neto <b className="num-u">{netoFicha} g</b></span>
                  </div>
                )}
              </div>
              <button type="button" className="qc-btn" disabled={netoFicha <= 0} onClick={agregarDeFicha}>Agregar {netoFicha} g al plato</button>

              {elegirRec && (
                <div className="qc-recipientes">
                  <button type="button" className="qc-atras" onClick={() => setElegirRec(false)}>‹ <IconoAlimento alimento={ficha.alimento} size={24} /> {nombreCorto(ficha.alimento)}</button>
                  <h3>¿En qué lo pesaste?</h3>
                  <p>Se descuenta su peso (tara) para guardar solo el alimento.</p>
                  <div className="qc-rlista">
                    {[{ id: "ninguno", nombre: "", taraG: 0 }, ...recipientes].map((r, i) => (
                      <button key={r.id} type="button" className={`qc-rop ${ficha.recId === r.id ? "on" : ""}`} style={{ animationDelay: `${i * 40}ms` }}
                        onClick={() => { const t0 = taraFicha, t1 = Number(r.taraG) || 0; setFicha((f) => ({ ...f, recId: r.id, g: Math.max(1, f.g - t0 + t1) })); setTimeout(() => setElegirRec(false), 220); }}>
                        <IconoRecipiente nombre={r.nombre} /><b>{r.nombre || "Sin recipiente"}</b><span>{r.id === "ninguno" ? "peso directo" : `tara ${Number(r.taraG) || 0} g`}</span>
                      </button>
                    ))}
                  </div>
                  {recipientes.some((r) => !(Number(r.taraG) > 0)) && <p className="qc-mini">Los recipientes con tara 0 g todavía no tienen su peso: se configura en Opciones › Recipientes.</p>}
                  {momento === "almuerzo" && ficha.alimento.categoria !== "proteina" && carnes.length > 0 && (
                    <div className="qc-carne">
                      <h4>¿Lo pesaste junto con una carne ya registrada?</h4>
                      <div className="qc-chips wrap">
                        <button type="button" className={`qc-chip ${!ficha.carneUid ? "on" : ""}`} onClick={() => setFicha((f) => ({ ...f, g: carneFicha ? f.g - carneFicha.gramos : f.g, carneUid: null }))}>No, es aparte</button>
                        {carnes.map((c) => <button key={c.uid} type="button" className={`qc-chip ${ficha.carneUid === c.uid ? "on" : ""}`} onClick={() => setFicha((f) => ({ ...f, g: f.g - (carneFicha ? carneFicha.gramos : 0) + c.gramos, carneUid: c.uid }))}>Restar {nombreCorto(c.alimento)} ({c.gramos} g)</button>)}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="qc-pie">
          {modo === "buscar" && (
            <div className={`qc-bandeja ${plato.length ? "llena" : ""}`} key={plato.length}>
              <span className="mini-plato">{plato.slice(-4).map((x) => <IconoAlimento key={x.alimento.id} alimento={x.alimento} size={22} />)}</span>
              <span className="info"><b>{plato.length ? `${plato.length} alimento${plato.length === 1 ? "" : "s"} en el plato` : "El plato está vacío"}</b>{plato.length ? <><span className="num-u">{Math.round(totPlato.kcal)}</span> kcal de {Math.round(meta)} · {nombreMom}</> : "Toca un alimento para agregarlo"}</span>
              {plato.length > 0 && <button type="button" className="qc-vaciar" onClick={() => setPlato([])}>Vaciar</button>}
            </div>
          )}
          <button type="button" className={`qc-btn ${exito ? "exito" : ""}`} disabled={!plato.length} onClick={registrar}>
            <span className="txt">Registrar {plato.length ? plato.length + " " : ""}en {nombreMom}</span>
            <svg className="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" strokeDasharray="24" /></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================================
   Menú de hoy (rediseño 2026-10-23, aprobado): avance del día con colores por estado,
   las 4 comidas, ventana "Arma por partes" por comida y pasar al registro.
   Mockups: docs-base/pantallas/P-05-menu*.png
   =================================================================================== */
const ESTADO_AVANCE = (p) => p > 1.05 ? "exceso" : p >= .85 ? "meta" : p > 0 ? "bajo" : "cero";
const COLOR_ESTADO = { cero: "var(--border)", bajo: "var(--st-bajo)", meta: "var(--st-meta)", exceso: "var(--st-exceso)" };
const colorEstado = (p) => COLOR_ESTADO[ESTADO_AVANCE(p)];
const TEXTO_ESTADO = (p) => p > 1.05 ? `▲ Te pasaste ${Math.round((p - 1) * 100)} %` : p >= 1 ? "✓ ¡Meta cumplida!" : p >= .85 ? "● ¡Por llegar a tu meta!" : p > 0 ? "◐ Vas en camino" : "○ Elige tu primera comida";

function AnilloAvance({ pct, size = 88, grosor = 10 }) {
  const r = (size - grosor) / 2, c = 2 * Math.PI * r, h = size / 2, est = ESTADO_AVANCE(pct);
  const [estallido, setEstallido] = useState(0);
  const prev = useRef(est);
  useEffect(() => { if (est === "meta" && prev.current !== "meta") setEstallido((x) => x + 1); prev.current = est; }, [est]);
  return (
    <span className={`mh-ring est-${est}`} style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={h} cy={h} r={r} fill="none" stroke="var(--tint)" strokeWidth={grosor} />
        <circle cx={h} cy={h} r={r} fill="none" stroke={COLOR_ESTADO[est]} strokeWidth={grosor} strokeLinecap="round" transform={`rotate(-90 ${h} ${h})`} strokeDasharray={c} strokeDashoffset={c * (1 - Math.min(1, pct))} className="arco" />
        <circle cx={h} cy={h} r={r} fill="none" stroke="var(--st-exceso)" strokeWidth={grosor - 3} strokeLinecap="round" transform={`rotate(-90 ${h} ${h})`} strokeDasharray={c} strokeDashoffset={c * (1 - Math.max(0, Math.min(1, pct - 1)))} className="arco" style={{ filter: "brightness(.8)" }} />
      </svg>
      {estallido > 0 && <span key={estallido} className="mh-estallido" aria-hidden="true">{Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2, d = 46 + (i % 3) * 7; return <i key={i} style={{ "--x": `${Math.cos(a) * d}px`, "--y": `${Math.sin(a) * d}px`, background: i % 3 ? "var(--st-meta)" : "var(--tone-300)" }} />; })}</span>}
    </span>
  );
}

function AvanceDia({ total, requerimiento, latir }) {
  const metas = { kcal: requerimiento.get || 1, p: requerimiento.proteinasG || 1, c: requerimiento.carbohidratosG || 1, g: requerimiento.grasasG || 1 };
  const p = total.kcal / metas.kcal, est = ESTADO_AVANCE(p);
  const COLS = [["kcal", "calorias", "Calorías", ""], ["p", "proteina", "Proteína", " g"], ["c", "carbohidratos", "Carbohid.", " g"], ["g", "grasas", "Grasa", " g"]];
  return (
    <div className={`mh-avance est-${est}`}>
      <div className="mh-av-top">
        <AnilloAvance pct={p} />
        <div className="info">
          <div className="grande"><span className="pcw num-u"><NumeroAnimado valor={p * 100} duracion={900} /></span><small>%</small></div>
          <p>de tu meta de hoy · <b className="num-u"><NumeroAnimado valor={total.kcal} duracion={900} /></b> de {Math.round(metas.kcal)} kcal</p>
          <span className="mh-estado">{TEXTO_ESTADO(p)}</span>
        </div>
      </div>
      <div className="mh-nutris">
        {COLS.map(([k, ik, n, u]) => { const pk = total[k] / metas[k], ek = ESTADO_AVANCE(pk); return (
          <div key={k} className={`mh-nutri ${ek === "exceso" ? "exceso" : ""}`}>
            <IconoAlimento clave={ik} size={30} key={latir + k} className={latir ? "mh-late" : ""} />
            <span className="val"><b className="num-u"><NumeroAnimado valor={total[k]} duracion={900} /></b>{u}</span>
            <span className="barra"><i style={{ width: `${Math.min(100, pk * 100)}%`, background: COLOR_ESTADO[ek] }} /></span>
            <small>{n} · <span className="num-u">{Math.round(pk * 100)}</span>%</small>
          </div>); })}
      </div>
    </div>
  );
}

/* Metas de una comida: el requerimiento del día repartido según el % de esa comida */
const metasMomento = (req, m) => { const f = (MEAL_DEFS.find((d) => d.key === m) || {}).pct || 0.25; return { kcal: (req.get || 0) * f || 1, p: (req.proteinasG || 0) * f || 1, c: (req.carbohidratosG || 0) * f || 1, g: (req.grasasG || 0) * f || 1 }; };
const NUTRIS_MENU = [["kcal", "calorias", "Calorías", ""], ["p", "proteina", "Proteína", " g"], ["c", "carbohidratos", "Carbohid.", " g"], ["g", "grasas", "Grasa", " g"]];
/* Los 4 indicadores (calorías, proteína, carbohidratos, grasa) con valor, barra y %, por comida */
function NutrisComida({ total, metas, compacto }) {
  return (
    <div className={`mh-nutris ${compacto ? "compacto" : ""}`}>
      {NUTRIS_MENU.map(([k, ik, n, u]) => { const pk = total[k] / metas[k], ek = ESTADO_AVANCE(pk); return (
        <div key={k} className={`mh-nutri ${ek === "exceso" ? "exceso" : ""}`}>
          <IconoAlimento clave={ik} size={compacto ? 22 : 30} />
          <span className="val"><b className="num-u"><NumeroAnimado valor={total[k]} duracion={500} /></b>{u}</span>
          <span className="barra"><i style={{ width: `${Math.min(100, pk * 100)}%`, background: COLOR_ESTADO[ek] }} /></span>
          <small>{compacto ? <>de <span className="num-u">{Math.round(metas[k])}</span>{u} · </> : <>{n} · </>}<span className="num-u" style={{ color: COLOR_ESTADO[ek] === "var(--border)" ? undefined : COLOR_ESTADO[ek], fontWeight: 600 }}>{Math.round(pk * 100)}</span>%</small>
        </div>); })}
    </div>
  );
}

/* Ventana de una comida: variantes de un toque arriba; lo elegido sube con sus pesos y el resto
   baja a "¿Algo más?". Las animaciones de subir/bajar usan la técnica FLIP. */
const PARTES_MENU = [["Base", ["carbohidrato", "quinua", "menestra"]], ["Proteína", ["proteina"]], ["Lácteos", ["lacteo"]], ["Fruta", ["fruta"]], ["Verduras", ["vegetal"]], ["Extras", ["grasa"]]];
function VentanaComida({ momento, variantes, inicial, requerimiento, base, onConfirmar, onCerrar }) {
  const [sel, setSel] = useState(() => (inicial || []).map((it) => ({ alimento: it.alimento, gramos: it.gramos })));
  const [variante, setVariante] = useState(null);
  const [nuevos, setNuevos] = useState([]);
  const [saliendo, setSaliendo] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const contRef = useRef(null), posiciones = useRef(null);
  const meta = metaMomento(requerimiento, momento), metas = metasMomento(requerimiento, momento);
  const resultados = useMemo(() => {
    const q = normalizarTexto(busqueda);
    if (!q) return null;
    return FOOD_DB.filter((f) => coincideBusqueda(f, q)).slice(0, 16);
  }, [busqueda]);
  const disponibles = useMemo(() => {
    const ids = new Set(); variantes.forEach((v) => v.items.forEach((it) => ids.add(it.alimento.id)));
    (FRECUENTES_BASE[momento] || []).forEach((id) => ids.add(id));
    return [...ids].map((id) => ALIMENTO_POR_ID[id]).filter(Boolean);
  }, [variantes, momento]);
  const porcionVar = (a) => { const gs = []; variantes.forEach((v) => v.items.forEach((it) => { if (it.alimento.id === a.id) gs.push(it.gramos); })); return gs.length ? Math.round(gs.reduce((x, y) => x + y, 0) / gs.length / 5) * 5 : porcionDe(a); };
  const capturar = () => { const m = {}; if (contRef.current) contRef.current.querySelectorAll("[data-flip]").forEach((el) => { m[el.dataset.flip] = el.getBoundingClientRect(); }); posiciones.current = m; };
  useLayoutEffect(() => {
    const antes = posiciones.current; posiciones.current = null;
    if (!antes || !contRef.current || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    contRef.current.querySelectorAll("[data-flip]").forEach((el) => {
      const a = antes[el.dataset.flip]; if (!a) return; const b = el.getBoundingClientRect(); const dx = a.left - b.left, dy = a.top - b.top; if (!dx && !dy) return;
      el.style.transition = "none"; el.style.transform = `translate(${dx}px, ${dy}px)`; el.style.zIndex = 3;
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = "transform .55s cubic-bezier(.2,0,0,1.2)"; el.style.transform = ""; setTimeout(() => { el.style.zIndex = ""; }, 600); }));
    });
  });
  const elegirVariante = (i) => { capturar(); setVariante(i); const it = variantes[i].items.map((x) => ({ alimento: x.alimento, gramos: x.gramos })); setSel(it); setNuevos(it.map((x) => x.alimento.id)); if (contRef.current) contRef.current.scrollTo({ top: 0, behavior: "smooth" }); };
  const sumar = (a) => { capturar(); setVariante(null); setSel((s) => s.some((x) => x.alimento.id === a.id) ? s : [...s, { alimento: a, gramos: porcionVar(a) }]); setNuevos([a.id]); };
  const sumarBuscado = (a) => { sumar(a); setBusqueda(""); if (contRef.current) contRef.current.scrollTo({ top: 0, behavior: "smooth" }); };
  const quitar = (i) => { capturar(); setVariante(null); setSel((s) => s.filter((_, j) => j !== i)); setNuevos([]); };
  const t = sumaMacros(sel);
  /* El avance es del DÍA: lo ya registrado + las otras comidas del menú + lo elegido aquí */
  const b = base || { kcal: 0, p: 0, c: 0, g: 0 };
  const dia = { kcal: b.kcal + t.kcal, p: b.p + t.p, c: b.c + t.c, g: b.g + t.g };
  const metasDia = { kcal: requerimiento.get || 1, p: requerimiento.proteinasG || 1, c: requerimiento.carbohidratosG || 1, g: requerimiento.grasasG || 1 };
  const pm = dia.kcal / metasDia.kcal;
  const elegidos = new Set(sel.map((x) => x.alimento.id));
  const partes = PARTES_MENU.map(([n, cats]) => [n, disponibles.filter((a) => cats.includes(a.categoria) && !elegidos.has(a.id))]).filter((p) => p[1].length);
  const cerrar = (ok) => { setSaliendo(true); setTimeout(() => (ok ? onConfirmar(sel) : onCerrar()), 260); };
  const nom = MOMENTO_LABEL_CAPITALIZADO[momento];
  return (
    <div className={`mh-ventana ${saliendo ? "sale" : ""}`} role="dialog" aria-modal="true" aria-label={nom}>
      <div className="mh-v-cab"><span className="emo">{MOMENTO_EMOJI[momento]}</span><h2>{nom}<small>Sugerido para esta comida: ~<span className="num-u">{Math.round(meta)}</span> kcal</small></h2><button type="button" className="qc-x" aria-label="Cerrar" onClick={() => cerrar(false)}>✕</button></div>
      <div className="mh-resumen">
        <AnilloAvance pct={pm} size={46} grosor={5} />
        <div className="tx"><b>Tu día: <span className="num-u"><NumeroAnimado valor={dia.kcal} duracion={400} /></span> de {Math.round(metasDia.kcal)} kcal</b><span>{sel.length ? <>Esta comida suma <b className="num-u" style={{ display: "inline", fontSize: "inherit" }}>{Math.round(t.kcal)}</b> kcal · {TEXTO_ESTADO(pm)}</> : "Elige una variante, busca o toca alimentos"}</span></div>
        <span className="num-u pct" style={{ color: colorEstado(pm) }}>{Math.round(pm * 100)}%</span>
        <NutrisComida total={dia} metas={metasDia} compacto />
      </div>
      <div className="mh-v-cuerpo" ref={contRef}>
        <label className="qc-buscador">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Busca cualquier alimento (ej. Ensure)" aria-label="Buscar alimento" />
          {busqueda && <button type="button" className="qc-x" style={{ width: 26, height: 26 }} aria-label="Borrar búsqueda" onClick={() => setBusqueda("")}>✕</button>}
        </label>
        {resultados && (
          <div className="mh-buscados">
            <p className="qc-tsec">{resultados.length ? `${resultados.length} resultado${resultados.length === 1 ? "" : "s"} · toca para sumar` : "No encontré ese alimento"}</p>
            <div className="qc-rejilla">{resultados.map((a) => <button key={a.id} type="button" className={`qc-tile ${elegidos.has(a.id) ? "tiene" : ""}`} onClick={() => sumarBuscado(a)}><IconoAlimento alimento={a} size={34} /><span className="tn">{nombreMosaico(a)}</span></button>)}</div>
          </div>
        )}
        <p className="qc-tsec">Tus variantes · un toque</p>
        <div className="mh-rapidas">
          {variantes.map((v, i) => (
            <button key={i} type="button" className={`mh-rapida ${variante === i ? "on" : ""}`} onClick={() => elegirVariante(i)}>
              <span className="icos">{v.items.slice(0, 3).map((it) => <IconoAlimento key={it.alimento.id} alimento={it.alimento} size={20} />)}</span>
              {v.nombre}{v.veces > 0 && <small>{v.veces}×</small>}
            </button>
          ))}
        </div>
        {sel.length > 0 && (
          <div className="mh-seleccion">
            <div className="t-sel"><span>Tu {nom.toLowerCase()}</span><button type="button" onClick={() => { capturar(); setSel([]); setVariante(null); }}>Empezar de nuevo</button></div>
            <div className="qc-rejilla">{sel.map((x) => <button key={x.alimento.id} type="button" data-flip={x.alimento.id} className="qc-tile tiene"><IconoAlimento alimento={x.alimento} size={34} /><span className="tn">{nombreMosaico(x.alimento)}</span></button>)}</div>
            <div className="mh-pesos">
              {sel.map((x, i) => { const tt = calcularTotalesItem(x.alimento, x.gramos); return (
                <div key={x.alimento.id} className={`it ${nuevos.includes(x.alimento.id) ? "peso-in" : ""}`} style={{ animationDelay: `${nuevos.indexOf(x.alimento.id) * 80 + 380}ms` }}>
                  <IconoAlimento alimento={x.alimento} size={26} />
                  <span className="n">{nombreCorto(x.alimento)}<small><span className="num-u">{Math.round(tt.kcal)}</span> kcal</small></span>
                  <Pasos valor={x.gramos} onCambio={(v) => setSel((s) => s.map((y, j) => (j === i ? { ...y, gramos: v } : y)))} />
                  <button type="button" className="quitar" aria-label={`Quitar ${nombreCorto(x.alimento)}`} onClick={() => quitar(i)}>✕</button>
                </div>); })}
            </div>
          </div>
        )}
        <div className={`mh-resto ${sel.length ? "atenuado" : ""}`}>
          {sel.length > 0 && <p className="algo-mas">¿Algo más? Toca para sumar</p>}
          {partes.map(([n, lista]) => (
            <div key={n} className="mh-parte"><h3>{n}</h3>
              <div className="qc-rejilla">{lista.map((a) => <button key={a.id} type="button" data-flip={a.id} className="qc-tile" onClick={() => sumar(a)}><IconoAlimento alimento={a} size={34} /><span className="tn">{nombreMosaico(a)}</span></button>)}</div>
            </div>
          ))}
        </div>
      </div>
      <button type="button" className="qc-btn" disabled={!sel.length} onClick={() => cerrar(true)}>{sel.length ? `Confirmar ${nom.toLowerCase()} · ${Math.round(t.kcal)} kcal` : "Elige lo que comerás"}</button>
    </div>
  );
}

function PantallaMenuHoy({ requerimiento, pacienteId, addItem, onErrorSync, log = [] }) {
  const hoy = hoyISO();
  const historial = useHistorialComidas(pacienteId);
  const clave = "nutriapp_menu_hoy_" + hoy;
  const [plan, setPlan] = useState(() => { try { const s = JSON.parse(localStorage.getItem(clave) || "{}"); const r = {}; Object.keys(s).forEach((m) => { r[m] = s[m].map((x) => ({ alimento: ALIMENTO_POR_ID[x.alimentoId], gramos: x.gramos })).filter((x) => x.alimento); }); return r; } catch { return {}; } });
  const [abierta, setAbierta] = useState(null);
  const [recien, setRecien] = useState(null);
  const [aviso, setAviso] = useState("");
  const [latir, setLatir] = useState(0);
  const remoto = useRef(false);
  const serializar = (p) => { const o = {}; Object.keys(p).forEach((m) => { o[m] = p[m].map((x) => ({ alimentoId: x.alimento.id, gramos: x.gramos })); }); return o; };
  useEffect(() => { try { localStorage.setItem(clave, JSON.stringify(serializar(plan))); } catch {} }, [plan]);
  /* El menú del día también se guarda en la nube (espacio compartido), igual que antes las ediciones del menú */
  useEffect(() => {
    if (!pacienteId) return;
    return dbFirestore.collection("pacientes").doc(pacienteId).collection("menuHoy").doc(hoy).onSnapshot((snap) => {
      const d = snap.data(); if (!d) return; const r = {};
      Object.keys(d).forEach((m) => { r[m] = (d[m] || []).map((x) => ({ alimento: ALIMENTO_POR_ID[x.alimentoId], gramos: x.gramos })).filter((x) => x.alimento); });
      remoto.current = true; setPlan(r);
    }, () => onErrorSync && onErrorSync("No se pudo leer tu menú de hoy desde la nube. Revisa tu conexión."));
  }, [pacienteId, hoy]);
  useEffect(() => {
    if (!pacienteId) return;
    if (remoto.current) { remoto.current = false; return; }
    const t = setTimeout(() => { dbFirestore.collection("pacientes").doc(pacienteId).collection("menuHoy").doc(hoy).set(serializar(plan)).catch(() => onErrorSync && onErrorSync("No se pudo guardar tu menú en la nube. Revisa tu conexión.")); }, 800);
    return () => clearTimeout(t);
  }, [plan, pacienteId]);

  const variantes = useMemo(() => Object.fromEntries(MOMENTOS_KEYS.map((m) => [m, variantesPorMomento(historial, m, requerimiento)])), [historial, requerimiento]);
  const regHoy = log.filter((it) => it.alimento && (!it.fecha || it.fecha === hoy));
  const totalReg = sumaMacros(regHoy), totalPlan = sumaMacros(Object.values(plan).flat());
  const total = { kcal: totalReg.kcal + totalPlan.kcal, p: totalReg.p + totalPlan.p, c: totalReg.c + totalPlan.c, g: totalReg.g + totalPlan.g };
  const regDe = (m) => regHoy.filter((it) => it.momento === m);
  const baseSin = (m) => { const x = sumaMacros(plan[m] || []); return { kcal: total.kcal - x.kcal, p: total.p - x.p, c: total.c - x.c, g: total.g - x.g }; };
  const n = MOMENTOS_KEYS.filter((m) => plan[m] && plan[m].length).length;
  const confirmar = (m, items) => { setPlan((p) => ({ ...p, [m]: items })); setAbierta(null); setRecien(m); setLatir((x) => x + 1); setTimeout(() => setRecien(null), 800); };
  const pasarAlRegistro = () => {
    MOMENTOS_KEYS.forEach((m) => (plan[m] || []).forEach((it) => addItem(it.alimento, it.gramos, m, null, hoy)));
    setPlan({}); setAviso("✓ Pasado a tu registro de hoy"); setTimeout(() => setAviso(""), 2600);
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch {}
  };
  return (
    <div className="nutri-pagina">
      <div className="nutri-sheet px-5 pt-6 pb-24">
        <AvanceDia total={total} requerimiento={requerimiento} latir={latir} />
        {(totalReg.kcal > 0 || totalPlan.kcal > 0) && <p className="mh-origen">Ya registrado hoy: <b className="num-u">{Math.round(totalReg.kcal)}</b> kcal · En tu menú: <b className="num-u">{Math.round(totalPlan.kcal)}</b> kcal</p>}
        <p className="qc-tsec" style={{ marginTop: 16 }}>Elige tus comidas</p>
        <div className="mh-comidas">
          {MOMENTOS_KEYS.map((m) => { const its = plan[m] || [], reg = regDe(m), meta = metaMomento(requerimiento, m), tk = sumaMacros(its).kcal + sumaMacros(reg).kcal, pd = tk / (requerimiento.get || 1); return (
            <button key={m} type="button" className={`mh-comida ${its.length || reg.length ? "lista" : ""} ${recien === m ? "recien" : ""}`} onClick={() => setAbierta(m)}>
              {(its.length > 0 || reg.length > 0) && <span className="ok">✓</span>}
              <span className="emo">{MOMENTO_EMOJI[m]}</span><b>{MOMENTO_LABEL_CAPITALIZADO[m]}</b>
              {its.length || reg.length ? (
                <>
                  <ul className="mh-lista">
                    {[...reg.map((it) => ({ ...it, reg: true })), ...its].slice(0, 5).map((it, k) => <li key={k} className={it.reg ? "reg" : ""}><IconoAlimento alimento={it.alimento} size={18} /><span>{nombreCorto(it.alimento)}</span><em className="num-u">{Math.round(it.gramos)} g</em></li>)}
                    {reg.length + its.length > 5 && <li className="mas">+{reg.length + its.length - 5} más</li>}
                  </ul>
                  {reg.length > 0 && <span className="mh-tag">{its.length ? "Registrado + menú" : "Ya registrado"}</span>}
                  <span className="est"><b className="num-u">{Math.round(tk)}</b> kcal · <b className="num-u">{Math.round(pd * 100)}%</b> de tu día</span>
                </>
              ) : <span className="est">Sugerido ~<span className="num-u">{Math.round(meta)}</span> kcal<br />Toca para elegir</span>}
            </button>); })}
        </div>
        {n === 4 ? (
          <div className="mh-completado" key={"c" + latir}>
            <h3>¡Menú completado!</h3>
            <p>Tus 4 comidas cubren el <b className="num-u">{Math.round(total.kcal / (requerimiento.get || 1) * 100)}%</b> de tus calorías y el <b className="num-u">{Math.round(total.p / (requerimiento.proteinasG || 1) * 100)}%</b> de tu proteína.</p>
            <button type="button" onClick={pasarAlRegistro}>→ Pasar al registro</button>
            {Array.from({ length: 22 }, (_, i) => <i key={i} className="confeti" style={{ left: `${(i * 37) % 100}%`, background: ["var(--tone-200)", "var(--tone-400)", "var(--on-hero)", "var(--st-meta)", "var(--tone-300)"][i % 5], animationDelay: `${(i % 7) * 70}ms` }} />)}
          </div>
        ) : (
          <div className="mh-pendiente">{n ? `Te faltan ${4 - n} comida${4 - n === 1 ? "" : "s"} para completar el menú.` : "Toca una comida para empezar tu menú de hoy."}</div>
        )}
        <div style={{ marginTop: 18 }}><SugeridorIngrediente requerimiento={requerimiento} /></div>
      </div>
      {aviso && ReactDOM.createPortal(<div className="mh-toast" role="status">{aviso}</div>, document.body)}
      {abierta && ReactDOM.createPortal(<VentanaComida momento={abierta} base={baseSin(abierta)} variantes={variantes[abierta]} inicial={plan[abierta]} requerimiento={requerimiento} onConfirmar={(items) => confirmar(abierta, items)} onCerrar={() => setAbierta(null)} />, document.body)}
    </div>
  );
}

function PantallaRegistro({ log, addItem, removeItem, updateItem, recipientes, pacienteId, fechaInicial, onFechaInicialConsumida, requerimiento }) {
  const [busqueda, setBusqueda] = useState("");
  const [seleccionado, setSeleccionado] = useState(null);
  const [recipienteId, setRecipienteId] = useState("ninguno");
  const [pesoBruto, setPesoBruto] = useState(100);
  const [momento, setMomento] = useState("desayuno");
  const [restarCarneId, setRestarCarneId] = useState("ninguna");
  const [editandoId, setEditandoId] = useState(null);
  const [edicion, setEdicion] = useState(null);
  const [fechaSeleccionada, setFechaSeleccionada] = useState(hoyISO());
  const [logOtraFecha, setLogOtraFecha] = useState([]);
  const [filtroMomento, setFiltroMomento] = useState("todos");
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [hojaAbierta, setHojaAbierta] = useState(false);
  const historial = useHistorialComidas(pacienteId);

  const hoy = hoyISO();
  const diasSemana = useMemo(() => { const l = getLunes(new Date()); l.setUTCDate(l.getUTCDate() + semanaOffset * 7); return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setUTCDate(d.getUTCDate() + i); return d; }); }, [semanaOffset]);

  // Si venimos de "Historial" con una fecha concreta para editar, saltamos a la semana de esa fecha.
  useEffect(() => {
    if (!fechaInicial) return;
    const lunesActual = getLunes(new Date());
    const lunesDestino = getLunes(fechaInicial);
    const offset = Math.round((lunesDestino - lunesActual) / (7 * DIAS_EN_MS));
    setSemanaOffset(offset);
    setFechaSeleccionada(fechaInicial);
    setSeleccionado(null);
    if (onFechaInicialConsumida) onFechaInicialConsumida();
  }, [fechaInicial]);

  useEffect(() => {
    if (fechaSeleccionada === hoy) return;
    let activo = true;
    obtenerLogFecha(pacienteId, fechaSeleccionada).then((items) => { if (activo) setLogOtraFecha(items); });
    return () => { activo = false; };
  }, [fechaSeleccionada, pacienteId]);

  const logActivo = fechaSeleccionada === hoy ? log : logOtraFecha;
  const logFiltrado = filtroMomento === "todos" ? logActivo : logActivo.filter((it) => it.momento === filtroMomento);

  const resultados = useMemo(() => {
    if (!busqueda.trim()) return [];
    const q = normalizarTexto(busqueda);
    return FOOD_DB.filter((f) => normalizarTexto(f.nombre).includes(q)).slice(0, 6);
  }, [busqueda]);

  const recipiente = recipientes.find((r) => r.id === recipienteId);
  const tara = recipiente ? Number(recipiente.taraG) || 0 : 0;
  const carnesAlmuerzo = logActivo.filter((it) => it.momento === "almuerzo" && it.alimento.categoria === "proteina");
  const carneRestada = restarCarneId !== "ninguna" ? logActivo.find((it) => it.uid === restarCarneId) : null;
  const pesoCarneRestada = carneRestada ? carneRestada.gramos : 0;
  const pesoNeto = Math.max(Math.round(pesoBruto - tara - pesoCarneRestada), 0);
  const mostrarRestarCarne = momento === "almuerzo" && seleccionado && seleccionado.categoria !== "proteina" && carnesAlmuerzo.length > 0;

  const totalesActivo = calcularTotalesLog(logFiltrado);
  const pctMomento = filtroMomento === "todos" ? 1 : (MEAL_DEFS.find((m) => m.key === filtroMomento) || {}).pct || 1;
  const metasActivo = {
    kcal: (requerimiento.get || 0) * pctMomento,
    proteinasG: (requerimiento.proteinasG || 0) * pctMomento,
    carbohidratosG: (requerimiento.carbohidratosG || 0) * pctMomento,
    grasasG: (requerimiento.grasasG || 0) * pctMomento,
    sodioMg: (requerimiento.sodioMg || 0) * pctMomento,
  };

  const iniciarEdicion = (item) => {
    setEditandoId(item.uid);
    setEdicion({ recipienteId: item.tara && item.tara.recipiente ? (recipientes.find((r) => r.nombre === item.tara.recipiente) || {}).id || "ninguno" : "ninguno", pesoBruto: item.tara ? item.tara.pesoBruto : item.gramos, momento: item.momento, restarCarneId: "ninguna" });
  };
  const guardarEdicion = (item) => {
    const rec = recipientes.find((r) => r.id === edicion.recipienteId);
    const t = rec ? Number(rec.taraG) || 0 : 0;
    const carneRest = edicion.restarCarneId !== "ninguna" ? logActivo.find((it) => it.uid === edicion.restarCarneId) : null;
    const nuevoNeto = Math.max(Math.round(edicion.pesoBruto - t - (carneRest ? carneRest.gramos : 0)), 0);
    const nuevaTara = (rec || carneRest) ? { recipiente: rec ? rec.nombre : null, pesoBruto: edicion.pesoBruto, tara: t, carneNombre: carneRest ? carneRest.alimento.nombre : null, carneGramos: carneRest ? carneRest.gramos : null } : null;
    updateItem(item.uid, { gramos: nuevoNeto, momento: edicion.momento, tara: nuevaTara }, fechaSeleccionada);
    if (fechaSeleccionada !== hoy) setLogOtraFecha((prev) => prev.map((it) => (it.uid === item.uid ? { ...it, gramos: nuevoNeto, momento: edicion.momento, tara: nuevaTara } : it)));
    setEditandoId(null); setEdicion(null);
  };
  const eliminarDeLista = (itemId) => {
    removeItem(itemId, fechaSeleccionada);
    if (fechaSeleccionada !== hoy) setLogOtraFecha((prev) => prev.filter((it) => it.uid !== itemId));
  };

  const MOMENTOS = [{ key: "todos", label: "Todos" }, { key: "desayuno", label: "Desayuno" }, { key: "almuerzo", label: "Almuerzo" }, { key: "cena", label: "Cena" }, { key: "colacion", label: "Colación" }];

  return (
    <div className="nutri-pagina">
      <div className="nutri-sheet px-5 pt-6 pb-24">

      <div className="flex items-center justify-between mb-2">
        <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text">‹ Semana anterior</button>
        <span className="text-xs nutri-muted">{RANGO_SEMANA(diasSemana[0], diasSemana[6])}</span>
        <button onClick={() => setSemanaOffset((s) => Math.min(s + 1, 0))} disabled={semanaOffset === 0} className="text-xs nutri-brand-text disabled:opacity-30">Semana siguiente ›</button>
      </div>
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2" style={{ scrollbarWidth: "none" }}>
        {diasSemana.map((d, i) => {
          const iso = fechaLimaISO(d);
          const futuro = iso > hoy;
          return (
            <button key={i} disabled={futuro} onClick={() => { setFechaSeleccionada(iso); setSeleccionado(null); }} className={`shrink-0 rounded-lg px-2.5 py-1.5 text-center nutri-chip ${iso === fechaSeleccionada ? "nutri-chip-active" : "bg-white nutri-ink"} ${futuro ? "opacity-30" : ""}`}>
              <div className="text-[10px] uppercase">{NOMBRE_DIA_CORTO(d)}</div>
              <div className="text-xs font-medium">{d.getDate()}</div>
            </button>
          );
        })}
      </div>
      {semanaOffset !== 0 && <button onClick={() => { setSemanaOffset(0); setFechaSeleccionada(hoy); setSeleccionado(null); }} className="text-xs nutri-brand-text mb-2 underline">Volver a esta semana</button>}

function FilaCumplimiento({ n }) {
  const cumplido = n.actual >= n.meta;
  return (
    <div className="py-1.5 flex items-center justify-between text-xs">
      <span className="nutri-ink w-24">{n.label}</span>
      <span className="nutri-muted flex-1 text-center">{Math.round(n.actual)} / {Math.round(n.meta)} {n.unidad}</span>
      {cumplido ? <span style={{ color: "var(--st-meta)" }}>✅</span> : <span className="nutri-warn">⚠️</span>}
    </div>
  );
}

function PantallaHistorial({ requerimiento, pacienteId, onCerrar, onEditarDia }) {
  const [vista, setVista] = useState("semana");
  const [anio, setAnio] = useState(new Date().getFullYear());
  const [mes, setMes] = useState(new Date().getMonth());
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [cargando, setCargando] = useState(true);
  const [dias, setDias] = useState([]);
  const [diaExpandido, setDiaExpandido] = useState(null);

  const NOMBRES_MES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  const rangoFechas = useMemo(() => {
    if (vista === "semana") {
      const l = getLunes(new Date());
      l.setUTCDate(l.getUTCDate() + semanaOffset * 7);
      return Array.from({ length: 7 }, (_, i) => { const d = new Date(l); d.setUTCDate(d.getUTCDate() + i); return d; }).filter((d) => d <= new Date());
    }
    const ultimoDia = new Date(anio, mes + 1, 0).getDate();
    return Array.from({ length: ultimoDia }, (_, i) => new Date(anio, mes, i + 1)).filter((d) => d <= new Date());
  }, [vista, anio, mes, semanaOffset]);

  useEffect(() => {
    setCargando(true);
    Promise.all(rangoFechas.map((d) => {
      const iso = fechaLimaISO(d);
      return obtenerLogFecha(pacienteId, iso).then((items) => ({ fecha: iso, dia: d, items }));
    })).then((res) => { setDias(res); setCargando(false); });
  }, [rangoFechas, pacienteId]);

  const conDatos = dias.filter((d) => d.items.length > 0);
  const totalPeriodo = conDatos.reduce((acc, d) => {
    const t = calcularTotalesLog(d.items);
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG, fibraG: acc.fibraG + t.fibraG };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });
  const n = conDatos.length || 1;
  const promedio = { kcal: totalPeriodo.kcal / n, proteinasG: totalPeriodo.proteinasG / n, carbohidratosG: totalPeriodo.carbohidratosG / n, grasasG: totalPeriodo.grasasG / n, fibraG: totalPeriodo.fibraG / n };

  const filasResumen = [
    { label: "Calorías", unidad: "kcal", meta: requerimiento.get, actual: promedio.kcal },
    { label: "Proteína", unidad: "g", meta: requerimiento.proteinasG, actual: promedio.proteinasG },
    { label: "Carbohidratos", unidad: "g", meta: requerimiento.carbohidratosG, actual: promedio.carbohidratosG },
    { label: "Grasas", unidad: "g", meta: requerimiento.grasasG, actual: promedio.grasasG },
    { label: "Fibra", unidad: "g", meta: requerimiento.fibraG, actual: promedio.fibraG },
  ];

  return (
    <PantallaCapas cabecera={<CabeceraSimple titulo="Historial" sub="Tus días por semana o por mes" onCerrar={onCerrar} />}>
      <div className="px-5 pt-5 pb-24">
        <div className="flex nutri-chip rounded-full overflow-hidden mb-4 w-fit">
          <button onClick={() => setVista("semana")} className={`text-xs px-4 py-1.5 ${vista === "semana" ? "nutri-chip-active" : "nutri-ink"}`}>Por semana</button>
          <button onClick={() => setVista("mes")} className={`text-xs px-4 py-1.5 ${vista === "mes" ? "nutri-chip-active" : "nutri-ink"}`}>Por mes</button>
        </div>

        <div className="flex items-center gap-2 mb-4">
          <select value={anio} onChange={(e) => setAnio(Number(e.target.value))} className="rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink">
            {[0, 1, 2].map((i) => { const y = new Date().getFullYear() - i; return <option key={y} value={y}>{y}</option>; })}
          </select>
          {vista === "mes" && (
            <select value={mes} onChange={(e) => setMes(Number(e.target.value))} className="rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink flex-1">
              {NOMBRES_MES.map((nm, i) => <option key={i} value={i}>{nm}</option>)}
            </select>
          )}
          {vista === "semana" && (
            <div className="flex items-center gap-2 flex-1 justify-between">
              <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text">‹ Anterior</button>
              <span className="text-xs nutri-muted">{rangoFechas[0] && RANGO_SEMANA(rangoFechas[0], rangoFechas[rangoFechas.length - 1] || rangoFechas[0])}</span>
              <button onClick={() => setSemanaOffset((s) => Math.min(s + 1, 0))} className="text-xs nutri-brand-text">Siguiente ›</button>
            </div>
          )}
        </div>

        {cargando ? (
          <p className="text-sm nutri-muted">Cargando...</p>
        ) : (
          <>
            <div className="nutri-panel rounded-2xl p-4 mb-5">
              <p className="text-sm font-medium nutri-ink mb-2">Promedio diario vs. tu meta ({conDatos.length} día{conDatos.length === 1 ? "" : "s"} con registro)</p>
              {filasResumen.map((f, i) => <FilaCumplimiento key={i} n={f} />)}
            </div>

            <p className="text-sm font-medium nutri-ink mb-2">Día por día</p>
            <div className="space-y-2">
              {dias.map((d, i) => {
                const t = calcularTotalesLog(d.items);
                const cumpleKcal = d.items.length > 0 && t.kcal >= requerimiento.get;
                const expandido = diaExpandido === d.fecha;
                return (
                  <div key={i} className="nutri-panel rounded-xl overflow-hidden">
                    <div
                      role="button"
                      tabIndex={0}
                      onClick={() => d.items.length > 0 && setDiaExpandido(expandido ? null : d.fecha)}
                      onKeyDown={(e) => { if (e.key === "Enter" && d.items.length > 0) setDiaExpandido(expandido ? null : d.fecha); }}
                      className="w-full px-4 py-3 flex items-center justify-between text-left cursor-pointer"
                    >
                      <div>
                        <div className="text-sm nutri-ink capitalize">{NOMBRE_DIA_LARGO(d.dia)}</div>
                        <div className="text-xs nutri-muted">{d.items.length === 0 ? "Sin registro" : `${Math.round(t.kcal)} kcal · ${Math.round(t.proteinasG)} g proteína`}</div>
                      </div>
                      <div className="flex items-center gap-3">
                        {d.items.length > 0 && (cumpleKcal ? <span style={{ color: "var(--st-meta)" }}>✅</span> : <span className="nutri-warn">⚠️</span>)}
                        <button onClick={(e) => { e.stopPropagation(); onEditarDia(d.fecha); }} className="nutri-brand-text flex items-center gap-1 text-xs shrink-0">
                          <IconEdit size={14} /> {d.items.length === 0 ? "Agregar" : "Editar"}
                        </button>
                        {d.items.length > 0 && <span className="nutri-muted text-xs">{expandido ? "▾" : "▸"}</span>}
                      </div>
                    </div>
                    {expandido && (
                      <div className="px-4 pb-4 pt-1 border-t" style={{ borderColor: "var(--panel-border)" }}>
                        <PanelMetas totales={t} requerimiento={requerimiento} tamanoGrid="sm" log={d.items} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </PantallaCapas>
  );
}

/* Reporte diario: aporte calórico y proteico total de un día concreto, con el detalle de cada
   alimento (gramos, kcal y proteína aportados, y su % sobre el total del día), tanto en números
   como en gráfico (barras de magnitud, una por alimento). Reusa la navegación de semana/día de
   Registro y Menú (ya corregida para calcular "hoy" en huso horario de Lima, no el del
   dispositivo), y obtenerLogFecha para leer el registro de cualquier fecha, local o en la nube. */
/* =====================================================================================
   REPORTES
   Menú de reportes con tres opciones:
   1) Totales por día (con gráficas) · 2) Detalle por alimento (una hoja por día) ·
   3) Resumen clínico para el médico (tendencias, cumplimiento, hallazgos).
   Todo se calcula en el navegador y los PDF se generan con jsPDF (gratis, sin servidor).
   Las fechas siempre se interpretan en huso horario de Lima (ver fechaLimaISO/getLunes).
   ===================================================================================== */
const COLOR_PDF = { verde: [20, 67, 60], naranja: [217, 108, 63], dorado: [199, 154, 61], azul: [78, 112, 137], carb: [108, 143, 99], gris: [107, 114, 104], tinta: [30, 36, 31], pista: [231, 227, 214], rojo: [178, 59, 59] };
const NOMBRE_MOMENTO_CAP = { desayuno: "Desayuno", almuerzo: "Almuerzo", cena: "Cena", colacion: "Colación" };
const LEYENDA_PDF = "Información orientativa; no reemplaza la indicación de tu nutricionista o médico.";

function fechaLargaLima(fechaISO) {
  const s = new Date(fechaISO + "T12:00:00Z").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "America/Lima" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fechaCortaLima(fechaISO) {
  return new Date(fechaISO + "T12:00:00Z").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short", timeZone: "America/Lima" }).replace(/\./g, "");
}
function etiquetaEjeLima(fechaISO) {
  const d = new Date(fechaISO + "T12:00:00Z");
  return {
    w: d.toLocaleDateString("es-ES", { weekday: "narrow", timeZone: "America/Lima" }).toUpperCase(),
    n: d.toLocaleDateString("es-ES", { day: "numeric", timeZone: "America/Lima" }),
  };
}
const rangoFechasISO = (n) => Array.from({ length: n }, (_, i) => fechaISOOffset(n - 1 - i));
const n0 = (v) => String(Math.round(v));
const n1 = (v) => String(Math.round(v * 10) / 10);
const pctTxt = (v) => `${Math.round(v)}%`;

/* Aporte de cada alimento de un día (kcal y proteína) y su % sobre el total del día. */
function filasDelDia(items) {
  const totales = calcularTotalesLog(items);
  const filas = items.map((it) => {
    const a = calcularTotalesItem(it.alimento, it.gramos);
    return {
      ...it,
      aporteKcal: a.kcal,
      aporteProteina: a.proteinasG,
      pctKcal: totales.kcal > 0 ? (a.kcal / totales.kcal) * 100 : 0,
      pctProteina: totales.proteinasG > 0 ? (a.proteinasG / totales.proteinasG) * 100 : 0,
    };
  });
  return { totales, filas };
}


/* ---------- Resumen clínico (función pura: la usan la pantalla y el PDF) ---------- */
function calcularResumenClinico({ datos, requerimiento, perfil, pesos }) {
  const porDia = datos.filter((d) => d.items.length > 0).map((d) => ({ fecha: d.fecha, items: d.items, t: calcularTotalesLog(d.items) }));
  const n = porDia.length;
  const suma = (k) => porDia.reduce((s, d) => s + d.t[k], 0);
  const prom = (k) => (n ? suma(k) / n : 0);
  const promedios = { kcal: prom("kcal"), proteinasG: prom("proteinasG"), carbohidratosG: prom("carbohidratosG"), grasasG: prom("grasasG"), fibraG: prom("fibraG"), sodioMg: prom("sodioMg") };
  const pct = (v, meta) => (meta > 0 ? (v / meta) * 100 : 0);
  const pctMeta = { kcal: pct(promedios.kcal, requerimiento.get), proteinasG: pct(promedios.proteinasG, requerimiento.proteinasG), carbohidratosG: pct(promedios.carbohidratosG, requerimiento.carbohidratosG), grasasG: pct(promedios.grasasG, requerimiento.grasasG), fibraG: pct(promedios.fibraG, requerimiento.fibraG), sodioMg: pct(promedios.sodioMg, requerimiento.sodioMg) };
  const protPorKg = perfil.pesoKg > 0 ? promedios.proteinasG / perfil.pesoKg : 0;

  const kP = suma("proteinasG") * 4, kC = suma("carbohidratosG") * 4, kG = suma("grasasG") * 9;
  const kTot = kP + kC + kG;
  const distribucion = kTot > 0 ? { proteina: (kP / kTot) * 100, carbohidratos: (kC / kTot) * 100, grasas: (kG / kTot) * 100 } : null;
  const objetivoDist = { proteina: requerimiento.proteinasPct, carbohidratos: requerimiento.carbohidratosPct, grasas: requerimiento.grasasPct };

  const get = requerimiento.get;
  const cumplimiento = {
    diasKcalOk: porDia.filter((d) => get > 0 && Math.abs(d.t.kcal - get) / get <= 0.1).length,
    diasKcalBajo: porDia.filter((d) => get > 0 && d.t.kcal < get * 0.8).length,
    diasProteinaOk: porDia.filter((d) => requerimiento.proteinasG > 0 && d.t.proteinasG >= requerimiento.proteinasG * 0.9).length,
    diasSodioExcedido: porDia.filter((d) => requerimiento.sodioMg > 0 && d.t.sodioMg > requerimiento.sodioMg).length,
  };

  const porMomento = MEAL_DEFS.map((m) => {
    const ts = porDia.map((d) => calcularTotalesLog(d.items.filter((it) => it.momento === m.key)));
    const avgK = n ? ts.reduce((s, t) => s + t.kcal, 0) / n : 0;
    const avgP = n ? ts.reduce((s, t) => s + t.proteinasG, 0) / n : 0;
    const objetivo = get * m.pct;
    return { key: m.key, label: m.label, avgKcal: avgK, avgProteina: avgP, objetivoKcal: objetivo, pctObjetivo: objetivo > 0 ? (avgK / objetivo) * 100 : 0 };
  });

  const agg = {};
  porDia.forEach((d) => d.items.forEach((it) => {
    const a = calcularTotalesItem(it.alimento, it.gramos);
    const x = (agg[it.alimento.nombre] = agg[it.alimento.nombre] || { nombre: it.alimento.nombre, gramos: 0, kcal: 0, proteina: 0, veces: 0 });
    x.gramos += it.gramos; x.kcal += a.kcal; x.proteina += a.proteinasG; x.veces += 1;
  }));
  const kcalTotal = suma("kcal"), protTotal = suma("proteinasG");
  const lista = Object.values(agg).map((x) => ({ ...x, pctKcal: kcalTotal > 0 ? (x.kcal / kcalTotal) * 100 : 0, pctProteina: protTotal > 0 ? (x.proteina / protTotal) * 100 : 0 }));
  const topKcal = [...lista].sort((a, b) => b.kcal - a.kcal).slice(0, 5);
  const topProteina = [...lista].sort((a, b) => b.proteina - a.proteina).slice(0, 5);

  const inicio = datos.length ? datos[0].fecha : "", fin = datos.length ? datos[datos.length - 1].fecha : "";
  const serie = (pesos || []).filter((p) => p.fecha >= inicio && p.fecha <= fin).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const peso = { serie, delta: null, deltaPct: null };
  if (serie.length >= 2) {
    peso.delta = serie[serie.length - 1].pesoKg - serie[0].pesoKg;
    peso.deltaPct = serie[0].pesoKg > 0 ? (peso.delta / serie[0].pesoKg) * 100 : null;
  }

  const alertas = [];
  const add = (sev, txt) => alertas.push({ sev, txt });
  const total = datos.length;
  if (n === 0) return { n, total, promedios, pctMeta, protPorKg, distribucion, objetivoDist, cumplimiento, porMomento, topKcal, topProteina, peso, alertas, porDia };
  if (n < Math.ceil(total * 0.5)) add("media", `Solo hay registro de alimentos en ${n} de ${total} días: interpretar los promedios con cautela.`);
  if (pctMeta.kcal < 70) add("alta", `Ingesta energética promedio de ${n0(promedios.kcal)} kcal/día (${pctTxt(pctMeta.kcal)} de la meta de ${n0(get)} kcal): déficit sostenido.`);
  else if (pctMeta.kcal < 90) add("media", `Ingesta energética promedio de ${n0(promedios.kcal)} kcal/día (${pctTxt(pctMeta.kcal)} de la meta): por debajo de lo previsto.`);
  else if (pctMeta.kcal > 115) add("media", `Ingesta energética promedio de ${n0(promedios.kcal)} kcal/día (${pctTxt(pctMeta.kcal)} de la meta): por encima de lo previsto.`);
  if (cumplimiento.diasKcalBajo > 0 && pctMeta.kcal >= 70) add("info", `${cumplimiento.diasKcalBajo} de ${n} días con menos del 80% de la meta calórica.`);
  if (pctMeta.proteinasG < 70) add("alta", `Proteína promedio de ${n1(promedios.proteinasG)} g/día (${pctTxt(pctMeta.proteinasG)} de la meta de ${n0(requerimiento.proteinasG)} g; ${n1(protPorKg)} g/kg).`);
  else if (pctMeta.proteinasG < 90) add("media", `Proteína promedio de ${n1(promedios.proteinasG)} g/día (${pctTxt(pctMeta.proteinasG)} de la meta; ${n1(protPorKg)} g/kg).`);
  if (requerimiento.esAdultoMayor && protPorKg < 1.0) add("media", `Aporte proteico de ${n1(protPorKg)} g/kg/día: por debajo de 1.0-1.2 g/kg recomendado en adultos mayores (guías ESPEN).`);
  if (promedios.sodioMg > requerimiento.sodioMg) add(requerimiento.restricciones.limitarSodio ? "alta" : "media", `Sodio promedio de ${n0(promedios.sodioMg)} mg/día, sobre el límite de ${n0(requerimiento.sodioMg)} mg${requerimiento.restricciones.limitarSodio ? " (el paciente tiene restricción de sodio)" : ""}.`);
  else if (cumplimiento.diasSodioExcedido >= Math.ceil(n * 0.3)) add("info", `Sodio por encima del límite en ${cumplimiento.diasSodioExcedido} de ${n} días.`);
  if (pctMeta.fibraG < 70) add("info", `Fibra promedio de ${n1(promedios.fibraG)} g/día (${pctTxt(pctMeta.fibraG)} de la meta de ${n0(requerimiento.fibraG)} g).`);
  if (peso.deltaPct !== null) {
    const a = serie[0].pesoKg, b = serie[serie.length - 1].pesoKg;
    if (peso.deltaPct <= -5) add("alta", `Pérdida de peso de ${n1(Math.abs(peso.deltaPct))}% en el período (${n1(a)} kg a ${n1(b)} kg): clínicamente significativa.`);
    else if (peso.deltaPct <= -2) add("media", `Pérdida de peso de ${n1(Math.abs(peso.deltaPct))}% en el período (${n1(a)} kg a ${n1(b)} kg).`);
    else if (peso.deltaPct >= 3) add("info", `Aumento de peso de ${n1(peso.deltaPct)}% en el período (${n1(a)} kg a ${n1(b)} kg).`);
  }
  const rn = requerimiento.riesgoNutricionalMayor;
  if (rn && rn.nivel !== "bajo") add(rn.nivel === "alto" ? "alta" : "media", `Riesgo nutricional ${rn.nivel} en adulto mayor (IMC ${rn.imc.toFixed(1)}, ${rn.categoriaIMC}${rn.mna ? `; MNA-SF ${rn.mna.puntaje}/14` : ""}).`);
  porMomento.forEach((m) => { if (m.objetivoKcal > 0 && m.pctObjetivo < 60) add("info", `${m.label}: cubre en promedio solo el ${pctTxt(m.pctObjetivo)} de lo previsto (${n0(m.avgKcal)} de ${n0(m.objetivoKcal)} kcal); es una oportunidad para fortificar.`); });
  const des = porMomento.find((m) => m.key === "desayuno");
  if (requerimiento.esAdultoMayor && des && des.avgProteina < 15) add("info", `El desayuno aporta ${n1(des.avgProteina)} g de proteína en promedio; conviene repartir 25-30 g por comida principal.`);
  if (cumplimiento.diasKcalOk >= Math.ceil(n * 0.7)) add("ok", `Buen cumplimiento calórico: ${cumplimiento.diasKcalOk} de ${n} días dentro de ±10% de la meta.`);
  if (cumplimiento.diasProteinaOk >= Math.ceil(n * 0.7)) add("ok", `Buen cumplimiento proteico: ${cumplimiento.diasProteinaOk} de ${n} días con al menos 90% de la meta.`);
  const orden = { alta: 0, media: 1, info: 2, ok: 3 };
  alertas.sort((a, b) => orden[a.sev] - orden[b.sev]);
  return { n, total, promedios, pctMeta, protPorKg, distribucion, objetivoDist, cumplimiento, porMomento, topKcal, topProteina, peso, alertas, porDia };
}

/* ---------- Primitivas de PDF (lienzo A4 con encabezado, paginación y pie) ---------- */
function crearLienzoPDF(titulo, subtitulo) {
  const C = window.jspdf && window.jspdf.jsPDF;
  if (!C) { alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet y recarga la app."); return null; }
  const doc = new C({ unit: "mm", format: "a4" });
  const L = { doc, W: 210, H: 297, M: 15, ANCHO: 180, y: 30, titulo, subtitulo };
  L.encabezado = () => {
    doc.setFillColor(...COLOR_PDF.verde); doc.rect(0, 0, L.W, 22, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text(L.titulo, L.M, 11);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(L.subtitulo || "", L.M, 17.5);
    L.y = 30;
  };
  L.asegurar = (alto) => {
    if (L.y + alto > L.H - 18) { doc.addPage(); L.encabezado(); return true; }
    return false;
  };
  L.seccion = (txt) => {
    L.asegurar(14);
    doc.setTextColor(...COLOR_PDF.verde); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    doc.text(txt, L.M, L.y); L.y += 2;
    doc.setDrawColor(...COLOR_PDF.verde); doc.setLineWidth(0.4); doc.line(L.M, L.y, L.W - L.M, L.y); L.y += 6;
  };
  L.nota = (txt) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.gris);
    doc.splitTextToSize(txt, L.ANCHO).forEach((ln) => { L.asegurar(4); doc.text(ln, L.M, L.y); L.y += 3.8; });
    L.y += 1;
  };
  L.finalizar = (archivo, leyenda) => {
    const paginas = doc.getNumberOfPages();
    for (let i = 1; i <= paginas; i++) {
      doc.setPage(i);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.gris);
      doc.text(leyenda || LEYENDA_PDF, L.M, L.H - 8);
      doc.text(`Página ${i} de ${paginas}`, L.W - L.M, L.H - 8, { align: "right" });
    }
    doc.save(archivo);
  };
  L.encabezado();
  return L;
}

function pdfTarjeta(L, x, w, nombre, valor, detalle, p, color) {
  const { doc } = L, y = L.y;
  doc.setDrawColor(...COLOR_PDF.pista); doc.setLineWidth(0.3); doc.roundedRect(x, y, w, 30, 2, 2);
  doc.setTextColor(...COLOR_PDF.gris); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text(nombre, x + 4, y + 6);
  doc.setTextColor(...COLOR_PDF.tinta); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text(valor, x + 4, y + 15);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...COLOR_PDF.gris);
  doc.text(detalle, x + 4, y + 21);
  if (p !== null) {
    doc.setFillColor(...COLOR_PDF.pista); doc.roundedRect(x + 4, y + 24, w - 8, 2.5, 1, 1, "F");
    doc.setFillColor(...color); doc.roundedRect(x + 4, y + 24, Math.max(0.1, (w - 8) * Math.min(Math.max(p, 0), 100) / 100), 2.5, 1, 1, "F");
  }
}

/* Tabla simple con encabezado repetido en cada página. columnas: [{ t, w, a: "l"|"r" }] */
function pdfTabla(L, columnas, filas, opciones = {}) {
  const { doc } = L;
  const anchoTotal = columnas.reduce((s, c) => s + c.w, 0);
  const cabecera = () => {
    doc.setFillColor(...COLOR_PDF.pista); doc.rect(L.M, L.y - 4, anchoTotal, 6, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.tinta);
    let x = L.M;
    columnas.forEach((c) => { c.a === "r" ? doc.text(c.t, x + c.w - 1.5, L.y, { align: "right" }) : doc.text(c.t, x + 1.5, L.y); x += c.w; });
    L.y += 6;
  };
  L.asegurar(14); cabecera();
  filas.forEach((f) => {
    if (L.asegurar(7)) cabecera();
    doc.setFont("helvetica", f.negrita ? "bold" : "normal"); doc.setFontSize(8.5); doc.setTextColor(...COLOR_PDF.tinta);
    let x = L.M;
    columnas.forEach((c, i) => {
      const txt = String(f.celdas[i] ?? "");
      c.a === "r" ? doc.text(txt, x + c.w - 1.5, L.y, { align: "right" }) : doc.text(doc.splitTextToSize(txt, c.w - 3)[0], x + 1.5, L.y);
      x += c.w;
    });
    L.y += opciones.alto || 5.2;
  });
  L.y += 3;
}

/* Gráfico de barras por día con línea de meta (una sola serie: la magnitud es lo que se compara). */
function pdfGraficoBarras(L, { titulo, datos, meta, color, unidad }) {
  const { doc } = L;
  L.asegurar(62); L.seccion(titulo);
  const x0 = L.M + 11, w = L.ANCHO - 11, y0 = L.y + 4, h = 36;
  const maxDato = Math.max(...datos.map((d) => d.valor || 0), meta || 0, 1);
  const techo = maxDato * 1.1;
  const yy = (v) => y0 + h - (v / techo) * h;
  doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.gris); doc.setLineWidth(0.15); doc.setDrawColor(...COLOR_PDF.pista);
  [0, 0.5, 1].forEach((f) => { const v = (maxDato) * f; doc.line(x0, yy(v), x0 + w, yy(v)); doc.text(n0(v), x0 - 1.5, yy(v) + 1, { align: "right" }); });
  const paso = w / datos.length, bw = Math.min(9, paso * 0.62), mostrarValores = datos.length <= 14, cada = Math.ceil(datos.length / 15);
  datos.forEach((d, i) => {
    const bx = x0 + paso * i + (paso - bw) / 2;
    if (d.valor > 0) {
      doc.setFillColor(...color); doc.rect(bx, yy(d.valor), bw, y0 + h - yy(d.valor), "F");
      if (mostrarValores) { doc.setFontSize(6.5); doc.setTextColor(...COLOR_PDF.tinta); doc.text(n0(d.valor), bx + bw / 2, yy(d.valor) - 1, { align: "center" }); }
    }
    if (i % cada === 0) {
      const e = etiquetaEjeLima(d.fecha);
      doc.setFontSize(6.5); doc.setTextColor(...COLOR_PDF.gris);
      doc.text(e.w, bx + bw / 2, y0 + h + 3.2, { align: "center" }); doc.text(e.n, bx + bw / 2, y0 + h + 6.2, { align: "center" });
    }
  });
  if (meta > 0) {
    doc.setDrawColor(...COLOR_PDF.tinta); doc.setLineWidth(0.3); doc.setLineDashPattern([1.6, 1.2], 0);
    doc.line(x0, yy(meta), x0 + w, yy(meta)); doc.setLineDashPattern([], 0);
    doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.tinta); doc.setFont("helvetica", "bold");
    doc.text(`Meta: ${n0(meta)} ${unidad}`, x0 + w, yy(meta) - 1.2, { align: "right" });
  }
  L.y = y0 + h + 11;
}

/* Evolución del peso (línea con puntos; etiquetas directas en los extremos). */
function pdfGraficoPeso(L, serie) {
  const { doc } = L;
  L.asegurar(56); L.seccion("Evolución del peso");
  if (serie.length < 2) { L.nota(serie.length === 1 ? `Solo hay un registro de peso en el período (${n1(serie[0].pesoKg)} kg el ${fechaCortaLima(serie[0].fecha)}); se necesitan al menos dos para ver tendencia.` : "No hay registros de peso en el período."); return; }
  const x0 = L.M + 11, w = L.ANCHO - 16, y0 = L.y + 5, h = 30;
  const vals = serie.map((p) => p.pesoKg), mn = Math.min(...vals) - 0.5, mx = Math.max(...vals) + 0.5;
  const t0 = new Date(serie[0].fecha + "T12:00:00Z").getTime(), t1 = new Date(serie[serie.length - 1].fecha + "T12:00:00Z").getTime();
  const px = (f) => x0 + (t1 > t0 ? ((new Date(f + "T12:00:00Z").getTime() - t0) / (t1 - t0)) * w : 0);
  const py = (v) => y0 + h - ((v - mn) / (mx - mn)) * h;
  doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.gris); doc.setLineWidth(0.15); doc.setDrawColor(...COLOR_PDF.pista);
  [mn, (mn + mx) / 2, mx].forEach((v) => { doc.line(x0, py(v), x0 + w, py(v)); doc.text(n1(v), x0 - 1.5, py(v) + 1, { align: "right" }); });
  doc.setDrawColor(...COLOR_PDF.azul); doc.setLineWidth(0.5);
  serie.forEach((p, i) => { if (i > 0) doc.line(px(serie[i - 1].fecha), py(serie[i - 1].pesoKg), px(p.fecha), py(p.pesoKg)); });
  doc.setFillColor(...COLOR_PDF.azul);
  serie.forEach((p, i) => {
    doc.circle(px(p.fecha), py(p.pesoKg), 0.9, "F");
    if (serie.length <= 8 || i === 0 || i === serie.length - 1) { doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.tinta); doc.text(`${n1(p.pesoKg)} kg`, px(p.fecha), py(p.pesoKg) - 2, { align: i === 0 ? "left" : i === serie.length - 1 ? "right" : "center" }); }
  });
  doc.setFontSize(7); doc.setTextColor(...COLOR_PDF.gris);
  doc.text(fechaCortaLima(serie[0].fecha), x0, y0 + h + 4); doc.text(fechaCortaLima(serie[serie.length - 1].fecha), x0 + w, y0 + h + 4, { align: "right" });
  L.y = y0 + h + 9;
}

/* Barra apilada 100% (macronutrientes: real vs objetivo) con leyenda siempre visible. */
function pdfBarraMacros(L, real, objetivo) {
  const { doc } = L;
  L.asegurar(44); L.seccion("Distribución de la energía por macronutriente");

    const vals = [d.proteina, d.carbohidratos, d.grasas], bx0 = L.M + 28, bw = L.ANCHO - 28;

      x += ancho;

  dibujar("Consumido", real, L.y); dibujar("Objetivo", objetivo, L.y + 10);

  nombres.forEach((nm, i) => {

    lx += 40;

}

/* ---------- PDF 1: totales por día ---------- */
function exportarTotalesPDF({ datos, requerimiento }) {
  const dias = datos.map((d) => ({ fecha: d.fecha, ...filasDelDia(d.items), hay: d.items.length > 0 }));
  const con = dias.filter((d) => d.hay);
  const L = crearLienzoPDF("NutriApp · Totales por día", `Del ${fechaCortaLima(datos[0].fecha)} al ${fechaCortaLima(datos[datos.length - 1].fecha)} (${datos.length} días)`);
  if (!L) return;
  const n = con.length;
  const prom = (k) => (n ? con.reduce((s, d) => s + d.totales[k], 0) / n : 0);
  const pK = requerimiento.get > 0 ? (prom("kcal") / requerimiento.get) * 100 : 0, pP = requerimiento.proteinasG > 0 ? (prom("proteinasG") / requerimiento.proteinasG) * 100 : 0;
  const wc = (L.ANCHO - 6) / 2;
  pdfTarjeta(L, L.M, wc, "PROMEDIO DIARIO DE CALORÍAS", `${n0(prom("kcal"))} kcal`, `Meta: ${n0(requerimiento.get)} kcal · ${pctTxt(pK)} de la meta`, pK, COLOR_PDF.naranja);
  pdfTarjeta(L, L.M + wc + 6, wc, "PROMEDIO DIARIO DE PROTEÍNA", `${n0(prom("proteinasG"))} g`, `Meta: ${n0(requerimiento.proteinasG)} g · ${pctTxt(pP)} de la meta`, pP, COLOR_PDF.dorado);
  L.y += 36;
  L.nota(`Días con registro de alimentos: ${n} de ${datos.length}. Los promedios consideran solo los días con registro.`); L.y += 4;
  pdfGraficoBarras(L, { titulo: "Calorías por día", datos: dias.map((d) => ({ fecha: d.fecha, valor: d.hay ? d.totales.kcal : 0 })), meta: requerimiento.get, color: COLOR_PDF.naranja, unidad: "kcal" });
  pdfGraficoBarras(L, { titulo: "Proteína por día", datos: dias.map((d) => ({ fecha: d.fecha, valor: d.hay ? d.totales.proteinasG : 0 })), meta: requerimiento.proteinasG, color: COLOR_PDF.dorado, unidad: "g" });
  L.seccion("Detalle por día");
  pdfTabla(L,
    [{ t: "Fecha", w: 40 }, { t: "Calorías", w: 26, a: "r" }, { t: "% meta", w: 20, a: "r" }, { t: "Proteína", w: 26, a: "r" }, { t: "% meta", w: 20, a: "r" }, { t: "Carbohid.", w: 24, a: "r" }, { t: "Grasas", w: 24, a: "r" }],
    dias.map((d) => ({ celdas: d.hay ? [fechaCortaLima(d.fecha), `${n0(d.totales.kcal)} kcal`, pctTxt(requerimiento.get > 0 ? (d.totales.kcal / requerimiento.get) * 100 : 0), `${n0(d.totales.proteinasG)} g`, pctTxt(requerimiento.proteinasG > 0 ? (d.totales.proteinasG / requerimiento.proteinasG) * 100 : 0), `${n0(d.totales.carbohidratosG)} g`, `${n0(d.totales.grasasG)} g`] : [fechaCortaLima(d.fecha), "Sin registro", "", "", "", "", ""] })));
  L.finalizar(`reporte_totales_${datos[0].fecha}_a_${datos[datos.length - 1].fecha}.pdf`);
}

/* ---------- PDF 2: detalle por alimento, una hoja por día ---------- */
function dibujarHojaDia(L, dia, requerimiento) {
  const { doc, M, W, ANCHO } = L;
  const { totales, filas } = dia;
  const pK = requerimiento.get > 0 ? (totales.kcal / requerimiento.get) * 100 : 0, pP = requerimiento.proteinasG > 0 ? (totales.proteinasG / requerimiento.proteinasG) * 100 : 0;
  const wc = (ANCHO - 6) / 2;
  pdfTarjeta(L, M, wc, "CALORÍAS TOTALES DEL DÍA", `${n0(totales.kcal)} kcal`, `Meta diaria: ${n0(requerimiento.get)} kcal · Cumplido: ${pctTxt(pK)}`, pK, COLOR_PDF.naranja);
  pdfTarjeta(L, M + wc + 6, wc, "PROTEÍNA TOTAL DEL DÍA", `${n0(totales.proteinasG)} g`, `Meta diaria: ${n0(requerimiento.proteinasG)} g · Cumplido: ${pctTxt(pP)}`, pP, COLOR_PDF.dorado);
  L.y += 38;
  L.nota("Cada barra muestra qué porcentaje del total del día aportó ese alimento (calorías a la izquierda, proteína a la derecha)."); L.y += 3;
  const cx = { nom: M + 2, cant: M + 70, kcal: M + 88, bk: M + 91, pk: M + 128, prot: M + 146, bp: M + 149, pp: W - M };
  const cabecera = () => {
    doc.setFillColor(...COLOR_PDF.pista); doc.rect(M, L.y - 4, ANCHO, 6, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...COLOR_PDF.tinta);
    doc.text("Alimento", cx.nom, L.y); doc.text("Cantidad", cx.cant, L.y, { align: "right" });
    doc.text("Calorías", cx.kcal, L.y, { align: "right" }); doc.text("% de las calorías del día", cx.bk, L.y);
    doc.text("Proteína", cx.prot, L.y, { align: "right" }); doc.text("% de la proteína", cx.bp, L.y);
    L.y += 6;
  };
  cabecera();
  const barra = (x, ancho, p, color) => {
    doc.setFillColor(...COLOR_PDF.pista); doc.roundedRect(x, L.y - 3, ancho, 3.2, 0.8, 0.8, "F");
    doc.setFillColor(...color); doc.roundedRect(x, L.y - 3, Math.max(0.5, ancho * Math.min(p, 100) / 100), 3.2, 0.8, 0.8, "F");
  };
  MOMENTOS_KEYS.forEach((m) => {
    const grupo = filas.filter((f) => f.momento === m);

    doc.text(`${NOMBRE_MOMENTO_CAP[m]} — ${n0(sk)} kcal · ${n0(sp)} g de proteína`, M + 1, L.y); L.y += 5;
    grupo.sort((a, b) => b.aporteKcal - a.aporteKcal).forEach((f) => {
      if (L.asegurar(6)) cabecera();
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...COLOR_PDF.tinta);

  doc.setDrawColor(...COLOR_PDF.verde); doc.setLineWidth(0.4); doc.line(M, L.y - 3, W - M, L.y - 3);

  doc.text(`${n0(totales.proteinasG)} g`, cx.prot, L.y + 1, { align: "right" }); doc.text("100%", cx.pp, L.y + 1, { align: "right" });
  L.y += 8;
}

/* ---------- PDF 3: resumen clínico para el médico ---------- */
const OBJETIVO_TXT = { perdida: "Pérdida de peso", mantenimiento: "Mantenimiento", ganancia_muscular: "Ganancia muscular" };
const SEVERIDAD_TXT = { alta: "PRIORIDAD ALTA", media: "A VIGILAR", info: "INFORMATIVO", ok: "FAVORABLE" };

/* ---------- Componentes de pantalla ---------- */
/* ===================================================================================
   Patrón B · capas superpuestas (07-MOTION: layer-overlap-scroll). La cabecera oscura queda
   fija detrás; el panel claro se monta encima con esquinas redondeadas y, al deslizar, la tapa:
   el contenido de la cabecera sube al 35 % de la velocidad, se achica un poco y se desvanece.
   =================================================================================== */
const CapasCtx = React.createContext(false);
function useCapasScroll(ref, rango = 90) {
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let raf = 0;
    const f = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
      const y = Math.max(0, window.scrollY), p = Math.min(y, rango) / rango;
      el.style.transform = quieto ? "" : `translateY(${-y * 0.35}px) scale(${1 - p * 0.08})`;
      el.style.opacity = String(1 - p);
      el.style.pointerEvents = p > 0.6 ? "none" : "";
    }); };
    f(); window.addEventListener("scroll", f, { passive: true });
    return () => { window.removeEventListener("scroll", f); cancelAnimationFrame(raf); };
  }, [ref, rango]);
}
function PantallaCapas({ cabecera, children, alto = 104, className = "" }) {
  const ref = useRef(null);
  useCapasScroll(ref);
  useEffect(() => { try { window.scrollTo(0, 0); } catch {} }, []);
  return (
    <div className={`capas max-w-md mx-auto ${className}`} style={{ "--capas-alto": `${alto}px` }}>
      <header className="capas-cab"><div className="capas-cont" ref={ref}>{cabecera}</div></header>
      <main className="capas-panel"><CapasCtx.Provider value={true}>{children}</CapasCtx.Provider></main>
    </div>
  );
}
function CabeceraSimple({ titulo, sub, onCerrar, icono }) {
  return (
    <div className="capas-fila">
      {onCerrar && <button type="button" className="capas-btn" onClick={onCerrar} aria-label="Volver">‹</button>}
      {icono && <span className="capas-ico">{icono}</span>}
      <span className="capas-tit"><b>{titulo}</b>{sub && <small>{sub}</small>}</span>
    </div>
  );
}

function EncabezadoReporte({ titulo, onVolver, etiqueta = "Volver" }) {
  const enCapas = useContext(CapasCtx);
  if (enCapas) return (
    <div className="capas-sub">

      <b>{titulo}</b>
    </div>

  return (
