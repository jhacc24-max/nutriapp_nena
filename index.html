function PantallaMenu({ requerimiento, pacienteId, onErrorSync, pasarARegistro }) {
  const [semanaOffset, setSemanaOffset] = useState(0);
  const [variacion, setVariacion] = useState(0);
  const [diaSeleccionado, setDiaSeleccionado] = useState(() => {
    // Día de la semana de "hoy" en Lima (no el del dispositivo), para que el tab seleccionado
    // por defecto coincida con el día real en Perú.
    const hoy = new Date(hoyISO() + "T12:00:00Z").getUTCDay();
    return hoy === 0 ? 6 : hoy - 1; // índice 0=lunes...6=domingo
  });
  /* Las ediciones del menú (cambios de alimento/gramaje por día) antes solo se guardaban en la
     nube (Firestore): si no había "espacio" configurado o la sincronización fallaba, se perdían
     al cambiar de pestaña o recargar, porque este estado vive dentro de PantallaMenu y se
     reinicia cada vez que el componente se desmonta. Ahora se respaldan también en localStorage
     para que un cambio hecho hoy en el menú de mañana siga ahí aunque no haya nube. */
  const [ediciones, setEdiciones] = useState(() => {
    try { const s = localStorage.getItem("nutriapp_menu_ediciones"); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  useEffect(() => {
    try { localStorage.setItem("nutriapp_menu_ediciones", JSON.stringify(ediciones)); } catch {}
  }, [ediciones]);
  const [agregando, setAgregando] = useState(null);
  const [nuevoAlimento, setNuevoAlimento] = useState(null);
  const [nuevoGramos, setNuevoGramos] = useState(100);
  const [modoManual, setModoManual] = useState(false);
  const [manual, setManual] = useState({ nombre: "", kcal: "", proteinasG: "", carbohidratosG: "", grasasG: "" });
  const aplicandoRemotoMenu = useRef(false);
  const diasCargados = useRef({});

  const lunes = useMemo(() => {
    const l = getLunes(new Date());
    l.setUTCDate(l.getUTCDate() + semanaOffset * 7);
    return l;
  }, [semanaOffset]);

  const dias = useMemo(() => Array.from({ length: 7 }, (_, i) => { const d = new Date(lunes); d.setUTCDate(d.getUTCDate() + i); return d; }), [lunes]);

  const menusSemana = useMemo(() => dias.map((d) => {
    const seedDia = Math.floor(d.getTime() / DIAS_EN_MS) + variacion * 1000;
    const menu = generarMenu(requerimiento, seedDia);
    const totalDia = menu.reduce((acc, m) => {
      const t = m.items.reduce((s, it) => { const x = calcularTotalesItem(it.alimento, it.gramos); return { kcal: s.kcal + x.kcal, proteinasG: s.proteinasG + x.proteinasG, carbohidratosG: s.carbohidratosG + x.carbohidratosG, grasasG: s.grasasG + x.grasasG }; }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0 });
      return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG };
    }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0 });
    return { fecha: d, menu, totalDia };
  }), [dias, requerimiento, variacion]);

  const activo = menusSemana[diaSeleccionado];
  const claveDia = fechaLimaISO(activo.fecha);

  useEffect(() => {
    if (!pacienteId) return;
    const unsub = dbFirestore.collection("pacientes").doc(pacienteId).collection("menuEdiciones").doc(claveDia).onSnapshot((snap) => {
      const d = snap.data() || {};
      const resuelto = {};
      Object.keys(d).forEach((mealKey) => {
        resuelto[mealKey] = (d[mealKey] || []).map((it) => ({ alimento: FOOD_DB.find((f) => f.id === it.alimentoId), gramos: it.gramos })).filter((it) => it.alimento);
      });
      aplicandoRemotoMenu.current = true;
      diasCargados.current[claveDia] = true;
      setEdiciones((prev) => ({ ...prev, [claveDia]: resuelto }));
    }, () => onErrorSync && onErrorSync("No se pudo leer tus ajustes del menú desde la nube. Revisa tu conexión."));
    return unsub;
  }, [pacienteId, claveDia]);

  useEffect(() => {
    if (!pacienteId) return;
    if (aplicandoRemotoMenu.current) { aplicandoRemotoMenu.current = false; return; }
    if (!diasCargados.current[claveDia]) return;
    const dia = ediciones[claveDia] || {};
    const serializado = {};
    Object.keys(dia).forEach((mealKey) => { serializado[mealKey] = dia[mealKey].map((it) => ({ alimentoId: it.alimento.id, gramos: it.gramos })); });
    const t = setTimeout(() => { dbFirestore.collection("pacientes").doc(pacienteId).collection("menuEdiciones").doc(claveDia).set(serializado).catch(() => onErrorSync && onErrorSync("No se pudo guardar tu ajuste del menú en la nube. Revisa tu conexión.")); }, 800);
    return () => clearTimeout(t);
  }, [pacienteId, claveDia, ediciones]);

  const edicionesDia = ediciones[claveDia] || {};
  const menuEfectivo = activo.menu.map((m) => (edicionesDia[m.key] ? { ...m, items: edicionesDia[m.key] } : m));
  const totalEfectivo = menuEfectivo.reduce((acc, m) => {
    const t = m.items.reduce((s, it) => { const x = calcularTotalesItem(it.alimento, it.gramos); return { kcal: s.kcal + x.kcal, proteinasG: s.proteinasG + x.proteinasG, carbohidratosG: s.carbohidratosG + x.carbohidratosG, grasasG: s.grasasG + x.grasasG, fibraG: s.fibraG + x.fibraG }; }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });
    return { kcal: acc.kcal + t.kcal, proteinasG: acc.proteinasG + t.proteinasG, carbohidratosG: acc.carbohidratosG + t.carbohidratosG, grasasG: acc.grasasG + t.grasasG, fibraG: acc.fibraG + t.fibraG };
  }, { kcal: 0, proteinasG: 0, carbohidratosG: 0, grasasG: 0, fibraG: 0 });

  const actualizarItemsComida = (mealKey, nuevosItems) => setEdiciones((prev) => ({ ...prev, [claveDia]: { ...(prev[claveDia] || {}), [mealKey]: nuevosItems } }));
  const restablecerComida = (mealKey) => setEdiciones((prev) => { const dia = { ...(prev[claveDia] || {}) }; delete dia[mealKey]; return { ...prev, [claveDia]: dia }; });
  const cambiarItem = (mealKey, idx) => {
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    const item = meal.items[idx];
    const candidatos = FOOD_DB.filter((f) => f.categoria === item.alimento.categoria && aptoParaRestricciones(f, requerimiento.restricciones));
    if (candidatos.length < 2) return;
    const curIdx = candidatos.findIndex((f) => f.id === item.alimento.id);
    const siguiente = candidatos[(curIdx + 1) % candidatos.length];
    actualizarItemsComida(mealKey, meal.items.map((it, i) => (i === idx ? { ...it, alimento: siguiente } : it)));
  };
  const quitarItem = (mealKey, idx) => {
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    actualizarItemsComida(mealKey, meal.items.filter((_, i) => i !== idx));
  };
  const elegirAlimentoParaAgregar = (alimentoId) => {
    if (alimentoId === "__manual__") { setModoManual(true); return; }
    const alimento = FOOD_DB.find((f) => f.id === alimentoId);
    if (!alimento) return;
    setNuevoAlimento(alimento);
    setNuevoGramos(100);
  };
  /* Alimento/nutriente que no está en la base de datos: el usuario ingresa los valores por
     cada 100 g (igual que el resto del catálogo), y de ahí en adelante se trata exactamente
     igual que cualquier otro alimento del menú — cuenta en los totales del día y, al usar
     "A registro", se copia al registro de alimentos contando dentro de sus nutrientes. */
  const confirmarManual = () => {
    const n = (v) => Math.max(Number(v) || 0, 0);
    if (!manual.nombre.trim()) return;
    setNuevoAlimento({
      id: `manual_${Date.now()}`,
      nombre: manual.nombre.trim(),
      categoria: "otro",
      porcionBaseG: 100,
      kcal: n(manual.kcal),
      proteinasG: n(manual.proteinasG),
      carbohidratosG: n(manual.carbohidratosG),
      fibraG: 0,
      grasasG: n(manual.grasasG),
      grasasSaturadasG: 0,
      sodioMg: 0,
      potasioMg: 0,
      azucaresG: 0,
    });
    setNuevoGramos(100);
    setModoManual(false);
    setManual({ nombre: "", kcal: "", proteinasG: "", carbohidratosG: "", grasasG: "" });
  };
  const confirmarAgregarItem = (mealKey) => {
    if (!nuevoAlimento || !(nuevoGramos > 0)) return;
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    actualizarItemsComida(mealKey, [...meal.items, { alimento: nuevoAlimento, gramos: nuevoGramos }]);
    setAgregando(null); setNuevoAlimento(null); setNuevoGramos(100);
  };
  const cancelarAgregarItem = () => {
    setAgregando(null); setNuevoAlimento(null); setNuevoGramos(100);
    setModoManual(false); setManual({ nombre: "", kcal: "", proteinasG: "", carbohidratosG: "", grasasG: "" });
  };
  const editarGramosItem = (mealKey, idx, gramos) => {
    const meal = menuEfectivo.find((m) => m.key === mealKey);
    actualizarItemsComida(mealKey, meal.items.map((it, i) => (i === idx ? { ...it, gramos: Math.max(Number(gramos) || 0, 0) } : it)));
  };

  const desvio = requerimiento.get > 0 ? Math.round(((totalEfectivo.kcal - requerimiento.get) / requerimiento.get) * 100) : 0;
  const esHoy = (d) => fechaLimaISO(d) === hoyISO();

  const [pasandoARegistro, setPasandoARegistro] = useState(false);
  const [copiadoOk, setCopiadoOk] = useState(false);
  const confirmarPasarARegistro = async () => {
    if (!pasarARegistro || pasandoARegistro) return;
    const ok = window.confirm(`¿Copiar el menú de ${NOMBRE_DIA_LARGO(activo.fecha)} a tu registro de alimentos de ese día? Esto reemplaza lo que ya tengas registrado ese día por lo planificado en el menú (después solo ajustas cantidades si algo cambió al momento de comer).`);
    if (!ok) return;
    setPasandoARegistro(true); setCopiadoOk(false);
    try {
      await pasarARegistro(claveDia, menuEfectivo);
      setCopiadoOk(true);
      setTimeout(() => setCopiadoOk(false), 5000);
    } catch {
      onErrorSync && onErrorSync("No se pudo copiar el menú a tu registro. Revisa tu conexión e inténtalo de nuevo.");
    } finally {
      setPasandoARegistro(false);
    }
  };

  return (
    <div className="nutri-pagina">
      <div className="nutri-hero-titulo">
        <div className="flex items-center justify-between mb-1">
          <h1 className="nutri-serif text-2xl nutri-ink">Menú semanal</h1>
          <button onClick={() => setVariacion((v) => v + 1)} className="flex items-center gap-1.5 text-xs nutri-brand-text font-medium"><IconRefresh size={13} /> Nueva variación</button>
        </div>
        <p className="text-sm nutri-muted mb-4">Cambia automáticamente semana a semana (y por lo tanto mes a mes y año a año) para variar los alimentos.</p>
      </div>
      <div className="nutri-sheet px-5 pt-6 pb-24">

      <SugeridorIngrediente requerimiento={requerimiento} />

      <div className="flex items-center justify-between mb-3">
        <button onClick={() => setSemanaOffset((s) => s - 1)} className="text-xs nutri-brand-text font-medium px-2 py-1">‹ Semana anterior</button>
        <span className="text-xs nutri-muted font-medium">{RANGO_SEMANA(dias[0], dias[6])}</span>
        <button onClick={() => setSemanaOffset((s) => s + 1)} className="text-xs nutri-brand-text font-medium px-2 py-1">Semana siguiente ›</button>
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1 mb-5" style={{ scrollbarWidth: "none" }}>
        {menusSemana.map((dm, i) => (
          <button
            key={i}
            onClick={() => setDiaSeleccionado(i)}
            className={`shrink-0 rounded-xl px-3 py-2 text-center nutri-chip ${i === diaSeleccionado ? "nutri-chip-active" : "bg-white nutri-ink"}`}
            style={{ minWidth: 64 }}
          >
            <div className="text-[10px] uppercase tracking-wide opacity-80">{NOMBRE_DIA_CORTO(dm.fecha)}{esHoy(dm.fecha) ? " •" : ""}</div>
            <div className="nutri-serif text-base leading-tight">{dm.fecha.getDate()}</div>
            <div className="text-[10px] opacity-80">{Math.round(dm.totalDia.kcal)} kcal</div>
          </button>
        ))}
      </div>

      <div className="flex items-center justify-between mb-1">
        <p className="text-sm font-medium nutri-ink capitalize">{NOMBRE_DIA_LARGO(activo.fecha)}</p>
        {pasarARegistro && (
          <button onClick={confirmarPasarARegistro} disabled={pasandoARegistro} className="text-xs nutri-brand-text font-medium disabled:opacity-40">
            {pasandoARegistro ? "Copiando..." : "→ A registro"}
          </button>
        )}
      </div>
      {copiadoOk && <p className="text-xs mb-2" style={{ color: "var(--st-meta)" }}>✓ Menú copiado a tu registro de {NOMBRE_DIA_LARGO(activo.fecha)}. Ahora solo ajusta cantidades ahí si algo cambió.</p>}
      <div className="nutri-panel rounded-xl p-4 mb-5">
        {[
          { label: "Calorías", unidad: "kcal", meta: requerimiento.get, actual: totalEfectivo.kcal, cls: "nutri-accent-energy" },
          { label: "Proteína", unidad: "g", meta: requerimiento.proteinasG, actual: totalEfectivo.proteinasG, cls: "nutri-accent-protein" },
          { label: "Carbohidratos", unidad: "g", meta: requerimiento.carbohidratosG, actual: totalEfectivo.carbohidratosG, cls: "nutri-accent-carb" },
          { label: "Grasas", unidad: "g", meta: requerimiento.grasasG, actual: totalEfectivo.grasasG, cls: "nutri-accent-fat" },
          { label: "Fibra", unidad: "g", meta: requerimiento.fibraG, actual: totalEfectivo.fibraG, cls: "nutri-accent-fiber" },
        ].map((n, i) => {
          const cumplido = n.actual >= n.meta;
          return (
            <div key={i} className="py-2" style={{ borderTop: i > 0 ? "1px solid var(--panel-border)" : "none" }}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-medium nutri-ink flex items-center gap-1.5"><span className={`inline-block w-2.5 h-2.5 rounded-full ${n.cls}`} />{n.label}</span>
                {cumplido ? <span className="text-xs" style={{ color: "var(--st-meta)" }}>✅ Cumplido</span> : <span className="text-xs nutri-warn">⚠️ Ajustar</span>}
              </div>
              <Bar value={n.actual} max={n.meta} colorClass={n.cls} marcarExceso={false} />
              <div className="flex items-center justify-between text-xs nutri-muted mt-1">
                <span>Meta: {Math.round(n.meta)} {n.unidad}</span>
                <span>Menú: {Math.round(n.actual)} {n.unidad}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div className="space-y-4">
        {menuEfectivo.map((m, mi) => (
          <div key={m.key} className="nutri-panel rounded-2xl p-5" style={{ borderLeft: `5px solid var(--tone-${[400, 500, 600, 700][mi % 4]})` }}>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm font-medium nutri-ink">{m.label}</span>
              <div className="flex items-center gap-2">
                <span className="text-xs nutri-muted">{Math.round(requerimiento.get * m.pct)} kcal objetivo</span>
                {edicionesDia[m.key] && <button onClick={() => restablecerComida(m.key)} className="text-xs nutri-brand-text">Restablecer</button>}
              </div>
            </div>
            <div className="space-y-2 mb-2">
              {m.items.map((it, i) => (
                <div key={i} className="flex items-center justify-between text-sm flex-wrap gap-y-1">
                  <span className="nutri-ink flex items-center gap-2.5"><IconoAlimento alimento={it.alimento} size={34} />{it.alimento.nombre}</span>
                  <div className="flex items-center gap-2 flex-wrap justify-end">
                    <input
                      type="number"
                      value={it.gramos}
                      onChange={(e) => editarGramosItem(m.key, i, e.target.value)}
                      className="w-14 rounded-lg nutri-chip px-1.5 py-1 text-xs bg-white nutri-ink text-right"
                     onFocus={(e) => e.target.select()} />
                    <span className="nutri-muted text-xs">g</span>
                    {esAceite(it.alimento) && <SelectorCucharas onElegir={(g) => editarGramosItem(m.key, i, g)} />}
                    {esNuez(it.alimento) && <SelectorNueces onElegir={(g) => editarGramosItem(m.key, i, g)} />}
                    <button onClick={() => cambiarItem(m.key, i)} title="Cambiar por otra opción" className="nutri-brand-text"><IconRefresh size={13} /></button>
                    <button onClick={() => quitarItem(m.key, i)} title="Quitar" className="nutri-warn"><IconTrash size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
            {agregando === m.key ? (
              <div className="mt-2 space-y-2">
                {modoManual ? (
                  <div className="nutri-panel rounded-lg p-3">
                    <span className="text-sm nutri-ink font-medium block mb-2">Alimento o nutriente personalizado</span>
                    <input
                      className="w-full rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink mb-2"
                      placeholder="Nombre (ej. Ensure Advance, plato casero...)"
                      value={manual.nombre}
                      onChange={(e) => setManual((s) => ({ ...s, nombre: e.target.value }))}
                    />
                    <p className="text-[11px] nutri-muted mb-1">Valores por cada 100 g (o 100 ml):</p>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <label className="text-xs nutri-muted">Kcal
                        <input type="number" className="w-full rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink" value={manual.kcal} onChange={(e) => setManual((s) => ({ ...s, kcal: e.target.value }))} onFocus={(e) => e.target.select()} />
                      </label>
                      <label className="text-xs nutri-muted">Proteína (g)
                        <input type="number" className="w-full rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink" value={manual.proteinasG} onChange={(e) => setManual((s) => ({ ...s, proteinasG: e.target.value }))} onFocus={(e) => e.target.select()} />
                      </label>
                      <label className="text-xs nutri-muted">Carbohidratos (g)
                        <input type="number" className="w-full rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink" value={manual.carbohidratosG} onChange={(e) => setManual((s) => ({ ...s, carbohidratosG: e.target.value }))} onFocus={(e) => e.target.select()} />
                      </label>
                      <label className="text-xs nutri-muted">Grasas (g)
                        <input type="number" className="w-full rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink" value={manual.grasasG} onChange={(e) => setManual((s) => ({ ...s, grasasG: e.target.value }))} onFocus={(e) => e.target.select()} />
                      </label>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={confirmarManual} disabled={!manual.nombre.trim()} className="flex-1 nutri-brand text-white rounded-lg py-1.5 text-xs disabled:opacity-40">Continuar</button>
                      <button onClick={cancelarAgregarItem} className="flex-1 nutri-chip nutri-ink rounded-lg py-1.5 text-xs">Cancelar</button>
                    </div>
                  </div>
                ) : !nuevoAlimento ? (
                  <div className="flex gap-2">
                    <select className="flex-1 rounded-lg nutri-chip px-2 py-1.5 bg-white nutri-ink" style={{ fontSize: "0.7rem" }} defaultValue="" onChange={(e) => elegirAlimentoParaAgregar(e.target.value)}>
                      <option value="" disabled>Elige un alimento...</option>
                      <option value="__manual__">➕ Otro (no está en la lista)...</option>
                      {ORDEN_CATEGORIAS.map((cat) => {
                        const items = FOOD_DB.filter((f) => f.categoria === cat && aptoParaRestricciones(f, requerimiento.restricciones));
                        if (items.length === 0) return null;
                        return (
                          <optgroup key={cat} label={CATEGORIA_LABELS[cat] || cat}>
                            {items.map((f) => <option key={f.id} value={f.id}>{f.nombre}</option>)}
                          </optgroup>
                        );
                      })}
                    </select>
                    <button onClick={cancelarAgregarItem} className="text-xs nutri-muted px-2">Cancelar</button>
                  </div>
                ) : (
                  <div className="nutri-panel rounded-lg p-3">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-sm nutri-ink font-medium flex items-center gap-2.5"><IconoAlimento alimento={nuevoAlimento} size={36} className="nutri-ico-pop" key={nuevoAlimento.id} />{nuevoAlimento.nombre}</span>
                      <button onClick={() => setNuevoAlimento(null)} className="text-xs nutri-muted">cambiar</button>
                    </div>
                    <div className="flex items-center gap-2 flex-wrap mb-2">
                      <input
                        type="number"
                        value={nuevoGramos}
                        onChange={(e) => setNuevoGramos(Number(e.target.value))}
                        className="w-20 rounded-lg nutri-chip px-2 py-1.5 text-sm bg-white nutri-ink"
                       onFocus={(e) => e.target.select()} />
                      <span className="text-xs nutri-muted">gramos</span>
                      {esAceite(nuevoAlimento) && <SelectorCucharas onElegir={setNuevoGramos} />}
                      {esNuez(nuevoAlimento) && <SelectorNueces onElegir={setNuevoGramos} />}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => confirmarAgregarItem(m.key)} disabled={!(nuevoGramos > 0)} className="flex-1 nutri-brand text-white rounded-lg py-1.5 text-xs disabled:opacity-40">Agregar</button>
                      <button onClick={cancelarAgregarItem} className="flex-1 nutri-chip nutri-ink rounded-lg py-1.5 text-xs">Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <button onClick={() => setAgregando(m.key)} className="text-xs nutri-brand-text flex items-center gap-1"><IconPlus size={12} /> Agregar alimento</button>
            )}
            {m.notaExtra && <p className="text-xs nutri-brand-text mt-3">💡 {m.notaExtra}</p>}
          </div>
        ))}
      </div>

      {(requerimiento.condicionesActivas.length > 0 || requerimiento.interacciones.length > 0) && (
        <div className="mt-5 flex items-start gap-2 text-xs nutri-muted">
          <span className="mt-0.5 shrink-0"><IconSparkles size={14} /></span>
          <span>
            {requerimiento.condicionesActivas.length > 0 && <>Excluye alimentos no recomendados para: {requerimiento.condicionesActivas.map((c) => c.nombre).join(", ")}. </>}
            {requerimiento.interacciones.length > 0 && <>También considera tus medicamentos: {requerimiento.interacciones.map((i) => i.medicamentoUsuario).join(", ")}.</>}
          </span>
        </div>
      )}
      </div>
    </div>
  );
}

/* Instalación como app: usa el aviso del navegador cuando existe; si no, se muestran los pasos manuales. */
function useInstalar() {
  const [evento, setEvento] = useState(() => (typeof window !== "undefined" ? window.__nutriInstalar : null));
  useEffect(() => {
    const act = () => setEvento(window.__nutriInstalar || null);
    window.addEventListener("nutri-instalable", act);
    return () => window.removeEventListener("nutri-instalable", act);
  }, []);
  const instalada = typeof window !== "undefined" && ((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true);
  const ua = typeof navigator !== "undefined" ? navigator.userAgent : "";
  const ios = /iphone|ipad|ipod/i.test(ua);
  const seguro = typeof window !== "undefined" && (window.isSecureContext || location.protocol === "https:");
  const pedir = async () => {
    if (!evento) return "manual";
    evento.prompt();
    try { const r = await evento.userChoice; window.__nutriInstalar = null; setEvento(null); return r.outcome; } catch { return "manual"; }
  };
  return { disponible: !!evento, instalada, ios, seguro, pedir };
}

function TarjetaCuenta({ salir, email, instalar }) {
  const [confirmando, setConfirmando] = useState(false);
  const [saliendo, setSaliendo] = useState(false);
  const [verPasos, setVerPasos] = useState(false);
  const intentarInstalar = async () => { const r = await instalar.pedir(); if (r === "manual") setVerPasos(true); };
  return (
    <div className="nutri-panel rounded-2xl p-5 mb-5">
      <div className="flex items-center gap-2 mb-3"><IconActivity size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">Cuenta y aplicación</span></div>

      <div className="rounded-xl p-3 mb-3" style={{ background: "color-mix(in srgb, var(--tone-500) 10%, transparent)", border: "1px solid color-mix(in srgb, var(--tone-500) 22%, transparent)" }}>
        <p className="text-sm font-medium nutri-ink mb-0.5">Instalar en tu celular</p>
        {instalar.instalada ? (
          <p className="text-xs" style={{ color: "var(--st-meta)" }}>✓ La app ya está instalada en este dispositivo.</p>
        ) : (
          <>
            <p className="text-xs nutri-muted mb-2">Se abre desde un ícono en tu pantalla de inicio, a pantalla completa y también sin conexión.</p>
            <button onClick={intentarInstalar} className="w-full nutri-brand text-white rounded-xl py-2.5 text-sm font-medium">Instalar app</button>
            {(verPasos || (!instalar.disponible && !instalar.ios)) && (
              <div className="text-xs nutri-muted mt-2.5 leading-relaxed">
                {instalar.ios
                  ? <p><b className="nutri-ink">iPhone:</b> en Safari toca el botón <b>Compartir</b> (cuadro con flecha) y elige <b>“Añadir a pantalla de inicio”</b>.</p>
                  : <p><b className="nutri-ink">Android:</b> en Chrome toca los tres puntos ⋮ y elige <b>“Instalar aplicación”</b> (o “Añadir a pantalla de inicio”).</p>}
                {!instalar.seguro && <p className="nutri-warn mt-1">Para instalarla, la app debe abrirse desde su dirección web (https), no desde un archivo descargado.</p>}
              </div>
            )}
            {instalar.ios && !verPasos && (
              <p className="text-xs nutri-muted mt-2.5 leading-relaxed"><b className="nutri-ink">iPhone:</b> en Safari toca <b>Compartir</b> y elige <b>“Añadir a pantalla de inicio”</b>.</p>
            )}
          </>
        )}
      </div>

      {salir ? (
        <div>
          {email && <p className="text-xs nutri-muted mb-2">Sesión iniciada como <b className="nutri-ink">{email}</b></p>}
          {!confirmando ? (
            <button onClick={() => setConfirmando(true)} className="w-full rounded-xl py-2.5 text-sm font-medium nutri-warn" style={{ border: "1.5px solid currentColor", background: "transparent" }}>Cerrar sesión</button>
          ) : (
            <div className="rounded-xl p-3" style={{ background: "var(--warn-bg)" }}>
              <p className="text-xs nutri-ink mb-2">¿Cerrar la sesión en este dispositivo? Tus datos siguen guardados en tu cuenta.</p>
              <div className="flex gap-2">
                <button disabled={saliendo} onClick={async () => { setSaliendo(true); try { await salir(); } finally { setSaliendo(false); setConfirmando(false); } }} className="flex-1 rounded-lg py-2 text-sm font-medium text-white" style={{ background: "var(--warn)" }}>{saliendo ? "..." : "Sí, cerrar sesión"}</button>
                <button onClick={() => setConfirmando(false)} className="flex-1 nutri-chip rounded-lg py-2 text-sm nutri-ink">Cancelar</button>
              </div>
            </div>
          )}
        </div>
      ) : (
        <p className="text-xs nutri-muted">Estás usando la app sin cuenta: tus datos se guardan solo en este teléfono.</p>
      )}
    </div>
  );
}

    setNuevoSup({ nombre: "", kcal: "", proteinaG: "", vecesDia: 1, momento: "mañana", notas: "" });

        </div>
      </div>

      </>}
      {seccion !== "plan" && <div className="nutri-panel rounded-2xl p-5">
        <div className="flex items-center gap-2 mb-3"><IconPill size={16} className="nutri-brand-text" /><span className="text-sm font-medium nutri-ink">Medicamentos</span></div>

        <div className="flex flex-col gap-2 mb-3">
          <input className={inputCls} placeholder="Nombre del medicamento" value={nuevoMed.nombre} onChange={(e) => setNuevoMed((m) => ({ ...m, nombre: e.target.value }))} />
          <div className="flex gap-2">
            <input className={inputCls} placeholder="Dosis (ej. 50 mg)" value={nuevoMed.dosis} onChange={(e) => setNuevoMed((m) => ({ ...m, dosis: e.target.value }))} />
            <input className={inputCls} placeholder="Frecuencia (ej. 1x/día)" value={nuevoMed.frecuencia} onChange={(e) => setNuevoMed((m) => ({ ...m, frecuencia: e.target.value }))} />

          <IconCamera size={15} /> {subiendoFoto ? "Leyendo la receta..." : "Subir foto de receta"}
        </button>
        <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFoto} />

        {errorFoto && <p className="text-xs nutri-warn mb-3">{errorFoto}</p>}

        {sugerenciasFoto.length > 0 && (

            <span className="text-xs nutri-muted block mb-2">Detectado en la foto — confirma para agregar:</span>
            <div className="flex flex-wrap gap-2">

                <button key={i} onClick={() => { setMedicamentos((prev) => [...prev, { id: `med_${Date.now()}_${i}`, nombre, dosis: "", frecuencia: "" }]); setSugerenciasFoto((prev) => prev.filter((_, j) => j !== i)); }} className="text-xs px-3 py-1.5 rounded-full nutri-chip nutri-ink flex items-center gap-1">

        <div className="space-y-2 mb-3">
          {medicamentos.map((m) => (

              <div><span className="nutri-ink">{m.nombre}</span> <span className="nutri-muted text-xs">{m.dosis} {m.frecuencia}</span></div>
              <button onClick={() => eliminarMedicamento(m.id)} className="nutri-warn"><IconTrash size={15} /></button>

          {medicamentos.length === 0 && <p className="text-sm nutri-muted">Aún no agregaste medicamentos.</p>}
        </div>

        <p className="text-[11px] nutri-muted leading-relaxed">Esta información es orientativa y no reemplaza la indicación de tu médico o farmacéutico. Ante cualquier duda sobre interacciones fármaco-nutriente, consúltalo con un profesional de salud.</p>
      </div>}
      </>}
      </div>
    </div>
  );

function PantallaLogin({ auth }) {
  const [modo, setModo] = useState("entrar");

  const fallar = (msg) => { setError(msg); setSacudir(true); setTimeout(() => setSacudir(false), 380); };

  const enviar = async (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    setError(""); setAviso("");
    if (!correo.trim() || clave.length < 6) { fallar(!correo.trim() ? "Escribe tu correo." : "La contraseña debe tener al menos 6 caracteres."); return; }
    setCargando(true);
    try {
      if (modo === "entrar") await auth.signInWithEmailAndPassword(correo.trim(), clave);
      else await auth.createUserWithEmailAndPassword(correo.trim(), clave);
      setOk(true);
    } catch (e) {

    } finally { setCargando(false); }

    setError(""); setAviso("");

    catch (e) { fallar(e.code === "auth/user-not-found" ? "No existe una cuenta con ese correo." : e.code === "auth/invalid-email" ? "Correo inválido." : "No se pudo enviar el correo. Intenta de nuevo."); }

        <h1><MarcaNombre salta retraso={0.2} /></h1>
        <p>{entrando ? "Tu plan de comidas, simple y a tiempo." : "Crea tu cuenta para guardar tus datos y usarlos en todos tus celulares."}</p>
      </div>
      <form className={`nl-form ${sacudir ? "nl-sacude" : ""}`} onSubmit={enviar} noValidate>
        <label className="nl-campo">
          <input type="email" autoComplete="username" placeholder=" " value={correo} onChange={(e) => setCorreo(e.target.value)} />
          <span>Correo</span>
        </label>
        <label className="nl-campo">
          <input type={verClave ? "text" : "password"} autoComplete={entrando ? "current-password" : "new-password"} placeholder=" " value={clave} onChange={(e) => setClave(e.target.value)} />
          <span>Contraseña</span>
          <button type="button" className="nl-ojo" onClick={() => setVerClave((v) => !v)} aria-label={verClave ? "Ocultar contraseña" : "Mostrar contraseña"}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{verClave ? <><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><path d="M1 1l22 22" /></> : <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></>}</svg>
          </button>
        </label>
        {entrando && <button type="button" onClick={olvide} className="nl-olvide">¿Olvidaste tu contraseña?</button>}
        <div className="nl-msg" aria-live="polite">
          {error && <p className="nutri-warn">{error}</p>}

          <span className="nl-nivel">{ONDA_SVG("rgba(255,255,255,.28)")}</span>

      </form>
    </div>
  );
}

function generarCodigoEspacio() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function PantallaEspacio({ uid, onListo }) {
  const [modo, setModo] = useState("elegir");
  const [codigoInput, setCodigoInput] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const crearEspacio = async () => {
    setCargando(true); setError("");
    try {
      const codigo = generarCodigoEspacio();
      await dbFirestore.collection("pacientes").doc(codigo).set({ perfil: PERFIL_DEFAULT, catalogoCustom: [], recipientes: RECIPIENTES_DEFAULT, medicamentos: [], prescripcion: PRESCRIPCION_DEFAULT, suplementos: [], pesos: [], tema: "claro", creadoPor: uid, creadoEn: Date.now() });
      await dbFirestore.collection("usuarios").doc(uid).set({ pacienteId: codigo }, { merge: true });
      onListo(codigo);
    } catch (e) { setError("No se pudo crear el espacio. Intenta de nuevo."); } finally { setCargando(false); }
  };

  const unirse = async () => {
    setCargando(true); setError("");
    try {
      const codigo = codigoInput.trim().toUpperCase();
      // Las reglas de Firestore solo permiten vincularse a un espacio que exista; así el espacio
      // no se puede leer antes de ser miembro (ver firestore.rules).
      try { await dbFirestore.collection("usuarios").doc(uid).set({ pacienteId: codigo }, { merge: true }); }
      catch (e) { setError("No existe un espacio con ese código."); setCargando(false); return; }
      onListo(codigo);
    } catch (e) { setError("Ocurrió un error. Intenta de nuevo."); } finally { setCargando(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ background: "var(--bg)" }}>
      <div className="w-full max-w-sm nutri-panel rounded-2xl p-6">
        <h1 className="nutri-serif text-2xl nutri-ink mb-1 text-center">Espacio compartido</h1>
        <p className="text-sm nutri-muted mb-6 text-center">Todas las personas que registren comidas para el mismo paciente deben usar el mismo espacio, con su propia cuenta.</p>
        {modo === "elegir" && (
          <div className="space-y-2">
            <button onClick={crearEspacio} disabled={cargando} className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm disabled:opacity-40">{cargando ? "..." : "Crear un espacio nuevo"}</button>
            <button onClick={() => setModo("unirse")} className="w-full nutri-chip rounded-lg py-2.5 text-sm nutri-ink">Unirme con un código</button>
          </div>
        )}
        {modo === "unirse" && (
          <div className="space-y-2">
            <input className="w-full rounded-lg nutri-chip px-3 py-2 text-sm bg-white nutri-ink text-center tracking-widest uppercase" placeholder="CÓDIGO" value={codigoInput} onChange={(e) => setCodigoInput(e.target.value)} maxLength={6} />
            <button onClick={unirse} disabled={cargando || codigoInput.trim().length < 4} className="w-full nutri-brand text-white rounded-lg py-2.5 text-sm disabled:opacity-40">{cargando ? "..." : "Unirme"}</button>
            <button onClick={() => setModo("elegir")} className="w-full text-xs nutri-brand-text text-center">Volver</button>
          </div>
        )}
        {error && <p className="text-xs nutri-warn mt-3 text-center">{error}</p>}
        <button onClick={() => authFirebase.signOut()} className="w-full text-xs nutri-warn text-center mt-4">Cerrar sesión</button>
      </div>
    </div>
  );
}

function Raiz() {
  const [usuario, setUsuario] = useState(FIREBASE_ACTIVO ? undefined : null);
  const [pacienteId, setPacienteId] = useState(undefined);
  /* Pantalla de carga con el logo animado: se muestra al menos lo que dura la animación y, si la
     sesión tarda más, sigue hasta que esté lista. Reemplaza el antiguo texto "Cargando...". */
  const [introLista, setIntroLista] = useState(false);
  const [saliendo, setSaliendo] = useState(false);
  useEffect(() => { const t1 = setTimeout(() => setSaliendo(true), 2300); const t2 = setTimeout(() => setIntroLista(true), 2750); return () => { clearTimeout(t1); clearTimeout(t2); }; }, []);
  useEffect(() => {
    if (!FIREBASE_ACTIVO) return;
    return authFirebase.onAuthStateChanged((u) => { setUsuario(u); setPacienteId(undefined); });
  }, []);
  useEffect(() => {
    if (!FIREBASE_ACTIVO || !usuario) return;
    dbFirestore.collection("usuarios").doc(usuario.uid).get().then((doc) => {
      setPacienteId(doc.exists && doc.data().pacienteId ? doc.data().pacienteId : null);
    });
  }, [usuario]);

  const cargando = FIREBASE_ACTIVO && (usuario === undefined || (usuario && pacienteId === undefined));
  if (!introLista || cargando) return <PantallaCarga saliendo={saliendo && !cargando} />;
  if (!FIREBASE_ACTIVO) return <NutriApp pacienteId={null} />;
  if (!usuario) return <PantallaLogin auth={authFirebase} />;
  if (!pacienteId) return <PantallaEspacio uid={usuario.uid} onListo={setPacienteId} />;
  return <NutriApp pacienteId={pacienteId} salir={() => authFirebase.signOut()} email={usuario.email} nombre={usuario.displayName} foto={usuario.photoURL} />;
}

function NutriApp({ pacienteId, salir, email, nombre, foto }) {
  const instalar = useInstalar();

  const [perfil, setPerfil] = useState(() => { try { const s = localStorage.getItem("nutriapp_perfil"); return s ? JSON.parse(s) : PERFIL_DEFAULT; } catch { return PERFIL_DEFAULT; } });
  const [catalogo, setCatalogo] = useState(() => { try { const s = localStorage.getItem("nutriapp_condiciones_custom"); const custom = s ? JSON.parse(s) : []; return [...CONDICIONES_PRESET, ...custom]; } catch { return CONDICIONES_PRESET; } });
  const [recipientes, setRecipientes] = useState(() => { try { const s = localStorage.getItem("nutriapp_recipientes"); return s ? JSON.parse(s) : RECIPIENTES_DEFAULT; } catch { return RECIPIENTES_DEFAULT; } });
  const [medicamentos, setMedicamentos] = useState(() => { try { const s = localStorage.getItem("nutriapp_medicamentos"); return s ? JSON.parse(s) : []; } catch { return []; } });
  const [prescripcion, setPrescripcion] = useState(() => { try { const s = localStorage.getItem("nutriapp_prescripcion"); return s ? JSON.parse(s) : PRESCRIPCION_DEFAULT; } catch { return PRESCRIPCION_DEFAULT; } });
  const [suplementos, setSuplementos] = useState(() => { try { const s = localStorage.getItem("nutriapp_suplementos"); return s ? JSON.parse(s) : SUPLEMENTOS_DEFAULT; } catch { return SUPLEMENTOS_DEFAULT; } });
  const [tema, setTema] = useState(() => { try { return localStorage.getItem("nutriapp_tema") || "claro"; } catch { return "claro"; } });
  const [paleta, setPaleta] = useState(() => { try { const g = localStorage.getItem("nutriapp_paleta"); return PALETAS.some((x) => x.id === g) ? g : "turquesa"; } catch { return "turquesa"; } });
  useEffect(() => {
    try { localStorage.setItem("nutriapp_paleta", paleta); document.body.setAttribute("data-paleta", paleta); } catch {}
    try { const c = getComputedStyle(document.body).getPropertyValue("--hero").trim(); const m = document.querySelector('meta[name="theme-color"]'); if (c && m) m.setAttribute("content", c); } catch {}
  }, [paleta, tema]);
  useEffect(() => { try { localStorage.setItem("nutriapp_tema", tema); document.body.setAttribute("data-tema", tema); } catch {} }, [tema]);

  const [pesos, setPesos] = useState(() => { try { const s = localStorage.getItem("nutriapp_pesos"); return s ? JSON.parse(s) : []; } catch { return []; } });
  useEffect(() => { try { localStorage.setItem("nutriapp_pesos", JSON.stringify(pesos)); } catch {} }, [pesos]);
  /* Registrar un peso en cualquier fecha (hoy o pasada). Hay un solo peso por día: si ya existe
     uno en esa fecha devuelve { conflicto } para que la pantalla pida confirmación y vuelva a
     llamar con reemplazar. El peso del perfil (IMC, requerimientos) siempre queda alineado con el
     registro MÁS RECIENTE, así que cargar un peso antiguo no lo altera. */
  const alinearPerfilConPesos = (nuevos) => { if (nuevos.length) setPerfil((pf) => ({ ...pf, pesoKg: nuevos[nuevos.length - 1].pesoKg })); };
  const agregarPeso = useCallback((fecha, pesoKg, { reemplazar = false } = {}) => {
    if (!(pesoKg >= 20 && pesoKg <= 300)) return { error: "Ingresa un peso entre 20 y 300 kg." };
    if (!fecha || fecha > hoyISO()) return { error: "La fecha no puede estar vacía ni ser futura." };
    const existente = pesos.find((p) => p.fecha === fecha);
    if (existente && !reemplazar) return { conflicto: existente };
    const nuevos = [...pesos.filter((p) => p.fecha !== fecha), { id: `peso_${Date.now()}`, fecha, pesoKg }].sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPesos(nuevos);
    alinearPerfilConPesos(nuevos);
    return { ok: true, reemplazado: !!existente };
  }, [pesos]);
  /* Carga masiva (varios pesos de una vez). Si hay dos del mismo día en la lista, gana el último. */
  const importarPesos = useCallback((lista, reemplazar) => {
    const porFecha = {}; pesos.forEach((p) => { porFecha[p.fecha] = p; });
    let agregados = 0, reemplazados = 0, omitidos = 0;
    lista.forEach((it, i) => {
      if (porFecha[it.fecha] && !reemplazar) { omitidos++; return; }
      if (porFecha[it.fecha]) reemplazados++; else agregados++;
      porFecha[it.fecha] = { id: `peso_${Date.now()}_${i}`, fecha: it.fecha, pesoKg: it.pesoKg };
    });
    const nuevos = Object.values(porFecha).sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPesos(nuevos);
    alinearPerfilConPesos(nuevos);
    return { agregados, reemplazados, omitidos };
  }, [pesos]);
  /* Corregir o eliminar un peso mal registrado. Se identifica por fecha (hay un solo peso por día).
     El peso del perfil (que alimenta IMC y requerimientos) se vuelve a alinear con el registro
     más reciente que quede, y el arreglo completo se sincroniza con el espacio compartido. */
  const corregirPeso = useCallback((fechaOriginal, { pesoKg, fecha }) => {
    if (fecha !== fechaOriginal && pesos.some((p) => p.fecha === fecha)) return "Ya hay un peso registrado en esa fecha.";
    const nuevos = pesos.map((p) => (p.fecha === fechaOriginal ? { ...p, pesoKg, fecha } : p)).sort((a, b) => a.fecha.localeCompare(b.fecha));
    setPesos(nuevos);
    alinearPerfilConPesos(nuevos);
    return null;
  }, [pesos]);
  const eliminarPeso = useCallback((fechaOriginal) => {
    const nuevos = pesos.filter((p) => p.fecha !== fechaOriginal);
    setPesos(nuevos);
    alinearPerfilConPesos(nuevos);
  }, [pesos]);
  /* Hidratación de hoy: clave por fecha (igual que el log de alimentos), así se reinicia sola
     cada día sin necesidad de lógica adicional. El adulto mayor tiene el reflejo de sed
     disminuido, por eso vale la pena registrar el agua igual que la comida y no asumir que "si no
     tiene sed, no necesita tomar". */
  const [aguaMl, setAguaMl] = useState(() => { try { const s = localStorage.getItem("nutriapp_agua_" + hoyISO()); return s ? Number(s) : 0; } catch { return 0; } });
  useEffect(() => { try { localStorage.setItem("nutriapp_agua_" + hoyISO(), String(aguaMl)); } catch {} }, [aguaMl]);
  const registrarAgua = useCallback((ml) => setAguaMl((a) => Math.max(a + ml, 0)), []);
  const [log, setLog] = useState(() => { try { const s = localStorage.getItem("nutriapp_log_" + hoyISO()); return s ? JSON.parse(s) : []; } catch { return []; } });
  const [tab, setTab] = useState("menu");
  const [mostrarPerfil, setMostrarPerfil] = useState(null); // null | "perfil" | "salud" | "plan"
  const [mostrarHistorial, setMostrarHistorial] = useState(false);
  const [mostrarReporte, setMostrarReporte] = useState(false);
  const [fechaDesdeHistorial, setFechaDesdeHistorial] = useState(null);
  const [errorSync, setErrorSync] = useState("");
  const [enLinea, setEnLinea] = useState(typeof navigator !== "undefined" ? navigator.onLine : true);
  useEffect(() => {
    const on = () => setEnLinea(true);
    const off = () => setEnLinea(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);

  /* ---- Sincronización con Firestore (espacio compartido) ----
     `remotoListo` evita una condición de carrera: al conectar a un espacio (recién unido, o al
     reabrir la app), el efecto que ENVÍA cambios a la nube podía dispararse con los datos
     guardados solo en este celular (por ejemplo, recipientes vacíos por defecto) ANTES de que
     llegara el primer snapshot con los datos reales del espacio compartido, pisando en Firestore
     lo que otro usuario ya había agregado. Ahora no se envía nada hasta tener esos datos reales. */
  const aplicandoRemoto = useRef(false);
  const remotoListo = useRef(false);
  useEffect(() => {
    if (!pacienteId) { remotoListo.current = false; return; }
    remotoListo.current = false;
    const unsubEstado = dbFirestore.collection("pacientes").doc(pacienteId).onSnapshot((snap) => {
      const d = snap.data();
      remotoListo.current = true;
      if (!d) return;
      /* `aplicandoRemoto` solo debe marcarse si de verdad se va a aplicar un cambio remoto:
         antes se marcaba siempre, incluso cuando este snapshot no traía ningún campo (o llegaba
         vacío), dejando la bandera "encendida" sin que ningún efecto la consumiera — así, el
         SIGUIENTE cambio genuino del usuario (p. ej. registrar su peso) se descartaba porque se
         confundía con un eco de la nube y nunca se enviaba a Firestore. */
      if (d.perfil) { aplicandoRemoto.current = true; setPerfil(d.perfil); }
      if (d.catalogoCustom) { aplicandoRemoto.current = true; setCatalogo([...CONDICIONES_PRESET, ...d.catalogoCustom]); }
      if (d.recipientes) { aplicandoRemoto.current = true; setRecipientes(d.recipientes); }
      if (d.medicamentos) { aplicandoRemoto.current = true; setMedicamentos(d.medicamentos); }
      if (d.prescripcion) { aplicandoRemoto.current = true; setPrescripcion(d.prescripcion); }
      if (d.suplementos) { aplicandoRemoto.current = true; setSuplementos(d.suplementos); }
      if (d.pesos) { aplicandoRemoto.current = true; setPesos(d.pesos); }
      if (d.tema) { aplicandoRemoto.current = true; setTema(d.tema); }
    }, () => setErrorSync("No se pudo leer tu información desde la nube. Revisa tu conexión."));
    const unsubLog = dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(hoyISO()).collection("items").orderBy("agregadoEn").onSnapshot((snap) => {
      setLog(snap.docs.map((doc) => ({ uid: doc.id, ...doc.data() })));
    }, () => setErrorSync("No se pudo leer el registro de hoy desde la nube. Revisa tu conexión."));
    return () => { unsubEstado(); unsubLog(); remotoListo.current = false; };
  }, [pacienteId]);

  const guardarEstadoRemoto = useMemo(() => debounce((datos) => {
    if (!pacienteId) return;
    dbFirestore.collection("pacientes").doc(pacienteId).set(datos, { merge: true }).catch(() => setErrorSync("No se pudo guardar un cambio en la nube. Revisa tu conexión e inténtalo de nuevo."));
  }, 800), [pacienteId]);

  useEffect(() => {
    if (!pacienteId) return;
    if (!remotoListo.current) return;
    if (aplicandoRemoto.current) { aplicandoRemoto.current = false; return; }
    guardarEstadoRemoto({ perfil, catalogoCustom: catalogo.filter((c) => c.personalizada), recipientes, medicamentos, prescripcion, suplementos, pesos, tema });
  }, [pacienteId, perfil, catalogo, recipientes, medicamentos, prescripcion, suplementos, pesos, tema]);

  useEffect(() => { try { localStorage.setItem("nutriapp_perfil", JSON.stringify(perfil)); } catch {} }, [perfil]);
  useEffect(() => { try { localStorage.setItem("nutriapp_log_" + hoyISO(), JSON.stringify(log)); } catch {} }, [log]);
  useEffect(() => { try { localStorage.setItem("nutriapp_condiciones_custom", JSON.stringify(catalogo.filter((c) => c.personalizada))); } catch {} }, [catalogo]);
  useEffect(() => { try { localStorage.setItem("nutriapp_recipientes", JSON.stringify(recipientes)); } catch {} }, [recipientes]);
  useEffect(() => { try { localStorage.setItem("nutriapp_medicamentos", JSON.stringify(medicamentos)); } catch {} }, [medicamentos]);
  useEffect(() => { try { localStorage.setItem("nutriapp_prescripcion", JSON.stringify(prescripcion)); } catch {} }, [prescripcion]);
  useEffect(() => { try { localStorage.setItem("nutriapp_suplementos", JSON.stringify(suplementos)); } catch {} }, [suplementos]);

  const requerimiento = useMemo(() => calcularRequerimiento(perfil, catalogo, medicamentos, prescripcion, suplementos, pesos), [perfil, catalogo, medicamentos, prescripcion, suplementos, pesos]);

  const addItem = useCallback((alimento, gramos, momento, tara, fecha) => {
    fecha = fecha || hoyISO();
    const nuevo = { alimento, gramos, momento, tara, fecha, agregadoEn: Date.now() };
    if (fecha === hoyISO()) {
      const idLocal = `local_${Date.now()}_${Math.random()}`;
      setLog((prev) => [...prev, { uid: idLocal, ...nuevo }]);
    }
    if (pacienteId) {
      dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(fecha).collection("items").add(nuevo)
        .catch(() => setErrorSync("⚠️ Este alimento NO se pudo guardar en la nube (se quedó solo en este celular). Revisa tu conexión y vuelve a intentarlo."));
    } else if (fecha !== hoyISO()) {
      try {
        const s = localStorage.getItem("nutriapp_log_" + fecha);
        const arr = s ? JSON.parse(s) : [];
        arr.push({ uid: `${Date.now()}_${Math.random()}`, ...nuevo });
        localStorage.setItem("nutriapp_log_" + fecha, JSON.stringify(arr));
      } catch {}
    }
  }, [pacienteId]);

  const removeItem = useCallback((itemId, fecha) => {
    fecha = fecha || hoyISO();
    if (fecha === hoyISO()) setLog((prev) => prev.filter((it) => it.uid !== itemId));
    if (pacienteId && !itemId.startsWith("local_")) {
      dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(fecha).collection("items").doc(itemId).delete()
        .catch(() => setErrorSync("No se pudo eliminar ese alimento en la nube. Revisa tu conexión."));
    } else if (!pacienteId && fecha !== hoyISO()) {
      try {
        const s = localStorage.getItem("nutriapp_log_" + fecha);
        const arr = (s ? JSON.parse(s) : []).filter((it) => it.uid !== itemId);
        localStorage.setItem("nutriapp_log_" + fecha, JSON.stringify(arr));
      } catch {}
    }
  }, [pacienteId]);

  const updateItem = useCallback((itemId, cambios, fecha) => {
    fecha = fecha || hoyISO();
    if (fecha === hoyISO()) setLog((prev) => prev.map((it) => (it.uid === itemId ? { ...it, ...cambios } : it)));
    if (pacienteId && !itemId.startsWith("local_")) {
      dbFirestore.collection("pacientes").doc(pacienteId).collection("registros").doc(fecha).collection("items").doc(itemId).update(cambios)
        .catch(() => setErrorSync("No se pudo guardar esa edición en la nube. Revisa tu conexión."));
    } else if (!pacienteId && fecha !== hoyISO()) {
      try {
        const s = localStorage.getItem("nutriapp_log_" + fecha);
        const arr = (s ? JSON.parse(s) : []).map((it) => (it.uid === itemId ? { ...it, ...cambios } : it));
        localStorage.setItem("nutriapp_log_" + fecha, JSON.stringify(arr));
      } catch {}
    }
  }, [pacienteId]);

  /* Copia el menú ya planificado (y ajustado) de un día al registro de alimentos de esa misma
     fecha, reemplazando lo que hubiera. Pensado para el flujo de "arma el menú de mañana hoy en
     la noche" y que al día siguiente el registro ya salga con todo cargado, listo para solo
     ajustar cantidades en vez de volver a buscar cada alimento. */
  const pasarMenuARegistro = useCallback(async (fecha, menuDelDia) => {
    const actuales = await obtenerLogFecha(pacienteId, fecha);
    actuales.forEach((it) => removeItem(it.uid, fecha));
    menuDelDia.forEach((m) => { m.items.forEach((it) => addItem(it.alimento, it.gramos, m.key, null, fecha)); });
  }, [pacienteId, addItem, removeItem]);

  /* Respaldo completo de datos: no solo el registro de alimentos, también perfil, recipientes,
     medicamentos, prescripción, suplementos, condiciones personalizadas y pesos — todo lo que se
     perdería si se borra la app o se cambia de celular. Se descarga como un archivo .json al
     dispositivo: gratis, sin depender de ningún servicio de pago ni de conexión a internet. */
  const DIAS_BACKUP_REGISTROS = 60;
  const exportarBackup = useCallback(async () => {
    const fechas = Array.from({ length: DIAS_BACKUP_REGISTROS }, (_, i) => fechaISOOffset(i));
    const registros = {};
    await Promise.all(fechas.map(async (fecha) => {
      const items = await obtenerLogFecha(pacienteId, fecha);
      if (items.length > 0) registros[fecha] = items.map(({ uid, ...resto }) => resto);
    }));
    const backup = {
      version: 1,
      exportadoEn: new Date().toISOString(),
      perfil,
      catalogoCustom: catalogo.filter((c) => c.personalizada),
      recipientes,
      medicamentos,
      prescripcion,
      suplementos,
      pesos,
      tema,
      registros,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `nutriapp_respaldo_${hoyISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, [pacienteId, perfil, catalogo, recipientes, medicamentos, prescripcion, suplementos, pesos, tema]);

  const restaurarBackup = useCallback(async (backup) => {
    if (backup.perfil) setPerfil(backup.perfil);
    if (backup.catalogoCustom) setCatalogo([...CONDICIONES_PRESET, ...backup.catalogoCustom]);
    if (backup.recipientes) setRecipientes(backup.recipientes);
    if (backup.medicamentos) setMedicamentos(backup.medicamentos);
    if (backup.prescripcion) setPrescripcion(backup.prescripcion);
    if (backup.suplementos) setSuplementos(backup.suplementos);
    if (backup.pesos) setPesos(backup.pesos);
    if (backup.tema) setTema(backup.tema);
    for (const [fecha, items] of Object.entries(backup.registros || {})) {
      const actuales = await obtenerLogFecha(pacienteId, fecha);
      actuales.forEach((it) => removeItem(it.uid, fecha));
      items.forEach((it) => addItem(it.alimento, it.gramos, it.momento, it.tara || null, fecha));
    }
  }, [pacienteId, addItem, removeItem]);

  const agregarCondicionCustom = useCallback((nueva) => setCatalogo((prev) => [...prev, nueva]), []);

  const TABS = [
    { key: "menu", label: "Menú", icon: NavMenu, c: NAV_GRADIENTES.menu },
    { key: "registro", label: "Registro", icon: NavRegistro, c: NAV_GRADIENTES.registro },
    { key: "dashboard", label: "Panel", icon: NavPanel, c: NAV_GRADIENTES.panelA },
    { key: "reportes", label: "Reportes", icon: NavReportes, c: NAV_GRADIENTES.reportes },
    { key: "opciones", label: "Opciones", icon: NavOpciones, c: NAV_GRADIENTES.opciones },
  ];
  /* Dirección de la transición entre pantallas: entra desde la derecha si el menú nuevo está a la
     derecha del anterior, y desde la izquierda si está a la izquierda. Se guarda en un ref que solo
     cambia cuando cambia la pestaña, para que un re-render cualquiera no repita la animación. */
  const idxTab = TABS.findIndex((t) => t.key === tab);
  const dirTabRef = useRef({ idx: idxTab, clase: "nutri-pantalla-der" });
  if (dirTabRef.current.idx !== idxTab) dirTabRef.current = { idx: idxTab, clase: idxTab > dirTabRef.current.idx ? "nutri-pantalla-der" : "nutri-pantalla-izq" };
  const clasePantalla = dirTabRef.current.clase;

  if (mostrarHistorial) return <PantallaHistorial requerimiento={requerimiento} pacienteId={pacienteId} onCerrar={() => setMostrarHistorial(false)} onEditarDia={(fecha) => { setFechaDesdeHistorial(fecha); setMostrarHistorial(false); setTab("registro"); }} />;
  if (mostrarPerfil) return (
    <SeccionCuenta sec={mostrarPerfil} onCerrar={() => setMostrarPerfil(null)}>
      {mostrarPerfil === "perfil" && <PantallaPerfil seccion="datos" perfil={perfil} setPerfil={setPerfil} catalogo={catalogo} agregarCondicionCustom={agregarCondicionCustom} />}
      {mostrarPerfil === "salud" && <>
        <PantallaPerfil seccion="condiciones" perfil={perfil} setPerfil={setPerfil} catalogo={catalogo} agregarCondicionCustom={agregarCondicionCustom} />
        <PantallaOpciones seccion="medicamentos" recipientes={recipientes} setRecipientes={setRecipientes} medicamentos={medicamentos} setMedicamentos={setMedicamentos} prescripcion={prescripcion} setPrescripcion={setPrescripcion} suplementos={suplementos} setSuplementos={setSuplementos} perfil={perfil} tema={tema} setTema={setTema} paleta={paleta} setPaleta={setPaleta} pacienteId={pacienteId} salir={salir} email={email} instalar={instalar} exportarBackup={exportarBackup} restaurarBackup={restaurarBackup} />
      </>}
      {mostrarPerfil === "plan" && <PantallaOpciones seccion="plan" recipientes={recipientes} setRecipientes={setRecipientes} medicamentos={medicamentos} setMedicamentos={setMedicamentos} prescripcion={prescripcion} setPrescripcion={setPrescripcion} suplementos={suplementos} setSuplementos={setSuplementos} perfil={perfil} tema={tema} setTema={setTema} paleta={paleta} setPaleta={setPaleta} pacienteId={pacienteId} salir={salir} email={email} instalar={instalar} exportarBackup={exportarBackup} restaurarBackup={restaurarBackup} />}
    </SeccionCuenta>
  );
  if (mostrarReporte) return <PantallaReportes requerimiento={requerimiento} pacienteId={pacienteId} perfil={perfil} pesos={pesos} agregarPeso={agregarPeso} importarPesos={importarPesos} corregirPeso={corregirPeso} eliminarPeso={eliminarPeso} medicamentos={medicamentos} onCerrar={() => setMostrarReporte(false)} />;

  return (
    <PantallaCapas key={"capas-" + tab} cabecera={<BarraSuperior tab={tab} log={log} nombre={nombre} email={email} foto={foto}
        onAbrir={(k) => setMostrarPerfil(k)} />}>
      {!enLinea && <div className="px-4 py-2 text-xs text-center" style={{ background: "var(--warn-f)", color: "var(--warn-c)" }}>📶 Sin conexión — tus cambios se guardarán cuando vuelva la señal.</div>}
      {errorSync && (
        <div className="px-4 py-2 text-xs flex items-center justify-between gap-2 nutri-warn-bg">
          <span className="nutri-warn">{errorSync}</span>
          <button onClick={() => setErrorSync("")} className="nutri-warn font-bold">✕</button>
        </div>
      )}
      <div key={tab} className={clasePantalla}>
        {tab === "registro" && <PantallaRegistro log={log} addItem={addItem} removeItem={removeItem} updateItem={updateItem} recipientes={recipientes} pacienteId={pacienteId} fechaInicial={fechaDesdeHistorial} onFechaInicialConsumida={() => setFechaDesdeHistorial(null)} requerimiento={requerimiento} />}
        {tab === "dashboard" && <PantallaDashboard requerimiento={requerimiento} log={log} perfil={perfil} pesos={pesos} agregarPeso={agregarPeso} importarPesos={importarPesos} corregirPeso={corregirPeso} eliminarPeso={eliminarPeso} aguaMl={aguaMl} registrarAgua={registrarAgua} />}
        {tab === "menu" && <PantallaMenuHoy requerimiento={requerimiento} pacienteId={pacienteId} addItem={addItem} onErrorSync={setErrorSync} log={log} />}
        {tab === "reportes" && <PantallaReportes enPestana onHistorial={() => setMostrarHistorial(true)} requerimiento={requerimiento} pacienteId={pacienteId} perfil={perfil} pesos={pesos} agregarPeso={agregarPeso} importarPesos={importarPesos} corregirPeso={corregirPeso} eliminarPeso={eliminarPeso} medicamentos={medicamentos} />}
        {tab === "opciones" && <PantallaOpciones seccion="cuenta" recipientes={recipientes} setRecipientes={setRecipientes} medicamentos={medicamentos} setMedicamentos={setMedicamentos} prescripcion={prescripcion} setPrescripcion={setPrescripcion} suplementos={suplementos} setSuplementos={setSuplementos} perfil={perfil} tema={tema} setTema={setTema} paleta={paleta} setPaleta={setPaleta} pacienteId={pacienteId} salir={salir} email={email} instalar={instalar} exportarBackup={exportarBackup} restaurarBackup={restaurarBackup} />}
      </div>
      <nav className="nutri-nav fixed flex max-w-md" aria-label="Navegación principal">
        <NavDefs />
        {TABS.map(({ key, label, icon: IconC, c }) => (
          <button key={key} onClick={() => setTab(key)} aria-label={label} aria-current={tab === key ? "page" : undefined} className={`nutri-nav-item ${tab === key ? "activo" : ""}`} style={{ "--c1": c[0], "--c2": c[1] }}>
            <span className="nutri-nav-pill"><IconC size={24} /><span className="nutri-nav-label">{label}</span></span>
          </button>
        ))}
      </nav>
    </PantallaCapas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);
</script>
</body>
</html>
