  body[data-paleta="cafe"][data-tema="oscuro"] { --bg:#140C08; --surface:#211710; --tint:#32241B; --selected:#563823; --hero:#704C33; --hero-2:#8B6145; --on-hero:#FFFFFF; --on-hero-soft:#ECD6C8; --accent:#C0987E; --on-accent:#111318; --text:#F7F0ED; --text-2:#ADA29B; --border:#362B24; --nav:#291F18; --nav-active:#A67A5C; --on-nav-active:#111318; --img-1a:#704C33; --img-1b:#C0987E; --img-2a:#563823; --img-2b:#A67A5C; --img-3a:#3C2515; --img-3b:#8B6145; color-scheme: dark }
  /* Pizarra */
  body[data-paleta="pizarra"] { --tone-50:#F5F7FA; --tone-100:#E9EDF3; --tone-200:#D4DBE5; --tone-300:#B7C2D0; --tone-400:#95A3B5; --tone-500:#77869A; --tone-600:#5F6D80; --tone-700:#4A5666; --tone-800:#36414E; --tone-900:#242C37; --tone-950:#141A22; --bg:#F4F6F9; --surface:#FFFFFF; --tint:#E9EDF3; --selected:#D4DBE5; --hero:#242C37; --hero-2:#36414E; --on-hero:#FFFFFF; --on-hero-soft:#B7C2D0; --accent:#5F6D80; --on-accent:#FFFFFF; --text:#141619; --text-2:#606468; --border:#DCDEE1; --nav:#FFFFFF; --nav-active:#242C37; --on-nav-active:#FFFFFF; --img-1a:#E9EDF3; --img-1b:#95A3B5; --img-2a:#D4DBE5; --img-2b:#5F6D80; --img-3a:#B7C2D0; --img-3b:#36414E }
  body[data-paleta="pizarra"][data-tema="oscuro"] { --bg:#0C0F12; --surface:#161A1E; --tint:#23282E; --selected:#36414E; --hero:#4A5666; --hero-2:#5F6D80; --on-hero:#FFFFFF; --on-hero-soft:#D4DBE5; --accent:#95A3B5; --on-accent:#111318; --text:#F0F2F5; --text-2:#A1A5AA; --border:#2A2E33; --nav:#1E2226; --nav-active:#77869A; --on-nav-active:#111318; --img-1a:#4A5666; --img-1b:#95A3B5; --img-2a:#36414E; --img-2b:#77869A; --img-3a:#242C37; --img-3b:#5F6D80; color-scheme: dark }

  /* Los roles de la paleta alimentan las variables que ya usa toda la app. */
  body {
    --panel-bg: var(--surface); --panel-border: var(--border); --input-bg: var(--surface);
    --ink: var(--text); --muted: var(--text-2);
    --brand: var(--tone-600); --brand-text: var(--tone-700); --brand-soft: var(--tint);
    --brand-glow: color-mix(in srgb, var(--tone-500) 32%, transparent);
    --track: var(--selected); --chip-border: var(--border); --chip-active-bg: var(--tone-600); --chip-active-text: #FFFFFF;
    --accent-energy: #D96C3F; --accent-protein: #C79A3D; --accent-carb: #6C8F63; --accent-fat: #4E7089; --accent-fiber: #8E6BB0;
    --warn: #B23B3B; --warn-bg: #F6E7E4;
  }
  body[data-tema="oscuro"] {
    --input-bg: color-mix(in srgb, var(--surface) 78%, white);
    --brand-text: var(--accent);
    --chip-active-bg: var(--accent); --chip-active-text: var(--on-accent);
    --accent-energy: #E08A57; --accent-protein: #D9B563; --accent-carb: #83B276; --accent-fat: #77A0C7; --accent-fiber: #B093D4;
    --warn: #E58080; --warn-bg: #3A2328;
  }
  html { font-size: 18px; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); transition: background 0.3s, color 0.3s; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  .nutri-serif { font-family: 'Fraunces', serif; }
  .nutri-panel { background: linear-gradient(165deg, var(--panel-bg) 0%, color-mix(in srgb, var(--tint) 38%, var(--panel-bg)) 100%); border: 1px solid var(--panel-border); transition: border-color 0.3s; }
  /* Cabecera y bandas de título: degradado oscuro (--hero → --hero-2) que se va aclarando; la hoja de contenido se monta encima con esquinas redondeadas. */
  .nutri-header { background: linear-gradient(90deg, var(--hero), var(--hero-2)); color: var(--on-hero); transition: background .3s; }
  .nutri-pagina { position: relative; }
  .nutri-hero-titulo { --ink: var(--on-hero); --muted: var(--on-hero-soft); --brand-text: var(--on-hero); position: relative; overflow: hidden; padding: 22px 20px 56px;
    background:
      radial-gradient(110% 100% at 100% 0%, color-mix(in srgb, var(--tone-400) 46%, transparent) 0%, transparent 60%),
      linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--tone-500) 55%, transparent) 100%),
      linear-gradient(90deg, var(--hero), var(--hero-2)); transition: background .3s; }
  .nutri-hero-titulo > p { margin-bottom: 0; }
  .nutri-sheet { position: relative; z-index: 1; margin-top: -30px; border-radius: 30px 30px 0 0; min-height: 70vh;
    background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--tint) 55%, var(--bg)) 100%);
    box-shadow: 0 -14px 32px -22px rgba(0,0,0,.5); transition: background .3s; }
  /* Tarjeta principal oscura (como la tarjeta "dark" del documento): redefine los colores de texto y pistas para que todo su contenido se adapte. */
  .nutri-hero-card { position: relative; overflow: hidden; border-color: transparent;
    --ink: var(--on-hero); --muted: var(--on-hero-soft); --brand-text: var(--on-hero);
    --panel-border: color-mix(in srgb, var(--on-hero) 22%, transparent); --track: color-mix(in srgb, var(--on-hero) 22%, transparent);
    --chip-border: color-mix(in srgb, var(--on-hero) 32%, transparent); --input-bg: color-mix(in srgb, var(--on-hero) 14%, transparent); --warn: #FFC2B8;
    background:
      radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--tone-300) 34%, transparent), transparent 62%),
      linear-gradient(150deg, var(--card-a) 0%, var(--card-b) 62%, var(--card-c) 100%); }
  /* La tarjeta principal es un paso más clara que el encabezado para distinguirse de él. */
  body { --card-a: var(--tone-700); --card-b: var(--tone-600); --card-c: var(--tone-500); }
  body[data-tema="oscuro"] { --card-a: var(--tone-600); --card-b: color-mix(in srgb, var(--tone-600) 55%, var(--tone-500)); --card-c: var(--tone-500); }
  /* Tarjetas de cada pantalla: tres tonos de la paleta que se alternan, para que se distingan una de otra. */
  body { --cardtone-1: var(--tone-100); --cardtone-2: var(--surface); --cardtone-3: color-mix(in srgb, var(--tone-200) 62%, var(--surface));
         --cardline: color-mix(in srgb, var(--tone-300) 55%, transparent); }
  body[data-tema="oscuro"] { --cardtone-1: var(--tint); --cardtone-2: var(--surface); --cardtone-3: color-mix(in srgb, var(--selected) 72%, var(--surface));
         --cardline: color-mix(in srgb, var(--tone-500) 38%, transparent); }
  .nutri-sheet > .nutri-panel:not(.nutri-hero-card) { border-color: var(--cardline); }
  .nutri-sheet > .nutri-panel:not(.nutri-hero-card):nth-child(3n+1) { background: var(--cardtone-1); }
  .nutri-sheet > .nutri-panel:not(.nutri-hero-card):nth-child(3n+2) { background: var(--cardtone-2); }
  .nutri-sheet > .nutri-panel:not(.nutri-hero-card):nth-child(3n+3) { background: var(--cardtone-3); }

  /* Tarjeta del anillo de calorías: misma paleta pero en tono suave, para no competir con el encabezado. */
  .nutri-sheet > .nutri-panel.nutri-gauge-card { border-color: color-mix(in srgb, var(--tone-300) 60%, transparent); position: relative; overflow: hidden;
    background: radial-gradient(90% 70% at 18% 0%, color-mix(in srgb, #fff 55%, transparent), transparent 70%),
                linear-gradient(155deg, color-mix(in srgb, var(--tone-100) 85%, var(--surface)) 0%, color-mix(in srgb, var(--tone-200) 78%, var(--surface)) 100%); }
  body[data-tema="oscuro"] .nutri-sheet > .nutri-panel.nutri-gauge-card { border-color: color-mix(in srgb, var(--tone-500) 34%, transparent);
    background: radial-gradient(90% 70% at 18% 0%, color-mix(in srgb, var(--tone-500) 22%, transparent), transparent 70%),
                linear-gradient(155deg, color-mix(in srgb, var(--selected) 62%, var(--surface)) 0%, color-mix(in srgb, var(--tint) 85%, var(--surface)) 100%); }
  .nutri-pildora { padding: 4px 12px; border-radius: 999px; font-weight: 500; color: var(--brand-text);
    background: color-mix(in srgb, var(--tone-500) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tone-500) 26%, transparent); }
  .nutri-gauge-pct { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--gauge-color);
    background: color-mix(in srgb, var(--gauge-color) 14%, transparent); }
  .nutri-gauge-orbita { color: var(--brand-text); animation: nutriOrbita 40s linear infinite; }
  @keyframes nutriOrbita { to { transform: rotate(360deg); } }
  .nutri-gauge-destello { animation: nutriDestello 3.4s cubic-bezier(.4,0,.2,1) 1.4s infinite; }
  @keyframes nutriDestello { 0% { transform: rotate(0deg); opacity: 0; } 12% { opacity: 1; } 70%, 100% { transform: rotate(var(--vuelta, 360deg)); opacity: 0; } }
  .nutri-gauge-ok { animation: nutriLogro 1.1s cubic-bezier(.34,1.56,.64,1) 1.1s 1; }
  @keyframes nutriLogro { 0% { transform: scale(1); } 35% { transform: scale(1.07); } 100% { transform: scale(1); } }
  .nutri-gauge-ok::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 2px solid var(--gauge-color); opacity: 0; pointer-events: none; animation: nutriOnda 1.4s ease-out 1.15s 1; }
  @keyframes nutriOnda { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.3); opacity: 0; } }
  /* Mosaico de cada nutriente en "Cumplimiento de metas de hoy". */
  .nutri-metrica { --track: color-mix(in srgb, var(--m) 20%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--m) 14%, var(--panel-bg)) 0%, color-mix(in srgb, var(--m) 5%, var(--panel-bg)) 100%);
    border: 1px solid color-mix(in srgb, var(--m) 30%, transparent); animation: nutriSube .5s cubic-bezier(.22,1,.36,1) both;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .25s; }
  .nutri-metrica:active { transform: scale(.96); }
  .nutri-metrica:hover { box-shadow: 0 10px 24px -14px var(--m); }
  .nutri-metrica-chip { font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: 999px; color: var(--muted);
    background: color-mix(in srgb, var(--m) 12%, transparent); }
  .nutri-metrica-chip.ok { color: var(--st-meta); background: color-mix(in srgb, var(--st-meta) 16%, transparent); }
  
  /* Barras: crecen con resorte y tienen un brillo que las recorre. */
  .nutri-bar-fill { position: relative; overflow: hidden; transition: width .9s cubic-bezier(.22,1.2,.36,1); }
  .nutri-bar-fill::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(255 255 255 / .28), rgb(255 255 255 / 0) 60%); }
  .nutri-bar-fill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .45), transparent); animation: nutriBarraBrillo 3.2s ease-in-out 1.2s infinite; }
  @keyframes nutriBarraBrillo { 0% { left: -40%; } 55%, 100% { left: 140%; } }
  @media (prefers-reduced-motion: reduce) {
    .nutri-gauge-orbita, .nutri-gauge-destello, .nutri-gauge-ok, .nutri-gauge-ok::after, .nutri-bar-fill::after { animation: none !important; }
    .nutri-gauge-destello { display: none; }
  }

  /* Pantalla de ingreso F2 · Ola líquida (colores solo con roles de la paleta). */
  .nutri-login { position: relative; min-height: 100vh; max-width: 28rem; margin: 0 auto; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .nl-top { position: absolute; left: 0; right: 0; top: 0; height: 330px; overflow: hidden; background: linear-gradient(160deg, var(--hero-2), var(--hero)); }
  body:not([data-tema="oscuro"]) .nl-top { background: linear-gradient(160deg, var(--tone-400), var(--tone-700)); }
  .nl-top i { position: absolute; border-radius: 50%; background: rgb(255 255 255 / .12); animation: nlFlota 9s ease-in-out infinite alternate; }
  .nl-top i:nth-child(2) { animation-duration: 12s; } .nl-top i:nth-child(3) { animation-duration: 7s; }
  @keyframes nlFlota { to { transform: translateY(-14px) scale(1.06); } }
  .nl-wave { position: absolute; left: 0; bottom: -1px; width: 200%; height: 40px; animation: nlOla 7s linear infinite; }
  .nl-wave.b { opacity: .45; bottom: 6px; animation-duration: 11s; animation-direction: reverse; }
  @keyframes nlOla { to { transform: translateX(-50%); } }
  .nl-brand { position: relative; z-index: 1; text-align: center; padding: 58px 28px 0; color: #fff; height: 330px; }
  .nl-logo { width: 62px; height: 62px; margin: 0 auto 12px; border-radius: 50%; background: #fff; color: var(--tone-600); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgb(0 0 0 / .18); animation: nutriIcoPop .7s cubic-bezier(.34,1.56,.64,1) both; }
  .nl-brand h1 { font-size: 30px; line-height: 1.1; margin-bottom: 6px; animation: nutriSube .6s .08s both; }
  .nl-brand p { font-size: 14px; color: rgb(255 255 255 / .88); max-width: 17rem; margin: 0 auto; animation: nutriSube .6s .16s both; }
  .nl-form { position: relative; z-index: 1; padding: 0 26px 34px; margin-top: -2px; }
  .nl-form > * { animation: nutriSube .55s cubic-bezier(.22,1,.36,1) both; }
  .nl-form > *:nth-child(1) { animation-delay: .2s; } .nl-form > *:nth-child(2) { animation-delay: .26s; } .nl-form > *:nth-child(3) { animation-delay: .32s; } .nl-form > *:nth-child(4) { animation-delay: .36s; } .nl-form > *:nth-child(5) { animation-delay: .4s; } .nl-form > *:nth-child(6) { animation-delay: .44s; }
  .nl-campo { position: relative; display: block; margin-bottom: 14px; }
  .nl-campo input { width: 100%; height: 56px; border-radius: 16px; padding: 22px 46px 6px 16px; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--border); outline: none; transition: border-color .2s, box-shadow .2s; }
  .nl-campo span { position: absolute; left: 17px; top: 17px; font-size: 15px; color: var(--muted); pointer-events: none; transform-origin: left top; transition: transform .2s cubic-bezier(.2,0,0,1), color .2s; }
  .nl-campo input:focus + span, .nl-campo input:not(:placeholder-shown) + span { transform: translateY(-9px) scale(.78); }
  .nl-campo input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .nl-campo input:focus + span { color: var(--brand-text); }
  .nl-ojo { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 50%; }
  .nl-olvide { display: block; margin-left: auto; font-size: 13px; font-weight: 600; color: var(--brand-text); padding: 4px 0 2px; min-height: 32px; }
  .nl-msg { min-height: 22px; font-size: 12.5px; margin: 2px 2px 8px; }
  .nl-sacude { animation: nlSacude .34s cubic-bezier(.2,0,0,1); }
  @keyframes nlSacude { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .nl-btn { position: relative; overflow: hidden; width: 100%; height: 54px; border-radius: 999px; background: var(--tone-600); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 10px 22px -10px var(--tone-600); transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .3s; }
  body[data-tema="oscuro"] .nl-btn { background: var(--hero-2); box-shadow: 0 10px 22px -10px var(--tone-500); }
  .nl-btn:active { transform: scale(.97); }
  .nl-btn:disabled { opacity: 1; cursor: default; }
  .nl-nivel { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgb(255 255 255 / .28); transition: height 1200ms cubic-bezier(.3,.6,.3,1); }
  .nl-nivel svg { position: absolute; left: 0; top: -9px; width: 200%; height: 10px; animation: nlOla 1.3s linear infinite; }
  .nl-btn.cargando .nl-nivel { height: 82%; } .nl-btn.ok .nl-nivel { height: 112%; transition-duration: 320ms; }
  .nl-t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .25s, transform .3s; }
  .nl-t-carga, .nl-t-ok { opacity: 0; transform: translateY(10px); }
  .nl-btn.cargando .nl-t-reposo, .nl-btn.ok .nl-t-reposo { opacity: 0; transform: translateY(-10px); }
  .nl-btn.cargando .nl-t-carga { opacity: 1; transform: none; }
  .nl-btn.ok .nl-t-carga { opacity: 0; } .nl-btn.ok .nl-t-ok { opacity: 1; transform: none; }
  .nl-pie { text-align: center; font-size: 14px; color: var(--muted); margin-top: 18px; }
  .nl-pie button { font-weight: 700; color: var(--brand-text); padding: 6px 4px; }
  @media (prefers-reduced-motion: reduce) { .nl-wave, .nl-top i, .nl-nivel svg { animation: none !important; } .nl-nivel { transition: none; } }
  .nutri-swatch { width: 36px; height: 36px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .28); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s; }
  .nutri-swatch[aria-pressed="true"] { transform: scale(1.14); box-shadow: inset 0 0 0 2px rgb(255 255 255 / .35), 0 0 0 3px var(--panel-bg), 0 0 0 5px var(--ink); }
  .nutri-ink { color: var(--ink); }
  .nutri-muted { color: var(--muted); }
  .nutri-brand { background: var(--brand); transition: background 0.3s; }
  .nutri-brand-text { color: var(--brand-text); }
  .nutri-accent-energy { background: var(--accent-energy); }
  .nutri-accent-protein { background: var(--accent-protein); }
  .nutri-accent-carb { background: var(--accent-carb); }
  .nutri-accent-fat { background: var(--accent-fat); }
  .nutri-accent-fiber { background: var(--accent-fiber); }
  .nutri-warn { color: var(--warn); }
  .nutri-warn-bg { background: var(--warn-bg); }
  .nutri-track { background: var(--track); }
  .nutri-chip { border: 1px solid var(--chip-border); }
  .nutri-chip-active { background: var(--chip-active-bg); color: var(--chip-active-text); border-color: var(--chip-active-bg); }
  body[data-tema="oscuro"] .bg-white { background: var(--input-bg) !important; }
  body[data-tema="oscuro"] ::placeholder { color: color-mix(in srgb, var(--text-2) 75%, transparent); opacity: 1; }
  .anillos-3d { perspective: 800px; }
  .anillos-3d-svg { transform: rotateX(26deg); transition: transform 0.35s cubic-bezier(.22,1,.36,1); transform-style: preserve-3d; touch-action: manipulation; }
  .anillos-3d:hover .anillos-3d-svg, .anillos-3d:active .anillos-3d-svg { transform: rotateX(8deg) scale(1.04); }
  @keyframes nutriFadeScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .nutri-fade-in { animation: nutriFadeScale 0.35s cubic-bezier(.22,1,.36,1); }

  /* ---------- Movimiento ---------- */
  /* Botones y chips: respuesta táctil al presionar y transición suave al cambiar de estado. */
  button { transition: transform .18s cubic-bezier(.22,1,.36,1), background-color .25s, color .25s, border-color .25s, opacity .25s; }
  button:active:not(:disabled) { transform: scale(.95); }
  .nutri-chip { transition: background-color .25s, color .25s, border-color .25s, transform .18s cubic-bezier(.22,1,.36,1), box-shadow .25s; }
  @keyframes nutriChipPop { 0% { transform: scale(.88); } 55% { transform: scale(1.07); } 100% { transform: scale(1); } }
  .nutri-chip-active { animation: nutriChipPop .38s cubic-bezier(.22,1,.36,1); box-shadow: 0 4px 14px -6px var(--brand-glow); }

  /* Pantallas: entran deslizándose desde el lado del menú al que vas, y sus bloques aparecen escalonados. */
  @keyframes nutriEntraDer { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes nutriEntraIzq { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes nutriSube { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .nutri-pantalla-der { animation: nutriEntraDer .42s cubic-bezier(.22,1,.36,1) backwards; }
  .nutri-pantalla-izq { animation: nutriEntraIzq .42s cubic-bezier(.22,1,.36,1) backwards; }
  .nutri-pantalla-der .nutri-sheet > *, .nutri-pantalla-izq .nutri-sheet > *, .nutri-pantalla-der .nutri-hero-titulo > *, .nutri-pantalla-izq .nutri-hero-titulo > * { animation: nutriSube .5s cubic-bezier(.22,1,.36,1) backwards; }
  .nutri-hero-titulo > *:nth-child(1) { animation-delay: .02s !important; }
  .nutri-hero-titulo > *:nth-child(2) { animation-delay: .07s !important; }
  .nutri-sheet > *:nth-child(1) { animation-delay: .08s; }
  .nutri-sheet > *:nth-child(2) { animation-delay: .13s; }
  .nutri-sheet > *:nth-child(3) { animation-delay: .18s; }
  .nutri-sheet > *:nth-child(4) { animation-delay: .23s; }
  .nutri-sheet > *:nth-child(5) { animation-delay: .28s; }
  .nutri-sheet > *:nth-child(6) { animation-delay: .33s; }
  .nutri-sheet > *:nth-child(n+7) { animation-delay: .37s; }

  /* Barra inferior: cada ítem tiene su par de colores (--c1, --c2). La pastilla activa se expande con un
     degradado suave de esos colores y el nombre se desliza al costado del icono; el del menú anterior se recoge. */
  .nutri-nav { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; padding: 5px; z-index: 20; border-radius: 999px; background: var(--nav);
    box-shadow: 0 14px 30px -12px rgba(8,16,30,.38), 0 0 0 1px var(--border); transition: background .3s, box-shadow .3s; }
  .nutri-nav-item { flex: 1 1 0; display: flex; align-items: center; justify-content: center; padding: 0 2px; color: var(--muted); transition: flex-grow .5s cubic-bezier(.22,1,.36,1), color .3s; min-width: 0; }
  .nutri-nav-item.activo { flex-grow: 2.5; color: var(--ink); }
  .nutri-nav-pill { position: relative; display: flex; align-items: center; justify-content: center; height: 42px; min-width: 42px; padding: 0 9px; border-radius: 999px; transition: padding .5s cubic-bezier(.22,1,.36,1), box-shadow .4s; }
  .nutri-nav-pill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .4s;
    background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 26%, var(--nav)), color-mix(in srgb, var(--c2) 16%, var(--nav))); }
  .nutri-nav-item.activo .nutri-nav-pill { padding: 0 14px 0 10px; box-shadow: 0 8px 18px -10px var(--c1); }
  .nutri-nav-item.activo .nutri-nav-pill::before { opacity: 1; }
  .nutri-nav-label { position: relative; display: inline-block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; letter-spacing: .01em; transform: translateX(-8px); transition: max-width .5s cubic-bezier(.22,1,.36,1), opacity .3s, margin .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1); }
  .nutri-nav-item.activo .nutri-nav-label { max-width: 90px; opacity: 1; margin-left: 7px; transform: translateX(0); transition-delay: 0s, .08s, 0s, 0s; }

  /* Iconos Heroicons rellenos con degradado: grises e inactivos; con color, brillo y latido cuando están activos. */
  .nutri-ico { position: relative; z-index: 1; overflow: visible; transform-origin: center; opacity: .82;
    filter: grayscale(1) brightness(.7) drop-shadow(0 0 0 transparent); transition: filter .4s, opacity .4s; }
  body[data-tema="oscuro"] .nutri-ico { opacity: .72; filter: grayscale(1) brightness(1.05) drop-shadow(0 0 0 transparent); }
  .nutri-nav-item.activo .nutri-ico { opacity: 1; filter: grayscale(0) brightness(1) drop-shadow(0 3px 5px color-mix(in srgb, var(--c1) 55%, transparent));
    animation: nutriIcoPop .5s cubic-bezier(.22,1,.36,1), nutriLatido 1.6s ease-in-out .5s infinite; }
  @keyframes nutriIcoPop { 0% { transform: scale(.7) rotate(-8deg); } 55% { transform: scale(1.18) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
  /* Latido: dos pulsos seguidos y una pausa, como un corazón. */
  @keyframes nutriLatido { 0%, 56%, 100% { transform: scale(1); } 14% { transform: scale(1.22); } 28% { transform: scale(1); } 42% { transform: scale(1.14); } }
  @keyframes nutriEngrane { from { transform: rotate(-140deg); } to { transform: rotate(0); } }
  .nutri-nav-item.activo .ico-engrane { animation: nutriEngrane .9s cubic-bezier(.22,1,.36,1); transform-box: fill-box; transform-origin: center; }
  @keyframes nutriRebanada { 0%, 100% { transform: translate(0,0); } 45% { transform: translate(1.2px,-1.2px); } }
  .nutri-nav-item.activo .ico-rebanada { animation: nutriRebanada 1.6s ease-in-out .5s infinite; }

  /* Accesibilidad: quien tiene "reducir movimiento" activado en su teléfono no recibe desplazamientos, rebotes ni latidos. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .nutri-nav-item.activo .nutri-ico, .nutri-nav-item.activo .ico-rebanada { animation: none !important; }
  }
  /* Íconos de alimentos: "pop" al seleccionarlos (icon-pop de 07-MOTION-DESIGN) */
  .nutri-ico-ali svg { display: block; width: 100%; height: 100%; }
  @keyframes nutri-ico-pop { 0% { transform: scale(.6); } 45% { transform: scale(1.25) rotate(-6deg); } 70% { transform: scale(.95) rotate(3deg); } 100% { transform: scale(1); } }
  .nutri-ico-pop { animation: nutri-ico-pop .55s cubic-bezier(.3,1.4,.5,1) both; }
  @media (prefers-reduced-motion: reduce) { .nutri-ico-pop { animation: none; } }

  /* ---------- Marca NutriApp: ícono "corazón de alimentos" + nombre con letras que saltan ---------- */
  .marca-n { font-family: "Baloo 2", "Nunito", system-ui, sans-serif; font-weight: 800; line-height: 1; letter-spacing: -.5px; white-space: nowrap; display: inline-flex; align-items: flex-end; color: #fff; }
  .marca-n .l { display: inline-block; position: relative; }
  .marca-n .app { color: #B6E86A; }
  .marca-n .i-sin { position: relative; }
  .marca-n .punto { position: absolute; left: 50%; top: .02em; width: .3em; height: .3em; margin-left: -.15em; }
  .marca-n.salta .l { opacity: 0; animation: marcaSalta .6s cubic-bezier(.34,1.56,.64,1) calc(var(--t, 0s) + var(--k) * 75ms) forwards; }
  @keyframes marcaSalta { 0% { opacity: 0; transform: translateY(.8em) scale(.3) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
  .marca-n.salta .punto { transform: scale(0); animation: marcaPunto .5s cubic-bezier(.34,1.56,.64,1) calc(var(--t, 0s) + .85s) forwards, marcaLate 1s ease-in-out calc(var(--t, 0s) + 1.5s) 2; }
  @keyframes marcaPunto { to { transform: scale(1); } }
  @keyframes marcaLate { 0%, 56%, 100% { transform: scale(1); } 14% { transform: scale(1.35); } 42% { transform: scale(1.18); } }
  .icono-app { display: block; border-radius: 22.5%; overflow: hidden; flex: none; }
  .icono-app svg, .icono-app img { display: block; width: 100%; height: 100%; }
  .nutri-carga { position: fixed; inset: 0; z-index: 100; background: linear-gradient(160deg, var(--hero), var(--hero-2)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .nutri-carga .icono-app { width: min(46vw, 200px); box-shadow: 0 18px 34px -16px rgb(0 0 0 / .7); }
  .nutri-carga .marca-n { font-size: 42px; }
  .nutri-carga .barra { width: 120px; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .18); overflow: hidden; }
  .nutri-carga .barra i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #B6E86A; animation: cargaBarra 1.2s ease-in-out infinite; }
  @keyframes cargaBarra { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .nutri-carga.sale { animation: cargaSale .45s cubic-bezier(.2,0,0,1) forwards; }
  @keyframes cargaSale { to { opacity: 0; transform: scale(1.06); filter: blur(6px); } }
  /* Animación del corazón (mosaico): los alimentos aparecen desde la punta, sube la N y late */
  .cn .letra, .cn .destello, .cn .latido { transform-box: view-box; }
  .cn.anima .f { animation: cnPop .5s cubic-bezier(.34,1.56,.64,1) var(--d) both; }
  @keyframes cnPop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
  .cn.anima .base-c { animation: cnAparece .4s ease both; }
  @keyframes cnAparece { from { opacity: 0; } }
  .cn.anima .letra { transform-origin: 256px 272px; animation: cnSubeN .7s cubic-bezier(.34,1.56,.64,1) var(--tN) both; }
  @keyframes cnSubeN { from { transform: translateY(40px) scale(.6); opacity: 0; } }
  .cn.anima .destello { animation: cnDestello .9s ease-in-out var(--tL) both; }
  @keyframes cnDestello { from { transform: skewX(-18deg) translateX(0); } to { transform: skewX(-18deg) translateX(560px); } }
  .cn.anima .latido { transform-origin: 256px 280px; animation: cnLate 1.1s ease-in-out calc(var(--tL) + .3s) 2; }
  @keyframes cnLate { 0%, 56%, 100% { transform: scale(1); } 14% { transform: scale(1.07); } 28% { transform: scale(1); } 42% { transform: scale(1.04); } }
  .nl-logo.icono-app { width: 72px; height: 72px; border-radius: 22.5%; background: none; box-shadow: 0 10px 24px rgb(0 0 0 / .22); }
  .nl-brand .marca-n { font-size: 36px; margin-bottom: 8px; }
  .nutri-header .marca { display: flex; align-items: center; gap: 8px; }
  .nutri-header .marca .icono-app { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 3px 8px rgb(0 0 0 / .3); }
  .nutri-header .marca-n { font-size: 21px; }
  @media (prefers-reduced-motion: reduce) { .marca-n.salta .l, .marca-n.salta .punto, .cn.anima * { animation: none !important; opacity: 1 !important; transform: none !important; } }

  /* ---------- Registro "¿Qué comiste?" y Menú de hoy (rediseño 2026-10-23) ---------- */
  body { --st-bajo: #E07A12; --st-meta: #16A34A; --st-exceso: #E5484D; --warn-c: #B45309; --warn-f: #FEF3C7; }
  body[data-tema="oscuro"] { --st-bajo: #FFA94D; --st-meta: #3DD68C; --st-exceso: #FF6B6F; --warn-c: #FBBF24; --warn-f: #3A2A06; }
  .num-u { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qc-capa { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .qc-fondo { position: absolute; inset: 0; background: rgb(0 0 0 / .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: qcFondo .36s ease both; }
  @keyframes qcFondo { from { opacity: 0; } }
  .qc-hoja { position: relative; width: 100%; max-width: 28rem; height: 92vh; height: 92dvh; background: var(--bg); color: var(--text); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)); animation: qcSube .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes qcSube { from { transform: translateY(100%); } }
  .qc-capa.cierra .qc-hoja { animation: qcBaja .33s cubic-bezier(.3,0,1,1) forwards; }
  .qc-capa.cierra .qc-fondo { animation: qcFondo .33s ease reverse forwards; }
  @keyframes qcBaja { to { transform: translateY(100%); } }
  .qc-asa { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto; flex: none; }
  .qc-cab { position: relative; display: flex; align-items: center; gap: 8px; flex: none; }
  .qc-cab h2 { margin: 0; flex: 1; font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; }
  .qc-vidrio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .qc-morph { display: inline-block; animation: qcMorph .5s cubic-bezier(.2,0,0,1); }
  @keyframes qcMorph { 0% { filter: blur(5px); opacity: 0; transform: translateY(6px); } }
  .qc-x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; flex: none; }
  .qc-picker { position: absolute; right: 40px; top: 40px; z-index: 30; display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 16px; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); box-shadow: 0 16px 30px -12px rgb(0 0 0 / .35); transform-origin: top right; animation: qcPicker .36s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes qcPicker { from { opacity: 0; transform: scale(.6) translateY(-8px); } }
  .qc-picker button { text-align: left; font-size: 14px; padding: 8px 14px 8px 10px; border-radius: 11px; color: var(--text); }
  .qc-picker button.on { background: var(--tint); font-weight: 600; }
  .qc-seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 3px; flex: none; }
  .qc-seg button { position: relative; z-index: 1; height: 36px; font-size: 14px; font-weight: 600; color: var(--text-2); transition: color .24s; }
  .qc-seg button.on { color: var(--on-accent); }
  .qc-seg .ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 11px; background: var(--accent); transition: transform .36s cubic-bezier(.34,1.56,.64,1); }
  .qc-seg.der .ind { transform: translateX(100%); }
  .qc-zona { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .qc-vista { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; scrollbar-width: none; padding-bottom: 6px; }
  .qc-vista::-webkit-scrollbar { display: none; }
  .qc-vista.entra-der { animation: nutriEntraDer .36s cubic-bezier(.2,0,0,1.2) both; }
  .qc-vista.entra-izq { animation: nutriEntraIzq .36s cubic-bezier(.2,0,0,1.2) both; }
  .qc-buscador { display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 22px; background: var(--surface); border: 1.5px solid var(--border); padding: 0 14px; color: var(--text-2); flex: none; }
  .qc-buscador:focus-within { border-color: var(--accent); }
  .qc-buscador input { flex: 1; min-width: 0; border: 0; background: none; font-size: 15px; color: var(--text); outline: none; }
  .qc-tsec { font-size: 11.5px; font-weight: 600; color: var(--text-2); margin: 2px 2px -3px; text-transform: uppercase; letter-spacing: .05em; }
  .qc-rejilla { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
  .qc-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 6px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.2; min-width: 0; animation: qcCluster .5s cubic-bezier(.34,1.56,.64,1) both; transition: border-color .24s, background .24s; }
  .qc-tile:active { transform: scale(.93); }
  @keyframes qcCluster { from { opacity: 0; transform: scale(.4); } }
  .qc-tile.tiene { border-color: var(--accent); background: var(--tint); }
  .qc-tile .tn { width: 100%; padding: 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .qc-tile .veces { font-size: 9.5px; font-weight: 500; color: var(--text-2); }
  .qc-tile .badge { position: absolute; top: -6px; right: -4px; background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 10px; padding: 1px 6px; font-weight: 700; animation: nutriChipPop .5s cubic-bezier(.34,1.56,.64,1); }
  .qc-vacio { grid-column: 1 / -1; font-size: 13px; color: var(--text-2); }
  .qc-pasos { display: inline-flex; align-items: center; gap: 2px; background: var(--tint); border-radius: 11px; padding: 2px; flex: none; }
  .qc-pasos button { width: 28px; height: 28px; border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 700; font-size: 16px; line-height: 1; transition: transform .15s; }
  .qc-pasos button:active { transform: scale(.85); }
  .qc-pasos label { display: flex; align-items: baseline; gap: 1px; padding: 0 2px; font-size: 13px; font-weight: 600; color: var(--text); }
  .qc-pasos input { width: 40px; border: 0; background: transparent; font-family: "Inter", sans-serif; font-weight: 700; font-size: 14px; color: var(--text); text-align: right; padding: 2px 0; -moz-appearance: textfield; }
  .qc-pasos input::-webkit-outer-spin-button, .qc-pasos input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .qc-pasos input:focus { outline: 2px solid var(--accent); border-radius: 6px; background: var(--surface); }
  .qc-pasos.grande { padding: 4px; border-radius: 16px; }
  .qc-pasos.grande button { width: 42px; height: 42px; border-radius: 13px; font-size: 22px; }
  .qc-pasos.grande input { width: 60px; font-size: 17px; }
  .qc-ficha { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: none; animation: qcFicha .5s cubic-bezier(.2,0,0,1.2) both; }
  @keyframes qcFicha { from { opacity: 0; transform: scale(.4); } }
  .qc-ficha .cab-f { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 10px 12px; }
  .qc-ficha .cab-f .tx { flex: 1; min-width: 0; }
  .qc-ficha .cab-f b { display: block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; }
  .qc-ficha .cab-f .tx > span { font-size: 12px; color: var(--text-2); }
  .qc-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .qc-chips.wrap { flex-wrap: wrap; }
  .qc-chip { flex: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); transition: background .24s, color .24s; }
  .qc-chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .qc-centro { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .qc-mini { font-size: 12px; color: var(--text-2); }
  .qc-mini b { color: var(--text); }
  .qc-macros { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
  .qc-macros div { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 7px 4px; text-align: center; font-size: 11px; color: var(--text-2); }
  .qc-macros strong { display: block; font-size: 16px; color: var(--text); }
  .qc-macros strong small { font-size: 11px; font-weight: 600; color: var(--text-2); margin-left: 1px; }
  .qc-recip { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  .qc-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--text); width: 100%; text-align: left; }
  .qc-toggle .sw { width: 38px; height: 22px; border-radius: 11px; background: var(--border); position: relative; transition: background .24s; flex: none; }
  .qc-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
  .qc-toggle.on .sw { background: var(--accent); }
  .qc-toggle.on .sw::after { transform: translateX(16px); }
  .qc-recfila { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .qc-recfila .elegido { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 12.5px; font-weight: 600; color: var(--text); text-align: left; }
  .qc-recfila .elegido svg { width: 28px; height: 20px; flex: none; }
  .qc-recipientes { position: absolute; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; gap: 9px; overflow-y: auto; scrollbar-width: none; animation: nutriEntraDer .36s cubic-bezier(.2,0,0,1) both; }
  .qc-recipientes h3 { margin: 0; font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; }
  .qc-recipientes p { margin: -4px 0 0; font-size: 12.5px; color: var(--text-2); }
  .qc-atras { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text); align-self: flex-start; }
  .qc-rlista { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
  .qc-rop { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); color: var(--text); min-width: 0; text-align: center; animation: qcCluster .5s cubic-bezier(.34,1.56,.64,1) both; transition: border-color .24s, background .24s; }
  .qc-rop.on { border-color: var(--accent); background: var(--tint); }
  .qc-rop svg { width: 36px; height: 26px; color: var(--text-2); }
  .qc-rop b { font-size: 11px; font-weight: 600; line-height: 1.2; min-height: 2.4em; display: flex; align-items: center; justify-content: center; padding: 0 2px; overflow-wrap: anywhere; }
  .qc-rop span { font-size: 10px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .qc-carne h4 { margin: 4px 2px 6px; font-size: 13px; font-weight: 600; }
  .qc-campo { position: relative; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface); flex: none; }
  .qc-campo:focus-within { border-color: var(--accent); }

  .pn-barra .sobra { position: absolute; top: 0; bottom: 0; border-radius: 0 9px 9px 0; background: repeating-linear-gradient(135deg, rgb(255 255 255 / .45) 0 4px, transparent 4px 8px); transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .pn-barra .bandera { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2.5px dashed var(--text); }

  .pn-barra .marcas .pct { font-style: normal; font-size: 11px; color: var(--text-2); }
  .pn-barra .marcas .meta { position: absolute; top: 0; right: 0; color: var(--text-2); white-space: nowrap; }
  .pn-barra .marcas .meta b { color: var(--text); }

  .pn-fichas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pn-ficha { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 6px 8px; animation: nutriSube .4s cubic-bezier(.22,1,.36,1) both; }
  .pn-ficha > span:last-child { display: flex; flex-direction: column; min-width: 0; font-size: 11.5px; line-height: 1.25; color: var(--text-2); }

  .pn-ficha em { font-style: normal; font-size: 10px; color: var(--accent); font-weight: 600; }
  .pn-ficha.habitual { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }

  .pn-comidas { margin-top: 10px; background: var(--bg); border-radius: 14px; padding: 8px 10px; }
  .pn-ayer .pn-comidas { background: var(--surface); }
  .pn-comidas .tt { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .pn-comidas .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
  .pn-comidas .col { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text-2); }
  .pn-comidas .pal { width: 22px; height: 38px; border-radius: 6px; background: var(--tint); display: flex; align-items: flex-end; overflow: hidden; }
  .pn-comidas .pal i { display: block; width: 100%; background: var(--text-2); opacity: .45; border-radius: 6px; transition: height .8s; }
  .pn-comidas .col.on { color: var(--text); font-weight: 700; }

  .pn-detalle { margin-top: 8px; }

  .pn-detalle p { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); margin: 3px 0 0; }
  .pn-detalle p b { color: var(--text); font-weight: 600; }

  .pn-heroe { padding: 20px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; text-align: center; }
  .pn-heroe .fichas-w, .pn-heroe .pn-fichas { width: 100%; text-align: left; }
  .pn-heroe .sub { align-self: flex-start; }
  .pn-sec-tit { display: flex; flex-direction: column; margin: 0 2px 10px; }
  .pn-sec-tit b { font-size: 16px; color: var(--text); }
  .pn-sec-tit span { font-size: 12px; color: var(--text-2); }
  .pn-general { font-size: 13px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; padding: 10px 12px; margin: 0 0 10px; }

  .pn-cumple { padding: 16px; margin-bottom: 18px; }
  .pn-cumple-cab { display: flex; align-items: center; gap: 8px; }
  .pn-cumple-cab b { flex: 1; font-size: 15px; }
  .pn-seg { display: flex; background: var(--bg); border-radius: 999px; padding: 3px; }
  .pn-seg button { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; color: var(--text-2); transition: background .25s, color .25s; }
  .pn-seg button.on { background: var(--hero); color: var(--on-hero); }
  .pn-resumen-cumple { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 12px; }
  .pn-resumen-cumple > div { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 16px; padding: 8px; }
  .pn-resumen-cumple > div > span { display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); line-height: 1.25; }
  .pn-resumen-cumple b { font-size: 20px; color: var(--text); white-space: nowrap; } .pn-resumen-cumple b em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .pn-resumen-cumple small { font-size: 11px; }
  .pn-semana { display: grid; grid-template-columns: 26px repeat(7, 1fr); gap: 6px 4px; align-items: center; justify-items: center; }
  .pn-semana .dia { font-size: 11px; color: var(--text-2); text-transform: capitalize; }
  .pn-semana .dia.hoy { color: var(--accent); font-weight: 700; }
  .pn-semana .bola { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; animation: icPop .45s cubic-bezier(.34,1.56,.64,1) both; }
  .pn-semana .bola.sin { border: 2px dashed var(--border); color: var(--text-2); }
  .pn-mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .pn-mes .cua { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; animation: icPop .4s cubic-bezier(.34,1.56,.64,1) both; }
  .pn-mes .cua.sin { border: 1.5px dashed var(--border); color: var(--text-2); }
  .pn-mes .cua.hoy { outline: 2px solid var(--text); outline-offset: 1px; }
  .pn-mes .pie { grid-column: 1 / -1; font-size: 11px; color: var(--text-2); margin: 2px 0 0; }
  .pn-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pn-datos > span { display: flex; flex-direction: column; font-size: 11px; color: var(--text-2); background: var(--bg); border-radius: 14px; padding: 8px 10px; }
  .pn-datos b { font-size: 13px; color: var(--text); margin-top: 2px; }
  @keyframes icPop { from { transform: scale(.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pn-cuadro, .pn-ficha, .pn-semana .bola, .pn-mes .cua { animation: none !important; } .pn-barra .relleno, .pn-barra .sobra { transition: none; } }

  /* ===== Barra superior con avatar (nb-*) ===== */
  .nb-barra { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 20px; background: linear-gradient(90deg, var(--hero), var(--hero-2)); color: var(--on-hero); }
  .nb-izq { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  .nb-izq b { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; animation: nutriSube .4s cubic-bezier(.22,1,.36,1) both; }
  .nb-izq small { font-size: 12px; color: var(--on-hero-soft); }
  .nb-racha { display: inline-flex; align-items: center; gap: 3px; font-size: 16px; }
  .nb-racha .fuego { display: inline-block; animation: nbFuego 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .nb-racha.apagada { opacity: .55; filter: grayscale(1); } .nb-racha.apagada .fuego { animation: none; }
  @keyframes nbFuego { 50% { transform: scale(1.12) rotate(-4deg); } }
  .nb-avatar-btn { border-radius: 50%; padding: 2px; background: linear-gradient(135deg, var(--on-hero-soft), transparent); transition: transform .2s; }
  .nb-avatar-btn:active, .nb-avatar-btn.on { transform: scale(.92); }
  .nb-avatar { display: grid; place-items: center; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--tone-400), var(--tone-700)); color: #fff; font-weight: 700; border: 2px solid var(--hero); }
  .nb-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .nb-capa { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / .25); animation: nbFondo .2s both; }
  @keyframes nbFondo { from { opacity: 0; } }
  .nb-menu { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); right: max(12px, calc(50vw - 14rem + 12px)); width: min(300px, calc(100vw - 24px)); background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 24px; padding: 10px; box-shadow: 0 24px 50px -18px rgb(0 0 0 / .5); transform-origin: top right; animation: nbAbre .32s cubic-bezier(.34,1.4,.64,1) both; }
  @keyframes nbAbre { from { opacity: 0; transform: scale(.6) translateY(-8px); } }
  .nb-quien { display: flex; align-items: center; gap: 12px; padding: 6px 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .nb-quien span { display: flex; flex-direction: column; min-width: 0; }
  .nb-quien b { font-size: 16px; } .nb-quien small { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nb-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; text-align: left; color: var(--text); animation: nutriSube .35s cubic-bezier(.22,1,.36,1) both; transition: background .2s; }
  .nb-item:hover, .nb-item.abierto { background: var(--tint); }
  .nb-item > span { flex: 1; display: flex; flex-direction: column; font-size: 15px; font-weight: 600; }
  .nb-item small { font-size: 11.5px; font-weight: 400; color: var(--text-2); }
  .nb-item .flecha { font-style: normal; font-size: 20px; color: var(--text-2); transition: transform .25s; }
  .nb-item.abierto .flecha { transform: rotate(90deg); }
  .nb-sub { margin: 2px 0 6px 22px; padding-left: 12px; border-left: 2px solid var(--selected); display: flex; flex-direction: column; gap: 2px; animation: nutriSube .3s cubic-bezier(.22,1,.36,1) both; }
  .nb-sub button { display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text); }
  .nb-sub button small { grid-column: 2; font-size: 11px; font-weight: 400; color: var(--text-2); }
  .nb-sub button:hover { background: var(--tint); }
  /* Sin bandas de título: la hoja de contenido arranca pegada a la barra */
  .nutri-pagina { background: linear-gradient(180deg, var(--hero-2) 0 34px, transparent 34px); }
  .nutri-pagina > .nutri-sheet { margin-top: 0; padding-top: 18px; }
  @media (prefers-reduced-motion: reduce) { .nb-menu, .nb-item, .nb-sub, .nb-izq b, .nb-racha .fuego { animation: none !important; } }

  .nutri-nav-item.activo .ico-barra { animation: navBarra .6s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: bottom; }
  .nutri-nav-item.activo .ico-barra.b2 { animation-delay: .08s; } .nutri-nav-item.activo .ico-barra.b3 { animation-delay: .16s; }
  @keyframes navBarra { from { transform: scaleY(.2); } }

  /* ===== Secciones de la cuenta (pf-*): colores de la paleta (roles); cada sección solo se
     distingue por una línea delgada con su color de categoría (08-PALETAS §5) ===== */
  /* Las 3 secciones usan solo roles de la paleta: la línea y el cuadro del ícono cambian con la paleta elegida */
  .cat-azul, .cat-violeta, .cat-ambar { --cat: var(--accent); --cat-bg: var(--tint); --cat-fg: var(--brand-text); }
  .pf-sec { background: var(--bg); }
  .pf-cab { position: sticky; top: 0; z-index: 10; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 14px 10px; color: var(--on-hero);
    background: linear-gradient(90deg, var(--hero), var(--hero-2)); border-bottom: 3px solid var(--cat); }
  .pf-volver { position: relative; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--on-hero) 16%, transparent); color: var(--on-hero); font-size: 26px; line-height: 1; display: grid; place-items: center; padding-bottom: 3px; }
  .pf-ico { position: relative; width: 42px; height: 42px; border-radius: 14px; background: var(--cat-bg); color: var(--cat-fg); display: grid; place-items: center; animation: icPop .5s .1s cubic-bezier(.34,1.56,.64,1) both; }
  .pf-tx { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .pf-tx b { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; line-height: 1.15; animation: nutriSube .45s .08s cubic-bezier(.22,1,.36,1) both; }
  .pf-tx small { font-size: 12px; color: var(--on-hero-soft); animation: nutriSube .45s .14s cubic-bezier(.22,1,.36,1) both; }
  .pf-cuerpo { padding-bottom: 40px; }
  .pf-cuerpo .nutri-panel { animation: nutriSube .5s cubic-bezier(.22,1,.36,1) both; }
  .pf-cuerpo .nutri-panel:nth-of-type(2) { animation-delay: .07s; } .pf-cuerpo .nutri-panel:nth-of-type(3) { animation-delay: .14s; }
  .pf-fila { animation: pfEntra .55s cubic-bezier(.34,1.4,.64,1) both; }
  @keyframes pfEntra { 0% { opacity: 0; transform: translateY(-10px) scale(.94); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 60% { opacity: 1; transform: none; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .pf-recipiente { display: flex; align-items: center; gap: 8px; border-radius: 12px; }
  .pf-rec-ico { flex: none; width: 36px; height: 28px; display: grid; place-items: center; color: var(--text-2); }
  .pf-rec-ico svg { width: 36px; height: 26px; }
  .pf-aviso { font-size: 12px; color: var(--text-2); background: var(--tint); border-radius: 14px; padding: 8px 12px; margin: 0 0 -6px; }
  .nb-color { position: relative; }
  .nb-color::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--cat); }
  .nb-color .nb-ico { flex: none; width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--cat-bg); color: var(--cat-fg); }
  @media (prefers-reduced-motion: reduce) { .pf-fila, .pf-cuerpo .nutri-panel, .pf-ico, .pf-tx b, .pf-tx small { animation: none !important; } }

  /* Sin selección de texto (evita el menú "Buscar en Google" del celular); sí en campos de texto */
  html, body, body *:not(input):not(textarea):not(select):not([contenteditable="true"]) { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
  body { -webkit-tap-highlight-color: transparent; }
  input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  img, svg { -webkit-user-drag: none; }
  /* Campos de datos con los roles de la paleta (no gris): fondo surface/tint y borde de la paleta */
  body[data-tema="oscuro"] { --input-bg: color-mix(in srgb, var(--tint) 55%, var(--surface)); }
  .nutri-chip:is(input, select, textarea) { border-color: color-mix(in srgb, var(--accent) 22%, var(--border)); }
  .nutri-chip:is(input, select, textarea):focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  body { --nav-g1: var(--tone-400); --nav-g2: var(--tone-700); }
  body[data-tema="oscuro"] { --nav-g1: var(--tone-200); --nav-g2: var(--tone-400); }

  .nb-racha { color: var(--on-hero); border-radius: 999px; padding: 4px 8px; background: color-mix(in srgb, var(--on-hero) 12%, transparent); }
  .nb-racha:active { transform: scale(.94); }
  .nb-racha-info { padding: 14px; }
  .nb-racha-info .cab { display: flex; align-items: center; gap: 12px; }
  .nb-racha-info .fuego-g { width: 46px; height: 46px; border-radius: 15px; background: var(--tint); display: grid; place-items: center; font-size: 26px; animation: nbFuego 1.6s ease-in-out infinite; }
  .nb-racha-info .cab span:last-child { display: flex; flex-direction: column; }
  .nb-racha-info .cab b { font-size: 17px; } .nb-racha-info .cab small { font-size: 12px; color: var(--text-2); }
  .nb-racha-info p { font-size: 13px; line-height: 1.45; color: var(--text-2); margin: 10px 0; }
  .nb-racha-info .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 10.5px; color: var(--text-2); }
  .nb-racha-info .dias span { display: flex; flex-direction: column; align-items: center; gap: 3px; text-transform: capitalize; }
  .nb-racha-info .dias i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--border); font-size: 14px; }
  .nb-racha-info .dias .ok i { border: 0; background: var(--tint); animation: icPop .4s cubic-bezier(.34,1.56,.64,1) both; }
  .nb-racha-info .dias .hoy { color: var(--accent); font-weight: 700; }
  .nb-racha-info .pie { margin-bottom: 0; color: var(--text); font-weight: 600; }

  /* ===== Patrón B · capas superpuestas (capas-*) ===== */
  .capas { position: relative; min-height: 100vh; }
  .capas-cab { position: fixed; top: 0; left: 0; right: 0; z-index: 0; max-width: 28rem; margin: 0 auto; height: var(--capas-alto); overflow: hidden; color: var(--on-hero);
    background: radial-gradient(110% 100% at 100% 0%, color-mix(in srgb, var(--tone-400) 46%, transparent) 0%, transparent 60%), linear-gradient(90deg, var(--hero), var(--hero-2)); }
  .capas-cont { will-change: transform, opacity; transform-origin: 30% 0; }
  .capas-panel { position: relative; z-index: 1; margin-top: calc(var(--capas-alto) - 26px); min-height: calc(100vh - var(--capas-alto) + 26px); border-radius: 28px 28px 0 0;
    background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--tint) 55%, var(--bg)) 100%); box-shadow: 0 -14px 32px -22px rgba(0,0,0,.5); }
  .capas-panel .nutri-pagina { background: none; }
  .capas-panel .nutri-sheet { margin-top: 0; border-radius: 0; background: none; box-shadow: none; min-height: 0; }
  .capas-panel > .min-h-screen, .capas-panel .nutri-pagina > .min-h-screen { min-height: 0; }
  .capas .nb-barra { position: static; background: none; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0 20px; }
  .capas .nb-izq b { font-size: 24px; }
  .capas-fila { display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0 12px; }
  .capas-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--on-hero) 16%, transparent); color: var(--on-hero); font-size: 26px; line-height: 1; display: grid; place-items: center; padding-bottom: 3px; }
  .capas-ico { flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--tint); color: var(--brand-text); display: grid; place-items: center; animation: icPop .5s .1s cubic-bezier(.34,1.56,.64,1) both; }
  .capas-tit { display: flex; flex-direction: column; min-width: 0; }
  .capas-tit b { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; line-height: 1.15; animation: nutriSube .45s .08s cubic-bezier(.22,1,.36,1) both; }
  .capas-tit small { font-size: 12px; color: var(--on-hero-soft); animation: nutriSube .45s .14s cubic-bezier(.22,1,.36,1) both; }
  .pf-sec .capas-cab { box-shadow: inset 0 -3px 0 var(--cat); }
  .capas-sub { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
  .capas-sub b { font-size: 17px; color: var(--text); }
  /* card-arrow-nudge: el botón circular de flecha avanza 3 px con resorte al presionar */
