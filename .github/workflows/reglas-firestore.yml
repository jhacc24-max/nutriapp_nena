# Publica firestore.rules en Firebase cada vez que cambian en main (y se puede lanzar a mano).
# Usa el secreto FIREBASE_SERVICE_ACCOUNT, el mismo del respaldo.
name: Publicar reglas de Firestore

on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save firebase-admin@12.7.0
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/publicar-reglas.mjs
